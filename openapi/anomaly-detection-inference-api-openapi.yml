        thinking_budget:
          description: Indicates the desired thinking budget in tokens.
          type: number
    inference._types.EmbeddingInput:
      description: 'Inference input.

        Either a string, an array of strings, a `content` object, or an array of `content` objects.'
      oneOf:
      - $ref: '#/components/schemas/inference._types.EmbeddingStringInput'
      - $ref: '#/components/schemas/inference._types.EmbeddingContentInput'
    inference._types.MistralServiceSettings:
      type: object
      properties:
        api_key:
          externalDocs:
            url: https://console.mistral.ai/api-keys/
          description: 'A valid API key of your Mistral account.

            You can find your Mistral API keys or you can create a new one on the API Keys page.


            IMPORTANT: You need to provide the API key only once, during the inference model creation.

            The get inference endpoint API does not retrieve your API key.'
          type: string
        max_input_tokens:
          description: The maximum number of tokens per input before chunking occurs.
          type: number
        model:
          externalDocs:
            url: https://docs.mistral.ai/getting-started/models/
          description: 'The name of the model to use for the inference task.

            Refer to the Mistral models documentation for the list of available models.'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from the Mistral API.

            By default, the `mistral` service sets the number of requests allowed per minute to 240.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
      required:
