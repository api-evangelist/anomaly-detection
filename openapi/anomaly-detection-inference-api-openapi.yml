  /_inference/rerank/{inference_id}:
    post:
      tags:
      - Inference
      summary: Perform reranking inference on the service
      description: '## Required authorization


        * Cluster privileges: `monitor_inference`'
      operationId: inference-rerank
      parameters:
      - in: path
        name: inference_id
        description: The unique identifier for the inference endpoint.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: timeout
        description: The amount of time to wait for the inference request to complete.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  description: "Query input.\nThe query can be specified as a single string, or as an object.\nThe object form additionally allows specifying non-text inputs, such as images.\n\n> info\n> Only the `elastic` service currently supports non-text queries for the `rerank` task. For all other services, the query must be a string.\n\nstring example:\n```\n\"query\": \"some query text\"\n```\nobject example:\n```\n\"query\": {\n  \"type\": \"image\",\n  \"format\": \"base64\",\n  \"value\": \"data:image/jpeg;base64,...\"\n}\n```\nobject example using the `url` format (available in Elasticsearch 9.6.0 and later):\n```\n\"query\": {\n  \"type\": \"image\",\n  \"format\": \"url\",\n  \"value\": \"https://example.com/image.jpg\"\n}\n```"
                  allOf:
                  - $ref: '#/components/schemas/inference.rerank.RerankQuery'
                input:
                  description: "The documents to rank.\nThe input can be specified as a single string or an array of strings, or as an object or an array of objects.\nThe object form additionally allows specifying non-text inputs, such as images.\n\n> info\n> Only the `elastic` service currently supports non-text inputs for the `rerank` task. For all other services, the input must be a string or an array of strings.\n\nstring example:\n```\n\"input\": \"some document text\"\n```\nstring array example:\n```\n\"input\": [\"some document text\", \"some more document text\"]\n```\nobject example:\n```\n\"input\": {\n  \"type\": \"image\",\n  \"format\": \"base64\",\n  \"value\": \"data:image/jpeg;base64,...\"\n}\n```\nobject array example:\n```\n\"input\": [\n  {\n    \"type\": \"text\",\n    \"format\": \"text\",\n    \"value\": \"some document text\"\n  },\n  {\n    \"type\": \"image\",\n    \"format\": \"base64\",\n    \"value\": \"data:image/jpeg;base64,...\"\n  }\n]\n```\nobject array example using the `url` format (available in Elasticsearch 9.6.0 and later):\n```\n\"input\": [\n  {\n    \"type\": \"image\",\n    \"format\": \"url\",\n    \"value\": \"https://example.com/image.jpg\"\n  }\n]\n```"
                  allOf:
                  - $ref: '#/components/schemas/inference.rerank.RerankInput'
                return_documents:
                  description: Include the document text in the response.
                  type: boolean
                top_n:
                  description: Limit the response to the top N documents.
                  type: number
                task_settings:
                  description: 'Task settings for the individual inference request.

                    These settings are specific to the task type you specified and override the task settings specified when initializing the service.'
                  allOf:
                  - $ref: '#/components/schemas/inference._types.TaskSettings'
              required:
              - query
              - input
            examples:
              RerankRequestExample1:
                summary: Rerank task
                description: Run `POST _inference/rerank/cohere_rerank` to perform reranking on the example input.
                value: "{\n  \"input\": [\"luke\", \"like\", \"leia\", \"chewy\",\"r2d2\", \"star\", \"wars\"],\n  \"query\": \"star wars main character\"\n}"
              RerankRequestExample2:
                summary: Rerank task
                description: Run `POST _inference/rerank/bge-reranker-base-mkn` to perform reranking on the example input via Hugging Face
                value: "{\n  \"input\": [\"luke\", \"like\", \"leia\", \"chewy\",\"r2d2\", \"star\", \"wars\"],\n  \"query\": \"star wars main character\",\n  \"return_documents\": false,\n  \"top_n\": 2\n}"
              RerankRequestExample3:
                summary: Rerank task
                description: Run `POST _inference/rerank/bge-reranker-base-mkn` to perform reranking on the example input via Hugging Face
                value: "{\n  \"input\": [\"luke\", \"like\", \"leia\", \"chewy\",\"r2d2\", \"star\", \"wars\"],\n  \"query\": \"star wars main character\",\n  \"return_documents\": true,\n  \"top_n\": 3\n}"
              RerankRequestExample4:
                summary: Rerank task using the url format
                description: Run `POST _inference/rerank/my-multimodal-rerank-endpoint` to rank text documents against an image query referenced by URL. The `url` format is available in Elasticsearch 9.6.0 and later.
                value: "{\n  \"query\": {\n    \"type\": \"image\",\n    \"format\": \"url\",\n    \"value\": \"https://example.com/image.jpg\"\n  },\n  \"input\": [\"some document text\", \"some more document text\"],\n  \"top_n\": 2\n}"
              RerankRequestExample5:
                summary: Rerank task using the url format for inputs
                description: Run `POST _inference/rerank/my-multimodal-rerank-endpoint` to rank image documents referenced by URL against a text query. The `url` format is available in Elasticsearch 9.6.0 and later.
                value: "{\n  \"query\": \"a photo of a cat\",\n  \"input\": [\n    {\n      \"type\": \"image\",\n      \"format\": \"url\",\n      \"value\": \"https://example.com/image1.jpg\"\n    },\n    {\n      \"type\": \"image\",\n      \"format\": \"url\",\n      \"value\": \"https://example.com/image2.jpg\"\n    }\n  ],\n  \"top_n\": 2\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inference._types.RerankedInferenceResult'
              examples:
                RerankResponseExample1:
                  summary: Rerank task
                  description: 'A successful response from `POST _inference/rerank/cohere_rerank`.

                    '
                  value: "{\n  \"rerank\": [\n    {\n      \"index\": \"2\",\n      \"relevance_score\": \"0.011597361\",\n      \"text\": \"leia\"\n    },\n    {\n      \"index\": \"0\",\n      \"relevance_score\": \"0.006338922\",\n      \"text\": \"luke\"\n    },\n    {\n      \"index\": \"5\",\n      \"relevance_score\": \"0.0016166499\",\n      \"text\": \"star\"\n    },\n    {\n      \"index\": \"4\",\n      \"relevance_score\": \"0.0011695103\",\n      \"text\": \"r2d2\"\n    },\n    {\n      \"index\": \"1\",\n      \"relevance_score\": \"5.614787E-4\",\n      \"text\": \"like\"\n    },\n    {\n      \"index\": \"6\",\n      \"relevance_score\": \"3.7850367E-4\",\n      \"text\": \"wars\"\n    },\n    {\n      \"index\": \"3\",\n      \"relevance_score\": \"1.2508839E-5\",\n      \"text\": \"chewy\"\n    }\n  ]\n}"
                RerankResponseExample2:
                  summary: Rerank task
                  description: 'A successful response from `POST _inference/rerank/bge-reranker-base-mkn`.

                    '
                  value: "{\n  \"rerank\": [\n    {\n      \"index\": 6,\n      \"relevance_score\": 0.50955844\n    },\n    {\n      \"index\": 5,\n      \"relevance_score\": 0.084341794\n    }\n  ]\n}"
                RerankResponseExample3:
                  summary: Rerank task
                  description: 'A successful response from `POST _inference/rerank/bge-reranker-base-mkn`.

                    '
                  value: "{\n  \"rerank\": [\n    {\n      \"index\": 6,\n      \"relevance_score\": 0.50955844,\n      \"text\": \"wars\"\n    },\n    {\n      \"index\": 5,\n      \"relevance_score\": 0.084341794,\n      \"text\": \"star\"\n    },\n    {\n      \"index\": 3,\n      \"relevance_score\": 0.004520818,\n      \"text\": \"chewy\"\n    }\n  ]\n}"
      x-state: Generally available; Added in 8.11.0
      x-codeSamples:
      - lang: Console
        source: "POST _inference/rerank/cohere_rerank\n{\n  \"input\": [\"luke\", \"like\", \"leia\", \"chewy\",\"r2d2\", \"star\", \"wars\"],\n  \"query\": \"star wars main character\"\n}"
      - lang: Python
        source: "resp = client.inference.rerank(\n    inference_id=\"cohere_rerank\",\n    input=[\n        \"luke\",\n        \"like\",\n        \"leia\",\n        \"chewy\",\n        \"r2d2\",\n        \"star\",\n        \"wars\"\n    ],\n    query=\"star wars main character\",\n)"
      - lang: JavaScript
        source: "const response = await client.inference.rerank({\n  inference_id: \"cohere_rerank\",\n  input: [\"luke\", \"like\", \"leia\", \"chewy\", \"r2d2\", \"star\", \"wars\"],\n  query: \"star wars main character\",\n});"
