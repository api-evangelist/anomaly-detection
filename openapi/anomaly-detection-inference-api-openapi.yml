      - lang: C#
        source: "var response = await client.Inference\n    .PutAsync(new PutInferenceRequest()\n    {\n        InferenceId = \"hugging-face-embeddings\",\n        TaskType = TaskType.TextEmbedding,\n        InferenceConfig = new()\n        {\n            Service = \"hugging_face\",\n            ServiceSettings = JsonSerializer.Deserialize<JsonElement>(\"\"\"\n            {\n              \"api_key\": \"hugging-face-access-token\",\n              \"url\": \"url-endpoint\"\n            }\n            \"\"\")\n        }\n    });"
