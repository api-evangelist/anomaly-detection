    inference.rerank.RerankQuery:
      description: 'Query input for the `rerank` task.

        Either a string, or an object. The object form additionally allows specifying non-text inputs, such as images.


        > info

        > Only the `elastic` service currently supports non-text queries for the `rerank` task.'
      oneOf:
      - type: string
      - $ref: '#/components/schemas/inference.rerank.RerankInputObject'
    inference._types.TaskTypeAzureAIStudio:
      type: string
      enum:
      - text_embedding
      - completion
      - rerank
    inference._types.SparseVector:
      description: 'Sparse Embedding tokens are represented as a dictionary

        of string to double.'
      type: object
      additionalProperties:
        type: number
    inference._types.EmbeddingContentType:
      type: string
      enum:
      - text
      - image
      - audio
      - video
      - pdf
    inference._types.DenseEmbeddingResult:
      description: The dense embedding result object for float representation
      type: object
      properties:
        embedding:
          allOf:
          - $ref: '#/components/schemas/inference._types.DenseVector'
      required:
      - embedding
    inference._types.AlibabaCloudServiceSettings:
      type: object
      properties:
        api_key:
          description: A valid API key for the AlibabaCloud AI Search API.
          type: string
        host:
          externalDocs:
            url: https://opensearch.console.aliyun.com/cn-shanghai/rag/api-key
          description: 'The name of the host address used for the inference task.

            You can find the host address in the API keys section of the documentation.'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from AlibabaCloud AI Search.

            By default, the `alibabacloud-ai-search` service sets the number of requests allowed per minute to `1000`.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
        service_id:
          description: 'The name of the model service to use for the inference task.

            The following service IDs are available for the `completion` task:


            * `ops-qwen-turbo`

            * `qwen-turbo`

            * `qwen-plus`

            * `qwen-max ÷ qwen-max-longcontext`


            The following service ID is available for the `rerank` task:


            * `ops-bge-reranker-larger`


            The following service ID is available for the `sparse_embedding` task:


            * `ops-text-sparse-embedding-001`


            The following service IDs are available for the `text_embedding` task:


            `ops-text-embedding-001`

            `ops-text-embedding-zh-001`

            `ops-text-embedding-en-001`

            `ops-text-embedding-002`'
          type: string
        workspace:
          description: The name of the workspace used for the inference task.
          type: string
      required:
      - api_key
      - host
      - service_id
      - workspace
    inference._types.Ai21TaskType:
      type: string
      enum:
      - completion
      - chat_completion
    inference._types.AmazonBedrockTaskType:
      type: string
      enum:
      - chat_completion
      - completion
      - text_embedding
    inference._types.TextReasoningDetail:
      description: The reasoning text detail includes plaintext reasoning with optional signature verification.
      allOf:
      - $ref: '#/components/schemas/inference._types.BaseReasoningDetail'
      - type: object
        properties:
          type:
            type: string
            enum:
            - reasoning.text
          signature:
            description: 'The signature of the reasoning text,

              which can be used to verify the authenticity and integrity of the reasoning information provided by the model.'
            type: string
          text:
            description: 'The plaintext reasoning generated by the model,

              which provides a detailed explanation of the model''s reasoning process in human-readable form.'
            type: string
        required:
        - type
    inference._types.InferenceEndpointInfoGoogleAIStudio:
      allOf:
      - $ref: '#/components/schemas/inference._types.InferenceEndpoint'
      - type: object
        properties:
          inference_id:
            description: The inference Id
            type: string
          task_type:
            description: The task type
            allOf:
            - $ref: '#/components/schemas/inference._types.TaskTypeGoogleAIStudio'
        required:
        - inference_id
        - task_type
    inference._types.GoogleAiStudioTaskType:
      type: string
      enum:
      - completion
      - text_embedding
    inference._types.AmazonSageMakerSimilarity:
      type: string
      enum:
      - cosine
      - dot_product
      - l2_norm
    inference._types.FireworksAISimilarityType:
      type: string
      enum:
      - cosine
      - dot_product
      - l2_norm
    inference._types.OpenAITaskSettings:
      type: object
      properties:
        user:
          description: 'Specifies the user issuing the request.

            This information can be used for abuse detection.'
          type: string
        headers:
          description: "Specifies custom HTTP header parameters.\nFor example:\n```\n\"headers\": {\n  \"Custom-Header\": \"Some-Value\",\n  \"Another-Custom-Header\": \"Another-Value\"\n}\n```"
          type: object
          additionalProperties:
            type: string
    inference._types.ChatCompletionChoice:
      description: A single completion choice returned by the model.
      type: object
      properties:
        message:
          description: The message generated by the model for this choice.
          allOf:
          - $ref: '#/components/schemas/inference._types.ChatCompletionMessage'
        finish_reason:
          description: 'The reason the model stopped generating tokens.

            Common values are `stop` (natural stopping point) and `tool_calls` (the model called a tool).

            Omitted when the reason is not available.'
          type: string
        index:
          description: The index of this choice in the list of choices.
          type: number
      required:
      - message
      - index
    inference._types.TaskTypeCohere:
      type: string
      enum:
      - text_embedding
      - rerank
      - completion
    inference._types.TextEmbeddingInferenceResult:
      description: TextEmbeddingInferenceResult is an aggregation of mutually exclusive text_embedding variants
      type: object
      properties:
        text_embedding_bytes:
          type: array
          items:
            $ref: '#/components/schemas/inference._types.DenseEmbeddingByteResult'
        text_embedding_bits:
          type: array
          items:
            $ref: '#/components/schemas/inference._types.DenseEmbeddingByteResult'
        text_embedding:
          type: array
          items:
            $ref: '#/components/schemas/inference._types.DenseEmbeddingResult'
      minProperties: 1
      maxProperties: 1
    inference._types.CompletionToolType:
      oneOf:
      - type: string
      - $ref: '#/components/schemas/inference._types.CompletionToolChoice'
    inference._types.GoogleAiStudioServiceSettings:
      type: object
      properties:
        api_key:
          description: A valid API key of your Google Gemini account.
          type: string
        model_id:
          externalDocs:
            url: https://ai.google.dev/gemini-api/docs/models
          description: 'The name of the model to use for the inference task.

            Refer to the Google documentation for the list of supported models.'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from Google AI Studio.

            By default, the `googleaistudio` service sets the number of requests allowed per minute to 360.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
      required:
      - api_key
      - model_id
    inference._types.ReasoningSummary:
      type: string
      enum:
      - auto
      - concise
      - detailed
    inference._types.EmbeddingContentObjectItem:
      description: An object containing the input data for a single item for the model to embed.
      type: object
      properties:
        type:
          description: 'The type of input to embed. Not all models support all input types.

            The `audio`, `video`, and `pdf` types are available in Elasticsearch 9.5.0 and later.'
          allOf:
          - $ref: '#/components/schemas/inference._types.EmbeddingContentType'
        format:
          description: 'The format of the input. For the `text` type this must be `text`. For all other types, this must be `base64` or `url`.

            If not specified, this will default to `text` for the `text` type and `base64` for all other types.

            The `url` format is available in Elasticsearch 9.6.0 and later.

            Not all services and models support all formats.'
          allOf:
          - $ref: '#/components/schemas/inference._types.EmbeddingContentFormat'
        value:
          description: 'The value of the input to embed. For the `base64` format, this must be a base64-encoded data URI, i.e. "data:content/type;base64,...".

            For the `url` format, this must be a URL that points to the content, i.e. "https://example.com/image.jpg".'
          type: string
      required:
      - type
      - value
    inference._types.TaskType:
      type: string
      enum:
      - sparse_embedding
      - text_embedding
      - rerank
      - completion
      - chat_completion
      - embedding
    _types.DateTime:
      description: 'A date and time, either as a string whose format can depend on the context (defaulting to ISO 8601), or a

        number of milliseconds since the Epoch. Elasticsearch accepts both as input, but will generally output a string

        representation.'
      oneOf:
      - type: string
      - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
    inference._types.WatsonxServiceSettings:
      type: object
      properties:
        api_key:
          externalDocs:
            url: https://cloud.ibm.com/iam/apikeys
          description: 'A valid API key of your Watsonx account.

            You can find your Watsonx API keys or you can create a new one on the API keys page.


            IMPORTANT: You need to provide the API key only once, during the inference model creation.

            The get inference endpoint API does not retrieve your API key.'
          type: string
        api_version:
          externalDocs:
            url: https://cloud.ibm.com/apidocs/watsonx-ai#active-version-dates
          description: 'A version parameter that takes a version date in the format of `YYYY-MM-DD`.

            For the active version data parameters, refer to the Wastonx documentation.'
          type: string
        model_id:
          externalDocs:
            url: https://www.ibm.com/products/watsonx-ai/foundation-models
          description: 'The name of the model to use for the inference task.

            Refer to the IBM Embedding Models section in the Watsonx documentation for the list of available text embedding models.

            Refer to the IBM library - Foundation models in Watsonx.ai.'
          type: string
        project_id:
          description: The identifier of the IBM Cloud project to use for the inference task.
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from Watsonx.

            By default, the `watsonxai` service sets the number of requests allowed per minute to 120.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
        url:
          description: The URL of the inference endpoint that you created on Watsonx.
          type: string
      required:
      - api_key
      - api_version
      - model_id
      - project_id
      - url
    inference._types.OpenAIServiceSettings:
      type: object
      properties:
        api_key:
          externalDocs:
            url: https://platform.openai.com/api-keys
          description: 'A valid API key of your OpenAI account.

            You can find your OpenAI API keys in your OpenAI account under the API keys section.


            IMPORTANT: You must specify either `api_key` or `client_secret`.

            If you do not provide one or you provide more than one of them, you will receive an error when you try to create your endpoint.'
          type: string
        client_id:
          description: 'For OAuth 2.0 authorization using the client credentials grant flow.

            The application ID that''s assigned to your app.


            IMPORTANT: To configure OAuth 2.0, you must specify `client_id`, `scopes`, `token_url`, and `client_secret` together.

            If one of the fields is missing, you will receive an error when you try to create your endpoint.'
          type: string
        client_secret:
          description: 'For OAuth 2.0 authorization using the client credentials grant flow.

            The application secret that you created for your app.


            IMPORTANT: You must specify either `api_key` or `client_secret`.

            If you do not provide one or you provide more than one of them, you will receive an error when you try to create your endpoint.


            IMPORTANT: To configure OAuth 2.0, you must specify `client_id`, `scopes`, `token_url`, and `client_secret` together.

            If one of the fields is missing, you will receive an error when you try to create your endpoint.'
          type: string
        dimensions:
          description: 'For a `text_embedding` or `embedding` task, the number of dimensions the resulting output embeddings should have.

            It is supported only in `text-embedding-3` and later models.

            If it is not set, the OpenAI defined default for the model is used.'
          type: number
        model_id:
          externalDocs:
            url: https://platform.openai.com/docs/guides/embeddings/what-are-embeddings
          description: 'The name of the model to use for the inference task.

            Refer to the OpenAI documentation for the list of available text embedding models.'
          type: string
        organization_id:
          description: 'The unique identifier for your organization.

            You can find the Organization ID in your OpenAI account under *Settings > Organizations*.'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from OpenAI.

            The `openai` service sets a default number of requests allowed per minute depending on the task type.

            For `text_embedding` and `embedding`, it is set to `3000`.

            For `completion` and `chat_completion`, it is set to `500`.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
        scopes:
          description: "For OAuth 2.0 authorization using the client credentials grant flow.\nThe resource identifier of the resource you want.\nFor example:\n```\n\"scopes\": [\n  \"scope1\",\n  \"scope2\"\n]\n```\n\nIMPORTANT: To configure OAuth 2.0, you must specify `client_id`, `scopes`, `token_url`, and `client_secret` together.\nIf one of the fields is missing, you will receive an error when you try to create your endpoint."
          type: array
          items:
            type: string
        similarity:
          description: For a `text_embedding` or `embedding` task, the similarity measure. One of `cosine`, `dot_product`, `l2_norm`. Defaults to `dot_product`.
          allOf:
          - $ref: '#/components/schemas/inference._types.OpenAISimilarityType'
        token_url:
          description: 'For OAuth 2.0 authorization using the client credentials grant flow.

            An OAuth2 token endpoint where Elasticsearch sends a request to exchange client credentials for an access token.


            IMPORTANT: To configure OAuth 2.0, you must specify `client_id`, `scopes`, `token_url`, and `client_secret` together.

            If one of the fields is missing, you will receive an error when you try to create your endpoint.'
          type: string
        url:
          description: 'The URL endpoint to use for the requests.

            It can be changed for testing purposes.

            Default value is `https://api.openai.com/v1/embeddings` for a `text_embedding` or `embedding` task,

            `https://api.openai.com/v1/chat/completions` for a `completion` or `chat_completion` task.'
          type: string
      required:
      - model_id
    inference._types.OpenAIServiceType:
      type: string
      enum:
      - openai
    inference._types.SparseEmbeddingInferenceResult:
      description: The response format for the sparse embedding request.
      type: object
      properties:
        sparse_embedding:
          type: array
          items:
            $ref: '#/components/schemas/inference._types.SparseEmbeddingResult'
      required:
      - sparse_embedding
    inference._types.HuggingFaceTaskSettings:
      type: object
      properties:
        return_documents:
          description: For a `rerank` task, return doc text within the results.
          type: boolean
        top_n:
          description: 'For a `rerank` task, the number of most relevant documents to return.

            It defaults to the number of the documents.'
          type: number
    inference._types.ChatCompletionPromptTokensDetails:
      description: Breakdown of tokens used in the prompt.
      type: object
      properties:
        cached_tokens:
          description: The number of tokens that were cached from a previous request.
          type: number
        cache_write_tokens:
          description: The number of tokens written to the cache.
          type: number
    inference._types.ChatCompletionMessage:
      description: The message returned by the model.
      type: object
      properties:
        content:
          description: The content of the message.
          type: string
        refusal:
          description: The refusal message generated by the model.
          type: string
        role:
          description: The role of the message author.
          type: string
        reasoning:
          description: 'The reasoning generated by the model as plaintext.

            Currently supported only for the `elastic` provider.'
          type: string
        tool_calls:
          description: The tool calls generated by the model.
          type: array
          items:
            $ref: '#/components/schemas/inference._types.ChatCompletionToolCall'
        reasoning_details:
          description: 'The reasoning details generated by the model as structured data.

            Currently supported only for the `elastic` provider.'
          type: array
          items:
            $ref: '#/components/schemas/inference._types.ReasoningDetail'
    inference._types.ElserServiceSettings:
      type: object
      properties:
        adaptive_allocations:
          description: 'Adaptive allocations configuration details.

            If `enabled` is true, the number of allocations of the model is set based on the current load the process gets.

            When the load is high, a new model allocation is automatically created, respecting the value of `max_number_of_allocations` if it''s set.

            When the load is low, a model allocation is automatically removed, respecting the value of `min_number_of_allocations` if it''s set.

            If `enabled` is true, do not set the number of allocations manually.'
          allOf:
          - $ref: '#/components/schemas/inference._types.AdaptiveAllocations'
        num_allocations:
          description: 'The total number of allocations this model is assigned across machine learning nodes.

            Increasing this value generally increases the throughput.

            If adaptive allocations is enabled, do not set this value because it''s automatically set.'
          type: number
        num_threads:
          description: 'The number of threads used by each model allocation during inference.

            Increasing this value generally increases the speed per inference request.

            The inference process is a compute-bound process; `threads_per_allocations` must not exceed the number of available allocated processors per node.

            The value must be a power of 2.

            The maximum value is 32.


            > info

            > If you want to optimize your ELSER endpoint for ingest, set the number of threads to 1. If you want to optimize your ELSER endpoint for search, set the number of threads to greater than 1.'
          type: number
      required:
      - num_allocations
      - num_threads
    inference._types.RequestEmbedding:
      type: object
      properties:
        input:
          description: "Inference input.\nEither a string, an array of strings, a `content` object, or an array of `content` objects.\n`content` objects may contain a single item or an array of items. Models that support multiple items per `content`\nobject will return a single embedding for each `content` object, regardless of how many items it contains.\nSupport for multiple items in a single `content` object is available in Elasticsearch 9.5.0 and later.\n\nstring example:\n```\n\"input\": \"Some text\"\n```\nstring array example:\n```\n\"input\": [\"Some text\", \"Some more text\"]\n```\n`content` object example:\n```\n\"input\": {\n    \"content\": {\n      \"type\": \"image\",\n      \"format\": \"base64\",\n      \"value\": \"data:image/jpeg;base64,...\"\n    }\n  }\n```\n`content` object array example:\n```\n\"input\": [\n  {\n    \"content\": {\n      \"type\": \"text\",\n      \"format\": \"text\",\n      \"value\": \"Some text to generate an embedding\"\n    }\n  },\n  {\n    \"content\": {\n      \"type\": \"image\",\n      \"format\": \"base64\",\n      \"value\": \"data:image/jpeg;base64,...\"\n    }\n  }\n]\n```\n`content` object using the `url` format example (available in Elasticsearch 9.6.0 and later):\n```\n\"input\": {\n    \"content\": {\n      \"type\": \"image\",\n      \"format\": \"url\",\n      \"value\": \"https://example.com/image.jpg\"\n    }\n  }\n```\nMultiple items in one `content` object example (available in Elasticsearch 9.5.0 and later):\n```\n\"input\": [\n  {\n    \"content\": [\n      {\n        \"type\": \"image\",\n        \"format\": \"base64\",\n        \"value\": \"data:image/jpeg;base64,...\"\n      },\n      {\n        \"type\": \"text\",\n        \"value\": \"Some text to create an embedding\"\n      }\n    ]\n  }\n]\n```"
          allOf:
          - $ref: '#/components/schemas/inference._types.EmbeddingInput'
        input_type:
          description: 'The input data type for the embedding model. Possible values include:

            * `SEARCH`

            * `INGEST`

            * `CLASSIFICATION`

            * `CLUSTERING`


            Not all models support all values. Unsupported values will trigger a validation exception.

            Accepted values depend on the configured inference service, refer to the relevant service-specific documentation for more info.


            > info

            > The `input_type` parameter specified on the root level of the request body will take precedence over the `input_type` parameter specified in `task_settings`.'
          type: string
        task_settings:
          description: Task settings for the individual inference request. These settings are specific to the <task_type> you specified and override the task settings specified when initializing the service.
          allOf:
          - $ref: '#/components/schemas/inference._types.TaskSettings'
      required:
      - input
    inference._types.AmazonBedrockServiceSettings:
      type: object
      properties:
        access_key:
          description: A valid AWS access key that has permissions to use Amazon Bedrock and access to models for inference requests.
          type: string
        model:
          externalDocs:
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
          description: 'The base model ID or an ARN to a custom model based on a foundational model.

            The base model IDs can be found in the Amazon Bedrock documentation.

            Note that the model ID must be available for the provider chosen and your IAM user must have access to the model.'
          type: string
        provider:
          description: 'The model provider for your deployment.

            Note that some providers may support only certain task types.

            Supported providers include:


            * `amazontitan` - available for `text_embedding` and `completion` task types

            * `anthropic` - available for `chat_completion` and `completion` task types

            * `ai21labs` - available for `chat_completion` and `completion` task types

            * `cohere` - available for `chat_completion`, `completion` and `text_embedding` task types

            * `meta` - available for `chat_completion` and `completion` task types

            * `mistral` - available for `chat_completion` and `completion` task types'
          type: string
        region:
          externalDocs:
            url: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
          description: 'The region that your model or ARN is deployed in.

            The list of available regions per model can be found in the Amazon Bedrock documentation.'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from Amazon Bedrock.

            By default, the `amazonbedrock` service sets the number of requests allowed per minute to 240.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
        secret_key:
          externalDocs:
            url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
          description: 'A valid AWS secret key that is paired with the `access_key`.

            For informationg about creating and managing access and secret keys, refer to the AWS documentation.'
          type: string
      required:
      - access_key
      - model
      - region
      - secret_key
  responses:
    inference.update-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inference._types.InferenceEndpointInfo'
    inference.delete-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inference._types.DeleteInferenceEndpointResult'
    inference.get-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              endpoints:
                type: array
                items:
                  $ref: '#/components/schemas/inference._types.InferenceEndpointInfo'
            required:
            - endpoints
    inference.put-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inference._types.InferenceEndpointInfo'
    inference.inference-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inference._types.InferenceResult'
  parameters:
    inference.inference-timeout:
      in: query
      name: timeout
      description: The amount of time to wait for the inference request to complete.
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    inference.inference-task_type:
      in: path
      name: task_type
      description: The type of inference task that the model performs.
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/inference._types.TaskType'
      style: simple
    inference.update-inference_id:
      in: path
      name: inference_id
      description: The unique identifier of the inference endpoint.
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Id'
      style: simple
    inference.put-inference_id:
      in: path
      name: inference_id
      description: The inference Id
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Id'
      style: simple
    inference.put-task_type:
      in: path
      name: task_type
      description: The task type. Refer to the integration list in the API description for the available task types.
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/inference._types.TaskType'
      style: simple
    inference.delete-dry_run:
      in: query
      name: dry_run
      description: When true, checks the semantic_text fields and inference processors that reference the endpoint and returns them in a list, but does not delete the endpoint.
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    inference.put-timeout:
      in: query
      name: timeout
      description: 'Specifies the amount of time to wait for the inference endpoint to be created.

        The default depends on the task type: 120s for `completion` and `chat_completion`, and 30s for all other task types.'
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Duration'
      style: form
    inference.get-inference_id:
      in: path
      name: inference_id
