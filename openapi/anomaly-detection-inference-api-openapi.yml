          description: 'This setting helps to minimize the number of rate limit errors returned from the AI21 API.

            By default, the `ai21` service sets the number of requests allowed per minute to 200. Please refer to AI21 documentation for more details.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
