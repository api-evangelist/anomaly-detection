      - model
    inference._types.AnthropicServiceSettings:
      type: object
      properties:
        api_key:
          description: A valid API key for the Anthropic API.
          type: string
        model_id:
          description: 'The name of the model to use for the inference task.

            Refer to the Anthropic documentation for the list of supported models.'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from Anthropic.

            By default, the `anthropic` service sets the number of requests allowed per minute to 50.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
      required:
      - api_key
      - model_id
    inference._types.CustomTaskSettings:
      type: object
      properties:
        parameters:
          description: "Specifies parameters that are required to run the custom service. The parameters depend on the model your custom service uses.\nFor example:\n```\n\"task_settings\":{\n  \"parameters\":{\n    \"input_type\":\"query\",\n    \"return_token\":true\n  }\n}\n```\n\n> warn\n> The `task_settings.parameters` cannot contain the same keys as `secret_parameters`. If they do, an error will be returned. This applies to PUT requests and POST requests."
          type: object
          additionalProperties:
            $ref: '#/components/schemas/inference._types.CustomTaskParameter'
    inference._types.GoogleVertexAIServiceType:
      type: string
      enum:
      - googlevertexai
    inference._types.CustomServiceSettings:
      type: object
      properties:
        batch_size:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/mapping-reference/semantic-text#auto-text-chunking
          description: 'Specifies the batch size used for the semantic_text field. If the field is not provided, the default is 10.

            The batch size is the maximum number of inputs in a single request to the upstream service.

            The chunk within the batch are controlled by the selected chunking strategy for the semantic_text field.'
          type: number
        headers:
          description: "Specifies the HTTP header parameters – such as `Authorization` or `Content-Type` – that are required to access the custom service.\nFor example:\n```\n\"headers\": {\n  \"Authorization\": \"Bearer ${api_key}\",\n  \"Content-Type\": \"application/json;charset=utf-8\"\n}\n```"
          type: object
          additionalProperties:
            type: string
        input_type:
          description: "Specifies the input type translation values that are used to replace the `${input_type}` template in the request body.\nFor example:\n```\n\"input_type\": {\n  \"translation\": {\n    \"ingest\": \"do_ingest\",\n    \"search\": \"do_search\"\n  },\n  \"default\": \"a_default\"\n},\n```\nIf the subsequent inference requests come from a search context, the `search` key will be used and the template will be replaced with `do_search`.\nIf it comes from the ingest context `do_ingest` is used. If it's a different context that is not specified, the default value will be used. If no default is specified an empty string is used.\n`translation` can be:\n* `classification`\n* `clustering`\n* `ingest`\n* `search`"
          type: object
          additionalProperties:
            type: string
        query_parameters:
          description: "Specifies the query parameters as a list of tuples. The arrays inside the `query_parameters` must have two items, a key and a value.\nFor example:\n```\n\"query_parameters\":[\n  [\"param_key\", \"some_value\"],\n  [\"param_key\", \"another_value\"],\n  [\"other_key\", \"other_value\"]\n]\n```\nIf the base url is `https://www.elastic.co` it results in: `https://www.elastic.co?param_key=some_value&param_key=another_value&other_key=other_value`."
          type: array
          items:
            $ref: '#/components/schemas/inference._types.CustomServiceQueryParameter'
        request:
          description: The request configuration object.
          allOf:
          - $ref: '#/components/schemas/inference._types.CustomRequestParams'
        response:
          description: The response configuration object.
          allOf:
          - $ref: '#/components/schemas/inference._types.CustomResponseParams'
        secret_parameters:
          description: "Specifies secret parameters, like `api_key` or `api_token`, that are required to access the custom service.\nFor example:\n```\n\"secret_parameters\":{\n  \"api_key\":\"<api_key>\"\n}\n```"
          type: object
          additionalProperties:
            type: string
        url:
          description: The URL endpoint to use for the requests.
          type: string
      required:
      - request
      - response
      - secret_parameters
    inference._types.FireworksAIServiceSettings:
      type: object
      properties:
        api_key:
          externalDocs:
            url: https://docs.fireworks.ai/
          description: 'A valid API key for your Fireworks AI account.

            You can find or create your API keys in the Fireworks AI dashboard.


            IMPORTANT: You need to provide the API key only once, during the inference model creation.

            The get inference endpoint API does not retrieve your API key.'
          type: string
        model_id:
          externalDocs:
            url: https://docs.fireworks.ai/guides/recommended-models
          description: 'The name of the model to use for the inference task.

            Refer to the Fireworks AI documentation for the list of available models for chat completion, completion, and text embedding.

            For text embedding, supported models include the Qwen3 embedding family (e.g. `fireworks/qwen3-embedding-8b`) and other models in the Fireworks model library.'
          type: string
        url:
          description: 'The URL endpoint to use for the requests.

            If not provided, the default Fireworks AI API endpoint is used.'
          type: string
        dimensions:
          description: 'For a `text_embedding` task, the number of dimensions the resulting output embeddings should have.

            Variable-length embeddings are supported via this parameter.'
          type: number
        similarity:
          externalDocs:
            url: https://docs.fireworks.ai/guides/querying-embeddings-models
          description: For a `text_embedding` task, the similarity measure. One of cosine, dot_product, l2_norm.
          default: cosine
          allOf:
          - $ref: '#/components/schemas/inference._types.FireworksAISimilarityType'
        rate_limit:
          externalDocs:
            url: https://docs.fireworks.ai/guides/quotas_usage/rate-limits
          description: 'This setting helps to minimize the number of rate limit errors returned from the Fireworks AI API.

            Rate limit grouping is per API key only.

            By default, the `fireworksai` service sets the number of requests allowed per minute to 6000.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
      required:
      - api_key
      - model_id
    inference._types.VoyageAIServiceSettings:
      type: object
      properties:
        dimensions:
          externalDocs:
            url: https://docs.voyageai.com/docs/embeddings
          description: 'The number of dimensions for resulting output embeddings.

            This setting maps to `output_dimension` in the VoyageAI documentation.

            Only for the `text_embedding` task type.'
          type: number
        model_id:
          externalDocs:
            url: https://docs.voyageai.com/docs/reranker
          description: 'The name of the model to use for the inference task.

            Refer to the VoyageAI documentation for the list of available text embedding and rerank models.'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from VoyageAI.

            The `voyageai` service sets a default number of requests allowed per minute depending on the task type.

            For both `text_embedding` and `rerank`, it is set to `2000`.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
        embedding_type:
          externalDocs:
            url: https://docs.voyageai.com/docs/embeddings
          description: 'The data type for the embeddings to be returned.

            This setting maps to `output_dtype` in the VoyageAI documentation.

            Permitted values: float, int8, bit.

            `int8` is a synonym of `byte` in the VoyageAI documentation.

            `bit` is a synonym of `binary` in the VoyageAI documentation.

            Only for the `text_embedding` task type.'
          type: number
      required:
      - model_id
    inference._types.NvidiaServiceType:
      type: string
      enum:
      - nvidia
    inference._types.ElserTaskType:
      type: string
      enum:
      - sparse_embedding
    inference._types.AmazonBedrockTaskSettings:
      type: object
      properties:
        max_new_tokens:
          description: For `chat_completion` and `completion` tasks, it sets the maximum number for the output tokens to be generated.
          default: 64
          type: number
        temperature:
          description: 'For `chat_completion` and `completion` tasks, it is a number between 0.0 and 1.0 that controls the apparent creativity of the results.

            At temperature 0.0 the model is most deterministic, at temperature 1.0 most random.

            It should not be used if `top_p` or `top_k` is specified.'
          type: number
        top_k:
          description: 'For `chat_completion` and `completion` tasks, it limits samples to the top-K most likely words, balancing coherence and variability.

            It is only available for anthropic, cohere, and mistral providers.

            It is an alternative to `temperature`; it should not be used if `temperature` is specified.'
          type: number
        top_p:
          description: 'For `chat_completion` and `completion` tasks, it is a number in the range of 0.0 to 1.0, to eliminate low-probability tokens.

            Top-p uses nucleus sampling to select top tokens whose sum of likelihoods does not exceed a certain value, ensuring both variety and coherence.

            It is an alternative to `temperature`; it should not be used if `temperature` is specified.'
          type: number
    inference._types.ContextualAITaskSettings:
      type: object
      properties:
        instruction:
          description: 'Instructions for the reranking model. Refer to <https://docs.contextual.ai/api-reference/rerank/rerank#body-instruction>

            Only for the `rerank` task type.'
          type: string
        top_k:
          description: 'The number of most relevant documents to return.

