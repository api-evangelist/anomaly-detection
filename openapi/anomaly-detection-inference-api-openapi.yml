      description: The base reasoning detail that includes common fields across different types of reasoning details.
      type: object
      properties:
        format:
          description: The format of the reasoning detail.
          type: string
        id:
          description: The identifier of the reasoning detail.
          type: string
        index:
          description: 'The index of the reasoning detail,

            which indicates its position in the sequence of reasoning details generated by the model.'
          type: number
    inference._types.TaskTypeOpenShiftAi:
      type: string
      enum:
      - text_embedding
      - chat_completion
      - completion
      - rerank
    inference._types.HuggingFaceServiceSettings:
      type: object
      properties:
        api_key:
          externalDocs:
            url: https://huggingface.co/settings/tokens
          description: 'A valid access token for your HuggingFace account.

            You can create or find your access tokens on the HuggingFace settings page.


            IMPORTANT: You need to provide the API key only once, during the inference model creation.

            The get inference endpoint API does not retrieve your API key.'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from Hugging Face.

            By default, the `hugging_face` service sets the number of requests allowed per minute to 3000 for all supported tasks.

            Hugging Face does not publish a universal rate limit — actual limits may vary.

            It is recommended to adjust this value based on the capacity and limits of your specific deployment environment.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
        url:
          externalDocs:
            url: https://huggingface.co/docs/inference-providers/en/tasks/chat-completion#conversational-large-language-models-llms
          description: 'The URL endpoint to use for the requests.

            For `completion` and `chat_completion` tasks, the deployed model must be compatible with the Hugging Face Chat Completion interface (see the linked external documentation for details). The endpoint URL for the request must include `/v1/chat/completions`.

            If the model supports the OpenAI Chat Completion schema, a toggle should appear in the interface. Enabling this toggle doesn''t change any model behavior, it reveals the full endpoint URL needed (which should include `/v1/chat/completions`) when configuring the inference endpoint in Elasticsearch. If the model doesn''t support this schema, the toggle may not be shown.'
          type: string
        model_id:
          description: 'The name of the HuggingFace model to use for the inference task.

            For `completion` and `chat_completion` tasks, this field is optional but may be required for certain models — particularly when using serverless inference endpoints.

            For the `text_embedding` task, this field should not be included. Otherwise, the request will fail.'
          type: string
      required:
      - api_key
      - url
    inference._types.VoyageAITaskSettings:
      type: object
      properties:
        input_type:
          description: 'Type of the input text.

            Permitted values: `ingest` (maps to `document` in the VoyageAI documentation), `search` (maps to `query` in the VoyageAI documentation).

            Only for the `text_embedding` task type.'
          type: string
        return_documents:
          description: 'Whether to return the source documents in the response.

            Only for the `rerank` task type.'
          default: false
          type: boolean
        top_k:
          description: 'The number of most relevant documents to return.

            If not specified, the reranking results of all documents will be returned.

            Only for the `rerank` task type.'
          type: number
        truncation:
          description: Whether to truncate the input texts to fit within the context length.
          default: true
          type: boolean
    inference._types.TaskTypeAzureOpenAI:
      type: string
      enum:
      - text_embedding
      - completion
      - chat_completion
    inference._types.OpenShiftAiTaskType:
      type: string
      enum:
      - text_embedding
      - completion
      - chat_completion
      - rerank
    inference._types.TaskTypeNvidia:
      type: string
      enum:
      - chat_completion
      - completion
      - rerank
      - text_embedding
    inference._types.GoogleAiServiceType:
      type: string
      enum:
      - googleaistudio
    inference._types.CompletionToolChoiceFunction:
      description: The tool choice function.
      type: object
      properties:
        name:
          description: The name of the function to call.
          type: string
      required:
      - name
    inference._types.AnthropicTaskSettings:
      type: object
      properties:
        max_tokens:
          description: For a `completion` or `chat_completion` task, it is the maximum number of tokens to generate before stopping.
          type: number
        temperature:
          externalDocs:
            url: https://docs.anthropic.com/en/api/messages
          description: 'For a `completion` or `chat_completion` task, it is the amount of randomness injected into the response.

            For more details about the supported range, refer to Anthropic documentation.'
          type: number
        top_k:
          description: 'For a `completion` or `chat_completion` task, it specifies to only sample from the top K options for each subsequent token.

            It is recommended for advanced use cases only.

            You usually only need to use `temperature`.'
          type: number
        top_p:
          description: 'For a `completion` or `chat_completion` task, it specifies to use Anthropic''s nucleus sampling.

            In nucleus sampling, Anthropic computes the cumulative distribution over all the options for each subsequent token in decreasing probability order and cuts it off once it reaches the specified probability.

            You should either alter `temperature` or `top_p`, but not both.

            It is recommended for advanced use cases only.

            You usually only need to use `temperature`.'
          type: number
      required:
      - max_tokens
    inference._types.InferenceEndpointInfoOpenShiftAi:
      allOf:
      - $ref: '#/components/schemas/inference._types.InferenceEndpoint'
      - type: object
        properties:
          inference_id:
            description: The inference Id
            type: string
          task_type:
            description: The task type
            allOf:
            - $ref: '#/components/schemas/inference._types.TaskTypeOpenShiftAi'
        required:
        - inference_id
        - task_type
    inference._types.Reasoning:
      description: 'The reasoning configuration to use for the completion request.

        Currently supported only for `elastic` provider.'
      type: object
      properties:
        effort:
          description: 'The level of effort the model should put into reasoning.

            This is a hint that guides the model in how much effort to put into reasoning,

            with `xhigh` being the most effort and `none` being no effort.'
          allOf:
          - $ref: '#/components/schemas/inference._types.ReasoningEffort'
        enabled:
          description: 'Whether to enable reasoning with default settings.

            This is a shortcut for enabling reasoning without having to specify the other parameters.

            If `enabled` is set to `true`, then reasoning at the `medium` effort level is enabled.

            Ignored if `effort` is specified,

            in which case that parameter will control the reasoning process instead.'
          type: boolean
        exclude:
          description: 'Whether to exclude reasoning information from the response.

            If `true`, the response will not include any reasoning details.'
          type: boolean
        summary:
          description: 'The level of detail included in the reasoning summary returned in the response.

            This is a hint on how much detail to include in the summary of the reasoning that is returned in the response,

            with `auto` being the default level of detail, `concise` being less detail, and `detailed` being more detail.'
          allOf:
          - $ref: '#/components/schemas/inference._types.ReasoningSummary'
    inference._types.TaskTypeContextualAI:
      type: string
      enum:
      - rerank
    _types.Id:
      type: string
    inference._types.ChatCompletionCompletionTokensDetails:
      description: Breakdown of tokens used in the request.
      type: object
      properties:
        reasoning_tokens:
          description: The number of tokens used for reasoning by the model.
          type: number
    inference._types.TaskTypeMistral:
      type: string
