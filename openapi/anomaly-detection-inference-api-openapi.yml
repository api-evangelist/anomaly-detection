    inference._types.RequestChatCompletion:
      type: object
      properties:
        messages:
          description: 'A list of objects representing the conversation.

            Requests should generally only add new messages from the user (role `user`).

            The other message roles (`assistant`, `system`, or `tool`) should generally only be copied from the response to a previous completion request, such that the messages array is built up throughout a conversation.'
          type: array
          items:
            $ref: '#/components/schemas/inference._types.Message'
        model:
          description: The ID of the model to use. By default, the model ID is set to the value included when creating the inference endpoint.
          type: string
        max_completion_tokens:
          description: The upper bound limit for the number of tokens that can be generated for a completion request.
          type: number
        reasoning:
          description: "The reasoning configuration for the completion request.\nThis controls the model's reasoning process in one of two ways:\n\n* By specifying the model’s reasoning effort level with the `effort` field.\n* By enabling reasoning with default settings by setting `enabled` field to `true`.\n\nIt also includes optional settings to control:\n\n* The level of detail in the summary returned in the response with the `summary` field.\n* Whether reasoning details are included in the response at all with the `exclude` field.\n\nExample (effort):\n```\n{\n   \"reasoning\": {\n       \"effort\": \"high\",\n       \"summary\": \"concise\",\n       \"exclude\": false\n   }\n}\n```\nExample (enabled):\n```\n{\n   \"reasoning\": {\n       \"enabled\": true,\n       \"summary\": \"concise\",\n       \"exclude\": false\n   }\n}\n```\nCurrently supported only for `elastic` provider."
          allOf:
          - $ref: '#/components/schemas/inference._types.Reasoning'
        stop:
          description: A sequence of strings to control when the model should stop generating additional tokens.
          type: array
          items:
            type: string
        temperature:
          description: The sampling temperature to use.
          type: number
        tool_choice:
          description: "Controls which tool is called by the model.\nString representation: One of `auto`, `none`, or `requrired`. `auto` allows the model to choose between calling tools and generating a message. `none` causes the model to not call any tools. `required` forces the model to call one or more tools.\nExample (object representation):\n```\n{\n  \"tool_choice\": {\n      \"type\": \"function\",\n      \"function\": {\n          \"name\": \"get_current_weather\"\n      }\n  }\n}\n```"
          allOf:
          - $ref: '#/components/schemas/inference._types.CompletionToolType'
        tools:
          description: "A list of tools that the model can call.\nExample:\n```\n{\n  \"tools\": [\n      {\n          \"type\": \"function\",\n          \"function\": {\n              \"name\": \"get_price_of_item\",\n              \"description\": \"Get the current price of an item\",\n              \"parameters\": {\n                  \"type\": \"object\",\n                  \"properties\": {\n                      \"item\": {\n                          \"id\": \"12345\"\n                      },\n                      \"unit\": {\n                          \"type\": \"currency\"\n                      }\n                  }\n              }\n          }\n      }\n  ]\n}\n```"
          type: array
          items:
            $ref: '#/components/schemas/inference._types.CompletionTool'
        top_p:
          description: Nucleus sampling, an alternative to sampling with temperature.
          type: number
      required:
      - messages
    inference._types.GoogleVertexAITaskSettings:
      type: object
      properties:
        auto_truncate:
          description: For a `text_embedding` task, truncate inputs longer than the maximum token length automatically.
          type: boolean
        top_n:
          description: For a `rerank` task, the number of the top N documents that should be returned.
