    inference._types.JinaAIServiceSettings:
      type: object
      properties:
        api_key:
          externalDocs:
            url: https://jina.ai/embeddings/
          description: 'A valid API key of your JinaAI account.


            IMPORTANT: You need to provide the API key only once, during the inference model creation.

            The get inference endpoint API does not retrieve your API key.'
          type: string
        model_id:
          description: The name of the model to use for the inference task.
          type: string
        rate_limit:
          externalDocs:
            url: https://jina.ai/contact-sales/#rate-limit
          description: 'This setting helps to minimize the number of rate limit errors returned from JinaAI.

            By default, the `jinaai` service sets the number of requests allowed per minute to 2000 for all task types.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
        similarity:
          description: 'For an `embedding` or `text_embedding` task, the similarity measure. One of cosine, dot_product, l2_norm.

            The default values varies with the embedding type.

            For example, a float embedding type uses a `dot_product` similarity measure by default.'
          allOf:
          - $ref: '#/components/schemas/inference._types.JinaAISimilarityType'
        dimensions:
          externalDocs:
            url: https://jina.ai/embeddings/
          description: 'For an `embedding` or `text_embedding` task, the number of dimensions the resulting output embeddings should have.

            By default, the model''s standard output dimension is used.

            Refer to the Jina documentation for more information.'
          type: number
        embedding_type:
          description: 'For an `embedding` or `text_embedding` task, the data type returned by the model.

            Use `bit` for binary embeddings, which are encoded as bytes with signed int8 precision.

            Use `binary` for binary embeddings, which are encoded as bytes with signed int8 precision (this is a synonym of `bit`).

            Use `float` for the default float embeddings.'
          default: float
          allOf:
          - $ref: '#/components/schemas/inference._types.JinaAIElementType'
        multimodal_model:
          description: 'For the `embedding` task, whether the model supports multimodal inputs. If true, requests sent to the Jina model

            will use the multimodal request format (a list of objects). If false, requests sent to the model will use the same

            format as the `text_embedding` task (a list of strings). Setting this to `false` allows the `embedding` task to be

            used with models that do not support multimodal requests.'
          default: true
          type: boolean
      required:
      - api_key
      - model_id
    inference._types.DenseByteVector:
      description: 'Dense Embedding results containing bytes are represented as Dense

