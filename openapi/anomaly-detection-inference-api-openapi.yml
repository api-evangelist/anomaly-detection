  requestBodies:
    inference.put:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inference._types.InferenceEndpoint'
          examples:
            InferencePutExample1:
              description: An example body for a `PUT _inference/rerank/my-rerank-model` request.
              value: "{\n \"service\": \"cohere\",\n \"service_settings\": {\n   \"model_id\": \"rerank-english-v3.0\",\n   \"api_key\": \"{{COHERE_API_KEY}}\"\n }\n}"
      required: true
    inference.update:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inference._types.InferenceEndpoint'
          examples:
            InferenceUpdateExample1:
              description: An example body for a `PUT _inference/my-inference-endpoint/_update` request.
              value: "{\n \"service_settings\": {\n   \"api_key\": \"<API_KEY>\"\n },\n\"service\": \"example-service\"\n}"
      required: true
    inference.inference:
      content:
        application/json:
          schema:
            type: object
            properties:
              query:
                description: 'The query input, which is required only for the `rerank` task.

                  It is not required for other tasks.'
                type: string
              input:
                description: 'The text on which you want to perform the inference task.

                  It can be a single string or an array.


                  > info

                  > Inference endpoints for the `completion` task type currently only support a single string as input.'
                oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              input_type:
                description: 'Specifies the input data type for the embedding model. The `input_type` parameter only applies to Inference Endpoints with the `embedding` or `text_embedding` task type. Possible values include:

                  * `SEARCH`

                  * `INGEST`

                  * `CLASSIFICATION`

                  * `CLUSTERING`

                  Not all services support all values. Unsupported values will trigger a validation exception.

                  Accepted values depend on the configured inference service, refer to the relevant service-specific documentation for more info.


                  > info

                  > The `input_type` parameter specified on the root level of the request body will take precedence over the `input_type` parameter specified in `task_settings`.'
                type: string
              task_settings:
                description: 'Task settings for the individual inference request.

                  These settings are specific to the task type you specified and override the task settings specified when initializing the service.'
                allOf:
                - $ref: '#/components/schemas/inference._types.TaskSettings'
            required:
            - input
      required: true
  securitySchemes:
    apiKeyAuth:
