components:
  schemas:
    inference._types.JinaAIServiceType:
      type: string
      enum:
      - jinaai
    inference._types.AlibabaCloudTaskSettings:
      type: object
      properties:
        input_type:
          description: 'For a `sparse_embedding` or `text_embedding` task, specify the type of input passed to the model.

            Valid values are:


            * `ingest` for storing document embeddings in a vector database.

            * `search` for storing embeddings of search queries run against a vector database to find relevant documents.'
          type: string
        return_token:
          description: 'For a `sparse_embedding` task, it affects whether the token name will be returned in the response.

            It defaults to `false`, which means only the token ID will be returned in the response.'
          type: boolean
    inference._types.DeepSeekServiceSettings:
      type: object
      properties:
        api_key:
          externalDocs:
            url: https://api-docs.deepseek.com/
          description: 'A valid API key for your DeepSeek account.

            You can find or create your DeepSeek API keys on the DeepSeek API key page.


            IMPORTANT: You need to provide the API key only once, during the inference model creation.

            The get inference endpoint API does not retrieve your API key.'
          type: string
        model_id:
          description: 'For a `completion` or `chat_completion` task, the name of the model to use for the inference task.


            For the available `completion` and `chat_completion` models, refer to the [DeepSeek Models & Pricing docs](https://api-docs.deepseek.com/quick_start/pricing).'
          type: string
        url:
          description: The URL endpoint to use for the requests. Defaults to `https://api.deepseek.com/chat/completions`.
          type: string
      required:
      - api_key
      - model_id
    inference._types.InferenceChunkingSettings:
      description: Chunking configuration object
      type: object
      properties:
        max_chunk_size:
          description: 'The maximum size of a chunk in words.

            This value cannot be lower than `20` (for `sentence` strategy) or `10` (for `word` strategy).

            This value should not exceed the window size for the associated model.'
          default: 250
          type: number
        overlap:
          description: 'The number of overlapping words for chunks.

            It is applicable only to a `word` chunking strategy.

            This value cannot be higher than half the `max_chunk_size` value.'
          default: 100
          type: number
        sentence_overlap:
          description: 'The number of overlapping sentences for chunks.

            It is applicable only for a `sentence` chunking strategy.

            It can be either `1` or `0`.'
          default: 1
          type: number
        separator_group:
          description: 'Only applicable to the `recursive` strategy and required when using it.


            Sets a predefined list of separators in the saved chunking settings based on the selected text type.

            Values can be `markdown` or `plaintext`.


            Using this parameter is an alternative to manually specifying a custom `separators` list.'
          type: string
        separators:
          description: 'Only applicable to the `recursive` strategy and required when using it.


            A list of strings used as possible split points when chunking text.


            Each string can be a plain string or a regular expression (regex) pattern.

            The system tries each separator in order to split the text, starting from the first item in the list.


            After splitting, it attempts to recombine smaller pieces into larger chunks that stay within

            the `max_chunk_size` limit, to reduce the total number of chunks generated.'
          type: array
          items:
            type: string
        strategy:
          externalDocs:
            url: https://www.elastic.co/docs/explore-analyze/elastic-inference/inference-api#chunking-strategies
          description: "The chunking strategy: `sentence`, `word`, `none` or `recursive`.\n\n * If `strategy` is set to `recursive`, you must also specify:\n\n- `max_chunk_size`\n- either `separators` or`separator_group`\n\nLearn more about different chunking strategies in the linked documentation."
          default: sentence
          type: string
    inference._types.NvidiaTaskSettings:
      type: object
      properties:
        input_type:
          description: 'For a `text_embedding` task, type of input sent to the Nvidia endpoint.

            Valid values are:


            * `ingest`: Mapped to Nvidia''s `passage` value in request. Used when generating embeddings during indexing.

            * `search`: Mapped to Nvidia''s `query` value in request. Used when generating embeddings during querying.


            IMPORTANT: For Nvidia endpoints, if the `input_type` field is not specified, it defaults to `query`.'
          allOf:
          - $ref: '#/components/schemas/inference._types.NvidiaInputType'
        truncate:
          description: 'For a `text_embedding` task, the method used by the Nvidia model to handle inputs longer than the maximum token length.

            Valid values are:


            * `END`: When the input exceeds the maximum input token length, the end of the input is discarded.

            * `NONE`: When the input exceeds the maximum input token length, an error is returned.

            * `START`: When the input exceeds the maximum input token length, the start of the input is discarded.'
          allOf:
          - $ref: '#/components/schemas/inference._types.CohereTruncateType'
    inference._types.AzureAiStudioServiceSettings:
      type: object
      properties:
        api_key:
          externalDocs:
            url: https://ai.azure.com/
          description: 'A valid API key of your Azure AI Studio model deployment.

            This key can be found on the overview page for your deployment in the management section of your Azure AI Studio account.


            IMPORTANT: You need to provide the API key only once, during the inference model creation.

            The get inference endpoint API does not retrieve your API key.'
          type: string
        endpoint_type:
          externalDocs:
            url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/deployments-overview#billing-for-deploying-and-inferencing-llms-in-azure-ai-studio
          description: 'The type of endpoint that is available for deployment through Azure AI Studio: `token` or `realtime`.

            The `token` endpoint type is for "pay as you go" endpoints that are billed per token.

            The `realtime` endpoint type is for "real-time" endpoints that are billed per hour of usage.'
          type: string
        target:
          description: 'The target URL of your Azure AI Studio model deployment.

            This can be found on the overview page for your deployment in the management section of your Azure AI Studio account.'
          type: string
        provider:
          description: 'The model provider for your deployment.

            Note that some providers may support only certain task types.

            Supported providers include:


            * `cohere` - available for `text_embedding`, `rerank` and `completion` task types

            * `databricks` - available for `completion` task type only

            * `meta` - available for `completion` task type only

            * `microsoft_phi` - available for `completion` task type only

            * `mistral` - available for `completion` task type only

            * `openai` - available for `text_embedding` and `completion` task types'
          type: string
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from Azure AI Studio.

            By default, the `azureaistudio` service sets the number of requests allowed per minute to 240.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
      required:
      - api_key
      - endpoint_type
      - target
      - provider
    inference._types.NvidiaServiceSettings:
      type: object
      properties:
        api_key:
          description: 'A valid API key for your Nvidia endpoint.

            Can be found in `API Keys` section of Nvidia account settings.'
          type: string
        url:
          description: 'The URL of the Nvidia model endpoint. If not provided, the default endpoint URL is used depending on the task type:


            * For `text_embedding` task - `https://integrate.api.nvidia.com/v1/embeddings`.

            * For `completion` and `chat_completion` tasks - `https://integrate.api.nvidia.com/v1/chat/completions`.

            * For `rerank` task - `https://ai.api.nvidia.com/v1/retrieval/nvidia/reranking`.'
          type: string
        model_id:
          description: 'The name of the model to use for the inference task.

            Refer to the model''s documentation for the name if needed.

            Service has been tested and confirmed to be working with the following models:


            * For `text_embedding` task - `nvidia/llama-3.2-nv-embedqa-1b-v2`.

            * For `completion` and `chat_completion` tasks - `microsoft/phi-3-mini-128k-instruct`.

            * For `rerank` task - `nv-rerank-qa-mistral-4b:1`.

            Service doesn''t support `text_embedding` task `baai/bge-m3` and `nvidia/nvclip` models due to them not recognizing the `input_type` parameter.'
          type: string
        max_input_tokens:
          description: For a `text_embedding` task, the maximum number of tokens per input. Inputs exceeding this value are truncated prior to sending to the Nvidia API.
          type: number
        similarity:
          description: For a `text_embedding` task, the similarity measure. One of cosine, dot_product, l2_norm.
          allOf:
          - $ref: '#/components/schemas/inference._types.NvidiaSimilarityType'
        rate_limit:
          description: 'This setting helps to minimize the number of rate limit errors returned from the Nvidia API.

            By default, the `nvidia` service sets the number of requests allowed per minute to 3000.'
          allOf:
          - $ref: '#/components/schemas/inference._types.RateLimitSetting'
      required:
      - api_key
      - model_id
    inference._types.Ai21ServiceSettings:
      type: object
      properties:
        model_id:
          externalDocs:
            url: https://docs.ai21.com/docs/jamba-foundation-models
          description: 'The name of the model to use for the inference task.

            Refer to the AI21 models documentation for the list of supported models and versions.

            Service has been tested and confirmed to be working for `completion` and `chat_completion` tasks with the following models:

            * `jamba-mini`

