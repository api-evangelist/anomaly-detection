        - Azure OpenAI

        - Deepseek

        - Elastic

        - FireworksAI

        - Groq

        - Huggingface

        - IBMWatsonX

        - Llama

        - Mistral

        - NVIDIA

        - OpenAI

        - OpenShiftAI'
