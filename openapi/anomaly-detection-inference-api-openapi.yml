      - lang: PHP
        source: "$resp = $client->inference()->update([\n    \"inference_id\" => \"my-inference-endpoint\",\n    \"body\" => [\n        \"service_settings\" => [\n            \"api_key\" => \"<API_KEY>\",\n        ],\n        \"service\" => \"example-service\",\n    ],\n]);"
