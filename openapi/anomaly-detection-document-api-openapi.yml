info:
  title: Elasticsearch Document API
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the `main` branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: Document
  x-displayName: Document
  description: The document APIs enable you to create and manage documents in an Elasticsearch index.
  externalDocs:
    description: Learn more about reading and writing documents.
    url: https://www.elastic.co/docs/deploy-manage/distributed-architecture/reading-and-writing-documents
paths:
  /{index}/_bulk:
    put:
      tags:
      - Document
      summary: Bulk index or delete documents
      description: '**All methods and paths for this operation:**


        POST

        /_bulk


        PUT

        /_bulk


        POST

        /{index}/_bulk


        PUT

        /{index}/_bulk


        Perform multiple `index`, `create`, `delete`, and `update` actions in a single request. This reduces overhead and can greatly increase indexing speed. If the Elasticsearch security features are enabled, you must have the following index privileges for the target data stream, index, or index alias:


        * To use the `create` action, you must have the `create_doc`, `create`, `index`, or `write` index privilege. Data streams support only the `create` action. * To use the `index` action, you must have the `create`, `index`, or `write` index privilege. * To use the `delete` action, you must have the `delete` or `write` index privilege. * To use the `update` action, you must have the `index` or `write` index privilege. * To automatically create a data stream or index with a bulk API request, you must have the `auto_configure`, `create_index`, or `manage` index privilege. * To make the result of a bulk operation visible to search using the `refresh` parameter, you must have the `maintenance` or `manage` index privilege. Automatic data stream creation requires a matching index template with data stream enabled. The actions are specified in the request body using a newline delimited JSON (NDJSON) structure:


        ```

        action_and_meta_data\n

        optional_source\n

        action_and_meta_data\n

        optional_source\n

        .... action_and_meta_data\n

        optional_source\n

        ```


        The `index` and `create` actions expect a source on the next line and have the same semantics as the `op_type` parameter in the standard index API. A `create` action fails if a document with the same ID already exists in the target

        An `index` action adds or replaces a document as necessary. NOTE: Data streams support only the `create` action. To update or delete a document in a data stream, you must target the backing index containing the document. An `update` action expects that the partial doc, upsert, and script and its options are specified on the next line. A `delete` action does not expect a source on the next line and has the same semantics as the standard delete API. NOTE: The final line of data must end with a newline character (`\n`). Each newline character may be preceded by a carriage return (`\r`). When sending NDJSON data to the `_bulk` endpoint, use a `Content-Type` header of `application/json` or `application/x-ndjson`. Because this format uses literal newline characters (`\n`) as delimiters, make sure that the JSON actions and sources are not pretty printed. If you provide a target in the request path, it is used for any actions that don''t explicitly specify an `_index` argument. A note on the format: the idea here is to make processing as fast as possible. As some of the actions are redirected to other shards on other nodes, only `action_meta_data` is parsed on the receiving node side. Client libraries using this protocol should try and strive to do something similar on the client side, and reduce buffering as much as possible. There is no "correct" number of actions to perform in a single bulk request. Experiment with different settings to find the optimal size for your particular workload. Note that Elasticsearch limits the maximum size of a HTTP request to 100mb by default so clients must ensure that no request exceeds this size. It is not possible to index a single document that exceeds the size limit, so you must pre-process any such documents into smaller pieces before sending them to Elasticsearch. For instance, split documents into pages or chapters before indexing them, or store raw binary data in a system outside Elasticsearch and replace the raw data with a link to the external system in the documents that you send to Elasticsearch.'
      externalDocs:
        description: About tune for indexing speed
        url: https://www.elastic.co/docs/deploy-manage/production-guidance/optimize-performance/indexing-speed#disable-refresh-interval
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/docs-bulk.html
      operationId: bulk
      parameters:
      - $ref: '#/components/parameters/bulk-index'
      - $ref: '#/components/parameters/bulk-include_source_on_error'
      - $ref: '#/components/parameters/bulk-list_executed_pipelines'
      - $ref: '#/components/parameters/bulk-pipeline'
      - $ref: '#/components/parameters/bulk-refresh'
      - $ref: '#/components/parameters/bulk-routing'
      - $ref: '#/components/parameters/bulk-_source'
      - $ref: '#/components/parameters/bulk-_source_excludes'
      - $ref: '#/components/parameters/bulk-_source_includes'
      - $ref: '#/components/parameters/bulk-timeout'
      - $ref: '#/components/parameters/bulk-wait_for_active_shards'
      - $ref: '#/components/parameters/bulk-require_alias'
      - $ref: '#/components/parameters/bulk-require_data_stream'
      requestBody:
        $ref: '#/components/requestBodies/bulk'
      responses:
        '200':
          $ref: '#/components/responses/bulk-200'
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: 'POST _bulk

          { "index" : { "_index" : "test", "_id" : "1" } }

          { "field1" : "value1" }

          { "delete" : { "_index" : "test", "_id" : "2" } }

          { "create" : { "_index" : "test", "_id" : "3" } }

          { "field1" : "value3" }

          { "update" : {"_id" : "1", "_index" : "test"} }

          { "doc" : {"field2" : "value2"} }'
      - lang: Python
        source: "resp = client.bulk(\n    operations=[\n        {\n            \"index\": {\n                \"_index\": \"test\",\n                \"_id\": \"1\"\n            }\n        },\n        {\n            \"field1\": \"value1\"\n        },\n        {\n            \"delete\": {\n                \"_index\": \"test\",\n                \"_id\": \"2\"\n            }\n        },\n        {\n            \"create\": {\n                \"_index\": \"test\",\n                \"_id\": \"3\"\n            }\n        },\n        {\n            \"field1\": \"value3\"\n        },\n        {\n            \"update\": {\n                \"_id\": \"1\",\n                \"_index\": \"test\"\n            }\n        },\n        {\n            \"doc\": {\n                \"field2\": \"value2\"\n            }\n        }\n    ],\n)"
      - lang: JavaScript
        source: "const response = await client.bulk({\n  operations: [\n    {\n      index: {\n        _index: \"test\",\n        _id: \"1\",\n      },\n    },\n    {\n      field1: \"value1\",\n    },\n    {\n      delete: {\n        _index: \"test\",\n        _id: \"2\",\n      },\n    },\n    {\n      create: {\n        _index: \"test\",\n        _id: \"3\",\n      },\n    },\n    {\n      field1: \"value3\",\n    },\n    {\n      update: {\n        _id: \"1\",\n        _index: \"test\",\n      },\n    },\n    {\n      doc: {\n        field2: \"value2\",\n      },\n    },\n  ],\n});"
      - lang: Ruby
        source: "response = client.bulk(\n  body: [\n    {\n      \"index\": {\n        \"_index\": \"test\",\n        \"_id\": \"1\"\n      }\n    },\n    {\n      \"field1\": \"value1\"\n    },\n    {\n      \"delete\": {\n        \"_index\": \"test\",\n        \"_id\": \"2\"\n      }\n    },\n    {\n      \"create\": {\n        \"_index\": \"test\",\n        \"_id\": \"3\"\n      }\n    },\n    {\n      \"field1\": \"value3\"\n    },\n    {\n      \"update\": {\n        \"_id\": \"1\",\n        \"_index\": \"test\"\n      }\n    },\n    {\n      \"doc\": {\n        \"field2\": \"value2\"\n      }\n    }\n  ]\n)"
      - lang: PHP
        source: "$resp = $client->bulk([\n    \"body\" => array(\n        [\n            \"index\" => [\n                \"_index\" => \"test\",\n                \"_id\" => \"1\",\n            ],\n        ],\n        [\n            \"field1\" => \"value1\",\n        ],\n        [\n            \"delete\" => [\n                \"_index\" => \"test\",\n                \"_id\" => \"2\",\n            ],\n        ],\n        [\n            \"create\" => [\n                \"_index\" => \"test\",\n                \"_id\" => \"3\",\n            ],\n        ],\n        [\n            \"field1\" => \"value3\",\n        ],\n        [\n            \"update\" => [\n                \"_id\" => \"1\",\n                \"_index\" => \"test\",\n            ],\n        ],\n        [\n            \"doc\" => [\n                \"field2\" => \"value2\",\n            ],\n        ],\n    ),\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/x-ndjson" -d $''{"index":{"_index":"test","_id":"1"}}\n{"field1":"value1"}\n{"delete":{"_index":"test","_id":"2"}}\n{"create":{"_index":"test","_id":"3"}}\n{"field1":"value3"}\n{"update":{"_id":"1","_index":"test"}}\n{"doc":{"field2":"value2"}}\n'' "$ELASTICSEARCH_URL/_bulk"'
      - lang: C#
        source: "var response = await client\n    .BulkAsync(new BulkRequest()\n    {\n        Operations = new global::Elastic.Clients.Elasticsearch.Core.Bulk.BulkOperationsCollection\n        {\n            new global::Elastic.Clients.Elasticsearch.Core.Bulk.BulkIndexOperation<object>(JsonSerializer.Deserialize<JsonElement>(\"\"\"\n            {\n              \"field1\": \"value1\"\n            }\n            \"\"\"))\n            {\n                Id = \"1\",\n                Index = \"test\"\n            },\n            new global::Elastic.Clients.Elasticsearch.Core.Bulk.BulkDeleteOperation(\"2\")\n            {\n                Index = \"test\"\n            },\n            new global::Elastic.Clients.Elasticsearch.Core.Bulk.BulkCreateOperation<object>(JsonSerializer.Deserialize<JsonElement>(\"\"\"\n            {\n              \"field1\": \"value3\"\n            }\n            \"\"\"))\n            {\n                Id = \"3\",\n                Index = \"test\"\n            },\n            new global::Elastic.Clients.Elasticsearch.Core.Bulk.BulkUpdateOperation<object, object>(\"1\")\n            {\n                Index = \"test\",\n                Doc = JsonSerializer.Deserialize<JsonElement>(\"\"\"\n                {\n                  \"field2\": \"value2\"\n                }\n                \"\"\")\n            }\n        }\n    });"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /{index}/_create/{id}:
    post:
      tags:
      - Document
      summary: Create a new document in the index
      description: '**All methods and paths for this operation:**


        PUT

        /{index}/_create/{id}


        POST

        /{index}/_create/{id}


        You can index a new JSON document with the `//_doc/` or `//_create/` APIs

        Using `_create` guarantees that the document is indexed only if it does not already exist. It returns a 409 response when a document with a same ID already exists in the index. To update an existing document, you must use the `//_doc/` API. If the Elasticsearch security features are enabled, you must have the following index privileges for the target data stream, index, or index alias:


        * To add a document using the `PUT //_create/` or `POST //_create/` request formats, you must have the `create_doc`, `create`, `index`, or `write` index privilege. * To automatically create a data stream or index with this API request, you must have the `auto_configure`, `create_index`, or `manage` index privilege. Automatic data stream creation requires a matching index template with data stream enabled. **Automatically create data streams and indices**


        If the request''s target doesn''t exist and matches an index template with a `data_stream` definition, the index operation automatically creates the data stream. If the target doesn''t exist and doesn''t match a data stream template, the operation automatically creates the index and applies any matching index templates. NOTE: Elasticsearch includes several built-in index templates. To avoid naming collisions with these templates, refer to index pattern documentation. If no mapping exists, the index operation creates a dynamic mapping. By default, new fields and objects are automatically added to the mapping if needed. Automatic index creation is controlled by the `action.auto_create_index` setting. If it is `true`, any index can be created automatically. You can modify this setting to explicitly allow or block automatic creation of indices that match specified patterns or set it to `false` to turn off automatic index creation entirely. Specify a comma-separated list of patterns you want to allow or prefix each pattern with `+` or `-` to indicate whether it should be allowed or blocked. When a list is specified, the default behaviour is to disallow. NOTE: The `action.auto_create_index` setting affects the automatic creation of indices only. It does not affect the creation of data streams. **Routing**


        By default, shard placement — or routing — is controlled by using a hash of the document''s ID value. For more explicit control, the value fed into the hash function used by the router can be directly specified on a per-operation basis using the `routing` parameter. When setting up explicit mapping, you can also use the `_routing` field to direct the index operation to extract the routing value from the document itself. This does come at the (very minimal) cost of an additional document parsing pass. If the `_routing` mapping is defined and set to be required, the index operation will fail if no routing value is provided or extracted. NOTE: Data streams do not support custom routing unless they were created with the `allow_custom_routing` setting enabled in the template. **Distributed**


        The index operation is directed to the primary shard based on its route and performed on the actual node containing this shard. After the primary shard completes the operation, if needed, the update is distributed to applicable replicas. **Active shards**


        To improve the resiliency of writes to the system, indexing operations can be configured to wait for a certain number of active shard copies before proceeding with the operation. If the requisite number of active shard copies are not available, then the write operation must wait and retry, until either the requisite shard copies have started or a timeout occurs. By default, write operations only wait for the primary shards to be active before proceeding (that is to say `wait_for_active_shards` is `1`).'
      externalDocs:
        description: Learn more about data streams
        url: https://www.elastic.co/docs/manage-data/data-store/data-streams
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/docs-index_.html
      operationId: create
      parameters:
      - $ref: '#/components/parameters/create-index'
      - $ref: '#/components/parameters/create-id'
      - $ref: '#/components/parameters/create-include_source_on_error'
      - $ref: '#/components/parameters/create-pipeline'
      - $ref: '#/components/parameters/create-refresh'
      - $ref: '#/components/parameters/create-require_alias'
      - $ref: '#/components/parameters/create-require_data_stream'
      - $ref: '#/components/parameters/create-routing'
      - $ref: '#/components/parameters/create-timeout'
      - $ref: '#/components/parameters/create-version'
      - $ref: '#/components/parameters/create-version_type'
      - $ref: '#/components/parameters/create-wait_for_active_shards'
      requestBody:
        $ref: '#/components/requestBodies/create'
      responses:
        '200':
          $ref: '#/components/responses/create-200'
      x-state: Generally available; Added in 5.0.0
      x-codeSamples:
      - lang: Console
        source: "PUT my-index-000001/_create/1\n{\n  \"@timestamp\": \"2099-11-15T13:12:00\",\n  \"message\": \"GET /search HTTP/1.1 200 1070000\",\n  \"user\": {\n    \"id\": \"kimchy\"\n  }\n}"
      - lang: Python
        source: "resp = client.create(\n    index=\"my-index-000001\",\n    id=\"1\",\n    document={\n        \"@timestamp\": \"2099-11-15T13:12:00\",\n        \"message\": \"GET /search HTTP/1.1 200 1070000\",\n        \"user\": {\n            \"id\": \"kimchy\"\n        }\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.create({\n  index: \"my-index-000001\",\n  id: 1,\n  document: {\n    \"@timestamp\": \"2099-11-15T13:12:00\",\n    message: \"GET /search HTTP/1.1 200 1070000\",\n    user: {\n      id: \"kimchy\",\n    },\n  },\n});"
      - lang: Ruby
        source: "response = client.create(\n  index: \"my-index-000001\",\n  id: \"1\",\n  body: {\n    \"@timestamp\": \"2099-11-15T13:12:00\",\n    \"message\": \"GET /search HTTP/1.1 200 1070000\",\n    \"user\": {\n      \"id\": \"kimchy\"\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->create([\n    \"index\" => \"my-index-000001\",\n    \"id\" => \"1\",\n    \"body\" => [\n        \"@timestamp\" => \"2099-11-15T13:12:00\",\n        \"message\" => \"GET /search HTTP/1.1 200 1070000\",\n        \"user\" => [\n            \"id\" => \"kimchy\",\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"@timestamp":"2099-11-15T13:12:00","message":"GET /search HTTP/1.1 200 1070000","user":{"id":"kimchy"}}'' "$ELASTICSEARCH_URL/my-index-000001/_create/1"'
      - lang: C#
        source: "var response = await client.CreateAsync<MyDocument>(document: new MyDocument()\n{\n    Timestamp = \"2099-11-15T13:12:00\",\n    Message = \"GET /search HTTP/1.1 200 1070000\",\n    User = new()\n    {\n        Id = \"kimchy\"\n    }\n}, index: \"my-index-000001\", id: \"1\");"
      - lang: Java
        source: "client.create(c -> c\n    .id(\"1\")\n    .index(\"my-index-000001\")\n    .document(JsonData.fromJson(\"\"\"\n{\"@timestamp\":\"2099-11-15T13:12:00\",\"message\":\"GET /search HTTP/1.1 200 1070000\",\"user\":{\"id\":\"kimchy\"}}\n\"\"\"))\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /{index}/_doc/{id}:
    get:
      tags:
      - Document
      summary: Get a document by its ID
      description: 'Get a document and its source or stored fields from an index.


        By default, this API is realtime and is not affected by the refresh rate of the index (when data will become visible for search).

        In the case where stored fields are requested with the `stored_fields` parameter and the document has been updated but is not yet refreshed, the API will have to parse and analyze the source to extract the stored fields.

        To turn off realtime behavior, set the `realtime` parameter to false.


        **Source filtering**


        By default, the API returns the contents of the `_source` field unless you have used the `stored_fields` parameter or the `_source` field is turned off.

        You can turn off `_source` retrieval by using the `_source` parameter:


        ```

        GET my-index-000001/_doc/0?_source=false

        ```


        If you only need one or two fields from the `_source`, use the `_source_includes` or `_source_excludes` parameters to include or filter out particular fields.

        This can be helpful with large documents where partial retrieval can save on network overhead

        Both parameters take a comma separated list of fields or wildcard expressions.

        For example:


        ```

        GET my-index-000001/_doc/0?_source_includes=*.id&_source_excludes=entities

        ```


        If you only want to specify includes, you can use a shorter notation:


        ```

        GET my-index-000001/_doc/0?_source=*.id

        ```


        **Routing**


        If routing is used during indexing, the routing value also needs to be specified to retrieve a document.

        For example:


        ```

        GET my-index-000001/_doc/2?routing=user1

        ```


        This request gets the document with ID 2, but it is routed based on the user.

        The document is not fetched if the correct routing is not specified.


        **Distributed**


        The GET operation is hashed into a specific shard ID.

        It is then redirected to one of the replicas within that shard ID and returns the result.

        The replicas are the primary shard and its replicas within that shard ID group.

        This means that the more replicas you have, the better your GET scaling will be.


        **Versioning support**


        You can use the `version` parameter to retrieve the document only if its current version is equal to the specified one.


        Internally, Elasticsearch has marked the old document as deleted and added an entirely new document.

        The old version of the document doesn''t disappear immediately, although you won''t be able to access it.

        Elasticsearch cleans up deleted documents in the background as you continue to index more data.


        ## Required authorization


        * Index privileges: `read`'
      operationId: get
      parameters:
      - in: path
        name: index
        description: The name of the index that contains the document.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.IndexName'
        style: simple
      - in: path
        name: id
        description: A unique document identifier.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: preference
        description: 'The node or shard the operation should be performed on.

          By default, the operation is randomized between the shard replicas.


          If it is set to `_local`, the operation will prefer to be run on a local allocated shard when possible.

          If it is set to a custom value, the value is used to guarantee that the same shards will be used for the same custom value.

          This can help with "jumping values" when hitting different shards in different refresh states.

          A sample value can be something like the web session ID or the user name.'
        deprecated: false
        schema:
          type: string
        style: form
      - in: query
        name: realtime
        description: If `true`, the request is real-time as opposed to near-real-time.
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      - in: query
        name: refresh
        description: 'If `true`, the request refreshes the relevant shards before retrieving the document.

          Setting it to `true` should be done after careful thought and verification that this does not cause a heavy load on the system (and slow down indexing).'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: routing
        description: 'A custom value used to route operations to a specific shard.

          Not allowed when `index.slice.enabled` is `true` for the target index; use `_slice` instead.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Routing'
        style: form
      - in: query
        name: _source
        description: Indicates whether to return the `_source` field (`true` or `false`) or lists the fields to return.
        deprecated: false
        schema:
          $ref: '#/components/schemas/_global.search._types.SourceConfigParam'
        style: form
      - in: query
        name: _source_excludes
        description: 'A comma-separated list of source fields to exclude from the response.

          You can also use this parameter to exclude fields from the subset specified in `_source_includes` query parameter.

          If the `_source` parameter is `false`, this parameter is ignored.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Fields'
        style: form
      - in: query
        name: _source_exclude_vectors
        description: Whether vectors should be excluded from _source
        deprecated: false
        schema:
          default: false
          type: boolean
        x-state: Generally available; Added in 9.2.0
        style: form
      - in: query
        name: _source_includes
        description: 'A comma-separated list of source fields to include in the response.

          If this parameter is specified, only these source fields are returned.

          You can exclude fields from this subset using the `_source_excludes` query parameter.

          If the `_source` parameter is `false`, this parameter is ignored.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Fields'
        style: form
      - in: query
        name: stored_fields
        description: 'A comma-separated list of stored fields to return as part of a hit.

          If no fields are specified, no stored fields are included in the response.

          If this field is specified, the `_source` parameter defaults to `false`.

          Only leaf fields can be retrieved with the `stored_fields` option.

          Object fields can''t be returned; if specified, the request fails.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Fields'
        style: form
      - in: query
        name: version
        description: 'The version number for concurrency control.

          It must match the current version of the document for the request to succeed.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.VersionNumber'
        style: form
      - in: query
        name: version_type
        description: "The version type.\n\nSupported values include:\n  - `internal`: Use internal versioning that starts at 1 and increments with each update or delete.\n  - `external`: Only index the document if the specified version is strictly higher than the version of the stored document or if there is no existing document.\n  - `external_gte`: Only index the document if the specified version is equal or higher than the version of the stored document or if there is no existing document.\nNOTE: The `external_gte` version type is meant for special use cases and should be used with care.\nIf used incorrectly, it can result in loss of data.\n\n"
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.VersionType'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_global.get.GetResult'
              examples:
                GetResponseExample1:
                  summary: Get a document
                  description: 'A successful response from `GET my-index-000001/_doc/0`. It retrieves the JSON document with the `_id` 0 from the `my-index-000001` index.

                    '
                  value: "{\n  \"_index\": \"my-index-000001\",\n  \"_id\": \"0\",\n  \"_version\": 1,\n  \"_seq_no\": 0,\n  \"_primary_term\": 1,\n  \"found\": true,\n  \"_source\": {\n    \"@timestamp\": \"2099-11-15T14:12:12\",\n    \"http\": {\n      \"request\": {\n        \"method\": \"get\"\n      },\n      \"response\": {\n        \"status_code\": 200,\n        \"bytes\": 1070000\n      },\n      \"version\": \"1.1\"\n    },\n    \"source\": {\n      \"ip\": \"127.0.0.1\"\n    },\n    \"message\": \"GET /search HTTP/1.1 200 1070000\",\n    \"user\": {\n      \"id\": \"kimchy\"\n    }\n  }\n}"
                GetResponseExample2:
                  summary: Get stored fields
