          Avoid specifying this parameter for requests that target data streams with backing indices across multiple data tiers.'
        deprecated: false
        schema:
          type: number
        style: form
      - in: query
        name: timeout
        description: 'The period each update request waits for the following operations: dynamic mapping updates, waiting for active shards.

          By default, it is one minute.

          This guarantees Elasticsearch waits for at least the timeout before failing.

          The actual wait time could be longer, particularly when multiple waits occur.'
        deprecated: false
        schema:
          default: 1m
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: version
        description: If `true`, returns the document version as part of a hit.
        deprecated: false
        schema:
          type: boolean
        style: form
      - in: query
        name: version_type
