      - lang: Java
        source: "client.updateByQuery(u -> u\n    .conflicts(Conflicts.Proceed)\n    .index(\"my-index-000001\")\n    .query(q -> q\n        .term(t -> t\n            .field(\"user.id\")\n            .value(FieldValue.of(\"kimchy\"))\n        )\n    )\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_update_by_query/{task_id}/_rethrottle:
    post:
      tags:
      - Document
      summary: Throttle an update by query operation
      description: 'Change the number of requests per second for a particular update by query operation.

        Rethrottling that speeds up the query takes effect immediately but rethrotting that slows down the query takes effect after completing the current batch to prevent scroll timeouts.'
      operationId: update-by-query-rethrottle
      parameters:
      - in: path
        name: task_id
        description: The ID for the task.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: requests_per_second
        description: 'The maximum number of documents to update per second, across the entire update_by_query operation (including slices).

          It can be either `-1` to turn off throttling or any decimal number like `1.7` or `12` to throttle to that level.'
        required: true
        deprecated: false
        schema:
          type: number
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/_global.update_by_query_rethrottle.UpdateByQueryRethrottleNode'
                required:
                - nodes
      x-state: Generally available; Added in 6.5.0
      x-codeSamples:
      - lang: Console
        source: 'POST _update_by_query/r1A2WoRbTwKZ516z6NEs5A:36619/_rethrottle?requests_per_second=-1

          '
      - lang: Python
        source: "resp = client.update_by_query_rethrottle(\n    task_id=\"r1A2WoRbTwKZ516z6NEs5A:36619\",\n    requests_per_second=\"-1\",\n)"
      - lang: JavaScript
        source: "const response = await client.updateByQueryRethrottle({\n  task_id: \"r1A2WoRbTwKZ516z6NEs5A:36619\",\n  requests_per_second: \"-1\",\n});"
      - lang: Ruby
        source: "response = client.update_by_query_rethrottle(\n  task_id: \"r1A2WoRbTwKZ516z6NEs5A:36619\",\n  requests_per_second: \"-1\"\n)"
      - lang: PHP
        source: "$resp = $client->updateByQueryRethrottle([\n    \"task_id\" => \"r1A2WoRbTwKZ516z6NEs5A:36619\",\n    \"requests_per_second\" => \"-1\",\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_update_by_query/r1A2WoRbTwKZ516z6NEs5A:36619/_rethrottle?requests_per_second=-1"'
      - lang: C#
        source: "var response = await client\n    .UpdateByQueryRethrottleAsync(taskId: \"r1A2WoRbTwKZ516z6NEs5A:36619\", d1 => d1\n        .RequestsPerSecond(-1f)\n    );"
      - lang: Java
        source: "client.updateByQueryRethrottle(u -> u\n    .requestsPerSecond(-1.0F)\n    .taskId(\"r1A2WoRbTwKZ516z6NEs5A:36619\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
