          Elasticsearch creates a record of this task as a document at `.tasks/task/${taskId}`.'
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_docs:
