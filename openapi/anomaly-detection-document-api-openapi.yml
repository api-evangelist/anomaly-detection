  /_reindex/{task_id}/_rethrottle:
    post:
      tags:
      - Document
      summary: Throttle a reindex operation
      description: 'Change the maximum number of documents to index per second for a particular reindex operation.

        For example, to unthrottle to unlimited documents per second:


        ```

        POST _reindex/r1A2WoRbTwKZ516z6NEs5A:36619/_rethrottle?requests_per_second=-1

        ```


        Rethrottling that speeds up the query takes effect immediately.

        Rethrottling that slows down the query will take effect after completing the current batch of documents.

        This behavior prevents scroll timeouts.


        This API follows reindex tasks across node-shutdown relocations, so callers can keep using

        the original task ID throughout the lifetime of the operation.

        The relocated task ID is also accepted and is followed transparently.

        In either case, returned task IDs and timings reflect the original task, not its relocated successor.


        The rethrottle may not have been applied to any tasks if either `node_failures` or `task_failures` are non-empty, or if the response contains

        no successfully rethrottled tasks — that is, no entries under `nodes` (returned with the default

        `group_by=nodes` in stack) or under `tasks` (returned in serverless, or in stack with

        `group_by=none` or `group_by=parents`).'
      operationId: reindex-rethrottle
      parameters:
      - in: path
        name: task_id
        description: 'The task identifier, returned when creating a reindex task, or by listing tasks via

          `GET /_reindex` or `GET /_tasks`.

          In stack, can be either the original task ID or the task ID of the relocated task.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: requests_per_second
        description: 'The maximum number of documents to index per second, across the entire reindex operation (including slices).

          It can be either `-1` to turn off throttling or any decimal number like `1.7` or `12` to throttle to that level.'
        required: true
        deprecated: false
        schema:
          type: number
        style: form
      - in: query
        name: group_by
        description: "The way to group the tasks in the response.\nWe recommend setting this to `none`, which provides the cleanest response format.\n\nSupported values include:\n  - `nodes`: Group tasks by node ID.\n  - `parents`: Group tasks by parent task ID.\n  - `none`: Do not group tasks.\n\n"
        deprecated: false
        schema:
          default: nodes
          allOf:
          - $ref: '#/components/schemas/tasks._types.GroupBy'
        x-state: Generally available
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_failures:
                    description: 'Node-level failures encountered while applying the rethrottle request.

                      Will return a `failed_node_exception` wrapping a `no_such_node_exception`,

                      if a node handling the task either never existed, or has left the cluster, and one of the following is true:

                      1. The task has completed.

                      2. The task cannot be found.


                      Note: Rethrottle handles relocations, so it should succeed if the task can be found and has not completed.'
                    type: array
                    items:
                      $ref: '#/components/schemas/_types.ErrorCause'
                  task_failures:
                    description: 'Per-task failures encountered while applying the rethrottle.

                      If a rethrottle is attempted during a relocation handoff, the failure object reports `status: SERVICE_UNAVAILABLE` (the HTTP response itself is still `200 OK`).

                      In this case, the request can be retried until success.'
                    type: array
                    items:
                      $ref: '#/components/schemas/_types.TaskFailure'
                  nodes:
                    description: Tasks grouped by node, returned only when `group_by=nodes` (the default).
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/_global.reindex_rethrottle.ReindexNode'
                  tasks:
                    description: 'The tasks that were successfully rethrottled.

                      Always returned in serverless.

                      Returned with `group_by=none` or `group_by=parents` in stack.'
                    allOf:
                    - $ref: '#/components/schemas/_global.reindex_rethrottle.ReindexTasks'
              examples:
                ReindexRethrottleResponseExample1:
                  summary: Successful rethrottle
                  description: 'A successful response from `POST _reindex/{task_id}/_rethrottle?requests_per_second=10`. This is the response shape always returned in serverless, and in stack only when `group_by=none`. Task IDs and timings reflect the original task across node-shutdown relocations.

                    '
                  value: "{\n  \"tasks\": [\n    {\n      \"node\": \"r1A2WoRbTwKZ516z6NEs5A\",\n      \"id\": 36619,\n      \"type\": \"transport\",\n      \"action\": \"indices:data/write/reindex\",\n      \"status\": {\n        \"total\": 11500,\n        \"updated\": 0,\n        \"created\": 4000,\n        \"deleted\": 0,\n        \"batches\": 4,\n        \"version_conflicts\": 0,\n        \"noops\": 0,\n        \"retries\": {\n          \"bulk\": 0,\n          \"search\": 0\n        },\n        \"throttled_millis\": 0,\n        \"requests_per_second\": 10.0,\n        \"throttled_until_millis\": 0\n      },\n      \"description\": \"reindex from [my-source-index] to [my-dest-index]\",\n      \"start_time_in_millis\": 1762190000000,\n      \"running_time_in_nanos\": 4200000000,\n      \"cancellable\": true,\n      \"headers\": {}\n    }\n  ]\n}"
                ReindexRethrottleResponseExample2:
                  summary: Task ID's node is not in the cluster
                  description: 'A successful response from `POST _reindex/{task_id}/_rethrottle` when the task ID''s node is not in the cluster (for example, the node was shut down without relocation, or the task ID was never valid). The empty `tasks` array and `failed_node_exception` wrapping a `no_such_node_exception` indicate the task is gone.

                    '
                  value: "{\n  \"node_failures\": [\n    {\n      \"type\": \"failed_node_exception\",\n      \"reason\": \"Failed node [non_existing_node]\",\n      \"node_id\": \"non_existing_node\",\n      \"caused_by\": {\n        \"type\": \"no_such_node_exception\",\n        \"reason\": \"No such node [non_existing_node]\",\n        \"node_id\": \"non_existing_node\"\n      }\n    }\n  ],\n  \"tasks\": []\n}"
                ReindexRethrottleResponseRelocationExample1:
                  summary: Rethrottle during relocation (HTTP 200)
                  description: 'While the HTTP status remains `200 OK`, a rethrottle sent during a node-shutdown relocation handoff can return `task_failures` with `status: SERVICE_UNAVAILABLE` and a `status_exception` cause. Retry with the same task ID; the retry follows the relocated task until it succeeds.

                    '
                  value: "{\n  \"task_failures\": [\n    {\n      \"task_id\": 36619,\n      \"node_id\": \"r1A2WoRbTwKZ516z6NEs5A\",\n      \"status\": \"SERVICE_UNAVAILABLE\",\n      \"reason\": {\n        \"type\": \"status_exception\",\n        \"reason\": \"cannot rethrottle, task is being relocated\"\n      }\n    }\n  ],\n  \"tasks\": {}\n}"
      x-state: Generally available; Added in 2.4.0
      x-codeSamples:
      - lang: Console
        source: 'POST _reindex/r1A2WoRbTwKZ516z6NEs5A:36619/_rethrottle?requests_per_second=-1

          '
      - lang: Python
        source: "resp = client.reindex_rethrottle(\n    task_id=\"r1A2WoRbTwKZ516z6NEs5A:36619\",\n    requests_per_second=\"-1\",\n)"
      - lang: JavaScript
        source: "const response = await client.reindexRethrottle({\n  task_id: \"r1A2WoRbTwKZ516z6NEs5A:36619\",\n  requests_per_second: \"-1\",\n});"
      - lang: Ruby
        source: "response = client.reindex_rethrottle(\n  task_id: \"r1A2WoRbTwKZ516z6NEs5A:36619\",\n  requests_per_second: \"-1\"\n)"
      - lang: PHP
        source: "$resp = $client->reindexRethrottle([\n    \"task_id\" => \"r1A2WoRbTwKZ516z6NEs5A:36619\",\n    \"requests_per_second\" => \"-1\",\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_reindex/r1A2WoRbTwKZ516z6NEs5A:36619/_rethrottle?requests_per_second=-1"'
      - lang: C#
        source: "var response = await client\n    .ReindexRethrottleAsync(taskId: \"r1A2WoRbTwKZ516z6NEs5A:36619\", d1 => d1\n        .RequestsPerSecond(-1f)\n    );"
      - lang: Java
        source: "client.reindexRethrottle(r -> r\n    .requestsPerSecond(-1.0F)\n    .taskId(\"r1A2WoRbTwKZ516z6NEs5A:36619\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /{index}/_termvectors/{id}:
    post:
      tags:
      - Document
      summary: Get term vector information
      description: '**All methods and paths for this operation:**


        GET

        /{index}/_termvectors


        POST

        /{index}/_termvectors


        GET

        /{index}/_termvectors/{id}


        POST

        /{index}/_termvectors/{id}


        Get information and statistics about terms in the fields of a particular document.


        You can retrieve term vectors for documents stored in the index or for artificial documents passed in the body of the request.

        You can specify the fields you are interested in through the `fields` parameter or by adding the fields to the request body.

        For example:


        ```

        GET /my-index-000001/_termvectors/1?fields=message

        ```


        Fields can be specified using wildcards, similar to the multi match query.


        Term vectors are real-time by default, not near real-time.

        This can be changed by setting `realtime` parameter to `false`.


        You can request three types of values: _term information_, _term statistics_, and _field statistics_.

        By default, all term information and field statistics are returned for all fields but term statistics are excluded.


        **Term information**


        * term frequency in the field (always returned)

        * term positions (`positions: true`)

        * start and end offsets (`offsets: true`)

        * term payloads (`payloads: true`), as base64 encoded bytes


        If the requested information wasn''t stored in the index, it will be computed on the fly if possible.

        Additionally, term vectors could be computed for documents not even existing in the index, but instead provided by the user.


        > warn

        > Start and end offsets assume UTF-16 encoding is being used. If you want to use these offsets in order to get the original text that produced this token, you should make sure that the string you are taking a sub-string of is also encoded using UTF-16.


        **Behaviour**


        The term and field statistics are not accurate.

        Deleted documents are not taken into account.

        The information is only retrieved for the shard the requested document resides in.

        The term and field statistics are therefore only useful as relative measures whereas the absolute numbers have no meaning in this context.

        By default, when requesting term vectors of artificial documents, a shard to get the statistics from is randomly selected.

        Use `routing` only to hit a particular shard.

        Refer to the linked documentation for detailed examples of how to use this API.


        ## Required authorization


        * Index privileges: `read`'
      externalDocs:
        description: About term vectors API examples
        url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/term-vectors-examples
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/docs-termvectors.html
      operationId: termvectors
      parameters:
      - $ref: '#/components/parameters/termvectors-index'
      - $ref: '#/components/parameters/termvectors-id'
      - $ref: '#/components/parameters/termvectors-fields'
      - $ref: '#/components/parameters/termvectors-field_statistics'
      - $ref: '#/components/parameters/termvectors-offsets'
      - $ref: '#/components/parameters/termvectors-payloads'
      - $ref: '#/components/parameters/termvectors-positions'
      - $ref: '#/components/parameters/termvectors-preference'
      - $ref: '#/components/parameters/termvectors-realtime'
      - $ref: '#/components/parameters/termvectors-routing'
      - $ref: '#/components/parameters/termvectors-term_statistics'
      - $ref: '#/components/parameters/termvectors-version'
      - $ref: '#/components/parameters/termvectors-version_type'
      requestBody:
        $ref: '#/components/requestBodies/termvectors'
      responses:
        '200':
          $ref: '#/components/responses/termvectors-200'
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: "GET /my-index-000001/_termvectors/1\n{\n  \"fields\" : [\"text\"],\n  \"offsets\" : true,\n  \"payloads\" : true,\n  \"positions\" : true,\n  \"term_statistics\" : true,\n  \"field_statistics\" : true\n}"
      - lang: Python
        source: "resp = client.termvectors(\n    index=\"my-index-000001\",\n    id=\"1\",\n    fields=[\n        \"text\"\n    ],\n    offsets=True,\n    payloads=True,\n    positions=True,\n    term_statistics=True,\n    field_statistics=True,\n)"
      - lang: JavaScript
        source: "const response = await client.termvectors({\n  index: \"my-index-000001\",\n  id: 1,\n  fields: [\"text\"],\n  offsets: true,\n  payloads: true,\n  positions: true,\n  term_statistics: true,\n  field_statistics: true,\n});"
      - lang: Ruby
        source: "response = client.termvectors(\n  index: \"my-index-000001\",\n  id: \"1\",\n  body: {\n    \"fields\": [\n      \"text\"\n    ],\n    \"offsets\": true,\n    \"payloads\": true,\n    \"positions\": true,\n    \"term_statistics\": true,\n    \"field_statistics\": true\n  }\n)"
      - lang: PHP
        source: "$resp = $client->termvectors([\n    \"index\" => \"my-index-000001\",\n    \"id\" => \"1\",\n    \"body\" => [\n        \"fields\" => array(\n            \"text\",\n        ),\n        \"offsets\" => true,\n        \"payloads\" => true,\n        \"positions\" => true,\n        \"term_statistics\" => true,\n        \"field_statistics\" => true,\n    ],\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"fields":["text"],"offsets":true,"payloads":true,"positions":true,"term_statistics":true,"field_statistics":true}'' "$ELASTICSEARCH_URL/my-index-000001/_termvectors/1"'
      - lang: C#
