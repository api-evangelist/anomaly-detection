      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /{index}/_update_by_query:
    post:
      tags:
      - Document
      summary: Update documents
      description: 'Updates documents that match the specified query. If no query is specified, performs an update on every document in the data stream or index without modifying the source, which is useful for picking up mapping changes. If the Elasticsearch security features are enabled, you must have the following index privileges for the target data stream, index, or alias:


        * `read`

        * `index` or `write`


        You can specify the query criteria in the request URI or the request body using the same syntax as the search API. When you submit an update by query request, Elasticsearch gets a snapshot of the data stream or index when it begins processing the request and updates matching documents using internal versioning. When the versions match, the document is updated and the version number is incremented. If a document changes between the time that the snapshot is taken and the update operation is processed, it results in a version conflict and the operation fails. You can opt to count version conflicts instead of halting and returning by setting `conflicts` to `proceed`. Note that if you opt to count version conflicts, the operation could attempt to update more documents from the source than `max_docs` until it has successfully updated `max_docs` documents or it has gone through every document in the source query. NOTE: Documents with a version equal to 0 cannot be updated using update by query because internal versioning does not support 0 as a valid version number. While processing an update by query request, Elasticsearch performs multiple search requests sequentially to find all of the matching documents. A bulk update request is performed for each batch of matching documents. Any query or update failures cause the update by query request to fail and the failures are shown in the response. Any update requests that completed successfully still stick, they are not rolled back. **Refreshing shards**


        Specifying the `refresh` parameter refreshes all shards once the request completes. This is different to the update API''s `refresh` parameter, which causes only the shard

        that received the request to be refreshed. Unlike the update API, it does not support

        `wait_for`. **Running update by query asynchronously**


        If the request contains `wait_for_completion=false`, Elasticsearch

        performs some preflight checks, launches the request, and returns a

        task you can use to cancel or get the status of the task. Elasticsearch creates a record of this task as a document at `.tasks/task/${taskId}`. **Throttling update requests**


        To control the rate at which update by query issues batches of update operations, you can set `requests_per_second` to any positive decimal number. This pads each batch with a wait time to throttle the rate. Set `requests_per_second` to `-1` to turn off throttling. Throttling uses a wait time between batches so that the internal scroll requests can be given a timeout that takes the request padding into account. The padding time is the difference between the batch size divided by the `requests_per_second` and the time spent writing. By default the batch size is 1000, so if `requests_per_second` is set to `500`:


        ```

        target_time = 1000 / 500 per second = 2 seconds

        wait_time = target_time - write_time = 2 seconds - .5 seconds = 1.5 seconds

        ```


        Since the batch is issued as a single _bulk request, large batch sizes cause Elasticsearch to create many requests and wait before starting the next set. This is "bursty" instead of "smooth". **Slicing**


        Update by query supports sliced scroll to parallelize the update process. This can improve efficiency and provide a convenient way to break the request down into smaller parts. Setting `slices` to `auto` chooses a reasonable number for most data streams and indices. This setting will use one slice per shard, up to a certain limit. If there are multiple source data streams or indices, it will choose the number of slices based on the index or backing index with the smallest number of shards.'
      externalDocs:
        description: More about updating by query API
        url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/update-by-query-api
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/docs-update-by-query.html
      operationId: update-by-query
      parameters:
      - in: path
        name: index
        description: 'A comma-separated list of data streams, indices, and aliases to search.

          It supports wildcards (`*`).

          To search all data streams or indices, omit this parameter or use `*` or `_all`.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Indices'
        style: simple
      - in: query
        name: allow_no_indices
        description: 'A setting that does two separate checks on the index expression.

          If `false`, the request returns an error (1) if any wildcard expression

          (including `_all` and `*`) resolves to zero matching indices or (2) if the

          complete set of resolved indices, aliases or data streams is empty after all

          expressions are evaluated. If `true`, index expressions that resolve to no

          indices are allowed and the request returns an empty result.'
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      - in: query
        name: analyzer
        description: 'The analyzer to use for the query string.

          This parameter can be used only when the `q` query string parameter is specified.'
        deprecated: false
        schema:
          type: string
        style: form
      - in: query
        name: analyze_wildcard
        description: 'If `true`, wildcard and prefix queries are analyzed.

          This parameter can be used only when the `q` query string parameter is specified.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: conflicts
        description: "The preferred behavior when update by query hits version conflicts: `abort` or `proceed`.\n\nSupported values include:\n  - `abort`: Stop reindexing if there are conflicts.\n  - `proceed`: Continue reindexing even if there are conflicts.\n\n"
        deprecated: false
        schema:
          default: abort
          allOf:
          - $ref: '#/components/schemas/_types.Conflicts'
        style: form
      - in: query
        name: default_operator
        description: 'The default operator for query string query: `and` or `or`.

          This parameter can be used only when the `q` query string parameter is specified.'
        deprecated: false
        schema:
          default: or
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.Operator'
        style: form
      - in: query
        name: df
        description: 'The field to use as default where no field prefix is given in the query string.

          This parameter can be used only when the `q` query string parameter is specified.'
        deprecated: false
        schema:
          type: string
        style: form
      - in: query
        name: expand_wildcards
        description: "The type of index that wildcard patterns can match.\nIf the request can target data streams, this argument determines whether wildcard expressions match hidden data streams.\nIt supports comma-separated values, such as `open,hidden`.\n\nSupported values include:\n  - `all`: Match any data stream or index, including hidden ones.\n  - `open`: Match open, non-hidden indices. Also matches any non-hidden data stream.\n  - `closed`: Match closed, non-hidden indices. Also matches any non-hidden data stream. Data streams cannot be closed.\n  - `hidden`: Match hidden data streams and hidden indices. Must be combined with `open`, `closed`, or `both`.\n  - `none`: Wildcard expressions are not accepted.\n\n"
        deprecated: false
        schema:
          default: open
          allOf:
          - $ref: '#/components/schemas/_types.ExpandWildcards'
        style: form
      - in: query
        name: from
        description: Skips the specified number of documents.
        deprecated: false
        schema:
          default: 0
          type: number
        style: form
      - in: query
        name: ignore_unavailable
        description: 'If `false`, the request returns an error if it targets a concrete (non-wildcarded)

          index, alias, or data stream that is missing, closed, or otherwise unavailable.

          If `true`, unavailable concrete targets are silently ignored.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: lenient
        description: 'If `true`, format-based query failures (such as providing text to a numeric field) in the query string will be ignored.

          This parameter can be used only when the `q` query string parameter is specified.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: max_docs
        description: 'The maximum number of documents to process.

          It defaults to all documents.

          When set to a value less than or equal to `scroll_size` and `conflicts` is set to `abort`, a scroll will not be used to retrieve the results for the operation.'
        deprecated: false
        schema:
          type: number
        style: form
      - in: query
        name: pipeline
        description: 'The ID of the pipeline to use to preprocess incoming documents.

          If the index has a default ingest pipeline specified, then setting the value to `_none` disables the default ingest pipeline for this request.

          If a final pipeline is configured it will always run, regardless of the value of this parameter.'
        deprecated: false
        schema:
          type: string
        style: form
      - in: query
        name: preference
        description: 'The node or shard the operation should be performed on.

          It is random by default.'
        deprecated: false
        schema:
          type: string
        style: form
      - in: query
        name: q
        description: A query in the Lucene query string syntax.
        deprecated: false
        schema:
          type: string
        style: form
      - in: query
        name: refresh
        description: 'If `true`, Elasticsearch refreshes affected shards to make the operation visible to search after the request completes.

          This is different than the update API''s `refresh` parameter, which causes just the shard that received the request to be refreshed.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: request_cache
        description: 'If `true`, the request cache is used for this request.

          It defaults to the index-level setting.'
        deprecated: false
        schema:
          type: boolean
        style: form
      - in: query
        name: requests_per_second
        description: 'The maximum number of documents to update per second, across the entire update_by_query operation (including slices).

          It can be either `-1` to turn off throttling or any decimal number like `1.7` or `12` to throttle to that level.'
        deprecated: false
        schema:
          default: -1
          type: number
        style: form
      - in: query
        name: routing
        description: 'A custom value used to route operations to a specific shard.

          Not allowed when `index.slice.enabled` is `true` for the target index; use `_slice` instead.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Routing'
        x-state: Generally available
        style: form
      - in: query
        name: scroll
        description: The period to retain the search context for scrolling.
        deprecated: false
        schema:
          default: 5m
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: scroll_size
        description: The size of the scroll request that powers the operation.
        deprecated: false
        schema:
          default: 1000
          type: number
        style: form
      - in: query
        name: search_timeout
        description: 'An explicit timeout for each search request.

          By default, there is no timeout.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: search_type
        description: "The type of the search operation. Available options include `query_then_fetch` and `dfs_query_then_fetch`.\n\nSupported values include:\n  - `query_then_fetch`: Documents are scored using local term and document frequencies for the shard. This is usually faster but less accurate.\n  - `dfs_query_then_fetch`: Documents are scored using global term and document frequencies across all shards. This is usually slower but more accurate.\n\n"
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.SearchType'
        style: form
      - in: query
        name: slices
        description: The number of slices this task should be divided into.
        deprecated: false
        schema:
          default: '1'
          allOf:
          - $ref: '#/components/schemas/_types.Slices'
        style: form
      - in: query
        name: sort
