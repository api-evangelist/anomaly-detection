      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    termvectors-field_statistics:
      in: query
      name: field_statistics
      description: 'If `true`, the response includes:


        * The document count (how many documents contain this field).

        * The sum of document frequencies (the sum of document frequencies for all terms in this field).

        * The sum of total term frequencies (the sum of total term frequencies of each term in this field).'
      deprecated: false
      schema:
        default: true
        type: boolean
      style: form
    mtermvectors-offsets:
      in: query
      name: offsets
      description: If `true`, the response includes term offsets.
      deprecated: false
      schema:
        default: true
        type: boolean
      style: form
    bulk-wait_for_active_shards:
      in: query
      name: wait_for_active_shards
      description: 'The number of shard copies that must be active before proceeding with the operation.

        Set to `all` or any positive integer up to the total number of shards in the index (`number_of_replicas+1`).

        The default is `1`, which waits for each primary shard to be active.'
      deprecated: false
      schema:
        default: '1'
        allOf:
        - $ref: '#/components/schemas/_types.WaitForActiveShards'
      style: form
    create-version_type:
      in: query
      name: version_type
      description: "The version type.\n\nSupported values include:\n  - `internal`: Use internal versioning that starts at 1 and increments with each update or delete.\n  - `external`: Only index the document if the specified version is strictly higher than the version of the stored document or if there is no existing document.\n  - `external_gte`: Only index the document if the specified version is equal or higher than the version of the stored document or if there is no existing document.\nNOTE: The `external_gte` version type is meant for special use cases and should be used with care.\nIf used incorrectly, it can result in loss of data.\n\n"
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.VersionType'
      style: form
    bulk-timeout:
      in: query
      name: timeout
      description: 'The period each action waits for the following operations: automatic index creation, dynamic mapping updates, and waiting for active shards.

        The default is `1m` (one minute), which guarantees Elasticsearch waits for at least the timeout before failing.

        The actual wait time could be longer, particularly when multiple waits occur.'
      deprecated: false
      schema:
        default: 1m
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
  requestBodies:
    mtermvectors:
      content:
        application/json:
          schema:
            type: object
            properties:
              docs:
                description: An array of existing or artificial documents.
                type: array
                items:
                  $ref: '#/components/schemas/_global.mtermvectors.Operation'
              ids:
                description: A simplified syntax to specify documents by their ID if they're in the same index.
                type: array
                items:
                  $ref: '#/components/schemas/_types.Id'
          examples:
            MultiTermVectorsRequestExample1:
              summary: Get multiple term vectors
              description: 'Run `POST /my-index-000001/_mtermvectors`. When you specify an index in the request URI, the index does not need to be specified for each documents in the request body.

                '
              value: "{\n  \"docs\": [\n      {\n        \"_id\": \"2\",\n        \"fields\": [\n            \"message\"\n        ],\n        \"term_statistics\": true\n      },\n      {\n        \"_id\": \"1\"\n      }\n  ]\n}"
            MultiTermVectorsRequestExample2:
              summary: Simplified syntax
              description: 'Run `POST /my-index-000001/_mtermvectors`. If all requested documents are in same index and the parameters are the same, you can use a simplified syntax.

                '
              value: "{\n  \"ids\": [ \"1\", \"2\" ],\n  \"fields\": [\n    \"message\"\n  ],\n  \"term_statistics\": true\n}"
            MultiTermVectorsRequestExample3:
              summary: Artificial documents
              description: 'Run `POST /_mtermvectors` to generate term vectors for artificial documents provided in the body of the request. The mapping used is determined by the specified `_index`.

                '
              value: "{\n  \"docs\": [\n      {\n        \"_index\": \"my-index-000001\",\n        \"doc\" : {\n            \"message\" : \"test test test\"\n        }\n      },\n      {\n        \"_index\": \"my-index-000001\",\n        \"doc\" : {\n          \"message\" : \"Another test ...\"\n        }\n      }\n  ]\n}"
    index:
      content:
        application/json:
          schema:
            type: object
          examples:
            IndexRequestExample1:
              summary: Automate document IDs
              description: 'Run `POST my-index-000001/_doc/` to index a document. When you use the `POST /<target>/_doc/` request format, the `op_type` is automatically set to `create` and the index operation generates a unique ID for the document.

                '
              value: "{\n  \"@timestamp\": \"2099-11-15T13:12:00\",\n  \"message\": \"GET /search HTTP/1.1 200 1070000\",\n  \"user\": {\n    \"id\": \"kimchy\"\n  }\n}"
            IndexRequestExample2:
              summary: Define document IDs
              description: 'Run `PUT my-index-000001/_doc/1` to insert a JSON document into the `my-index-000001` index with an `_id` of 1.

                '
              value: "{\n  \"@timestamp\": \"2099-11-15T13:12:00\",\n  \"message\": \"GET /search HTTP/1.1 200 1070000\",\n  \"user\": {\n    \"id\": \"kimchy\"\n  }\n}"
      required: true
    termvectors:
      content:
        application/json:
          schema:
            type: object
            properties:
              doc:
                description: An artificial document (a document not present in the index) for which you want to retrieve term vectors.
                type: object
              filter:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-mlt-query
                description: 'Filter terms based on their tf-idf scores.

                  This could be useful in order find out a good characteristic vector of a document.

                  This feature works in a similar manner to the second phase of the More Like This Query.'
                allOf:
                - $ref: '#/components/schemas/_global.termvectors.Filter'
              per_field_analyzer:
                description: 'Override the default per-field analyzer.

                  This is useful in order to generate term vectors in any fashion, especially when using artificial documents.

                  When providing an analyzer for a field that already stores term vectors, the term vectors will be regenerated.'
                type: object
                additionalProperties:
                  type: string
              fields:
                description: 'A list of fields to include in the statistics.

                  It is used as the default list unless a specific field list is provided in the `completion_fields` or `fielddata_fields` parameters.'
                type: array
                items:
                  $ref: '#/components/schemas/_types.Field'
              field_statistics:
                description: 'If `true`, the response includes:


                  * The document count (how many documents contain this field).

                  * The sum of document frequencies (the sum of document frequencies for all terms in this field).

                  * The sum of total term frequencies (the sum of total term frequencies of each term in this field).'
                default: true
                type: boolean
              offsets:
                description: If `true`, the response includes term offsets.
                default: true
                type: boolean
              payloads:
                description: If `true`, the response includes term payloads.
                default: true
                type: boolean
              positions:
                description: If `true`, the response includes term positions.
                default: true
                type: boolean
              term_statistics:
                description: 'If `true`, the response includes:


                  * The total term frequency (how often a term occurs in all documents).

                  * The document frequency (the number of documents containing the current term).


                  By default these values are not returned since term statistics can have a serious performance impact.'
                default: false
                type: boolean
              routing:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/search-shard-routing
                description: A custom value that is used to route operations to a specific shard.
                allOf:
                - $ref: '#/components/schemas/_types.Routing'
              version:
                description: If `true`, returns the document version as part of a hit.
                allOf:
                - $ref: '#/components/schemas/_types.VersionNumber'
              version_type:
                description: "The version type.\n\nSupported values include:\n  - `internal`: Use internal versioning that starts at 1 and increments with each update or delete.\n  - `external`: Only index the document if the specified version is strictly higher than the version of the stored document or if there is no existing document.\n  - `external_gte`: Only index the document if the specified version is equal or higher than the version of the stored document or if there is no existing document.\nNOTE: The `external_gte` version type is meant for special use cases and should be used with care.\nIf used incorrectly, it can result in loss of data.\n\n"
                allOf:
                - $ref: '#/components/schemas/_types.VersionType'
          examples:
            TermVectorsRequestExample1:
              summary: Return stored term vectors
              description: 'Run `GET /my-index-000001/_termvectors/1` to return all information and statistics for field `text` in document 1.

                '
              value: "{\n  \"fields\" : [\"text\"],\n  \"offsets\" : true,\n  \"payloads\" : true,\n  \"positions\" : true,\n  \"term_statistics\" : true,\n  \"field_statistics\" : true\n}"
            TermVectorsRequestExample2:
              summary: Per-field analyzer
              description: 'Run `GET /my-index-000001/_termvectors/1` to set per-field analyzers. A different analyzer than the one at the field may be provided by using the `per_field_analyzer` parameter.

                '
              value: "{\n  \"doc\" : {\n    \"fullname\" : \"John Doe\",\n    \"text\" : \"test test test\"\n  },\n  \"fields\": [\"fullname\"],\n  \"per_field_analyzer\" : {\n    \"fullname\": \"keyword\"\n  }\n}"
            TermVectorsRequestExample3:
              summary: Terms filtering
              description: 'Run `GET /imdb/_termvectors` to filter the terms returned based on their tf-idf scores. It returns the three most "interesting" keywords from the artificial document having the given "plot" field value. Notice that the keyword "Tony" or any stop words are not part of the response, as their tf-idf must be too low.

                '
              value: "{\n  \"doc\": {\n    \"plot\": \"When wealthy industrialist Tony Stark is forced to build an armored suit after a life-threatening incident, he ultimately decides to use its technology to fight against evil.\"\n  },\n  \"term_statistics\": true,\n  \"field_statistics\": true,\n  \"positions\": false,\n  \"offsets\": false,\n  \"filter\": {\n    \"max_num_terms\": 3,\n    \"min_term_freq\": 1,\n    \"min_doc_freq\": 1\n  }\n}"
            TermVectorsRequestExample4:
              summary: Generate term vectors on the fly
              description: 'Run `GET /my-index-000001/_termvectors/1`. Term vectors which are not explicitly stored in the index are automatically computed on the fly. This request returns all information and statistics for the fields in document 1, even though the terms haven''t been explicitly stored in the index. Note that for the field text, the terms are not regenerated.

                '
              value: "{\n  \"fields\" : [\"text\", \"some_field_without_term_vectors\"],\n  \"offsets\" : true,\n  \"positions\" : true,\n  \"term_statistics\" : true,\n  \"field_statistics\" : true\n}"
            TermVectorsRequestExample5:
              summary: Artificial documents
              description: 'Run `GET /my-index-000001/_termvectors`. Term vectors can be generated for artificial documents, that is for documents not present in the index. If dynamic mapping is turned on (default), the document fields not in the original mapping will be dynamically created.

                '
              value: "{\n  \"doc\" : {\n    \"fullname\" : \"John Doe\",\n    \"text\" : \"test test test\"\n  }\n}"
    create:
      content:
        application/json:
          schema:
            type: object
          examples:
            CreateRequestExample1:
              description: 'Run `PUT my-index-000001/_create/1` to index a document into the `my-index-000001` index if no document with that ID exists.

                '
              value: "{\n  \"@timestamp\": \"2099-11-15T13:12:00\",\n  \"message\": \"GET /search HTTP/1.1 200 1070000\",\n  \"user\": {\n    \"id\": \"kimchy\"\n  }\n}"
      required: true
    mget:
      content:
        application/json:
          schema:
            type: object
            properties:
              docs:
                description: The documents you want to retrieve. Required if no index is specified in the request URI.
                type: array
                items:
                  $ref: '#/components/schemas/_global.mget.Operation'
              ids:
                description: The IDs of the documents you want to retrieve. Allowed when the index is specified in the request URI.
                allOf:
                - $ref: '#/components/schemas/_types.Ids'
          examples:
            MultiGetRequestExample1:
              summary: Get documents by ID
              description: 'Run `GET /my-index-000001/_mget`. When you specify an index in the request URI, only the document IDs are required in the request body.

                '
              value: "{\n  \"docs\": [\n    {\n      \"_id\": \"1\"\n    },\n    {\n      \"_id\": \"2\"\n    }\n  ]\n}"
            MultiGetRequestExample2:
              summary: Filter source fields
              description: 'Run `GET /_mget`. This request sets `_source` to `false` for document 1 to exclude the source entirely. It retrieves `field3` and `field4` from document 2. It retrieves the `user` field from document 3 but filters out the `user.location` field.

                '
              value: "{\n  \"docs\": [\n    {\n      \"_index\": \"test\",\n      \"_id\": \"1\",\n      \"_source\": false\n    },\n    {\n      \"_index\": \"test\",\n      \"_id\": \"2\",\n      \"_source\": [ \"field3\", \"field4\" ]\n    },\n    {\n      \"_index\": \"test\",\n      \"_id\": \"3\",\n      \"_source\": {\n        \"include\": [ \"user\" ],\n        \"exclude\": [ \"user.location\" ]\n      }\n    }\n  ]\n}"
            MultiGetRequestExample3:
              summary: Get stored fields
              description: 'Run `GET /_mget`. This request retrieves `field1` and `field2` from document 1 and `field3` and `field4` from document 2.

                '
              value: "{\n  \"docs\": [\n    {\n      \"_index\": \"test\",\n      \"_id\": \"1\",\n      \"stored_fields\": [ \"field1\", \"field2\" ]\n    },\n    {\n      \"_index\": \"test\",\n      \"_id\": \"2\",\n      \"stored_fields\": [ \"field3\", \"field4\" ]\n    }\n  ]\n}"
            MultiGetRequestExample4:
              summary: Document routing
              description: 'Run `GET /_mget?routing=key1`. If routing is used during indexing, you need to specify the routing value to retrieve documents. This request fetches `test/_doc/2` from the shard corresponding to routing key `key1`. It fetches `test/_doc/1` from the shard corresponding to routing key `key2`.

                '
              value: "{\n  \"docs\": [\n    {\n      \"_index\": \"test\",\n      \"_id\": \"1\",\n      \"routing\": \"key2\"\n    },\n    {\n      \"_index\": \"test\",\n      \"_id\": \"2\"\n    }\n  ]\n}"
      required: true
    bulk:
      content:
        application/json:
          schema:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/_global.bulk.OperationContainer'
              - $ref: '#/components/schemas/_global.bulk.UpdateAction'
              - type: object
                title: Document source
                description: The document to index. A document source line must follow an `index` or `create` action line.
          examples:
            BulkRequestExample1:
              summary: Multiple operations
              description: Run `POST _bulk` to perform multiple operations.
              value: '{ "index" : { "_index" : "test", "_id" : "1" } }

                { "field1" : "value1" }

                { "delete" : { "_index" : "test", "_id" : "2" } }

                { "create" : { "_index" : "test", "_id" : "3" } }

                { "field1" : "value3" }

                { "update" : {"_id" : "1", "_index" : "test"} }

                { "doc" : {"field2" : "value2"} }'
            BulkRequestExample2:
              summary: Bulk updates
              description: 'When you run `POST _bulk` and use the `update` action, you can use `retry_on_conflict` as a field in the action itself (not in the extra payload line) to specify how many times an update should be retried in the case of a version conflict.

                '
              value: '{ "update" : {"_id" : "1", "_index" : "index1", "retry_on_conflict" : 3} }

                { "doc" : {"field" : "value"} }

                { "update" : { "_id" : "0", "_index" : "index1", "retry_on_conflict" : 3} }

                { "script" : { "source": "ctx._source.counter += params.param1", "lang" : "painless", "params" : {"param1" : 1}}, "upsert" : {"counter" : 1}}

                { "update" : {"_id" : "2", "_index" : "index1", "retry_on_conflict" : 3} }

                { "doc" : {"field" : "value"}, "doc_as_upsert" : true }

                { "update" : {"_id" : "3", "_index" : "index1", "_source" : true} }

                { "doc" : {"field" : "value"} }

                { "update" : {"_id" : "4", "_index" : "index1"} }

                { "doc" : {"field" : "value"}, "_source": true}'
            BulkRequestExample3:
              summary: Filter for failed operations
              description: 'To return only information about failed operations, run `POST /_bulk?filter_path=items.*.error`.

                '
              value: '{ "update": {"_id": "5", "_index": "index1"} }

                { "doc": {"my_field": "foo"} }

                { "update": {"_id": "6", "_index": "index1"} }

                { "doc": {"my_field": "foo"} }

                { "create": {"_id": "7", "_index": "index1"} }

                { "my_field": "foo" }'
            BulkRequestExample4:
              summary: Dynamic templates
              description: 'Run `POST /_bulk` to perform a bulk request that consists of index and create actions with the `dynamic_templates` parameter. The bulk request creates two new fields `work_location` and `home_location` with type `geo_point` according to the `dynamic_templates` parameter. However, the `raw_location` field is created using default dynamic mapping rules, as a text field in that case since it is supplied as a string in the JSON document.

                '
              value: '{ "index" : { "_index" : "my_index", "_id" : "1", "dynamic_templates": {"work_location": "geo_point"}} }

                { "field" : "value1", "work_location": "41.12,-71.34", "raw_location": "41.12,-71.34"}

                { "create" : { "_index" : "my_index", "_id" : "2", "dynamic_templates": {"home_location": "geo_point"}} }

                { "field" : "value2", "home_location": "41.12,-71.34"}'
      required: true
      description: 'The request body contains a newline-delimited list of `create`, `delete`, `index`, and `update` actions and their associated source data.

        Each item in the list is one of three kinds of NDJSON lines:


        * An action line, which specifies the action to perform (`index`, `create`, `update`, or `delete`) and its metadata. For example: `{ "index": { "_index": "my-index", "_id": "1" } }`.

        * An update source line, which must follow an `update` action line. It contains the partial document, script, or upsert options to apply.

        * A document source line, which must follow an `index` or `create` action line. It contains the document to index.


        A `delete` action is not followed by a source line.

        '
