          minProperties: 1
          maxProperties: 1
        match_phrase_prefix:
          externalDocs:
            url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-match-query-phrase-prefix
          description: 'Returns documents that contain the words of a provided text, in the same order as provided.

