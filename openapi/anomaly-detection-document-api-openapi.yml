      - lang: Java
        source: "client.termvectors(t -> t\n    .fieldStatistics(true)\n    .fields(\"text\")\n    .id(\"1\")\n    .index(\"my-index-000001\")\n    .offsets(true)\n    .payloads(true)\n    .positions(true)\n    .termStatistics(true)\n);\n"
