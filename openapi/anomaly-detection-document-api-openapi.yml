          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.MultiMatchQuery'
        nested:
          externalDocs:
            url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-nested-query
          description: 'Wraps another query to search nested fields.

