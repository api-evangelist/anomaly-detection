      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"grid_agg":"geotile","grid_precision":2,"fields":["name","price"],"query":{"term":{"included":true}},"aggs":{"min_price":{"min":{"field":"price"}},"max_price":{"max":{"field":"price"}},"avg_price":{"avg":{"field":"price"}}}}'' "$ELASTICSEARCH_URL/museums/_mvt/location/13/4207/2692"'
      - lang: C#
        source: "var response = await client\n    .SearchMvtAsync(indices: new[] { \"museums\" }, field: global::Elastic.Clients.Elasticsearch.Infer.Field<MyDocument>(x => x.Location), zoom: 13, x: 4207, y: 2692, d1 => d1\n        .Aggs(d2 => d2\n            .Add(\"min_price\", d3 => d3\n                .Min(d4 => d4\n                    .Field(x => x.Price)\n                )\n            )\n            .Add(\"max_price\", d3 => d3\n                .Max(d4 => d4\n                    .Field(x => x.Price)\n                )\n            )\n            .Add(\"avg_price\", d3 => d3\n                .Avg(d4 => d4\n                    .Field(x => x.Price)\n                )\n            )\n        )\n        .Fields(x => x.Name, x => x.Price)\n        .GridAgg(GridAggregationType.Geotile)\n        .GridPrecision(2)\n        .Query(d2 => d2\n            .Term(d3 => d3\n                .Field(x => x.Included)\n                .Value(true)\n            )\n        )\n    );"
