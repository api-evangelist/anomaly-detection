  /{index}/_pit:
    post:
      tags:
      - Search
      summary: Open a point in time
      description: 'A search request by default runs against the most recent visible data of the target indices,

        which is called point in time. Elasticsearch pit (point in time) is a lightweight view into the

        state of the data as it existed when initiated. In some cases, it’s preferred to perform multiple

        search requests using the same point in time. For example, if refreshes happen between

        `search_after` requests, then the results of those requests might not be consistent as changes happening

        between searches are only visible to the more recent point in time.


        A point in time must be opened explicitly before being used in search requests.


        A subsequent search request with the `pit` parameter must not specify `index`, `routing`, or `preference` values as these parameters are copied from the point in time.


        Just like regular searches, you can use `from` and `size` to page through point in time search results, up to the first 10,000 hits.

        If you want to retrieve more hits, use PIT with `search_after`.


        IMPORTANT: Each search request against a PIT returns in its response a `pit_id` field which may be different from the identifier you originally supplied.

        Always use the most recently-received PIT identifier for the next request.

        If you make concurrent search requests against the same PIT, Elasticsearch can return several different `pit_id` values in its responses.

        In that case, use any of these values for later requests, preferring more recently-received values whenever possible.


        When a PIT that contains shard failures is used in a search request, the missing are always reported in the search response as a `NoShardAvailableActionException` exception.

        To get rid of these exceptions, a new PIT needs to be created so that shards missing from the previous PIT can be handled, assuming they become available in the meantime.


        **Keeping point in time alive**


        The `keep_alive` parameter, which is passed to a open point in time request and search request, extends the time to live of the corresponding point in time.

        The value does not need to be long enough to process all data — it just needs to be long enough for the next request.


        Normally, the background merge process optimizes the index by merging together smaller segments to create new, bigger segments.

        Once the smaller segments are no longer needed they are deleted.

        However, open point-in-times prevent the old segments from being deleted since they are still in use.


        TIP: Keeping older segments alive means that more disk space and file handles are needed.

        Ensure that you have configured your nodes to have ample free file handles.


        Additionally, if a segment contains deleted or updated documents then the point in time must keep track of whether each document in the segment was live at the time of the initial search request.

        Ensure that your nodes have sufficient heap space if you have many open point-in-times on an index that is subject to ongoing deletes or updates.

        Note that a point-in-time doesn''t prevent its associated indices from being deleted.

        You can check how many point-in-times (that is, search contexts) are open with the nodes stats API.


        ## Required authorization


        * Index privileges: `read`'
      operationId: open-point-in-time
      parameters:
      - in: path
        name: index
        description: A comma-separated list of index names to open point in time; use `_all` or empty string to perform the operation on all indices
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Indices'
        style: simple
      - in: query
        name: keep_alive
        description: Extend the length of time that the point in time persists.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: ignore_unavailable
        description: 'If `false`, the request returns an error if it targets a concrete (non-wildcarded)

          index, alias, or data stream that is missing, closed, or otherwise unavailable.

          If `true`, unavailable concrete targets are silently ignored.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: preference
        description: 'The node or shard the operation should be performed on.

          By default, it is random.'
        deprecated: false
        schema:
          type: string
        style: form
      - in: query
        name: routing
        description: A custom value that is used to route operations to a specific shard.
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Routing'
        style: form
      - in: query
        name: expand_wildcards
        description: "The type of index that wildcard patterns can match.\nIf the request can target data streams, this argument determines whether wildcard expressions match hidden data streams.\nIt supports comma-separated values, such as `open,hidden`.\n\nSupported values include:\n  - `all`: Match any data stream or index, including hidden ones.\n  - `open`: Match open, non-hidden indices. Also matches any non-hidden data stream.\n  - `closed`: Match closed, non-hidden indices. Also matches any non-hidden data stream. Data streams cannot be closed.\n  - `hidden`: Match hidden data streams and hidden indices. Must be combined with `open`, `closed`, or `both`.\n  - `none`: Wildcard expressions are not accepted.\n\n"
        deprecated: false
        schema:
          default: open
          allOf:
          - $ref: '#/components/schemas/_types.ExpandWildcards'
        style: form
      - in: query
        name: allow_partial_search_results
        description: 'Indicates whether the point in time tolerates unavailable shards or shard failures when initially creating the PIT.

          If `false`, creating a point in time request when a shard is missing or unavailable will throw an exception.

          If `true`, the point in time will contain all the shards that are available at the time of the request.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: max_concurrent_shard_requests
        description: Maximum number of concurrent shard requests that each sub-search request executes per node.
        deprecated: false
        schema:
          default: 5
          type: number
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                index_filter:
                  description: Filter indices if the provided query rewrites to `match_none` on every shard.
                  allOf:
                  - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  _shards:
                    description: Shards used to create the PIT
                    allOf:
                    - $ref: '#/components/schemas/_types.ShardStatistics'
                  id:
                    allOf:
                    - $ref: '#/components/schemas/_types.Id'
                  _clusters:
                    description: 'Metadata about the clusters involved in the request, returned when the request targets

                      one or more remote clusters.'
                    x-state: Generally available; Added in 9.5.0
                    allOf:
                    - $ref: '#/components/schemas/_types.ClusterStatistics'
                required:
                - _shards
                - id
              examples:
                OpenPointInTimeResponseExample1:
                  description: 'A successful response from `POST /my-index-000001/_pit?keep_alive=1m&allow_partial_search_results=true`. It includes a summary of the total number of shards, as well as the number of successful shards when creating the PIT.

                    '
                  value: "{\n  \"id\": \"46ToAwMDaWR5BXV1aWQyKwZub2RlXzMAAAAAAAAAACoBYwADaWR4BXV1aWQxAgZub2RlXzEAAAAAAAAAAAEBYQADaWR5BXV1aWQyKgZub2RlXzIAAAAAAAAAAAwBYgACBXV1aWQyAAAFdXVpZDEAAQltYXRjaF9hbGw_gAAAAA=\",\n  \"_shards\": {\n    \"total\": 10,\n    \"successful\": 10,\n    \"skipped\": 0,\n    \"failed\": 0\n  }\n}"
      x-state: Generally available; Added in 7.10.0
      x-codeSamples:
      - lang: Console
        source: 'POST /my-index-000001/_pit?keep_alive=1m&allow_partial_search_results=true

          '
      - lang: Python
        source: "resp = client.open_point_in_time(\n    index=\"my-index-000001\",\n    keep_alive=\"1m\",\n    allow_partial_search_results=True,\n)"
      - lang: JavaScript
        source: "const response = await client.openPointInTime({\n  index: \"my-index-000001\",\n  keep_alive: \"1m\",\n  allow_partial_search_results: \"true\",\n});"
      - lang: Ruby
        source: "response = client.open_point_in_time(\n  index: \"my-index-000001\",\n  keep_alive: \"1m\",\n  allow_partial_search_results: \"true\"\n)"
      - lang: PHP
        source: "$resp = $client->openPointInTime([\n    \"index\" => \"my-index-000001\",\n    \"keep_alive\" => \"1m\",\n    \"allow_partial_search_results\" => \"true\",\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/my-index-000001/_pit?keep_alive=1m&allow_partial_search_results=true"'
      - lang: C#
        source: "var response = await client\n    .OpenPointInTimeAsync(indices: new[] { \"my-index-000001\" }, d1 => d1\n        .AllowPartialSearchResults(true)\n        .KeepAlive(\"1m\")\n    );"
      - lang: Java
        source: "client.openPointInTime(o -> o\n    .allowPartialSearchResults(true)\n    .index(\"my-index-000001\")\n    .keepAlive(k -> k\n        .time(\"1m\")\n    )\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
