          examples:
            SearchShardsResponseExample1:
              description: An abbreviated response from `GET /my-index-000001/_search_shards`.
              value: "{\n  \"nodes\": {},\n  \"indices\": {\n      \"my-index-000001\": { }\n  },\n  \"shards\": [\n      [\n      {\n          \"index\": \"my-index-000001\",\n          \"node\": \"JklnKbD7Tyqi9TP3_Q_tBg\",\n          \"relocating_node\": null,\n          \"primary\": true,\n          \"shard\": 0,\n          \"state\": \"STARTED\",\n          \"allocation_id\": {\"id\":\"0TvkCyF7TAmM1wHP4a42-A\"},\n          \"relocation_failure_info\" : {\n          \"failed_attempts\" : 0\n          }\n      }\n      ],\n      [\n      {\n          \"index\": \"my-index-000001\",\n          \"node\": \"JklnKbD7Tyqi9TP3_Q_tBg\",\n          \"relocating_node\": null,\n          \"primary\": true,\n          \"shard\": 1,\n          \"state\": \"STARTED\",\n          \"allocation_id\": {\"id\":\"fMju3hd1QHWmWrIgFnI4Ww\"},\n          \"relocation_failure_info\" : {\n          \"failed_attempts\" : 0\n          }\n      }\n      ],\n      [\n      {\n          \"index\": \"my-index-000001\",\n          \"node\": \"JklnKbD7Tyqi9TP3_Q_tBg\",\n          \"relocating_node\": null,\n          \"primary\": true,\n          \"shard\": 2,\n          \"state\": \"STARTED\",\n          \"allocation_id\": {\"id\":\"Nwl0wbMBTHCWjEEbGYGapg\"},\n          \"relocation_failure_info\" : {\n          \"failed_attempts\" : 0\n          }\n      }\n      ],\n      [\n      {\n          \"index\": \"my-index-000001\",\n          \"node\": \"JklnKbD7Tyqi9TP3_Q_tBg\",\n          \"relocating_node\": null,\n          \"primary\": true,\n          \"shard\": 3,\n          \"state\": \"STARTED\",\n          \"allocation_id\": {\"id\":\"bU_KLGJISbW0RejwnwDPKw\"},\n          \"relocation_failure_info\" : {\n          \"failed_attempts\" : 0\n          }\n      }\n      ],\n      [\n      {\n          \"index\": \"my-index-000001\",\n          \"node\": \"JklnKbD7Tyqi9TP3_Q_tBg\",\n          \"relocating_node\": null,\n          \"primary\": true,\n          \"shard\": 4,\n          \"state\": \"STARTED\",\n          \"allocation_id\": {\"id\":\"DMs7_giNSwmdqVukF7UydA\"},\n          \"relocation_failure_info\" : {\n          \"failed_attempts\" : 0\n          }\n      }\n      ]\n    ]\n  }"
    explain-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              _index:
                allOf:
                - $ref: '#/components/schemas/_types.IndexName'
              _id:
                allOf:
                - $ref: '#/components/schemas/_types.Id'
              matched:
                type: boolean
              explanation:
                allOf:
                - $ref: '#/components/schemas/_global.explain.ExplanationDetail'
              get:
                allOf:
                - $ref: '#/components/schemas/_types.InlineGet'
            required:
            - _index
            - _id
            - matched
          examples:
            ExplainResponseExample1:
              description: A successful response from `GET /my-index-000001/_explain/0`.
              value: "{\n  \"_index\":\"my-index-000001\",\n  \"_id\":\"0\",\n  \"matched\":true,\n  \"explanation\":{\n      \"value\":1.6943598,\n      \"description\":\"weight(message:elasticsearch in 0) [PerFieldSimilarity], result of:\",\n      \"details\":[\n        {\n            \"value\":1.6943598,\n            \"description\":\"score(freq=1.0), computed as boost * idf * tf from:\",\n            \"details\":[\n              {\n                  \"value\":2.2,\n                  \"description\":\"boost\",\n                  \"details\":[]\n              },\n              {\n                  \"value\":1.3862944,\n                  \"description\":\"idf, computed as log(1 + (N - n + 0.5) / (n + 0.5)) from:\",\n                  \"details\":[\n                    {\n                        \"value\":1,\n                        \"description\":\"n, number of documents containing term\",\n                        \"details\":[]\n                    },\n                    {\n                        \"value\":5,\n                        \"description\":\"N, total number of documents with field\",\n                        \"details\":[]\n                    }\n                  ]\n              },\n              {\n                  \"value\":0.5555556,\n                  \"description\":\"tf, computed as freq / (freq + k1 * (1 - b + b * dl / avgdl)) from:\",\n                  \"details\":[\n                    {\n                        \"value\":1.0,\n                        \"description\":\"freq, occurrences of term within document\",\n                        \"details\":[]\n                    },\n                    {\n                        \"value\":1.2,\n                        \"description\":\"k1, term saturation parameter\",\n                        \"details\":[]\n                    },\n                    {\n                        \"value\":0.75,\n                        \"description\":\"b, length normalization parameter\",\n                        \"details\":[]\n                    },\n                    {\n                        \"value\":3.0,\n                        \"description\":\"dl, length of field\",\n                        \"details\":[]\n                    },\n                    {\n                        \"value\":5.4,\n                        \"description\":\"avgdl, average length of field\",\n                        \"details\":[]\n                    }\n                  ]\n              }\n            ]\n        }\n      ]\n  }\n}"
    search_mvt-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/_types.MapboxVectorTiles'
          examples:
            SearchMvtResponseExample1:
              description: 'A successful response from `GET museums/_mvt/location/13/4207/2692`. It returns results as a binary vector tile. When decoded into JSON, the tile contains the following data.

                '
              value: "{\n  \"hits\": {\n    \"extent\": 4096,\n    \"version\": 2,\n    \"features\": [\n      {\n        \"geometry\": {\n          \"type\": \"Point\",\n          \"coordinates\": [\n            3208,\n            3864\n          ]\n        },\n        \"properties\": {\n          \"_id\": \"1\",\n          \"_index\": \"museums\",\n          \"name\": \"NEMO Science Museum\",\n          \"price\": 1750\n        },\n        \"type\": 1\n      },\n      {\n        \"geometry\": {\n          \"type\": \"Point\",\n          \"coordinates\": [\n            3429,\n            3496\n          ]\n        },\n        \"properties\": {\n          \"_id\": \"3\",\n          \"_index\": \"museums\",\n          \"name\": \"Nederlands Scheepvaartmuseum\",\n          \"price\": 1650\n        },\n        \"type\": 1\n      },\n      {\n        \"geometry\": {\n          \"type\": \"Point\",\n          \"coordinates\": [\n            3429,\n            3496\n          ]\n        },\n        \"properties\": {\n          \"_id\": \"4\",\n          \"_index\": \"museums\",\n          \"name\": \"Amsterdam Centre for Architecture\",\n          \"price\": 0\n        },\n        \"type\": 1\n      }\n    ]\n  },\n  \"aggs\": {\n    \"extent\": 4096,\n    \"version\": 2,\n    \"features\": [\n      {\n        \"geometry\": {\n          \"type\": \"Polygon\",\n          \"coordinates\": [\n            [\n              [\n                3072,\n                3072\n              ],\n              [\n                4096,\n                3072\n              ],\n              [\n                4096,\n                4096\n              ],\n              [\n                3072,\n                4096\n              ],\n              [\n                3072,\n                3072\n              ]\n            ]\n          ]\n        },\n        \"properties\": {\n          \"_count\": 3,\n          \"max_price.value\": 1750.0,\n          \"min_price.value\": 0.0,\n          \"avg_price.value\": 1133.3333333333333\n        },\n        \"type\": 3\n      }\n    ]\n  },\n  \"meta\": {\n    \"extent\": 4096,\n    \"version\": 2,\n    \"features\": [\n      {\n        \"geometry\": {\n          \"type\": \"Polygon\",\n          \"coordinates\": [\n            [\n              [\n                0,\n                0\n              ],\n              [\n                4096,\n                0\n              ],\n              [\n                4096,\n                4096\n              ],\n              [\n                0,\n                4096\n              ],\n              [\n                0,\n                0\n              ]\n            ]\n          ]\n        },\n        \"properties\": {\n          \"_shards.failed\": 0,\n          \"_shards.skipped\": 0,\n          \"_shards.successful\": 1,\n          \"_shards.total\": 1,\n          \"aggregations._count.avg\": 3.0,\n          \"aggregations._count.count\": 1,\n          \"aggregations._count.max\": 3.0,\n          \"aggregations._count.min\": 3.0,\n          \"aggregations._count.sum\": 3.0,\n          \"aggregations.avg_price.avg\": 1133.3333333333333,\n          \"aggregations.avg_price.count\": 1,\n          \"aggregations.avg_price.max\": 1133.3333333333333,\n          \"aggregations.avg_price.min\": 1133.3333333333333,\n          \"aggregations.avg_price.sum\": 1133.3333333333333,\n          \"aggregations.max_price.avg\": 1750.0,\n          \"aggregations.max_price.count\": 1,\n          \"aggregations.max_price.max\": 1750.0,\n          \"aggregations.max_price.min\": 1750.0,\n          \"aggregations.max_price.sum\": 1750.0,\n          \"aggregations.min_price.avg\": 0.0,\n          \"aggregations.min_price.count\": 1,\n          \"aggregations.min_price.max\": 0.0,\n          \"aggregations.min_price.min\": 0.0,\n          \"aggregations.min_price.sum\": 0.0,\n          \"hits.max_score\": 0.0,\n          \"hits.total.relation\": \"eq\",\n          \"hits.total.value\": 3,\n          \"timed_out\": false,\n          \"took\": 2\n        },\n        \"type\": 3\n      }\n    ]\n  }\n}"
    scroll-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/_global.search.ResponseBody'
    msearch_template-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/_global.msearch.MultiSearchResult'
    search-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/_global.search.ResponseBody'
          examples:
            SearchResponseExample1:
              description: 'An abbreviated response from `GET /my-index-000001/_search?from=40&size=20` with a simple term query.

                '
              value: "{\n  \"took\": 5,\n  \"timed_out\": false,\n  \"_shards\": {\n    \"total\": 1,\n    \"successful\": 1,\n    \"skipped\": 0,\n    \"failed\": 0\n  },\n  \"hits\": {\n    \"total\": {\n      \"value\": 20,\n      \"relation\": \"eq\"\n    },\n    \"max_score\": 1.3862942,\n    \"hits\": [\n      {\n        \"_index\": \"my-index-000001\",\n        \"_id\": \"0\",\n        \"_score\": 1.3862942,\n        \"_source\": {\n          \"@timestamp\": \"2099-11-15T14:12:12\",\n          \"http\": {\n            \"request\": {\n              \"method\": \"get\"\n            },\n            \"response\": {\n              \"status_code\": 200,\n              \"bytes\": 1070000\n            },\n            \"version\": \"1.1\"\n          },\n          \"source\": {\n            \"ip\": \"127.0.0.1\"\n          },\n          \"message\": \"GET /search HTTP/1.1 200 1070000\",\n          \"user\": {\n            \"id\": \"kimchy\"\n          }\n        }\n      }\n    ]\n  }\n}"
  requestBodies:
    search_template:
      content:
        application/json:
          schema:
            type: object
            properties:
              explain:
                description: 'If `true`, returns detailed information about score calculation as part of each hit.

                  If you specify both this and the `explain` query parameter, the API uses only the query parameter.'
                default: false
                type: boolean
              id:
                description: 'The ID of the search template to use. If no `source` is specified,

                  this parameter is required.'
                allOf:
                - $ref: '#/components/schemas/_types.Id'
              params:
                description: 'Key-value pairs used to replace Mustache variables in the template.

                  The key is the variable name.

                  The value is the variable value.'
                type: object
                additionalProperties:
                  type: object
              profile:
                description: If `true`, the query execution is profiled.
                default: false
                type: boolean
              source:
                description: 'An inline search template. Supports the same parameters as the search API''s

                  request body. It also supports Mustache variables. If no `id` is specified, this

                  parameter is required.'
                allOf:
                - $ref: '#/components/schemas/_types.ScriptSource'
          examples:
            SearchTemplateRequestExample1:
              description: 'Run `GET my-index/_search/template` to run a search with a search template.

                '
              value: "{\n  \"id\": \"my-search-template\",\n  \"params\": {\n    \"query_string\": \"hello world\",\n    \"from\": 0,\n    \"size\": 10\n  }\n}"
      required: true
    render_search_template:
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                description: 'The ID of the search template to render.

                  If no `source` is specified, this or the `<template-id>` request path parameter is required.

                  If you specify both this parameter and the `<template-id>` parameter, the API uses only `<template-id>`.'
                allOf:
                - $ref: '#/components/schemas/_types.Id'
              file:
                type: string
              params:
                description: 'Key-value pairs used to replace Mustache variables in the template.

                  The key is the variable name.

                  The value is the variable value.'
                type: object
                additionalProperties:
                  type: object
              source:
                description: 'An inline search template.

                  It supports the same parameters as the search API''s request body.

                  These parameters also support Mustache variables.

                  If no `id` or `<templated-id>` is specified, this parameter is required.'
                allOf:
                - $ref: '#/components/schemas/_types.ScriptSource'
          examples:
            RenderSearchTemplateRequestExample1:
              description: Run `POST _render/template`
              value: "{\n  \"id\": \"my-search-template\",\n  \"params\": {\n    \"query_string\": \"hello world\",\n    \"from\": 20,\n    \"size\": 10\n  }\n}"
      required: true
    async_search.submit:
      content:
        application/json:
          schema:
            type: object
            properties:
              aggregations:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/_types.aggregations.AggregationContainer'
              collapse:
                allOf:
                - $ref: '#/components/schemas/_global.search._types.FieldCollapse'
              explain:
                description: If true, returns detailed information about score computation as part of a hit.
                default: false
                type: boolean
              ext:
                description: Configuration of search extensions defined by Elasticsearch plugins.
                type: object
                additionalProperties:
                  type: object
              from:
                description: 'Starting document offset. By default, you cannot page through more than 10,000

                  hits using the from and size parameters. To page through more hits, use the

                  search_after parameter.'
                default: 0
                type: number
              highlight:
                allOf:
                - $ref: '#/components/schemas/_global.search._types.Highlight'
              track_total_hits:
                description: 'Number of hits matching the query to count accurately. If true, the exact

                  number of hits is returned at the cost of some performance. If false, the

                  response does not include the total number of hits matching the query.

                  Defaults to 10,000 hits.'
                allOf:
                - $ref: '#/components/schemas/_global.search._types.TrackHits'
              indices_boost:
                description: Boosts the _score of documents from specified indices.
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: number
                  minProperties: 1
                  maxProperties: 1
              docvalue_fields:
                description: 'Array of wildcard (*) patterns. The request returns doc values for field

                  names matching these patterns in the hits.fields property of the response.'
                type: array
                items:
                  $ref: '#/components/schemas/_types.query_dsl.FieldAndFormat'
              knn:
                description: Defines the approximate kNN search to run.
                x-state: Generally available; Added in 8.4.0
                oneOf:
                - $ref: '#/components/schemas/_types.KnnSearch'
                - type: array
                  items:
                    $ref: '#/components/schemas/_types.KnnSearch'
              min_score:
                description: 'Minimum _score for matching documents. Documents with a lower _score are

                  not included in search results and results collected by aggregations.'
                type: number
              post_filter:
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
              profile:
                type: boolean
              query:
                description: Defines the search definition using the Query DSL.
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
              rescore:
                oneOf:
                - $ref: '#/components/schemas/_global.search._types.Rescore'
                - type: array
                  items:
                    $ref: '#/components/schemas/_global.search._types.Rescore'
              script_fields:
                description: Retrieve a script evaluation (based on different fields) for each hit.
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/_types.ScriptField'
              search_after:
                allOf:
                - $ref: '#/components/schemas/_types.SortResults'
              size:
                description: 'The number of hits to return. By default, you cannot page through more

                  than 10,000 hits using the from and size parameters. To page through more

                  hits, use the search_after parameter.'
                default: 10
                type: number
              slice:
                allOf:
                - $ref: '#/components/schemas/_types.SlicedScroll'
              sort:
                allOf:
                - $ref: '#/components/schemas/_types.Sort'
              _source:
                description: 'Indicates which source fields are returned for matching documents. These

                  fields are returned in the hits._source property of the search response.'
                allOf:
                - $ref: '#/components/schemas/_global.search._types.SourceConfig'
              fields:
                description: 'Array of wildcard (*) patterns. The request returns values for field names

                  matching these patterns in the hits.fields property of the response.'
                type: array
                items:
                  $ref: '#/components/schemas/_types.query_dsl.FieldAndFormat'
              suggest:
                allOf:
                - $ref: '#/components/schemas/_global.search._types.Suggester'
              terminate_after:
                description: 'Maximum number of documents to collect for each shard. If a query reaches this

                  limit, Elasticsearch terminates the query early. Elasticsearch collects documents

                  before sorting. Defaults to 0, which does not terminate query execution early.'
                default: 0
                type: number
              timeout:
                description: 'Specifies the period of time to wait for a response from each shard. If no response

                  is received before the timeout expires, the request fails and returns an error.

                  Defaults to no timeout.'
                type: string
              track_scores:
                description: If true, calculate and return document scores, even if the scores are not used for sorting.
                default: false
                type: boolean
              version:
                description: If true, returns document version as part of a hit.
                default: false
                type: boolean
              seq_no_primary_term:
                description: 'If true, returns sequence number and primary term of the last modification

                  of each hit. See Optimistic concurrency control.'
                type: boolean
              stored_fields:
                description: 'List of stored fields to return as part of a hit. If no fields are specified,

                  no stored fields are included in the response. If this field is specified, the _source

                  parameter defaults to false. You can pass _source: true to return both source fields

                  and stored fields in the search response.'
                allOf:
                - $ref: '#/components/schemas/_types.Fields'
              pit:
                description: 'Limits the search to a point in time (PIT). If you provide a PIT, you

                  cannot specify an <index> in the request path.'
                allOf:
                - $ref: '#/components/schemas/_global.search._types.PointInTimeReference'
              runtime_mappings:
                description: 'Defines one or more runtime fields in the search request. These fields take

                  precedence over mapped fields with the same name.'
                allOf:
                - $ref: '#/components/schemas/_types.mapping.RuntimeFields'
              stats:
                description: 'Stats groups to associate with the search. Each group maintains a statistics

                  aggregation for its associated searches. You can retrieve these stats using

                  the indices stats API.'
                type: array
                items:
                  type: string
          examples:
            AsyncSearchSubmitRequestExample1:
              description: 'Perform a search request asynchronously with `POST /sales*/_async_search?size=0`. It accepts the same parameters and request body as the search API.

                '
              value: "{\n  \"sort\": [\n    { \"date\": { \"order\": \"asc\" } }\n  ],\n  \"aggs\": {\n    \"sale_date\": {\n      \"date_histogram\": {\n        \"field\": \"date\",\n        \"calendar_interval\": \"1d\"\n      }\n    }\n  }\n}"
    rank_eval:
      content:
        application/json:
          schema:
            type: object
            properties:
              requests:
                description: A set of typical search requests, together with their provided ratings.
                type: array
                items:
                  $ref: '#/components/schemas/_global.rank_eval.RankEvalRequestItem'
              metric:
                description: Definition of the evaluation metric to calculate.
                allOf:
                - $ref: '#/components/schemas/_global.rank_eval.RankEvalMetric'
            required:
            - requests
          examples:
            RankEvalRequestExample1:
              description: An example body for a `GET /my-index-000001/_rank_eval` request.
              value: "{\n  \"requests\": [\n    {\n      \"id\": \"JFK query\",\n      \"request\": { \"query\": { \"match_all\": {} } },\n      \"ratings\": []\n    } ],\n  \"metric\": {\n    \"precision\": {\n      \"k\": 20,\n      \"relevant_rating_threshold\": 1,\n      \"ignore_unlabeled\": false\n    }\n  }\n}"
      required: true
    clear_scroll:
      content:
        application/json:
          schema:
            type: object
            properties:
              scroll_id:
                description: 'The scroll IDs to clear.

                  To clear all scroll IDs, use `_all`.'
                allOf:
                - $ref: '#/components/schemas/_types.ScrollIds'
          examples:
            ClearScrollRequestExample1:
              description: Run `DELETE /_search/scroll` to clear the search context and results for a scrolling search.
              value: "{\n  \"scroll_id\": \"DXF1ZXJ5QW5kRmV0Y2gBAAAAAAAAAD4WYm9laVYtZndUQlNsdDcwakFMNjU1QQ==\"\n}"
    msearch:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/_global.msearch.RequestItem'
          examples:
            MsearchRequestExample1:
              description: An example body for a `GET my-index-000001/_msearch` request.
              value: '{ }

                {"query" : {"match" : { "message": "this is a test"}}}

                {"index": "my-index-000002"}

                {"query" : {"match_all" : {}}}'
      required: true
    terms_enum:
      content:
        application/json:
          schema:
            type: object
            properties:
              field:
                description: The string to match at the start of indexed terms. If not provided, all terms in the field are considered.
                allOf:
                - $ref: '#/components/schemas/_types.Field'
              size:
                description: The number of matching terms to return.
                default: 10
                type: number
              timeout:
                description: 'The maximum length of time to spend collecting results.

                  If the timeout is exceeded the `complete` flag set to `false` in the response and the results may be partial or empty.'
                default: 1s
                allOf:
                - $ref: '#/components/schemas/_types.Duration'
              case_insensitive:
                description: When `true`, the provided search string is matched against index terms without case sensitivity.
                default: false
                type: boolean
              index_filter:
                description: Filter an index shard if the provided query rewrites to `match_none`.
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
              string:
                description: 'The string to match at the start of indexed terms.

                  If it is not provided, all terms in the field are considered.


                  > info

                  > The prefix string cannot be larger than the largest possible keyword value, which is Lucene''s term byte-length limit of 32766.'
                type: string
              search_after:
                description: 'The string after which terms in the index should be returned.

                  It allows for a form of pagination if the last result from one request is passed as the `search_after` parameter for a subsequent request.'
                type: string
            required:
            - field
          examples:
            TermsEnumRequestExample1:
              description: Run `POST stackoverflow/_terms_enum`.
              value: "{\n    \"field\" : \"tags\",\n    \"string\" : \"kiba\"\n}"
      required: true
    search_mvt:
      content:
        application/json:
          schema:
            type: object
            properties:
              aggs:
                description: 'Sub-aggregations for the geotile_grid.


                  It supports the following aggregation types:


                  - `avg`

                  - `boxplot`

                  - `cardinality`

                  - `extended stats`

                  - `max`

                  - `median absolute deviation`

                  - `min`

                  - `percentile`

                  - `percentile-rank`

                  - `stats`

                  - `sum`

                  - `value count`


                  The aggregation names can''t start with `_mvt_`. The `_mvt_` prefix is reserved for internal aggregations.'
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/_types.aggregations.AggregationContainer'
              buffer:
                description: 'The size, in pixels, of a clipping buffer outside the tile. This allows renderers

                  to avoid outline artifacts from geometries that extend past the extent of the tile.'
                default: 5
                type: number
              exact_bounds:
                description: 'If `false`, the meta layer''s feature is the bounding box of the tile.

                  If `true`, the meta layer''s feature is a bounding box resulting from a

                  `geo_bounds` aggregation. The aggregation runs on <field> values that intersect

                  the `<zoom>/<x>/<y>` tile with `wrap_longitude` set to `false`. The resulting

                  bounding box may be larger than the vector tile.'
                default: false
                type: boolean
              extent:
                description: The size, in pixels, of a side of the tile. Vector tiles are square with equal sides.
                default: 4096
                type: number
              fields:
                description: 'The fields to return in the `hits` layer.

                  It supports wildcards (`*`).

                  This parameter does not support fields with array values. Fields with array

                  values may return inconsistent results.'
                allOf:
                - $ref: '#/components/schemas/_types.Fields'
              grid_agg:
                description: The aggregation used to create a grid for the `field`.
                allOf:
                - $ref: '#/components/schemas/_global.search_mvt._types.GridAggregationType'
              grid_precision:
                description: 'Additional zoom levels available through the aggs layer. For example, if `<zoom>` is `7`

                  and `grid_precision` is `8`, you can zoom in up to level 15. Accepts 0-8. If 0, results

                  don''t include the aggs layer.'
                default: 8
                type: number
              grid_type:
                description: 'Determines the geometry type for features in the aggs layer. In the aggs layer,

                  each feature represents a `geotile_grid` cell. If `grid, each feature is a polygon

                  of the cells bounding box. If `point`, each feature is a Point that is the centroid

                  of the cell.'
                default: grid
                allOf:
                - $ref: '#/components/schemas/_global.search_mvt._types.GridType'
              query:
                description: The query DSL used to filter documents for the search.
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
              runtime_mappings:
                description: 'Defines one or more runtime fields in the search request. These fields take

                  precedence over mapped fields with the same name.'
                allOf:
                - $ref: '#/components/schemas/_types.mapping.RuntimeFields'
              size:
                description: 'The maximum number of features to return in the hits layer. Accepts 0-10000.

                  If 0, results don''t include the hits layer.'
                default: 10000
                type: number
              sort:
                description: 'Sort the features in the hits layer. By default, the API calculates a bounding

                  box for each feature. It sorts features based on this box''s diagonal length,

                  from longest to shortest.'
                allOf:
                - $ref: '#/components/schemas/_types.Sort'
              track_total_hits:
                description: 'The number of hits matching the query to count accurately. If `true`, the exact number

                  of hits is returned at the cost of some performance. If `false`, the response does

                  not include the total number of hits matching the query.'
                default: '10000'
                allOf:
                - $ref: '#/components/schemas/_global.search._types.TrackHits'
              with_labels:
                description: 'If `true`, the hits and aggs layers will contain additional point features representing

                  suggested label positions for the original features.


                  * `Point` and `MultiPoint` features will have one of the points selected.

                  * `Polygon` and `MultiPolygon` features will have a single point generated, either the centroid, if it is within the polygon, or another point within the polygon selected from the sorted triangle-tree.

                  * `LineString` features will likewise provide a roughly central point selected from the triangle-tree.

                  * The aggregation results will provide one central point for each aggregation bucket.


                  All attributes from the original features will also be copied to the new label features.

                  In addition, the new features will be distinguishable using the tag `_mvt_label_position`.'
                type: boolean
          examples:
            SearchMvtRequestExample1:
              description: 'Run `GET museums/_mvt/location/13/4207/2692` to search an index for `location` values that intersect the `13/4207/2692` vector tile.

                '
              value: "{\n  \"grid_agg\": \"geotile\",\n  \"grid_precision\": 2,\n  \"fields\": [\n    \"name\",\n    \"price\"\n  ],\n  \"query\": {\n    \"term\": {\n      \"included\": true\n    }\n  },\n  \"aggs\": {\n    \"min_price\": {\n      \"min\": {\n        \"field\": \"price\"\n      }\n    },\n    \"max_price\": {\n      \"max\": {\n        \"field\": \"price\"\n      }\n    },\n    \"avg_price\": {\n      \"avg\": {\n        \"field\": \"price\"\n      }\n    }\n  }\n}"
    count:
      content:
        application/json:
          schema:
            type: object
            properties:
              query:
                description: 'Defines the search query using Query DSL. A request body query cannot be used

                  with the `q` query string parameter.'
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
          examples:
            CountRequestExample1:
              description: 'Run `GET /my-index-000001/_count?q=user:kimchy`. Alternatively, run `GET /my-index-000001/_count` with the same query in the request body. Both requests count the number of documents in `my-index-000001` with a `user.id` of `kimchy`.

                '
              value: "{\n  \"query\" : {\n    \"term\" : { \"user.id\" : \"kimchy\" }\n  }\n}"
    field_caps:
      content:
        application/json:
          schema:
            type: object
            properties:
              fields:
                description: A list of fields to retrieve capabilities for. Wildcard (`*`) expressions are supported.
                x-state: Generally available; Added in 8.5.0
                allOf:
                - $ref: '#/components/schemas/_types.Fields'
              index_filter:
                description: 'Filter indices if the provided query rewrites to `match_none` on every shard.


                  IMPORTANT: The filtering is done on a best-effort basis, it uses index statistics and mappings to rewrite queries to `match_none` instead of fully running the request.

                  For instance a range query over a date field can rewrite to `match_none` if all documents within a shard (including deleted documents) are outside of the provided range.

                  However, not all queries can rewrite to `match_none` so this API may return an index even if the provided filter matches no document.'
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
              runtime_mappings:
                description: 'Define ad-hoc runtime fields in the request similar to the way it is done in search requests.

                  These fields exist only as part of the query and take precedence over fields defined with the same name in the index mappings.'
                x-state: Generally available; Added in 7.12.0
                allOf:
                - $ref: '#/components/schemas/_types.mapping.RuntimeFields'
          examples:
            FieldCapabilitiesRequestExample1:
              description: 'Run `POST my-index-*/_field_caps?fields=rating` to get field capabilities and filter indices with a query. Indices that rewrite the provided filter to `match_none` on every shard will be filtered from the response.

                '
              value: "{\n  \"index_filter\": {\n    \"range\": {\n      \"@timestamp\": {\n        \"gte\": \"2018\"\n      }\n    }\n  }\n}"
    explain:
      content:
        application/json:
          schema:
            type: object
            properties:
              query:
                description: Defines the search definition using the Query DSL.
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
          examples:
            ExplainRequestExample1:
              description: 'Run `GET /my-index-000001/_explain/0` with the request body. Alternatively, run `GET /my-index-000001/_explain/0?q=message:elasticsearch`

                '
              value: "{\n  \"query\" : {\n    \"match\" : { \"message\" : \"elasticsearch\" }\n  }\n}"
    search:
      content:
        application/json:
          schema:
            type: object
            properties:
              aggregations:
                externalDocs:
                  url: https://www.elastic.co/docs/explore-analyze/query-filter/aggregations
                description: Defines the aggregations that are run as part of the search request.
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/_types.aggregations.AggregationContainer'
              collapse:
                description: Collapses search results the values of the specified field.
                allOf:
                - $ref: '#/components/schemas/_global.search._types.FieldCollapse'
              explain:
                description: If `true`, the request returns detailed information about score computation as part of a hit.
                default: false
                type: boolean
              ext:
                description: Configuration of search extensions defined by Elasticsearch plugins.
                type: object
                additionalProperties:
                  type: object
              from:
                description: 'The starting document offset, which must be non-negative.

                  By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                default: 0
                type: number
              highlight:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/highlighting
                description: Specifies the highlighter to use for retrieving highlighted snippets from one or more fields in your search results.
                allOf:
                - $ref: '#/components/schemas/_global.search._types.Highlight'
              track_total_hits:
                description: 'Number of hits matching the query to count accurately.

                  If `true`, the exact number of hits is returned at the cost of some performance.

                  If `false`, the  response does not include the total number of hits matching the query.'
                default: '10000'
                allOf:
                - $ref: '#/components/schemas/_global.search._types.TrackHits'
              indices_boost:
                externalDocs:
                  url: https://www.elastic.co/docs/explore-analyze/query-filter/languages/querydsl#relevance-scores
                description: 'Boost the `_score` of documents from specified indices.

                  The boost value is the factor by which scores are multiplied.

                  A boost value greater than `1.0` increases the score.

                  A boost value between `0` and `1.0` decreases the score.'
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: number
                  minProperties: 1
                  maxProperties: 1
              docvalue_fields:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/retrieve-selected-fields#docvalue-fields
                description: 'An array of wildcard (`*`) field patterns.

                  The request returns doc values for field names matching these patterns in the `hits.fields` property of the response.'
                type: array
                items:
                  $ref: '#/components/schemas/_types.query_dsl.FieldAndFormat'
              knn:
                externalDocs:
                  url: https://www.elastic.co/docs/solutions/search/vector/knn#approximate-knn
                description: The approximate kNN search to run.
                x-state: Generally available; Added in 8.4.0
                oneOf:
                - $ref: '#/components/schemas/_types.KnnSearch'
                - type: array
                  items:
                    $ref: '#/components/schemas/_types.KnnSearch'
              rank:
                description: The Reciprocal Rank Fusion (RRF) to use.
                x-state: Generally available; Added in 8.8.0
                allOf:
                - $ref: '#/components/schemas/_types.RankContainer'
              min_score:
                description: 'The minimum `_score` for matching documents.

                  Documents with a lower `_score` are not included in search results and results collected by aggregations.'
                type: number
              post_filter:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/filter-search-results
                description: 'Use the `post_filter` parameter to filter search results.

                  The search hits are filtered after the aggregations are calculated.

                  A post filter has no impact on the aggregation results.'
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
              profile:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/search-profile
                description: 'Set to `true` to return detailed timing information about the execution of individual components in a search request.

                  NOTE: This is a debugging tool and adds significant overhead to search execution.'
                default: false
                type: boolean
              query:
                externalDocs:
                  url: https://www.elastic.co/docs/explore-analyze/query-filter/languages/querydsl
                description: The search definition using the Query DSL.
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
              rescore:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/rescore-search-results
                description: Can be used to improve precision by reordering just the top (for example 100 - 500) documents returned by the `query` and `post_filter` phases.
                oneOf:
                - $ref: '#/components/schemas/_global.search._types.Rescore'
                - type: array
                  items:
                    $ref: '#/components/schemas/_global.search._types.Rescore'
              retriever:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/retrievers
                description: 'A retriever is a specification to describe top documents returned from a search.

                  A retriever replaces other elements of the search API that also return top documents such as `query` and `knn`.'
                x-state: Generally available; Added in 8.14.0
                allOf:
                - $ref: '#/components/schemas/_types.RetrieverContainer'
              script_fields:
                description: Retrieve a script evaluation (based on different fields) for each hit.
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/_types.ScriptField'
              search_after:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results#search-after
                description: Used to retrieve the next page of hits using a set of sort values from the previous page.
                allOf:
                - $ref: '#/components/schemas/_types.SortResults'
              size:
                description: 'The number of hits to return, which must not be negative.

                  By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

                  To page through more hits, use the `search_after` property.'
                default: 10
                type: number
              slice:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results#slice-scroll
                description: Split a scrolled search into multiple slices that can be consumed independently.
                allOf:
                - $ref: '#/components/schemas/_types.SlicedScroll'
              sort:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/sort-search-results
                description: A comma-separated list of <field>:<direction> pairs.
                allOf:
                - $ref: '#/components/schemas/_types.Sort'
              _source:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/retrieve-selected-fields#source-filtering
                description: 'The source fields that are returned for matching documents.

                  These fields are returned in the `hits._source` property of the search response.

                  If the `stored_fields` property is specified, the `_source` property defaults to `false`.

                  Otherwise, it defaults to `true`.'
                allOf:
                - $ref: '#/components/schemas/_global.search._types.SourceConfig'
              fields:
                description: 'An array of wildcard (`*`) field patterns.

                  The request returns values for field names matching these patterns in the `hits.fields` property of the response.'
                type: array
                items:
                  $ref: '#/components/schemas/_types.query_dsl.FieldAndFormat'
              suggest:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/search-suggesters
                description: Defines a suggester that provides similar looking terms based on a provided text.
                allOf:
                - $ref: '#/components/schemas/_global.search._types.Suggester'
              terminate_after:
                description: 'The maximum number of documents to collect for each shard.

                  If a query reaches this limit, Elasticsearch terminates the query early.

                  Elasticsearch collects documents before sorting.


                  IMPORTANT: Use with caution.

                  Elasticsearch applies this property to each shard handling the request.

                  When possible, let Elasticsearch perform early termination automatically.

                  Avoid specifying this property for requests that target data streams with backing indices across multiple data tiers.


                  If set to `0` (default), the query does not terminate early.'
                default: 0
                type: number
              timeout:
                description: 'The period of time to wait for a response from each shard.

                  If no response is received before the timeout expires, the request fails and returns an error.

                  Defaults to no timeout.'
                type: string
              track_scores:
                description: If `true`, calculate and return document scores, even if the scores are not used for sorting.
                default: false
                type: boolean
              version:
                description: If `true`, the request returns the document version as part of a hit.
                default: false
                type: boolean
              seq_no_primary_term:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/optimistic-concurrency-control
                description: If `true`, the request returns sequence number and primary term of the last modification of each hit.
                type: boolean
              stored_fields:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/retrieve-selected-fields#stored-fields
                description: 'A comma-separated list of stored fields to return as part of a hit.

                  If no fields are specified, no stored fields are included in the response.

                  If this field is specified, the `_source` property defaults to `false`.

                  You can pass `_source: true` to return both source fields and stored fields in the search response.'
                allOf:
                - $ref: '#/components/schemas/_types.Fields'
              pit:
                description: 'Limit the search to a point in time (PIT).

                  If you provide a PIT, you cannot specify an `<index>` in the request path.'
                allOf:
                - $ref: '#/components/schemas/_global.search._types.PointInTimeReference'
              runtime_mappings:
                externalDocs:
                  url: https://www.elastic.co/docs/manage-data/data-store/mapping/define-runtime-fields-in-search-request
                description: 'One or more runtime fields in the search request.

                  These fields take precedence over mapped fields with the same name.'
                allOf:
                - $ref: '#/components/schemas/_types.mapping.RuntimeFields'
              stats:
                description: 'The stats groups to associate with the search.

                  Each group maintains a statistics aggregation for its associated searches.

                  You can retrieve these stats using the indices stats API.'
                type: array
                items:
                  type: string
          examples:
            SearchRequestExample1:
              summary: A simple term search
              description: 'Run `GET /my-index-000001/_search?from=40&size=20` to run a search.

                '
              value: "{\n  \"query\": {\n    \"term\": {\n      \"user.id\": \"kimchy\"\n    }\n  }\n}"
            SearchRequestExample2:
              summary: A point in time search
              description: 'Run `POST /_search` to run a point in time search. The `id` parameter tells Elasticsearch to run the request using contexts from this open point in time. The `keep_alive` parameter tells Elasticsearch how long it should extend the time to live of the point in time.

                '
              value: "{\n    \"size\": 100,  \n    \"query\": {\n        \"match\" : {\n            \"title\" : \"elasticsearch\"\n        }\n    },\n    \"pit\": {\n      \"id\":  \"46ToAwMDaWR5BXV1aWQyKwZub2RlXzMAAAAAAAAAACoBYwADaWR4BXV1aWQxAgZub2RlXzEAAAAAAAAAAAEBYQADaWR5BXV1aWQyKgZub2RlXzIAAAAAAAAAAAwBYgACBXV1aWQyAAAFdXVpZDEAAQltYXRjaF9hbGw_gAAAAA==\", \n      \"keep_alive\": \"1m\"  \n    }\n}"
            SearchRequestExample3:
              summary: Search slicing
              description: 'When paging through a large number of documents, it can be helpful to split the search into multiple slices to consume them independently. The result from running the first `GET /_search` request returns documents belonging to the first slice (`id: 0`). If you run a second request with `id` set to `1'', it returns documents in the second slice. Since the maximum number of slices is set to `2`, the union of the results is equivalent to the results of a point-in-time search without slicing.

                '
              value: "{\n  \"slice\": {\n    \"id\": 0,                      \n    \"max\": 2                      \n  },\n  \"query\": {\n    \"match\": {\n      \"message\": \"foo\"\n    }\n  },\n  \"pit\": {\n    \"id\": \"46ToAwMDaWR5BXV1aWQyKwZub2RlXzMAAAAAAAAAACoBYwADaWR4BXV1aWQxAgZub2RlXzEAAAAAAAAAAAEBYQADaWR5BXV1aWQyKgZub2RlXzIAAAAAAAAAAAwBYgACBXV1aWQyAAAFdXVpZDEAAQltYXRjaF9hbGw_gAAAAA==\"\n  }\n}"
    msearch_template:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/_global.msearch_template.RequestItem'
          examples:
            MultiSearchTemplateRequestExample1:
              description: Run `GET my-index/_msearch/template` to run multiple templated searches.
              value: '{ }

                { "id": "my-search-template", "params": { "query_string": "hello world", "from": 0, "size": 10 }}

                { }

                { "id": "my-other-search-template", "params": { "query_type": "match_all" }}'
      required: true
    scroll:
      content:
        application/json:
          schema:
            type: object
            properties:
              scroll:
                description: The period to retain the search context for scrolling.
                default: 1d
                allOf:
                - $ref: '#/components/schemas/_types.Duration'
              scroll_id:
                description: The scroll ID of the search.
                allOf:
                - $ref: '#/components/schemas/_types.ScrollId'
            required:
            - scroll_id
          examples:
