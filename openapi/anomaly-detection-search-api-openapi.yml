    search_shards-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              nodes:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/_global.search_shards.SearchShardsNodeAttributes'
              shards:
                type: array
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/_types.NodeShard'
              indices:
                type: object
