openapi: 3.2.0
info:
  title: Elasticsearch Ingest API
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the `main` branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: Ingest
  x-displayName: Ingest
  description: Ingest APIs enable you to manage tasks and resources related to ingest pipelines and processors.
  externalDocs:
    url: https://www.elastic.co/docs/manage-data/ingest
    description: Learn more about ingesting data.
paths:
  /_ingest/geoip/database/{id}:
    get:
      tags:
      - Ingest
      summary: Get GeoIP database configurations
      description: '**All methods and paths for this operation:**


        GET

        /_ingest/geoip/database


        GET

        /_ingest/geoip/database/{id}


        Get information about one or more IP geolocation database configurations.'
      operationId: ingest-get-geoip-database
      parameters:
      - $ref: '#/components/parameters/ingest.get_geoip_database-id'
      responses:
        '200':
          $ref: '#/components/responses/ingest.get_geoip_database-200'
      x-state: Generally available; Added in 8.15.0
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    put:
      tags:
      - Ingest
      summary: Create or update a GeoIP database configuration
      description: Refer to the create or update IP geolocation database configuration API.
      operationId: ingest-put-geoip-database
      parameters:
      - in: path
        name: id
        description: ID of the database configuration to create or update.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: master_timeout
        description: 'Period to wait for a connection to the master node.

          If no response is received before the timeout expires, the request fails and returns an error.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: Period to wait for a response. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: The provider-assigned name of the IP geolocation database to download.
                  allOf:
                  - $ref: '#/components/schemas/_types.Name'
                maxmind:
                  description: 'The configuration necessary to identify which IP geolocation provider to use to download the database, as well as any provider-specific configuration necessary for such downloading.

                    At present, the only supported provider is maxmind, and the maxmind provider requires that an account_id (string) is configured.'
                  allOf:
                  - $ref: '#/components/schemas/ingest._types.Maxmind'
              required:
              - name
              - maxmind
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 8.15.0
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    delete:
      tags:
      - Ingest
      summary: Delete GeoIP database configurations
      description: Delete one or more IP geolocation database configurations.
      operationId: ingest-delete-geoip-database
      parameters:
      - in: path
        name: id
        description: A comma-separated list of geoip database configurations to delete
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Ids'
        style: simple
      - in: query
        name: master_timeout
        description: 'The period to wait for a connection to the master node.

          If no response is received before the timeout expires, the request fails and returns an error.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: The period to wait for a response. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 8.15.0
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_ingest/ip_location/database/{id}:
    get:
      tags:
      - Ingest
      summary: Get IP geolocation database configurations
      description: '**All methods and paths for this operation:**


        GET

        /_ingest/ip_location/database


        GET

        /_ingest/ip_location/database/{id}


        ## Required authorization


        * Cluster privileges: `manage`'
      operationId: ingest-get-ip-location-database
      parameters:
      - $ref: '#/components/parameters/ingest.get_ip_location_database-id'
      responses:
        '200':
          $ref: '#/components/responses/ingest.get_ip_location_database-200'
      x-state: Generally available; Added in 8.15.0
      x-codeSamples:
      - lang: Console
        source: 'GET /_ingest/ip_location/database/my-database-id

          '
      - lang: Python
        source: "resp = client.ingest.get_ip_location_database(\n    id=\"my-database-id\",\n)"
      - lang: JavaScript
        source: "const response = await client.ingest.getIpLocationDatabase({\n  id: \"my-database-id\",\n});"
      - lang: Ruby
        source: "response = client.ingest.get_ip_location_database(\n  id: \"my-database-id\"\n)"
      - lang: PHP
        source: "$resp = $client->ingest()->getIpLocationDatabase([\n    \"id\" => \"my-database-id\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ingest/ip_location/database/my-database-id"'
      - lang: C#
        source: "var response = await client.Ingest\n    .GetIpLocationDatabaseAsync(d1 => d1\n        .Id(new[] { \"my-database-id\" })\n    );"
      - lang: Java
        source: "client.ingest().getIpLocationDatabase(g -> g\n    .id(\"my-database-id\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    put:
      tags:
      - Ingest
      summary: Create or update an IP geolocation database configuration
      description: '## Required authorization


        * Cluster privileges: `manage`'
      operationId: ingest-put-ip-location-database
      parameters:
      - in: path
        name: id
        description: The database configuration identifier.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: master_timeout
        description: 'The period to wait for a connection to the master node.

          If no response is received before the timeout expires, the request fails and returns an error.

          A value of `-1` indicates that the request should never time out.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: 'The period to wait for a response from all relevant nodes in the cluster after updating the cluster metadata.

          If no response is received before the timeout expires, the cluster metadata update still applies but the response indicates that it was not completely acknowledged.

          A value of `-1` indicates that the request should never time out.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ingest._types.DatabaseConfiguration'
            examples:
              IngestPutIpLocationDatabaseExample1:
                description: An example body for a `PUT _ingest/ip_location/database/my-database-1` request.
                value: "{\n  \"name\": \"GeoIP2-Domain\",\n  \"maxmind\": {\n    \"account_id\": \"1234567\"\n  }\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 8.15.0
      x-codeSamples:
      - lang: Console
        source: "PUT _ingest/ip_location/database/my-database-1\n{\n  \"name\": \"GeoIP2-Domain\",\n  \"maxmind\": {\n    \"account_id\": \"1234567\"\n  }\n}"
      - lang: Python
        source: "resp = client.ingest.put_ip_location_database(\n    id=\"my-database-1\",\n    configuration={\n        \"name\": \"GeoIP2-Domain\",\n        \"maxmind\": {\n            \"account_id\": \"1234567\"\n        }\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.ingest.putIpLocationDatabase({\n  id: \"my-database-1\",\n  configuration: {\n    name: \"GeoIP2-Domain\",\n    maxmind: {\n      account_id: \"1234567\",\n    },\n  },\n});"
      - lang: Ruby
        source: "response = client.ingest.put_ip_location_database(\n  id: \"my-database-1\",\n  body: {\n    \"name\": \"GeoIP2-Domain\",\n    \"maxmind\": {\n      \"account_id\": \"1234567\"\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->ingest()->putIpLocationDatabase([\n    \"id\" => \"my-database-1\",\n    \"body\" => [\n        \"name\" => \"GeoIP2-Domain\",\n        \"maxmind\" => [\n            \"account_id\" => \"1234567\",\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"name":"GeoIP2-Domain","maxmind":{"account_id":"1234567"}}'' "$ELASTICSEARCH_URL/_ingest/ip_location/database/my-database-1"'
      - lang: C#
        source: "var response = await client.Ingest\n    .PutIpLocationDatabaseAsync(id: \"my-database-1\", d1 => d1\n        .Configuration(d2 => d2\n            .Name(\"GeoIP2-Domain\")\n            .Maxmind(d3 => d3\n                .AccountId(\"1234567\")\n            )\n        )\n    );"
      - lang: Java
        source: "client.ingest().putIpLocationDatabase(p -> p\n    .id(\"my-database-1\")\n    .configuration(c -> c\n        .maxmind(m -> m\n            .accountId(\"1234567\")\n        )\n        .name(\"GeoIP2-Domain\")\n    )\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    delete:
      tags:
      - Ingest
      summary: Delete IP geolocation database configurations
      description: '## Required authorization


        * Cluster privileges: `manage`'
      operationId: ingest-delete-ip-location-database
      parameters:
      - in: path
        name: id
        description: A comma-separated list of IP location database configurations.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Ids'
        style: simple
      - in: query
        name: master_timeout
        description: 'The period to wait for a connection to the master node.

          If no response is received before the timeout expires, the request fails and returns an error.

          A value of `-1` indicates that the request should never time out.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: 'The period to wait for a response.

          If no response is received before the timeout expires, the request fails and returns an error.

          A value of `-1` indicates that the request should never time out.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 8.15.0
      x-codeSamples:
      - lang: Console
        source: 'DELETE /_ingest/ip_location/database/my-database-id

          '
      - lang: Python
        source: "resp = client.ingest.delete_ip_location_database(\n    id=\"my-database-id\",\n)"
      - lang: JavaScript
        source: "const response = await client.ingest.deleteIpLocationDatabase({\n  id: \"my-database-id\",\n});"
      - lang: Ruby
        source: "response = client.ingest.delete_ip_location_database(\n  id: \"my-database-id\"\n)"
      - lang: PHP
        source: "$resp = $client->ingest()->deleteIpLocationDatabase([\n    \"id\" => \"my-database-id\",\n]);"
      - lang: curl
        source: 'curl -X DELETE -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ingest/ip_location/database/my-database-id"'
      - lang: C#
        source: 'var response = await client.Ingest.DeleteIpLocationDatabaseAsync(id: new[] { "my-database-id" });'
      - lang: Java
        source: "client.ingest().deleteIpLocationDatabase(d -> d\n    .id(\"my-database-id\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_ingest/pipeline/{id}:
    get:
      tags:
      - Ingest
      summary: Get pipelines
      description: '**All methods and paths for this operation:**


        GET

        /_ingest/pipeline


        GET

        /_ingest/pipeline/{id}


        Get information about one or more ingest pipelines.

        This API returns a local reference of the pipeline.'
      externalDocs:
        description: About ingest pipelines
        url: https://www.elastic.co/docs/manage-data/ingest/transform-enrich/ingest-pipelines
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/get-pipeline-api.html
      operationId: ingest-get-pipeline
      parameters:
      - $ref: '#/components/parameters/ingest.get_pipeline-id'
      - $ref: '#/components/parameters/ingest.get_pipeline-master_timeout'
      - $ref: '#/components/parameters/ingest.get_pipeline-summary'
      responses:
        '200':
          $ref: '#/components/responses/ingest.get_pipeline-200'
      x-state: Generally available; Added in 5.0.0
      x-codeSamples:
      - lang: Console
        source: 'GET /_ingest/pipeline/my-pipeline-id

          '
      - lang: Python
        source: "resp = client.ingest.get_pipeline(\n    id=\"my-pipeline-id\",\n)"
      - lang: JavaScript
        source: "const response = await client.ingest.getPipeline({\n  id: \"my-pipeline-id\",\n});"
      - lang: Ruby
        source: "response = client.ingest.get_pipeline(\n  id: \"my-pipeline-id\"\n)"
      - lang: PHP
        source: "$resp = $client->ingest()->getPipeline([\n    \"id\" => \"my-pipeline-id\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ingest/pipeline/my-pipeline-id"'
      - lang: C#
        source: "var response = await client.Ingest\n    .GetPipelineAsync(d1 => d1\n        .Id(\"my-pipeline-id\")\n    );"
      - lang: Java
        source: "client.ingest().getPipeline(g -> g\n    .id(\"my-pipeline-id\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    put:
      tags:
      - Ingest
      summary: Create or update a pipeline
      description: Changes made using this API take effect immediately.
      externalDocs:
        description: About ingest pipelines
        url: https://www.elastic.co/docs/manage-data/ingest/transform-enrich/ingest-pipelines
      operationId: ingest-put-pipeline
      parameters:
      - in: path
        name: id
        description: ID of the ingest pipeline to create or update.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: Period to wait for a response. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: if_version
        description: Required version for optimistic concurrency control for pipeline updates
        deprecated: false
        schema:
          type: number
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _meta:
                  description: Optional metadata about the ingest pipeline. May have any contents. This map is not automatically generated by Elasticsearch.
                  allOf:
                  - $ref: '#/components/schemas/_types.Metadata'
                description:
                  description: Description of the ingest pipeline.
                  type: string
                on_failure:
                  description: Processors to run immediately after a processor failure. Each processor supports a processor-level `on_failure` value. If a processor without an `on_failure` value fails, Elasticsearch uses this pipeline-level parameter as a fallback. The processors in this parameter run sequentially in the order specified. Elasticsearch will not attempt to run the pipeline's remaining processors.
                  type: array
                  items:
                    $ref: '#/components/schemas/ingest._types.ProcessorContainer'
                processors:
                  description: Processors used to perform transformations on documents before indexing. Processors run sequentially in the order specified.
                  type: array
                  items:
                    $ref: '#/components/schemas/ingest._types.ProcessorContainer'
                version:
                  description: Version number used by external systems to track ingest pipelines. This parameter is intended for external systems only. Elasticsearch does not use or validate pipeline version numbers.
                  allOf:
                  - $ref: '#/components/schemas/_types.VersionNumber'
                deprecated:
                  description: 'Marks this ingest pipeline as deprecated.

                    When a deprecated ingest pipeline is referenced as the default or final pipeline when creating or updating a non-deprecated index template, Elasticsearch will emit a deprecation warning.'
                  default: false
                  type: boolean
                field_access_pattern:
                  description: Controls how processors in this pipeline should read and write data on a document's source.
                  default: classic
                  x-state: Generally available; Added in 9.2.0
                  allOf:
                  - $ref: '#/components/schemas/ingest._types.FieldAccessPattern'
            examples:
              PutPipelineRequestExample1:
                summary: Create an ingest pipeline.
                value: "{\n  \"description\" : \"My optional pipeline description\",\n  \"processors\" : [\n    {\n      \"set\" : {\n        \"description\" : \"My optional processor description\",\n        \"field\": \"my-keyword-field\",\n        \"value\": \"foo\"\n      }\n    }\n  ]\n}"
              PutPipelineRequestExample2:
                summary: Create an ingest pipeline with metadata.
                description: You can use the `_meta` parameter to add arbitrary metadata to a pipeline.
                value: "{\n  \"description\" : \"My optional pipeline description\",\n  \"processors\" : [\n    {\n      \"set\" : {\n        \"description\" : \"My optional processor description\",\n        \"field\": \"my-keyword-field\",\n        \"value\": \"foo\"\n      }\n    }\n  ],\n  \"_meta\": {\n    \"reason\": \"set my-keyword-field to foo\",\n    \"serialization\": {\n      \"class\": \"MyPipeline\",\n      \"id\": 10\n    }\n  }\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 5.0.0
      x-codeSamples:
      - lang: Console
        source: "PUT _ingest/pipeline/my-pipeline-id\n{\n  \"description\" : \"My optional pipeline description\",\n  \"processors\" : [\n    {\n      \"set\" : {\n        \"description\" : \"My optional processor description\",\n        \"field\": \"my-keyword-field\",\n        \"value\": \"foo\"\n      }\n    }\n  ]\n}"
      - lang: Python
        source: "resp = client.ingest.put_pipeline(\n    id=\"my-pipeline-id\",\n    description=\"My optional pipeline description\",\n    processors=[\n        {\n            \"set\": {\n                \"description\": \"My optional processor description\",\n                \"field\": \"my-keyword-field\",\n                \"value\": \"foo\"\n            }\n        }\n    ],\n)"
      - lang: JavaScript
        source: "const response = await client.ingest.putPipeline({\n  id: \"my-pipeline-id\",\n  description: \"My optional pipeline description\",\n  processors: [\n    {\n      set: {\n        description: \"My optional processor description\",\n        field: \"my-keyword-field\",\n        value: \"foo\",\n      },\n    },\n  ],\n});"
      - lang: Ruby
        source: "response = client.ingest.put_pipeline(\n  id: \"my-pipeline-id\",\n  body: {\n    \"description\": \"My optional pipeline description\",\n    \"processors\": [\n      {\n        \"set\": {\n          \"description\": \"My optional processor description\",\n          \"field\": \"my-keyword-field\",\n          \"value\": \"foo\"\n        }\n      }\n    ]\n  }\n)"
      - lang: PHP
        source: "$resp = $client->ingest()->putPipeline([\n    \"id\" => \"my-pipeline-id\",\n    \"body\" => [\n        \"description\" => \"My optional pipeline description\",\n        \"processors\" => array(\n            [\n                \"set\" => [\n                    \"description\" => \"My optional processor description\",\n                    \"field\" => \"my-keyword-field\",\n                    \"value\" => \"foo\",\n                ],\n            ],\n        ),\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"description":"My optional pipeline description","processors":[{"set":{"description":"My optional processor description","field":"my-keyword-field","value":"foo"}}]}'' "$ELASTICSEARCH_URL/_ingest/pipeline/my-pipeline-id"'
      - lang: C#
        source: "var response = await client.Ingest\n    .PutPipelineAsync(id: \"my-pipeline-id\", d1 => d1\n        .Description(\"My optional pipeline description\")\n        .Processors(d2 => d2\n            .Set(d3 => d3\n                .Description(\"My optional processor description\")\n                .Field(x => x.MyKeywordField)\n                .Value(\"foo\")\n            )\n        )\n    );"
      - lang: Java
        source: "client.ingest().putPipeline(p -> p\n    .description(\"My optional pipeline description\")\n    .id(\"my-pipeline-id\")\n    .processors(pr -> pr\n        .set(s -> s\n            .field(\"my-keyword-field\")\n            .value(JsonData.fromJson(\"\\\"foo\\\"\"))\n            .description(\"My optional processor description\")\n        )\n    )\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    delete:
      tags:
      - Ingest
      summary: Delete pipelines
      description: Delete one or more ingest pipelines.
      externalDocs:
        description: About ingest pipelines
        url: https://www.elastic.co/docs/manage-data/ingest/transform-enrich/ingest-pipelines
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/delete-pipeline-api.html
      operationId: ingest-delete-pipeline
      parameters:
      - in: path
        name: id
        description: 'Pipeline ID or wildcard expression of pipeline IDs used to limit the request.

          To delete all ingest pipelines in a cluster, use a value of `*`.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: master_timeout
        description: 'Period to wait for a connection to the master node.

          If no response is received before the timeout expires, the request fails and returns an error.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: 'Period to wait for a response.

          If no response is received before the timeout expires, the request fails and returns an error.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 5.0.0
      x-codeSamples:
      - lang: Console
        source: 'DELETE /_ingest/pipeline/my-pipeline-id

          '
      - lang: Python
        source: "resp = client.ingest.delete_pipeline(\n    id=\"my-pipeline-id\",\n)"
      - lang: JavaScript
        source: "const response = await client.ingest.deletePipeline({\n  id: \"my-pipeline-id\",\n});"
      - lang: Ruby
        source: "response = client.ingest.delete_pipeline(\n  id: \"my-pipeline-id\"\n)"
      - lang: PHP
        source: "$resp = $client->ingest()->deletePipeline([\n    \"id\" => \"my-pipeline-id\",\n]);"
      - lang: curl
