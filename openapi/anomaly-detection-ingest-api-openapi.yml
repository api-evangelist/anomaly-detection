    indices._types.DataStreamLifecycle:
      description: Data stream lifecycle denotes that a data stream is managed by the data stream lifecycle and contains the configuration.
      type: object
      properties:
        data_retention:
          description: 'If defined, every document added to this data stream will be stored at least for this time frame.

            Any time after this duration the document could be deleted.

            When empty, every document in this data stream will be stored indefinitely.'
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        effective_retention:
          description: The least amount of time data should be kept by elasticsearch.
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        retention_determined_by:
          description: Configuration source that can influence the retention of a data stream.
          allOf:
          - $ref: '#/components/schemas/indices._types.RetentionSource'
        downsampling:
          description: The list of downsampling rounds to execute as part of this downsampling configuration
          type: array
          items:
            $ref: '#/components/schemas/indices._types.DownsamplingRound'
        downsampling_method:
          description: 'The method used to downsample the data. There are two options `aggregate` and `last_value`. It requires

            `downsampling` to be defined. Defaults to `aggregate`.'
          allOf:
          - $ref: '#/components/schemas/indices._types.SamplingMethod'
        enabled:
          description: 'If defined, it turns data stream lifecycle on/off (`true`/`false`) for this data stream. A data stream lifecycle

            that''s disabled (enabled: `false`) will have no effect on the data stream.'
          default: true
          type: boolean
        frozen_after:
          description: 'The period after which data stream backing indices are automatically converted to partially mounted searchable snapshots.

            This field is valid only on main data stream lifecycles and cannot be set on failure-store lifecycles.'
          x-state: Generally available; Added in 9.5.0
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
