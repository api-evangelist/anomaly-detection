    _types.mapping.PropertyBase:
      type: object
      properties:
        meta:
          description: Metadata about the field.
          type: object
          additionalProperties:
            type: string
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/_types.mapping.Property'
        ignore_above:
          type: number
        dynamic:
          allOf:
          - $ref: '#/components/schemas/_types.mapping.DynamicMapping'
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/_types.mapping.Property'
        synthetic_source_keep:
          description: "\n\nSupported values include:\n  - `none`: Synthetic source diverges from the original source (default)\n  - `arrays`: Arrays of the corresponding field or object preserve the original element ordering and duplicate elements.\nThe synthetic source fragment for such arrays is not guaranteed to match the original source exactly,\ne.g. array [1, 2, [5], [[4, [3]]], 5] may appear as-is or in an equivalent format like [1, 2, 5, 4, 3, 5].\nThe exact format may change in the future, in an effort to reduce the storage overhead of this option.\n  - `all`: The source for both singleton instances and arrays of the corresponding field or object gets recorded.\nWhen applied to objects, the source of all sub-objects and sub-fields gets captured.\nFurthermore, the original source of arrays gets captured and appears in synthetic source with no modifications.\n\n"
          allOf:
          - $ref: '#/components/schemas/_types.mapping.SyntheticSourceKeepEnum'
    _global.search._types.BoundaryScanner:
      type: string
      enum:
      - chars
      - sentence
      - word
    ingest._types.ProcessorContainer:
      type: object
      properties:
        append:
          description: 'Appends one or more values to an existing array if the field already exists and it is an array.

            Converts a scalar to an array and appends one or more values to it if the field exists and it is a scalar.

            Creates an array containing the provided values if the field doesn’t exist.

            Accepts a single value or an array of values.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.AppendProcessor'
        attachment:
          description: The attachment processor lets Elasticsearch extract file attachments in common formats (such as PPT, XLS, and PDF) by using the Apache text extraction library Tika.
          allOf:
          - $ref: '#/components/schemas/ingest._types.AttachmentProcessor'
        bytes:
          description: 'Converts a human readable byte value (for example `1kb`) to its value in bytes (for example `1024`).

            If the field is an array of strings, all members of the array will be converted.

            Supported human readable units are "b", "kb", "mb", "gb", "tb", "pb" case insensitive.

            An error will occur if the field is not a supported format or resultant value exceeds 2^63.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.BytesProcessor'
        cef:
          description: Converts a CEF message into a structured format.
          allOf:
          - $ref: '#/components/schemas/ingest._types.CefProcessor'
        circle:
          description: Converts circle definitions of shapes to regular polygons which approximate them.
          allOf:
          - $ref: '#/components/schemas/ingest._types.CircleProcessor'
        community_id:
          description: 'Computes the Community ID for network flow data as defined in the

            Community ID Specification. You can use a community ID to correlate network

            events related to a single flow.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.CommunityIDProcessor'
        convert:
          description: 'Converts a field in the currently ingested document to a different type, such as converting a string to an integer.

            If the field value is an array, all members will be converted.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.ConvertProcessor'
        csv:
          description: 'Extracts fields from CSV line out of a single text field within a document.

            Any empty field in CSV will be skipped.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.CsvProcessor'
        date:
          description: Parses dates from fields, and then uses the date or timestamp as the timestamp for the document.
          allOf:
          - $ref: '#/components/schemas/ingest._types.DateProcessor'
        date_index_name:
          description: The purpose of this processor is to point documents to the right time based index based on a date or timestamp field in a document by using the date math index name support.
          allOf:
          - $ref: '#/components/schemas/ingest._types.DateIndexNameProcessor'
        dissect:
          description: Extracts structured fields out of a single text field by matching the text field against a delimiter-based pattern.
          allOf:
          - $ref: '#/components/schemas/ingest._types.DissectProcessor'
        dot_expander:
          description: 'Expands a field with dots into an object field.

            This processor allows fields with dots in the name to be accessible by other processors in the pipeline.

            Otherwise these fields can’t be accessed by any processor.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.DotExpanderProcessor'
        drop:
          description: 'Drops the document without raising any errors.

            This is useful to prevent the document from getting indexed based on some condition.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.DropProcessor'
        enrich:
          description: The `enrich` processor can enrich documents with data from another index.
          allOf:
          - $ref: '#/components/schemas/ingest._types.EnrichProcessor'
        fail:
          description: 'Raises an exception.

            This is useful for when you expect a pipeline to fail and want to relay a specific message to the requester.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.FailProcessor'
        fingerprint:
          description: 'Computes a hash of the document’s content. You can use this hash for

            content fingerprinting.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.FingerprintProcessor'
        foreach:
          description: Runs an ingest processor on each element of an array or object.
          allOf:
          - $ref: '#/components/schemas/ingest._types.ForeachProcessor'
        ip_location:
          description: Currently an undocumented alias for GeoIP Processor.
          allOf:
          - $ref: '#/components/schemas/ingest._types.IpLocationProcessor'
        geo_grid:
          description: 'Converts geo-grid definitions of grid tiles or cells to regular bounding boxes or polygons which describe their shape.

            This is useful if there is a need to interact with the tile shapes as spatially indexable fields.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.GeoGridProcessor'
        geoip:
          description: The `geoip` processor adds information about the geographical location of an IPv4 or IPv6 address.
          allOf:
          - $ref: '#/components/schemas/ingest._types.GeoIpProcessor'
        grok:
          description: 'Extracts structured fields out of a single text field within a document.

            You choose which field to extract matched fields from, as well as the grok pattern you expect will match.

            A grok pattern is like a regular expression that supports aliased expressions that can be reused.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.GrokProcessor'
        gsub:
          description: 'Converts a string field by applying a regular expression and a replacement.

            If the field is an array of string, all members of the array will be converted.

            If any non-string values are encountered, the processor will throw an exception.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.GsubProcessor'
        html_strip:
          description: 'Removes HTML tags from the field.

            If the field is an array of strings, HTML tags will be removed from all members of the array.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.HtmlStripProcessor'
        inference:
          description: Uses a pre-trained data frame analytics model or a model deployed for natural language processing tasks to infer against the data that is being ingested in the pipeline.
          allOf:
          - $ref: '#/components/schemas/ingest._types.InferenceProcessor'
        join:
          description: 'Joins each element of an array into a single string using a separator character between each element.

            Throws an error when the field is not an array.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.JoinProcessor'
        json:
          description: Parses a string containing JSON data into a structured object, string, or other value.
          allOf:
          - $ref: '#/components/schemas/ingest._types.JsonProcessor'
        kv:
          description: This processor helps automatically parse messages (or specific event fields) which are of the `foo=bar` variety.
          allOf:
          - $ref: '#/components/schemas/ingest._types.KeyValueProcessor'
        lowercase:
          description: 'Converts a string to its lowercase equivalent.

            If the field is an array of strings, all members of the array will be converted.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.LowercaseProcessor'
        network_direction:
          description: 'Calculates the network direction given a source IP address, destination IP

            address, and a list of internal networks.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.NetworkDirectionProcessor'
        pipeline:
          description: Executes another pipeline.
          allOf:
          - $ref: '#/components/schemas/ingest._types.PipelineProcessor'
        redact:
          description: 'The Redact processor uses the Grok rules engine to obscure text in the input document matching the given Grok patterns.

            The processor can be used to obscure Personal Identifying Information (PII) by configuring it to detect known patterns such as email or IP addresses.

            Text that matches a Grok pattern is replaced with a configurable string such as `<EMAIL>` where an email address is matched or simply replace all matches with the text `<REDACTED>` if preferred.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.RedactProcessor'
        registered_domain:
          description: 'Extracts the registered domain (also known as the effective top-level

            domain or eTLD), sub-domain, and top-level domain from a fully qualified

            domain name (FQDN). Uses the registered domains defined in the Mozilla

            Public Suffix List.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.RegisteredDomainProcessor'
        remove:
          description: 'Removes existing fields.

            If one field doesn’t exist, an exception will be thrown.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.RemoveProcessor'
        rename:
          description: 'Renames an existing field.

            If the field doesn’t exist or the new name is already used, an exception will be thrown.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.RenameProcessor'
        reroute:
          description: 'Routes a document to another target index or data stream.

            When setting the `destination` option, the target is explicitly specified and the dataset and namespace options can’t be set.

            When the `destination` option is not set, this processor is in a data stream mode. Note that in this mode, the reroute processor can only be used on data streams that follow the data stream naming scheme.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.RerouteProcessor'
        script:
          description: 'Runs an inline or stored script on incoming documents.

            The script runs in the `ingest` context.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.ScriptProcessor'
        set:
          description: 'Adds a field with the specified value.

            If the field already exists, its value will be replaced with the provided one.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.SetProcessor'
        set_security_user:
          description: Sets user-related details (such as `username`, `roles`, `email`, `full_name`, `metadata`, `api_key`, `realm` and `authentication_type`) from the current authenticated user to the current document by pre-processing the ingest.
          allOf:
          - $ref: '#/components/schemas/ingest._types.SetSecurityUserProcessor'
        sort:
          description: 'Sorts the elements of an array ascending or descending.

            Homogeneous arrays of numbers will be sorted numerically, while arrays of strings or heterogeneous arrays of strings + numbers will be sorted lexicographically.

            Throws an error when the field is not an array.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.SortProcessor'
        split:
          description: 'Splits a field into an array using a separator character.

            Only works on string fields.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.SplitProcessor'
        terminate:
          description: 'Terminates the current ingest pipeline, causing no further processors to be run.

            This will normally be executed conditionally, using the `if` option.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.TerminateProcessor'
        trim:
          description: 'Trims whitespace from a field.

            If the field is an array of strings, all members of the array will be trimmed.

            This only works on leading and trailing whitespace.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.TrimProcessor'
        uppercase:
          description: 'Converts a string to its uppercase equivalent.

            If the field is an array of strings, all members of the array will be converted.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.UppercaseProcessor'
        urldecode:
          description: 'URL-decodes a string.

            If the field is an array of strings, all members of the array will be decoded.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.UrlDecodeProcessor'
        uri_parts:
          description: 'Parses a Uniform Resource Identifier (URI) string and extracts its components as an object.

            This URI object includes properties for the URI’s domain, path, fragment, port, query, scheme, user info, username, and password.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.UriPartsProcessor'
        user_agent:
          description: 'The `user_agent` processor extracts details from the user agent string a browser sends with its web requests.

            This processor adds this information by default under the `user_agent` field.'
          allOf:
          - $ref: '#/components/schemas/ingest._types.UserAgentProcessor'
      minProperties: 1
      maxProperties: 1
