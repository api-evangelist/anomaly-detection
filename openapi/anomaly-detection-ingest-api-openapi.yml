            distributed. Cannot be changed after the field is created.'
          default: false
          x-state: Generally available; Added in 9.4.0
          type: boolean
        auto_calibrate:
          description: 'Only applicable to `bbq_disk`. When `true`, Elasticsearch automatically selects the optimal

            quantization encoding, oversampling factor, and preconditioning for each merged segment based

            on estimated recall characteristics. Cannot be changed after the field is created.'
          default: false
          x-state: Generally available; Added in 9.5.0
          type: boolean
      required:
      - type
