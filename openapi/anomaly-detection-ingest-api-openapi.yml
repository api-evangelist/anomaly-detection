            description: The field that will hold the parsed date.
            default: '@timestamp'
            allOf:
            - $ref: '#/components/schemas/_types.Field'
          timezone:
            description: 'The timezone to use when parsing the date.

              Supports template snippets.'
            default: UTC
            type: string
          output_format:
            description: 'The format to use when writing the date to target_field. Must be a valid

