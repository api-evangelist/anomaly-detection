          geotile_grid:
            externalDocs:
              url: https://www.elastic.co/docs/reference/aggregations/search-aggregations-bucket-geotilegrid-aggregation
            description: 'A multi-bucket aggregation that groups `geo_point` and `geo_shape` values into buckets that represent a grid.

