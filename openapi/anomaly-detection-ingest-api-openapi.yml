    _types.aggregations.MinimumInterval:
      type: string
      enum:
      - second
      - minute
      - hour
      - day
      - month
      - year
    _types.InferenceStringGroup:
      oneOf:
      - $ref: '#/components/schemas/_types.InferenceString'
      - type: array
        items:
          $ref: '#/components/schemas/_types.InferenceString'
    _types.aggregations.DiversifiedSamplerAggregation:
      allOf:
      - $ref: '#/components/schemas/_types.aggregations.BucketAggregationBase'
      - type: object
        properties:
          execution_hint:
            description: "The type of value used for de-duplication.\n\nSupported values include:\n  - `map`: Hold field values directly.\n  - `global_ordinals`: Hold ordinals of the field as determined by the Lucene index.\n  - `bytes_hash`: Hold hashes of the field values - with potential for hash collisions.\n\n"
            default: global_ordinals
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.SamplerAggregationExecutionHint'
          max_docs_per_value:
            description: Limits how many documents are permitted per choice of de-duplicating value.
            default: 1
            type: number
          script:
            allOf:
            - $ref: '#/components/schemas/_types.Script'
          shard_size:
            description: Limits how many top-scoring documents are collected in the sample processed on each shard.
            default: 100
            type: number
          field:
            description: The field used to provide values used for de-duplication.
            allOf:
            - $ref: '#/components/schemas/_types.Field'
      x-model: true
    _types.aggregations.ExtendedBoundsdouble:
      type: object
      properties:
        max:
          description: Maximum value for the bound.
          type: number
        min:
          description: Minimum value for the bound.
          type: number
    _types.mapping.HistogramProperty:
      allOf:
      - $ref: '#/components/schemas/_types.mapping.PropertyBase'
      - type: object
        properties:
          ignore_malformed:
            type: boolean
          time_series_metric:
            allOf:
            - $ref: '#/components/schemas/_types.mapping.TimeSeriesMetricType'
          type:
            type: string
            enum:
            - histogram
        required:
        - type
    indices._types.NumericFielddata:
      type: object
      properties:
        format:
          allOf:
          - $ref: '#/components/schemas/indices._types.NumericFielddataFormat'
      required:
      - format
  parameters:
    ingest.get_pipeline-id:
      in: path
      name: id
      description: 'Comma-separated list of pipeline IDs to retrieve.

        Wildcard (`*`) expressions are supported.

        To get all ingest pipelines, omit this parameter or use `*`.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Id'
      style: simple
    simulate.ingest-pipeline:
      in: query
      name: pipeline
      description: 'The pipeline to use as the default pipeline.

        This value can be used to override the default pipeline of the index.'
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.PipelineName'
      style: form
    ingest.get_geoip_database-id:
      in: path
      name: id
      description: 'A comma-separated list of database configuration IDs to retrieve.

        Wildcard (`*`) expressions are supported.

        To get all database configurations, omit this parameter or use `*`.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Ids'
      style: simple
    ingest.simulate-id:
      in: path
      name: id
      description: 'The pipeline to test.

        If you don''t specify a `pipeline` in the request body, this parameter is required.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Id'
      style: simple
    ingest.get_pipeline-summary:
      in: query
      name: summary
      description: Return pipelines without their definitions
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    ingest.get_pipeline-master_timeout:
      in: query
      name: master_timeout
      description: 'Period to wait for a connection to the master node.

        If no response is received before the timeout expires, the request fails and returns an error.'
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    simulate.ingest-index:
      in: path
      name: index
      description: 'The index to simulate ingesting into.

        This value can be overridden by specifying an index on each document.

        If you specify this parameter in the request path, it is used for any documents that do not explicitly specify an index argument.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.IndexName'
      style: simple
    ingest.get_ip_location_database-id:
      in: path
      name: id
      description: 'Comma-separated list of database configuration IDs to retrieve.

        Wildcard (`*`) expressions are supported.

        To get all database configurations, omit this parameter or use `*`.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Ids'
      style: simple
    simulate.ingest-merge_type:
      in: query
      name: merge_type
      description: 'The mapping merge type if mapping overrides are being provided in mapping_addition.

        The allowed values are one of index or template.

        The index option merges mappings the way they would be merged into an existing index.

        The template option merges mappings the way they would be merged into a template.'
      deprecated: false
      schema:
        default: index
        allOf:
        - $ref: '#/components/schemas/simulate.ingest.MergeType'
      style: form
    ingest.simulate-verbose:
      in: query
      name: verbose
      description: If `true`, the response includes output data for each processor in the executed pipeline.
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
  responses:
    simulate.ingest-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              docs:
                type: array
                items:
                  $ref: '#/components/schemas/simulate.ingest.SimulateIngestDocumentResult'
            required:
            - docs
          examples:
            SimulateIngestResponseExample1:
              summary: Use an existing pipeline definition
              description: A successful response when the simulation uses pipeline definitions that are already in the system.
              value: "{\n  \"docs\": [\n    {\n      \"doc\": null,\n      \"_id\": 123,\n      \"_index\": \"my-index\",\n      \"_version\": -3,\n      \"_source\": {\n        \"field1\": \"value1\",\n        \"field2\": \"value2\",\n        \"foo\": \"bar\"\n      },\n      \"executed_pipelines\": [\n        \"my-pipeline\",\n        \"my-final-pipeline\"\n      ]\n    },\n    {\n      \"doc\": null,\n      \"_id\": 456,\n      \"_index\": \"my-index\",\n      \"_version\": \"-3,\",\n      \"_source\": {\n        \"field1\": \"value1\",\n        \"field2\": \"value2\",\n        \"foo\": \"rab\"\n      },\n      \"executed_pipelines\": [\n        \"my-pipeline\",\n        \"my-final-pipeline\"\n      ]\n    }\n  ]\n}"
            SimulateIngestResponseExample2:
              summary: Use pipeline substitutions
              description: A successful response when the simulation uses pipeline substitutions.
              value: "{\n  \"docs\": [\n    {\n      \"doc\": null,\n      \"_id\": 123,\n      \"_index\": \"my-index\",\n      \"_version\": -3,\n      \"_source\": {\n        \"field2\": \"value2\",\n        \"foo\": \"BAR\"\n      },\n      \"executed_pipelines\": [\n        \"my-pipeline\",\n        \"my-final-pipeline\"\n      ]\n    },\n    {\n      \"doc\": null,\n      \"_id\": 456,\n      \"_index\": \"my-index\",\n      \"_version\": -3,\n      \"_source\": {\n        \"field2\": \"value2\",\n        \"foo\": \"RAB\"\n      },\n      \"executed_pipelines\": [\n        \"my-pipeline\",\n        \"my-final-pipeline\"\n      ]\n    }\n  ]\n}"
            SimulateIngestResponseExample3:
              summary: Use pipeline substitutions
              description: A successful response when the simulation uses pipeline substitutions.
              value: "{\n  \"docs\": [\n    {\n      \"doc\": {\n        \"_id\": \"123\",\n        \"_index\": \"my-index\",\n        \"_version\": -3,\n        \"_source\": {\n          \"foo\": \"foo\"\n        },\n        \"executed_pipelines\": [],\n        \"effective_mapping\": {\n          \"_doc\": {\n            \"properties\": {\n              \"foo\": {\n                \"type\": \"keyword\"\n              }\n            }\n          }\n        }\n      }\n    },\n    {\n      \"doc\": {\n        \"_id\": \"456\",\n        \"_index\": \"my-index\",\n        \"_version\": -3,\n        \"_source\": {\n          \"bar\": \"rab\"\n        },\n      \"executed_pipelines\": [],\n        \"effective_mapping\": {\n          \"_doc\": {\n            \"properties\": {\n              \"bar\": {\n                \"type\": \"keyword\"\n              }\n            }\n          }\n        }\n      }\n    }\n  ]\n}"
    ingest.get_ip_location_database-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              databases:
                type: array
                items:
                  $ref: '#/components/schemas/ingest.get_ip_location_database.DatabaseConfigurationMetadata'
            required:
            - databases
    ingest.get_pipeline-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/ingest._types.Pipeline'
          examples:
            GetPipelineResponseExample1:
              description: A successful response for retrieving information about an ingest pipeline.
              value: "{\n  \"my-pipeline-id\" : {\n    \"description\" : \"describe pipeline\",\n    \"version\" : 123,\n    \"processors\" : [\n      {\n        \"set\" : {\n          \"field\" : \"foo\",\n          \"value\" : \"bar\"\n        }\n      }\n    ],\n    \"created_date\" : \"2024-01-01T12:00:00.000Z\",\n    \"created_date_millis\" : 1704110400000,\n    \"modified_date\" : \"2025-01-01T12:00:00.000Z\",\n    \"modified_date_millis\" : 1735732800000\n  }\n}"
    ingest.get_geoip_database-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              databases:
                type: array
                items:
                  $ref: '#/components/schemas/ingest.get_geoip_database.DatabaseConfigurationMetadata'
            required:
            - databases
    ingest.simulate-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              docs:
                type: array
                items:
                  $ref: '#/components/schemas/ingest._types.SimulateDocumentResult'
            required:
            - docs
          examples:
            SimulatePipelineResponseExample1:
              description: A successful response for running an ingest pipeline against a set of provided documents.
              value: "{\n   \"docs\": [\n      {\n         \"doc\": {\n            \"_id\": \"id\",\n            \"_index\": \"index\",\n            \"_version\": \"-3\",\n            \"_source\": {\n               \"field2\": \"_value\",\n               \"foo\": \"bar\"\n            },\n            \"_ingest\": {\n               \"timestamp\": \"2017-05-04T22:30:03.187Z\"\n            }\n         }\n      },\n      {\n         \"doc\": {\n            \"_id\": \"id\",\n            \"_index\": \"index\",\n            \"_version\": \"-3\",\n            \"_source\": {\n               \"field2\": \"_value\",\n               \"foo\": \"rab\"\n            },\n            \"_ingest\": {\n               \"timestamp\": \"2017-05-04T22:30:03.188Z\"\n            }\n         }\n      }\n   ]\n}"
  requestBodies:
    ingest.simulate:
      content:
        application/json:
          schema:
            type: object
            properties:
              docs:
                description: Sample documents to test in the pipeline.
                type: array
                items:
                  $ref: '#/components/schemas/ingest._types.Document'
              pipeline:
                description: 'The pipeline to test.

                  If you don''t specify the `pipeline` request path parameter, this parameter is required.

                  If you specify both this and the request path parameter, the API only uses the request path parameter.'
                allOf:
                - $ref: '#/components/schemas/ingest._types.Pipeline'
            required:
            - docs
          examples:
            SimulatePipelineRequestExample1:
              summary: Run an ingest pipeline against a set of provided documents.
              description: You can specify the used pipeline either in the request body or as a path parameter.
              value: "{\n  \"pipeline\" :\n  {\n    \"description\": \"_description\",\n    \"processors\": [\n      {\n        \"set\" : {\n          \"field\" : \"field2\",\n          \"value\" : \"_value\"\n        }\n      }\n    ]\n  },\n  \"docs\": [\n    {\n      \"_index\": \"index\",\n      \"_id\": \"id\",\n      \"_source\": {\n        \"foo\": \"bar\"\n      }\n    },\n    {\n      \"_index\": \"index\",\n      \"_id\": \"id\",\n      \"_source\": {\n        \"foo\": \"rab\"\n      }\n    }\n  ]\n}"
      required: true
    simulate.ingest:
      content:
        application/json:
          schema:
            type: object
            properties:
              docs:
                description: Sample documents to test in the pipeline.
                type: array
                items:
                  $ref: '#/components/schemas/ingest._types.Document'
              component_template_substitutions:
                description: A map of component template names to substitute component template definition objects.
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/cluster._types.ComponentTemplateNode'
              index_template_substitutions:
                description: A map of index template names to substitute index template definition objects.
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/indices._types.IndexTemplate'
              mapping_addition:
                allOf:
                - $ref: '#/components/schemas/_types.mapping.TypeMapping'
              pipeline_substitutions:
                description: 'Pipelines to test.

                  If you don’t specify the `pipeline` request path parameter, this parameter is required.

                  If you specify both this and the request path parameter, the API only uses the request path parameter.'
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ingest._types.Pipeline'
            required:
            - docs
          examples:
            SimulateIngestRequestExample1:
              summary: Existing pipeline definitions
              description: In this example the index `my-index` has a default pipeline called `my-pipeline` and a final pipeline called `my-final-pipeline`. Since both documents are being ingested into `my-index`, both pipelines are run using the pipeline definitions that are already in the system.
              value: "{\n  \"docs\": [\n    {\n      \"_id\": \"123\",\n      \"_index\": \"my-index\",\n      \"_source\": {\n        \"foo\": \"bar\"\n      }\n    },\n    {\n      \"_id\": \"456\",\n      \"_index\": \"my-index\",\n      \"_source\": {\n        \"foo\": \"rab\"\n      }\n    }\n  ]\n}"
            SimulateIngestRequestExample2:
              summary: Pipeline substitions
              description: In this example the index `my-index` has a default pipeline called `my-pipeline` and a final pipeline called `my-final-pipeline`. But a substitute definition of `my-pipeline` is provided in `pipeline_substitutions`. The substitute `my-pipeline` will be used in place of the `my-pipeline` that is in the system, and then the `my-final-pipeline` that is already defined in the system will run.
              value: "{\n  \"docs\": [\n    {\n      \"_index\": \"my-index\",\n      \"_id\": \"123\",\n      \"_source\": {\n        \"foo\": \"bar\"\n      }\n    },\n    {\n      \"_index\": \"my-index\",\n      \"_id\": \"456\",\n      \"_source\": {\n        \"foo\": \"rab\"\n      }\n    }\n  ],\n  \"pipeline_substitutions\": {\n    \"my-pipeline\": {\n      \"processors\": [\n        {\n          \"uppercase\": {\n            \"field\": \"foo\"\n          }\n        }\n      ]\n    }\n  }\n}"
            SimulateIngestRequestExample3:
              summary: Component template substitutions
              description: 'In this example, imagine that the index `my-index` has a strict mapping with only the `foo` keyword field defined. Say that field mapping came from a component template named `my-mappings-template`. You want to test adding a new field, `bar`. So a substitute definition of `my-mappings-template` is provided in `component_template_substitutions`. The substitute `my-mappings-template` will be used in place of the existing mapping for `my-index` and in place of the `my-mappings-template` that is in the system.

                '
              value: "{\n  \"docs\": [\n    {\n      \"_index\": \"my-index\",\n      \"_id\": \"123\",\n      \"_source\": {\n        \"foo\": \"foo\"\n      }\n    },\n    {\n      \"_index\": \"my-index\",\n      \"_id\": \"456\",\n      \"_source\": {\n        \"bar\": \"rab\"\n      }\n    }\n  ],\n  \"component_template_substitutions\": {\n    \"my-mappings_template\": {\n      \"template\": {\n        \"mappings\": {\n          \"dynamic\": \"strict\",\n          \"properties\": {\n            \"foo\": {\n              \"type\": \"keyword\"\n            },\n            \"bar\": {\n              \"type\": \"keyword\"\n            }\n          }\n        }\n      }\n    }\n  }\n}"
            SimulateIngestRequestExample4:
              summary: Multiple substitutions
              description: The pipeline, component template, and index template substitutions replace the existing pipeline details for the duration of this request.
              value: "{\n  \"docs\": [\n    {\n      \"_id\": \"id\",\n      \"_index\": \"my-index\",\n      \"_source\": {\n        \"foo\": \"bar\"\n      }\n    },\n    {\n      \"_id\": \"id\",\n      \"_index\": \"my-index\",\n      \"_source\": {\n        \"foo\": \"rab\"\n      }\n    }\n  ],\n  \"pipeline_substitutions\": {\n    \"my-pipeline\": {\n      \"processors\": [\n        {\n          \"set\": {\n            \"field\": \"field3\",\n            \"value\": \"value3\"\n          }\n        }\n      ]\n    }\n  },\n  \"component_template_substitutions\": {\n    \"my-component-template\": {\n      \"template\": {\n        \"mappings\": {\n          \"dynamic\": true,\n          \"properties\": {\n            \"field3\": {\n              \"type\": \"keyword\"\n            }\n          }\n        },\n        \"settings\": {\n          \"index\": {\n            \"default_pipeline\": \"my-pipeline\"\n          }\n        }\n      }\n    }\n  },\n  \"index_template_substitutions\": {\n    \"my-index-template\": {\n      \"index_patterns\": [\n        \"my-index-*\"\n      ],\n      \"composed_of\": [\n        \"component_template_1\",\n        \"component_template_2\"\n      ]\n    }\n  },\n  \"mapping_addition\": {\n    \"dynamic\": \"strict\",\n    \"properties\": {\n      \"foo\": {\n        \"type\": \"keyword\"\n      }\n    }\n  }\n}"
      required: true
  securitySchemes:
    apiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
      description: "Elasticsearch APIs support key-based authentication.\nYou must create an API key and use the encoded value in the request header.\nFor example:\n\n\n```\ncurl -X GET \"${ES_URL}/_cat/indices?v=true\" \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n```\n\nTo get API keys, use the `/_security/api_key` APIs.\n"
    basicAuth:
      scheme: basic
      type: http
    bearerAuth:
      scheme: bearer
      type: http
      description: 'Elasticsearch APIs support the use of bearer tokens in the `Authorization` HTTP header to authenticate with the API.

        For examples, refer to [Token-based authentication services](https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/token-based-authentication-services)

        '
