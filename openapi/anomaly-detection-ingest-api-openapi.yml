          default: 0
          x-state: Generally available; Added in 9.2.0
          type: number
        bits:
          description: 'Only applicable to `bbq_disk`. The number of bits per dimension for quantization encoding.

            Valid values are `1`, `2`, `4`, or `7`. When no `rescore_vector` is explicitly set,

            the default oversampling is automatically adjusted based on the bits value.

            This setting can be changed without reindexing.'
          default: 1
          x-state: Generally available; Added in 9.4.0
          type: number
        precondition:
          description: 'Only applicable to `bbq_disk`. When `true`, transforms indexed vectors using a random orthogonal

