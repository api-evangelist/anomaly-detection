    _global.search._types.HighlightBase:
      type: object
      properties:
        type:
          description: "\n\nSupported values include:\n  - `plain`: The `plain` highlighter uses the standard Lucene highlighter\n  - `fvh`: The fvh highlighter uses the Lucene Fast Vector highlighter.\n  - `unified`: The unified highlighter uses the Lucene Unified Highlighter.\n\n"
          allOf:
          - $ref: '#/components/schemas/_global.search._types.HighlighterType'
        boundary_chars:
          description: A string that contains each boundary character.
          default: .,!? \t\n
          type: string
        boundary_max_scan:
          description: How far to scan for boundary characters.
          default: 20
          type: number
        boundary_scanner:
          description: "Specifies how to break the highlighted fragments: chars, sentence, or word.\nOnly valid for the unified and fvh highlighters.\nDefaults to `sentence` for the `unified` highlighter. Defaults to `chars` for the `fvh` highlighter.\n\nSupported values include:\n  - `chars`: Use the characters specified by `boundary_chars` as highlighting boundaries.\nThe `boundary_max_scan` setting controls how far to scan for boundary characters.\nOnly valid for the `fvh` highlighter.\n  - `sentence`: Break highlighted fragments at the next sentence boundary, as determined by Java’s `BreakIterator`.\nYou can specify the locale to use with `boundary_scanner_locale`.\nWhen used with the `unified` highlighter, the `sentence` scanner splits sentences bigger than `fragment_size` at the first word boundary next to fragment_size.\nYou can set `fragment_size` to `0` to never split any sentence.\n  - `word`: Break highlighted fragments at the next word boundary, as determined by Java’s `BreakIterator`.\nYou can specify the locale to use with `boundary_scanner_locale`.\n\n"
          allOf:
          - $ref: '#/components/schemas/_global.search._types.BoundaryScanner'
        boundary_scanner_locale:
          description: 'Controls which locale is used to search for sentence and word boundaries.

            This parameter takes a form of a language tag, for example: `"en-US"`, `"fr-FR"`, `"ja-JP"`.'
          default: Locale.ROOT
          type: string
        force_source:
          deprecated: true
          type: boolean
        fragmenter:
          description: 'Specifies how text should be broken up in highlight snippets: `simple` or `span`.

            Only valid for the `plain` highlighter.'
          default: span
          allOf:
          - $ref: '#/components/schemas/_global.search._types.HighlighterFragmenter'
        fragment_size:
          description: The size of the highlighted fragment in characters.
          default: 100
          type: number
        highlight_filter:
          type: boolean
        highlight_query:
          description: 'Highlight matches for a query other than the search query.

            This is especially useful if you use a rescore query because those are not taken into account by highlighting by default.'
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
        max_fragment_length:
          type: number
        max_analyzed_offset:
          description: 'If set to a non-negative value, highlighting stops at this defined maximum limit.

            The rest of the text is not processed, thus not highlighted and no error is returned

            The `max_analyzed_offset` query setting does not override the `index.highlight.max_analyzed_offset` setting, which prevails when it’s set to lower value than the query setting.'
          type: number
        no_match_size:
          description: The amount of text you want to return from the beginning of the field if there are no matching fragments to highlight.
          default: 0
          type: number
        number_of_fragments:
          description: 'The maximum number of fragments to return.

            If the number of fragments is set to `0`, no fragments are returned.

            Instead, the entire field contents are highlighted and returned.

            This can be handy when you need to highlight short texts such as a title or address, but fragmentation is not required.

            If `number_of_fragments` is `0`, `fragment_size` is ignored.'
          default: 5
          type: number
        options:
          type: object
          additionalProperties:
            type: object
        order:
          description: 'Sorts highlighted fragments by score when set to `score`.

            By default, fragments will be output in the order they appear in the field (order: `none`).

            Setting this option to `score` will output the most relevant fragments first.

            Each highlighter applies its own logic to compute relevancy scores.'
          default: none
          allOf:
          - $ref: '#/components/schemas/_global.search._types.HighlighterOrder'
        phrase_limit:
          description: 'Controls the number of matching phrases in a document that are considered.

            Prevents the `fvh` highlighter from analyzing too many phrases and consuming too much memory.

            When using `matched_fields`, `phrase_limit` phrases per matched field are considered. Raising the limit increases query time and consumes more memory.

            Only supported by the `fvh` highlighter.'
          default: 256
          type: number
        post_tags:
          description: 'Use in conjunction with `pre_tags` to define the HTML tags to use for the highlighted text.

            By default, highlighted text is wrapped in `<em>` and `</em>` tags.'
          type: array
          items:
            type: string
        pre_tags:
          description: 'Use in conjunction with `post_tags` to define the HTML tags to use for the highlighted text.

            By default, highlighted text is wrapped in `<em>` and `</em>` tags.'
          type: array
          items:
            type: string
        require_field_match:
          description: 'By default, only fields that contains a query match are highlighted.

            Set to `false` to highlight all fields.'
          default: true
          type: boolean
        tags_schema:
          description: Set to `styled` to use the built-in tag schema.
          allOf:
          - $ref: '#/components/schemas/_global.search._types.HighlighterTagsSchema'
    _types.mapping.CountedKeywordProperty:
      allOf:
