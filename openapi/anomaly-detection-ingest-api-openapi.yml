          additionalProperties:
            $ref: '#/components/schemas/_types.query_dsl.TermQuery'
          minProperties: 1
          maxProperties: 1
        terms:
          externalDocs:
            url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-terms-query
          description: 'Returns documents that contain one or more exact terms in a provided field.

            To return a document, one or more terms must exactly match a field value, including whitespace and capitalization.'
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.TermsQuery'
        terms_set:
          externalDocs:
            url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-terms-set-query
          description: 'Returns documents that contain a minimum number of exact terms in a provided field.

