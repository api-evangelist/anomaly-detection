            allOf:
            - $ref: '#/components/schemas/_types.aggregations.BucketSortAggregation'
          bucket_count_ks_test:
            externalDocs:
              url: https://www.elastic.co/docs/reference/aggregations/search-aggregations-bucket-count-ks-test-aggregation
