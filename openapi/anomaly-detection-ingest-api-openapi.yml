          maxProperties: 1
        knn:
          externalDocs:
            url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-knn-query
          description: 'Finds the k nearest vectors to a query vector, as measured by a similarity

            metric. knn query finds nearest vectors through approximate search on indexed

            dense_vectors.'
          allOf:
          - $ref: '#/components/schemas/_types.KnnQuery'
        kql:
          externalDocs:
            url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-kql-query
          description: 'Returns documents matching a provided Kibana Query Language (KQL) expression.

            The expression is parsed and rewritten into standard Query DSL.'
          x-state: Generally available; Added in 9.0.0
