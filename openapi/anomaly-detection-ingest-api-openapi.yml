            - type: array
              items:
                type: string
          match_mapping_type:
            oneOf:
            - type: string
            - type: array
              items:
                type: string
          unmatch_mapping_type:
            oneOf:
            - type: string
            - type: array
              items:
                type: string
          match_pattern:
            allOf:
            - $ref: '#/components/schemas/_types.mapping.MatchType'
      - type: object
        properties:
          mapping:
            allOf:
            - $ref: '#/components/schemas/_types.mapping.Property'
