            allOf:
            - $ref: '#/components/schemas/_types.aggregations.TimeSeriesAggregation'
          top_hits:
            externalDocs:
              url: https://www.elastic.co/docs/reference/aggregations/search-aggregations-metrics-top-hits-aggregation
