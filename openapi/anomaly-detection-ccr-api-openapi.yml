        name: index
        description: Name of the follow index to resume following
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.IndexName'
        style: simple
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node.
