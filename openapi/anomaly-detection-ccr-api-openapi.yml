openapi: 3.2.0
info:
  title: Elasticsearch Ccr API
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the `main` branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: Ccr
  x-displayName: Cross-cluster replication
  description: The cross-cluster replication (CCR) APIs let you run replication operations, such as creating and managing follower indices or auto-follow patterns. Use CCR to replicate indices across clusters to maintain search availability during outages, reduce indexing impact, and lower search latency by serving requests closer to users.
  externalDocs:
    description: Learn more about cross-cluster replication.
    url: https://www.elastic.co/docs/deploy-manage/tools/cross-cluster-replication
paths:
  /_ccr/auto_follow/{name}:
    get:
      tags:
      - Ccr
      summary: Get auto-follow patterns
      description: '**All methods and paths for this operation:**


        GET

        /_ccr/auto_follow


        GET

        /_ccr/auto_follow/{name}


        Get cross-cluster replication auto-follow patterns.


        ## Required authorization


        * Cluster privileges: `manage_ccr`'
      externalDocs:
        description: More about auto-follow patterns
        url: https://www.elastic.co/docs/deploy-manage/tools/cross-cluster-replication/manage-auto-follow-patterns
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/ccr-get-auto-follow-pattern.html
      operationId: ccr-get-auto-follow-pattern
      parameters:
      - $ref: '#/components/parameters/ccr.get_auto_follow_pattern-name'
      - $ref: '#/components/parameters/ccr.get_auto_follow_pattern-master_timeout'
      responses:
        '200':
          $ref: '#/components/responses/ccr.get_auto_follow_pattern-200'
      x-state: Generally available; Added in 6.5.0
      x-codeSamples:
      - lang: Console
        source: 'GET /_ccr/auto_follow/my_auto_follow_pattern

          '
      - lang: Python
        source: "resp = client.ccr.get_auto_follow_pattern(\n    name=\"my_auto_follow_pattern\",\n)"
      - lang: JavaScript
        source: "const response = await client.ccr.getAutoFollowPattern({\n  name: \"my_auto_follow_pattern\",\n});"
      - lang: Ruby
        source: "response = client.ccr.get_auto_follow_pattern(\n  name: \"my_auto_follow_pattern\"\n)"
      - lang: PHP
        source: "$resp = $client->ccr()->getAutoFollowPattern([\n    \"name\" => \"my_auto_follow_pattern\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ccr/auto_follow/my_auto_follow_pattern"'
      - lang: C#
        source: "var response = await client.CrossClusterReplication\n    .GetAutoFollowPatternAsync(d1 => d1\n        .Name(\"my_auto_follow_pattern\")\n    );"
      - lang: Java
        source: "client.ccr().getAutoFollowPattern(g -> g\n    .name(\"my_auto_follow_pattern\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    put:
      tags:
      - Ccr
      summary: Create or update auto-follow patterns
      description: 'Create a collection of cross-cluster replication auto-follow patterns for a remote cluster.

        Newly created indices on the remote cluster that match any of the patterns are automatically configured as follower indices.

        Indices on the remote cluster that were created before the auto-follow pattern was created will not be auto-followed even if they match the pattern.


        This API can also be used to update auto-follow patterns.

        NOTE: Follower indices that were configured automatically before updating an auto-follow pattern will remain unchanged even if they do not match against the new patterns.'
      externalDocs:
        description: More about auto-follow patterns
        url: https://www.elastic.co/docs/deploy-manage/tools/cross-cluster-replication/manage-auto-follow-patterns
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/ccr-put-auto-follow-pattern.html
      operationId: ccr-put-auto-follow-pattern
      parameters:
      - in: path
        name: name
        description: The name of the collection of auto-follow patterns.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remote_cluster:
                  description: The remote cluster containing the leader indices to match against.
                  type: string
                follow_index_pattern:
                  description: The name of follower index. The template {{leader_index}} can be used to derive the name of the follower index from the name of the leader index. When following a data stream, use {{leader_index}}; CCR does not support changes to the names of a follower data stream’s backing indices.
                  allOf:
                  - $ref: '#/components/schemas/_types.IndexPattern'
                leader_index_patterns:
                  description: An array of simple index patterns to match against indices in the remote cluster specified by the remote_cluster field.
                  allOf:
                  - $ref: '#/components/schemas/_types.IndexPatterns'
                leader_index_exclusion_patterns:
                  description: An array of simple index patterns that can be used to exclude indices from being auto-followed. Indices in the remote cluster whose names are matching one or more leader_index_patterns and one or more leader_index_exclusion_patterns won’t be followed.
                  allOf:
                  - $ref: '#/components/schemas/_types.IndexPatterns'
                max_outstanding_read_requests:
                  description: The maximum number of outstanding reads requests from the remote cluster.
                  default: 12
                  type: number
                settings:
                  description: Settings to override from the leader index. Note that certain settings can not be overrode (e.g., index.number_of_shards).
                  type: object
                  additionalProperties:
                    type: object
                max_outstanding_write_requests:
                  description: The maximum number of outstanding reads requests from the remote cluster.
                  default: 9
                  type: number
                read_poll_timeout:
                  description: The maximum time to wait for new operations on the remote cluster when the follower index is synchronized with the leader index. When the timeout has elapsed, the poll for operations will return to the follower so that it can update some statistics. Then the follower will immediately attempt to read from the leader again.
                  default: 1m
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                max_read_request_operation_count:
                  description: The maximum number of operations to pull per read from the remote cluster.
                  default: 5120
                  type: number
                max_read_request_size:
                  description: The maximum size in bytes of per read of a batch of operations pulled from the remote cluster.
                  default: 32mb
                  allOf:
                  - $ref: '#/components/schemas/_types.ByteSize'
                max_retry_delay:
                  description: The maximum time to wait before retrying an operation that failed exceptionally. An exponential backoff strategy is employed when retrying.
                  default: 500ms
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                max_write_buffer_count:
                  description: The maximum number of operations that can be queued for writing. When this limit is reached, reads from the remote cluster will be deferred until the number of queued operations goes below the limit.
                  default: 2147483647
                  type: number
                max_write_buffer_size:
                  description: The maximum total bytes of operations that can be queued for writing. When this limit is reached, reads from the remote cluster will be deferred until the total bytes of queued operations goes below the limit.
                  default: 512mb
                  allOf:
                  - $ref: '#/components/schemas/_types.ByteSize'
                max_write_request_operation_count:
                  description: The maximum number of operations per bulk write request executed on the follower.
                  default: 5120
                  type: number
                max_write_request_size:
                  description: The maximum total bytes of operations per bulk write request executed on the follower.
                  default: 9223372036854775807b
                  allOf:
                  - $ref: '#/components/schemas/_types.ByteSize'
              required:
              - remote_cluster
            examples:
              PutAutoFollowPatternRequestExample1:
                description: 'Run `PUT /_ccr/auto_follow/my_auto_follow_pattern` to creates an auto-follow pattern.

                  '
                value: "{\n  \"remote_cluster\" : \"remote_cluster\",\n  \"leader_index_patterns\" :\n  [\n    \"leader_index*\"\n  ],\n  \"follow_index_pattern\" : \"{{leader_index}}-follower\",\n  \"settings\": {\n    \"index.number_of_replicas\": 0\n  },\n  \"max_read_request_operation_count\" : 1024,\n  \"max_outstanding_read_requests\" : 16,\n  \"max_read_request_size\" : \"1024k\",\n  \"max_write_request_operation_count\" : 32768,\n  \"max_write_request_size\" : \"16k\",\n  \"max_outstanding_write_requests\" : 8,\n  \"max_write_buffer_count\" : 512,\n  \"max_write_buffer_size\" : \"512k\",\n  \"max_retry_delay\" : \"10s\",\n  \"read_poll_timeout\" : \"30s\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
              examples:
                PutAutoFollowPatternResponseExample1:
                  description: A successful response for creating an auto-follow pattern.
                  value: "{\n  \"acknowledged\": true\n}"
      x-state: Generally available; Added in 6.5.0
      x-codeSamples:
      - lang: Console
        source: "PUT /_ccr/auto_follow/my_auto_follow_pattern\n{\n  \"remote_cluster\" : \"remote_cluster\",\n  \"leader_index_patterns\" :\n  [\n    \"leader_index*\"\n  ],\n  \"follow_index_pattern\" : \"{{leader_index}}-follower\",\n  \"settings\": {\n    \"index.number_of_replicas\": 0\n  },\n  \"max_read_request_operation_count\" : 1024,\n  \"max_outstanding_read_requests\" : 16,\n  \"max_read_request_size\" : \"1024k\",\n  \"max_write_request_operation_count\" : 32768,\n  \"max_write_request_size\" : \"16k\",\n  \"max_outstanding_write_requests\" : 8,\n  \"max_write_buffer_count\" : 512,\n  \"max_write_buffer_size\" : \"512k\",\n  \"max_retry_delay\" : \"10s\",\n  \"read_poll_timeout\" : \"30s\"\n}"
      - lang: Python
        source: "resp = client.ccr.put_auto_follow_pattern(\n    name=\"my_auto_follow_pattern\",\n    remote_cluster=\"remote_cluster\",\n    leader_index_patterns=[\n        \"leader_index*\"\n    ],\n    follow_index_pattern=\"{{leader_index}}-follower\",\n    settings={\n        \"index.number_of_replicas\": 0\n    },\n    max_read_request_operation_count=1024,\n    max_outstanding_read_requests=16,\n    max_read_request_size=\"1024k\",\n    max_write_request_operation_count=32768,\n    max_write_request_size=\"16k\",\n    max_outstanding_write_requests=8,\n    max_write_buffer_count=512,\n    max_write_buffer_size=\"512k\",\n    max_retry_delay=\"10s\",\n    read_poll_timeout=\"30s\",\n)"
      - lang: JavaScript
        source: "const response = await client.ccr.putAutoFollowPattern({\n  name: \"my_auto_follow_pattern\",\n  remote_cluster: \"remote_cluster\",\n  leader_index_patterns: [\"leader_index*\"],\n  follow_index_pattern: \"{{leader_index}}-follower\",\n  settings: {\n    \"index.number_of_replicas\": 0,\n  },\n  max_read_request_operation_count: 1024,\n  max_outstanding_read_requests: 16,\n  max_read_request_size: \"1024k\",\n  max_write_request_operation_count: 32768,\n  max_write_request_size: \"16k\",\n  max_outstanding_write_requests: 8,\n  max_write_buffer_count: 512,\n  max_write_buffer_size: \"512k\",\n  max_retry_delay: \"10s\",\n  read_poll_timeout: \"30s\",\n});"
      - lang: Ruby
        source: "response = client.ccr.put_auto_follow_pattern(\n  name: \"my_auto_follow_pattern\",\n  body: {\n    \"remote_cluster\": \"remote_cluster\",\n    \"leader_index_patterns\": [\n      \"leader_index*\"\n    ],\n    \"follow_index_pattern\": \"{{leader_index}}-follower\",\n    \"settings\": {\n      \"index.number_of_replicas\": 0\n    },\n    \"max_read_request_operation_count\": 1024,\n    \"max_outstanding_read_requests\": 16,\n    \"max_read_request_size\": \"1024k\",\n    \"max_write_request_operation_count\": 32768,\n    \"max_write_request_size\": \"16k\",\n    \"max_outstanding_write_requests\": 8,\n    \"max_write_buffer_count\": 512,\n    \"max_write_buffer_size\": \"512k\",\n    \"max_retry_delay\": \"10s\",\n    \"read_poll_timeout\": \"30s\"\n  }\n)"
      - lang: PHP
        source: "$resp = $client->ccr()->putAutoFollowPattern([\n    \"name\" => \"my_auto_follow_pattern\",\n    \"body\" => [\n        \"remote_cluster\" => \"remote_cluster\",\n        \"leader_index_patterns\" => array(\n            \"leader_index*\",\n        ),\n        \"follow_index_pattern\" => \"{{leader_index}}-follower\",\n        \"settings\" => [\n            \"index.number_of_replicas\" => 0,\n        ],\n        \"max_read_request_operation_count\" => 1024,\n        \"max_outstanding_read_requests\" => 16,\n        \"max_read_request_size\" => \"1024k\",\n        \"max_write_request_operation_count\" => 32768,\n        \"max_write_request_size\" => \"16k\",\n        \"max_outstanding_write_requests\" => 8,\n        \"max_write_buffer_count\" => 512,\n        \"max_write_buffer_size\" => \"512k\",\n        \"max_retry_delay\" => \"10s\",\n        \"read_poll_timeout\" => \"30s\",\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"remote_cluster":"remote_cluster","leader_index_patterns":["leader_index*"],"follow_index_pattern":"{{leader_index}}-follower","settings":{"index.number_of_replicas":0},"max_read_request_operation_count":1024,"max_outstanding_read_requests":16,"max_read_request_size":"1024k","max_write_request_operation_count":32768,"max_write_request_size":"16k","max_outstanding_write_requests":8,"max_write_buffer_count":512,"max_write_buffer_size":"512k","max_retry_delay":"10s","read_poll_timeout":"30s"}'' "$ELASTICSEARCH_URL/_ccr/auto_follow/my_auto_follow_pattern"'
      - lang: C#
        source: "var response = await client.CrossClusterReplication\n    .PutAutoFollowPatternAsync(name: \"my_auto_follow_pattern\", d1 => d1\n        .FollowIndexPattern(\"{{leader_index}}-follower\")\n        .LeaderIndexPatterns(\"leader_index*\")\n        .MaxOutstandingReadRequests(16)\n        .MaxOutstandingWriteRequests(8)\n        .MaxReadRequestOperationCount(1024)\n        .MaxReadRequestSize(new ByteSize(\"1024k\"))\n        .MaxRetryDelay(\"10s\")\n        .MaxWriteBufferCount(512)\n        .MaxWriteBufferSize(new ByteSize(\"512k\"))\n        .MaxWriteRequestOperationCount(32768)\n        .MaxWriteRequestSize(new ByteSize(\"16k\"))\n        .ReadPollTimeout(\"30s\")\n        .RemoteCluster(\"remote_cluster\")\n        .Settings(new Dictionary<string, object>()\n        {\n            { \"index.number_of_replicas\", 0 }\n        })\n    );"
      - lang: Java
        source: "client.ccr().putAutoFollowPattern(p -> p\n    .followIndexPattern(\"{{leader_index}}-follower\")\n    .leaderIndexPatterns(\"leader_index*\")\n    .maxOutstandingReadRequests(16)\n    .maxOutstandingWriteRequests(8)\n    .maxReadRequestOperationCount(1024)\n    .maxReadRequestSize(\"1024k\")\n    .maxRetryDelay(m -> m\n        .time(\"10s\")\n    )\n    .maxWriteBufferCount(512)\n    .maxWriteBufferSize(\"512k\")\n    .maxWriteRequestOperationCount(32768)\n    .maxWriteRequestSize(\"16k\")\n    .name(\"my_auto_follow_pattern\")\n    .readPollTimeout(r -> r\n        .time(\"30s\")\n    )\n    .remoteCluster(\"remote_cluster\")\n    .settings(\"index.number_of_replicas\", JsonData.fromJson(\"0\"))\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    delete:
      tags:
      - Ccr
      summary: Delete auto-follow patterns
      description: 'Delete a collection of cross-cluster replication auto-follow patterns.


        ## Required authorization


        * Cluster privileges: `manage_ccr`'
      externalDocs:
        description: More about auto-follow patterns
        url: https://www.elastic.co/docs/deploy-manage/tools/cross-cluster-replication/manage-auto-follow-patterns
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/ccr-delete-auto-follow-pattern.html
      operationId: ccr-delete-auto-follow-pattern
      parameters:
      - in: path
        name: name
        description: The auto-follow pattern collection to delete.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: query
        name: master_timeout
        description: 'The period to wait for a connection to the master node.

          If the master node is not available before the timeout expires, the request fails and returns an error.

          It can also be set to `-1` to indicate that the request should never timeout.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
              examples:
                DeleteAutoFollowPatternResponseExample1:
                  description: A successful response from `DELETE /_ccr/auto_follow/my_auto_follow_pattern`, which deletes an auto-follow pattern.
                  value: "{\n  \"acknowledged\" : true\n}"
      x-state: Generally available; Added in 6.5.0
      x-codeSamples:
      - lang: Console
        source: 'DELETE /_ccr/auto_follow/my_auto_follow_pattern

          '
      - lang: Python
        source: "resp = client.ccr.delete_auto_follow_pattern(\n    name=\"my_auto_follow_pattern\",\n)"
      - lang: JavaScript
        source: "const response = await client.ccr.deleteAutoFollowPattern({\n  name: \"my_auto_follow_pattern\",\n});"
      - lang: Ruby
        source: "response = client.ccr.delete_auto_follow_pattern(\n  name: \"my_auto_follow_pattern\"\n)"
      - lang: PHP
        source: "$resp = $client->ccr()->deleteAutoFollowPattern([\n    \"name\" => \"my_auto_follow_pattern\",\n]);"
      - lang: curl
        source: 'curl -X DELETE -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ccr/auto_follow/my_auto_follow_pattern"'
      - lang: C#
        source: 'var response = await client.CrossClusterReplication.DeleteAutoFollowPatternAsync(name: "my_auto_follow_pattern");'
      - lang: Java
        source: "client.ccr().deleteAutoFollowPattern(d -> d\n    .name(\"my_auto_follow_pattern\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /{index}/_ccr/follow:
    put:
      tags:
      - Ccr
      summary: Create a follower
      description: 'Create a cross-cluster replication follower index that follows a specific leader index.

        When the API returns, the follower index exists and cross-cluster replication starts replicating operations from the leader index to the follower index.'
      operationId: ccr-follow
      parameters:
      - in: path
        name: index
        description: The name of the follower index.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.IndexName'
        style: simple
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: wait_for_active_shards
        description: 'Specifies the number of shards to wait on being active before responding. This defaults to waiting on none of the shards to be

          active.

          A shard must be restored from the leader index before being active. Restoring a follower shard requires transferring all the

          remote Lucene segment files to the follower index.'
        deprecated: false
        schema:
          default: '0'
          allOf:
          - $ref: '#/components/schemas/_types.WaitForActiveShards'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data_stream_name:
                  description: If the leader index is part of a data stream, the name to which the local data stream for the followed index should be renamed.
                  type: string
                leader_index:
                  description: The name of the index in the leader cluster to follow.
                  allOf:
                  - $ref: '#/components/schemas/_types.IndexName'
                max_outstanding_read_requests:
                  description: The maximum number of outstanding reads requests from the remote cluster.
                  type: number
                max_outstanding_write_requests:
                  description: The maximum number of outstanding write requests on the follower.
                  type: number
                max_read_request_operation_count:
                  description: The maximum number of operations to pull per read from the remote cluster.
                  type: number
                max_read_request_size:
                  description: The maximum size in bytes of per read of a batch of operations pulled from the remote cluster.
                  allOf:
                  - $ref: '#/components/schemas/_types.ByteSize'
                max_retry_delay:
                  description: 'The maximum time to wait before retrying an operation that failed exceptionally. An exponential backoff strategy is employed when

                    retrying.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                max_write_buffer_count:
                  description: 'The maximum number of operations that can be queued for writing. When this limit is reached, reads from the remote cluster will be

                    deferred until the number of queued operations goes below the limit.'
                  type: number
                max_write_buffer_size:
                  description: 'The maximum total bytes of operations that can be queued for writing. When this limit is reached, reads from the remote cluster will

                    be deferred until the total bytes of queued operations goes below the limit.'
                  allOf:
                  - $ref: '#/components/schemas/_types.ByteSize'
                max_write_request_operation_count:
                  description: The maximum number of operations per bulk write request executed on the follower.
                  type: number
                max_write_request_size:
                  description: The maximum total bytes of operations per bulk write request executed on the follower.
                  allOf:
                  - $ref: '#/components/schemas/_types.ByteSize'
                read_poll_timeout:
                  description: 'The maximum time to wait for new operations on the remote cluster when the follower index is synchronized with the leader index.

                    When the timeout has elapsed, the poll for operations will return to the follower so that it can update some statistics.

                    Then the follower will immediately attempt to read from the leader again.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                remote_cluster:
                  description: The remote cluster containing the leader index.
                  type: string
                settings:
                  description: Settings to override from the leader index.
                  allOf:
                  - $ref: '#/components/schemas/indices._types.IndexSettings'
              required:
              - leader_index
              - remote_cluster
            examples:
              CreateFollowIndexRequestExample1:
                description: Run `PUT /follower_index/_ccr/follow?wait_for_active_shards=1` to create a follower index named `follower_index`.
                value: "{\n  \"remote_cluster\" : \"remote_cluster\",\n  \"leader_index\" : \"leader_index\",\n  \"settings\": {\n    \"index.number_of_replicas\": 0\n  },\n  \"max_read_request_operation_count\" : 1024,\n  \"max_outstanding_read_requests\" : 16,\n  \"max_read_request_size\" : \"1024k\",\n  \"max_write_request_operation_count\" : 32768,\n  \"max_write_request_size\" : \"16k\",\n  \"max_outstanding_write_requests\" : 8,\n  \"max_write_buffer_count\" : 512,\n  \"max_write_buffer_size\" : \"512k\",\n  \"max_retry_delay\" : \"10s\",\n  \"read_poll_timeout\" : \"30s\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  follow_index_created:
                    type: boolean
                  follow_index_shards_acked:
                    type: boolean
                  index_following_started:
                    type: boolean
                required:
                - follow_index_created
                - follow_index_shards_acked
                - index_following_started
              examples:
                CreateFollowIndexResponseExample1:
                  description: A successful response from `PUT /follower_index/_ccr/follow?wait_for_active_shards=1`.
                  value: "{\n  \"follow_index_created\" : true,\n  \"follow_index_shards_acked\" : true,\n  \"index_following_started\" : true\n}"
      x-state: Generally available; Added in 6.5.0
      x-codeSamples:
      - lang: Console
        source: "PUT /follower_index/_ccr/follow?wait_for_active_shards=1\n{\n  \"remote_cluster\" : \"remote_cluster\",\n  \"leader_index\" : \"leader_index\",\n  \"settings\": {\n    \"index.number_of_replicas\": 0\n  },\n  \"max_read_request_operation_count\" : 1024,\n  \"max_outstanding_read_requests\" : 16,\n  \"max_read_request_size\" : \"1024k\",\n  \"max_write_request_operation_count\" : 32768,\n  \"max_write_request_size\" : \"16k\",\n  \"max_outstanding_write_requests\" : 8,\n  \"max_write_buffer_count\" : 512,\n  \"max_write_buffer_size\" : \"512k\",\n  \"max_retry_delay\" : \"10s\",\n  \"read_poll_timeout\" : \"30s\"\n}"
      - lang: Python
