        repository_started_at:
          description: Time the repository was created or updated. Recorded in milliseconds since the Unix Epoch.
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        repository_stopped_at:
          description: Time the repository was deleted or updated. Recorded in milliseconds since the Unix Epoch.
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        archived:
          description: 'A flag that tells whether or not this object has been archived. When a repository is closed or updated the

            repository metering information is archived and kept for a certain period of time. This allows retrieving the

            repository metering information of previous repository instantiations.'
          type: boolean
        cluster_version:
          description: 'The cluster state version when this object was archived, this field can be used as a logical timestamp to delete

            all the archived metrics up to an observed version. This field is only present for archived repository metering

            information objects. The main purpose of this field is to avoid possible race conditions during repository metering

            information deletions, i.e. deleting archived repositories metering information that we haven’t observed yet.'
          allOf:
          - $ref: '#/components/schemas/_types.VersionNumber'
        request_counts:
          description: An object with the number of request performed against the repository grouped by request type.
          allOf:
          - $ref: '#/components/schemas/nodes._types.RequestCounts'
      required:
