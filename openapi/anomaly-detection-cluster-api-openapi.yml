      schema:
        $ref: '#/components/schemas/nodes.stats.NodeStatsMetrics'
      style: simple
    cluster.health-wait_for_status:
      in: query
      name: wait_for_status
      description: "Wait (until the timeout expires) for the cluster to reach a specific health status (or a better status).\nA green status is better than yellow and yellow is better than red.\nBy default, the request does not wait for a particular status.\n\nSupported values include:\n  - `green` (or `GREEN`): All shards are assigned.\n  - `yellow` (or `YELLOW`): All primary shards are assigned, but one or more replica shards are unassigned. If a node in the cluster fails, some data could be unavailable until that node is repaired.\n  - `red` (or `RED`): One or more primary shards are unassigned, so some data is unavailable. This can occur briefly during cluster startup as primary shards are assigned.\n  - `unknown`\n  - `unavailable`\n\n"
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.HealthStatus'
      style: form
    cluster.state-ignore_unavailable:
      in: query
      name: ignore_unavailable
      description: 'If `false`, the request returns an error if it targets a concrete (non-wildcarded)

        index, alias, or data stream that is missing, closed, or otherwise unavailable.

        If `true`, unavailable concrete targets are silently ignored.'
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    cluster.allocation_explain-include_yes_decisions:
      in: query
      name: include_yes_decisions
      description: If true, returns YES decisions in explanation.
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    nodes.hot_threads-sort:
      in: query
      name: sort
      description: "The sort order for 'cpu' type\n\nSupported values include:\n  - `cpu`: Threads that consume the most CPU time.\n  - `wait`: Threads that have been in a waiting state the longest.\n  - `block`: Threads that have been blocked the longest.\n  - `gpu`: Threads that consume the most GPU time.\n  - `mem`: Threads that allocate the most memory.\n\n"
      deprecated: false
      schema:
        default: total
        allOf:
        - $ref: '#/components/schemas/_types.ThreadType'
      style: form
    cluster.health-timeout:
      in: query
      name: timeout
      description: 'The period to wait for a response.

        If no response is received before the timeout expires, the request fails and returns an error.'
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    nodes.hot_threads-threads:
      in: query
      name: threads
