              description: Run `POST _nodes/reload_secure_settings` to reload the keystore on nodes in the cluster.
              value: "{\n  \"secure_settings_password\": \"keystore-password\"\n}"
    cluster.allocation_explain:
      content:
        application/json:
          schema:
            type: object
            properties:
              index:
                description: The name of the index that you would like an explanation for.
                allOf:
                - $ref: '#/components/schemas/_types.IndexName'
              shard:
                description: An identifier for the shard that you would like an explanation for.
                type: number
              primary:
                description: If true, returns an explanation for the primary shard for the specified shard ID.
                type: boolean
              current_node:
                description: Explain a shard only if it is currently located on the specified node name or node ID.
                allOf:
                - $ref: '#/components/schemas/_types.NodeId'
          examples:
            ClusterAllocationExplainRequestExample1:
              summary: All parameters in the request body
              description: Run `GET _cluster/allocation/explain` to get an explanation for a shard's current allocation.
              value: "{\n  \"index\": \"my-index-000001\",\n  \"shard\": 0,\n  \"primary\": false,\n  \"current_node\": \"my-node\"\n}"
            ClusterAllocationExplainRequestExample2:
              summary: Query Parameters
              description: 'Run `GET _cluster/allocation/explain?index=my-index-000001&shard=0&primary=false&current_node=my-node` to get an explanation for a shard''s current allocation. No parameters are required in the request body

                '
