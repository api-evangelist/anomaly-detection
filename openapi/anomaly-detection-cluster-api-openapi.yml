    nodes._types.IngestStats:
      type: object
      properties:
        count:
          description: Total number of documents ingested during the lifetime of this node.
          type: number
        current:
          description: Total number of documents currently being ingested.
          type: number
        failed:
          description: Total number of failed ingest operations during the lifetime of this node.
          type: number
        processors:
          description: Total number of ingest processors.
          type: array
          items:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/nodes._types.KeyedProcessor'
        time:
          description: Total time spent preprocessing ingest documents during the lifetime of this node.
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        time_in_millis:
          description: Total time, in milliseconds, spent preprocessing ingest documents during the lifetime of this node.
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitMillis'
        ingested_as_first_pipeline:
          description: 'Total size of all documents ingested by the pipeline.

            The value counts documents for which this pipeline was the first to process them; for pipelines that are not the first to process a document (for example, a final pipeline after a default pipeline, a pipeline run after a reroute processor, or a pipeline invoked by a pipeline processor), the value is `0`.'
          x-state: Generally available; Added in 8.15.0
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        ingested_as_first_pipeline_in_bytes:
          description: 'Total number of bytes of all documents ingested by the pipeline.

            The value counts documents for which this pipeline was the first to process them; for pipelines that are not the first to process a document, the value is `0`.'
          x-state: Generally available; Added in 8.15.0
          type: number
        produced_as_first_pipeline:
          description: 'Total size of all documents produced by the pipeline.

            The value counts documents for which this pipeline was the first to process them; for pipelines that are not the first to process a document, the value is `0`.

            In situations where there are subsequent pipelines, the value represents the size of the document after all pipelines have run.'
          x-state: Generally available; Added in 8.15.0
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        produced_as_first_pipeline_in_bytes:
          description: 'Total number of bytes of all documents produced by the pipeline.

            The value counts documents for which this pipeline was the first to process them; for pipelines that are not the first to process a document, the value is `0`.

            In situations where there are subsequent pipelines, the value represents the size of the document after all pipelines have run.'
          x-state: Generally available; Added in 8.15.0
          type: number
      required:
      - count
      - current
      - failed
      - processors
      - time_in_millis
      - ingested_as_first_pipeline_in_bytes
      - produced_as_first_pipeline_in_bytes
