  /_cluster/reroute:
    post:
      tags:
      - Cluster
      summary: Reroute the cluster
      description: 'Manually change the allocation of individual shards in the cluster.

        For example, a shard can be moved from one node to another explicitly, an allocation can be canceled, and an unassigned shard can be explicitly allocated to a specific node.


        It is important to note that after processing any reroute commands Elasticsearch will perform rebalancing as normal (respecting the values of settings such as `cluster.routing.rebalance.enable`) in order to remain in a balanced state.

        For example, if the requested allocation includes moving a shard from node1 to node2 then this may cause a shard to be moved from node2 back to node1 to even things out.


        The cluster can be set to disable allocations using the `cluster.routing.allocation.enable` setting.

        If allocations are disabled then the only allocations that will be performed are explicit ones given using the reroute command, and consequent allocations due to rebalancing.


        The cluster will attempt to allocate a shard a maximum of `index.allocation.max_retries` times in a row (defaults to `5`), before giving up and leaving the shard unallocated.

        This scenario can be caused by structural problems such as having an analyzer which refers to a stopwords file which doesn’t exist on all nodes.


        Once the problem has been corrected, allocation can be manually retried by calling the reroute API with the `?retry_failed` URI query parameter, which will attempt a single retry round for these shards.'
      operationId: cluster-reroute
      parameters:
      - in: query
        name: dry_run
        description: 'If true, then the request simulates the operation.

          It will calculate the result of applying the commands to the current cluster state and return the resulting cluster state after the commands (and rebalancing) have been applied; it will not actually perform the requested changes.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: explain
        description: If true, then the response contains an explanation of why the commands can or cannot run.
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: metric
        description: Limits the information returned to the specified metrics.
        deprecated: true
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        style: form
      - in: query
        name: retry_failed
        description: If true, then retries allocation of shards that are blocked due to too many subsequent allocation failures.
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: Period to wait for a response. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commands:
                  description: Defines the commands to perform.
                  type: array
                  items:
                    $ref: '#/components/schemas/cluster.reroute.Command'
            examples:
              ClusterRerouteRequestExample1:
                description: Run `POST /_cluster/reroute?metric=none` to changes the allocation of shards in a cluster.
                value: "{\n  \"commands\": [\n    {\n      \"move\": {\n        \"index\": \"test\", \"shard\": 0,\n        \"from_node\": \"node1\", \"to_node\": \"node2\"\n      }\n    },\n    {\n      \"allocate_replica\": {\n        \"index\": \"test\", \"shard\": 1,\n        \"node\": \"node3\"\n      }\n    }\n  ]\n}"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                  explanations:
                    type: array
                    items:
                      $ref: '#/components/schemas/cluster.reroute.RerouteExplanation'
                  state:
                    description: 'There aren''t any guarantees on the output/structure of the raw cluster state.

                      Here you will find the internal representation of the cluster, which can

                      differ from the external representation.'
                    type: object
                required:
                - acknowledged
      x-state: Generally available; Added in 5.0.0
      x-codeSamples:
      - lang: Console
        source: "POST /_cluster/reroute?metric=none\n{\n  \"commands\": [\n    {\n      \"move\": {\n        \"index\": \"test\", \"shard\": 0,\n        \"from_node\": \"node1\", \"to_node\": \"node2\"\n      }\n    },\n    {\n      \"allocate_replica\": {\n        \"index\": \"test\", \"shard\": 1,\n        \"node\": \"node3\"\n      }\n    }\n  ]\n}"
      - lang: Python
        source: "resp = client.cluster.reroute(\n    metric=\"none\",\n    commands=[\n        {\n            \"move\": {\n                \"index\": \"test\",\n                \"shard\": 0,\n                \"from_node\": \"node1\",\n                \"to_node\": \"node2\"\n            }\n        },\n        {\n            \"allocate_replica\": {\n                \"index\": \"test\",\n                \"shard\": 1,\n                \"node\": \"node3\"\n            }\n        }\n    ],\n)"
      - lang: JavaScript
        source: "const response = await client.cluster.reroute({\n  metric: \"none\",\n  commands: [\n    {\n      move: {\n        index: \"test\",\n        shard: 0,\n        from_node: \"node1\",\n        to_node: \"node2\",\n      },\n    },\n    {\n      allocate_replica: {\n        index: \"test\",\n        shard: 1,\n        node: \"node3\",\n      },\n    },\n  ],\n});"
      - lang: Ruby
        source: "response = client.cluster.reroute(\n  metric: \"none\",\n  body: {\n    \"commands\": [\n      {\n        \"move\": {\n          \"index\": \"test\",\n          \"shard\": 0,\n          \"from_node\": \"node1\",\n          \"to_node\": \"node2\"\n        }\n      },\n      {\n        \"allocate_replica\": {\n          \"index\": \"test\",\n          \"shard\": 1,\n          \"node\": \"node3\"\n        }\n      }\n    ]\n  }\n)"
      - lang: PHP
        source: "$resp = $client->cluster()->reroute([\n    \"metric\" => \"none\",\n    \"body\" => [\n        \"commands\" => array(\n            [\n                \"move\" => [\n                    \"index\" => \"test\",\n                    \"shard\" => 0,\n                    \"from_node\" => \"node1\",\n                    \"to_node\" => \"node2\",\n                ],\n            ],\n            [\n                \"allocate_replica\" => [\n                    \"index\" => \"test\",\n                    \"shard\" => 1,\n                    \"node\" => \"node3\",\n                ],\n            ],\n        ),\n    ],\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"commands":[{"move":{"index":"test","shard":0,"from_node":"node1","to_node":"node2"}},{"allocate_replica":{"index":"test","shard":1,"node":"node3"}}]}'' "$ELASTICSEARCH_URL/_cluster/reroute?metric=none"'
      - lang: Java
        source: "client.cluster().reroute(r -> r\n    .commands(List.of(Command.of(c -> c\n            .move(m -> m\n                .index(\"test\")\n                .shard(0)\n                .fromNode(\"node1\")\n                .toNode(\"node2\")\n            )\n        ),Command.of(c -> c\n            .allocateReplica(a -> a\n                .index(\"test\")\n                .shard(1)\n                .node(\"node3\")\n            )\n        )))\n    .metric(\"none\")\n);\n"
