    cluster.allocation_explain-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              allocate_explanation:
                type: string
              allocation_delay:
                allOf:
                - $ref: '#/components/schemas/_types.Duration'
              allocation_delay_in_millis:
                allOf:
                - $ref: '#/components/schemas/_types.DurationValueUnitMillis'
              can_allocate:
                allOf:
                - $ref: '#/components/schemas/cluster.allocation_explain.Decision'
              can_move_to_other_node:
                allOf:
                - $ref: '#/components/schemas/cluster.allocation_explain.Decision'
              can_rebalance_cluster:
                allOf:
                - $ref: '#/components/schemas/cluster.allocation_explain.Decision'
              can_rebalance_cluster_decisions:
                type: array
                items:
                  $ref: '#/components/schemas/cluster.allocation_explain.AllocationDecision'
              can_rebalance_to_other_node:
                allOf:
                - $ref: '#/components/schemas/cluster.allocation_explain.Decision'
              can_remain_decisions:
                type: array
                items:
                  $ref: '#/components/schemas/cluster.allocation_explain.AllocationDecision'
              can_remain_on_current_node:
                allOf:
                - $ref: '#/components/schemas/cluster.allocation_explain.Decision'
              cluster_info:
                allOf:
                - $ref: '#/components/schemas/cluster.allocation_explain.ClusterInfo'
              configured_delay:
                allOf:
                - $ref: '#/components/schemas/_types.Duration'
              configured_delay_in_millis:
                allOf:
                - $ref: '#/components/schemas/_types.DurationValueUnitMillis'
              current_node:
                allOf:
                - $ref: '#/components/schemas/cluster.allocation_explain.CurrentNode'
              current_state:
                type: string
              index:
                allOf:
                - $ref: '#/components/schemas/_types.IndexName'
              move_explanation:
                type: string
              node_allocation_decisions:
                type: array
                items:
                  $ref: '#/components/schemas/cluster.allocation_explain.NodeAllocationExplanation'
              primary:
                type: boolean
              rebalance_explanation:
                type: string
              remaining_delay:
                allOf:
                - $ref: '#/components/schemas/_types.Duration'
              remaining_delay_in_millis:
                allOf:
                - $ref: '#/components/schemas/_types.DurationValueUnitMillis'
              shard:
                type: number
              unassigned_info:
                allOf:
                - $ref: '#/components/schemas/cluster.allocation_explain.UnassignedInformation'
              note:
                x-state: Generally available; Added in 7.14.0
                type: string
            required:
            - current_state
            - index
            - primary
            - shard
          examples:
            ClusterAllocationExplainResponseExample1:
              summary: Conflicting settings
              description: 'An example of an allocation explanation for an unassigned primary shard. In this example, a newly created index has an index setting that requires that it only be allocated to a node named `nonexistent_node`, which does not exist, so the index is unable to allocate.

                '
              value: "{\n  \"index\" : \"my-index-000001\",\n  \"shard\" : 0,\n  \"primary\" : true,\n  \"current_state\" : \"unassigned\",\n  \"unassigned_info\" : {\n    \"reason\" : \"INDEX_CREATED\",\n    \"at\" : \"2017-01-04T18:08:16.600Z\",\n    \"last_allocation_status\" : \"no\"\n  },\n  \"can_allocate\" : \"no\",\n  \"allocate_explanation\" : \"Elasticsearch isn't allowed to allocate this shard to any of the nodes in the cluster. Choose a node to which you expect this shard to be allocated, find this node in the node-by-node explanation, and address the reasons which prevent Elasticsearch from allocating this shard there.\",\n  \"node_allocation_decisions\" : [\n    {\n      \"node_id\" : \"8qt2rY-pT6KNZB3-hGfLnw\",\n      \"node_name\" : \"node-0\",\n      \"transport_address\" : \"127.0.0.1:9401\",\n      \"roles\" : [\"data\", \"data_cold\", \"data_content\", \"data_frozen\", \"data_hot\", \"data_warm\", \"ingest\", \"master\", \"ml\", \"remote_cluster_client\", \"transform\"],\n      \"node_attributes\" : {},\n      \"node_decision\" : \"no\",\n      \"weight_ranking\" : 1,\n      \"deciders\" : [\n        {\n          \"decider\" : \"filter\",\n          \"decision\" : \"NO\",\n          \"explanation\" : \"node does not match index setting [index.routing.allocation.include] filters [_name:\\\"nonexistent_node\\\"]\"\n        }\n      ]\n    }\n  ]\n}"
            ClusterAllocationExplainResponseExample2:
              summary: Maximum retries
              description: 'An example of an allocation explanation for an unassigned primary shard that has reached the maximum number of allocation retry attempts. After the maximum number of retries is reached, Elasticsearch stops attempting to allocate the shard in order to prevent infinite retries which may impact cluster performance.

                '
              value: "{\n  \"index\" : \"my-index-000001\",\n  \"shard\" : 0,\n  \"primary\" : true,\n  \"current_state\" : \"unassigned\",\n  \"unassigned_info\" : {\n    \"at\" : \"2017-01-04T18:03:28.464Z\",\n    \"failed shard on node [mEKjwwzLT1yJVb8UxT6anw]: failed recovery, failure RecoveryFailedException\",\n    \"reason\": \"ALLOCATION_FAILED\",\n    \"failed_allocation_attempts\": 5,\n    \"last_allocation_status\": \"no\",\n  },\n  \"can_allocate\": \"no\",\n  \"allocate_explanation\": \"cannot allocate because allocation is not permitted to any of the nodes\",\n  \"node_allocation_decisions\" : [\n    {\n      \"node_id\" : \"3sULLVJrRneSg0EfBB-2Ew\",\n      \"node_name\" : \"node_t0\",\n      \"transport_address\" : \"127.0.0.1:9400\",\n      \"roles\" : [\"data_content\", \"data_hot\"],\n      \"node_decision\" : \"no\",\n      \"store\" : {\n        \"matching_size\" : \"4.2kb\",\n        \"matching_size_in_bytes\" : 4325\n      },\n      \"deciders\" : [\n        {\n          \"decider\": \"max_retry\",\n          \"decision\" : \"NO\",\n          \"explanation\": \"shard has exceeded the maximum number of retries [5] on failed allocation attempts - manually call [POST /_cluster/reroute?retry_failed] to retry, [unassigned_info[[reason=ALLOCATION_FAILED], at[2024-07-30T21:04:12.166Z], failed_attempts[5], failed_nodes[[mEKjwwzLT1yJVb8UxT6anw]], delayed=false, details[failed shard on node [mEKjwwzLT1yJVb8UxT6anw]: failed recovery, failure RecoveryFailedException], allocation_status[deciders_no]]]\"\n        }\n      ]\n    }\n  ]\n}"
    nodes.reload_secure_settings-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/nodes.reload_secure_settings.ResponseBase'
          examples:
            ReloadSecureSettingsResponseExample1:
              description: A successful response when reloading keystore on nodes in your cluster.
              value: "{\n  \"_nodes\": {\n    \"total\": 1,\n    \"successful\": 1,\n    \"failed\": 0\n  },\n  \"cluster_name\": \"my_cluster\",\n  \"nodes\": {\n    \"pQHNt5rXTTWNvUgOrdynKg\": {\n      \"name\": \"node-0\",\n      \"secure_setting_names\": [\n        \"keystore.seed\",\n        \"xpack.security.transport.ssl.keystore.secure_password\",\n        \"xpack.security.transport.ssl.truststore.secure_password\"\n      ],\n      \"keystore_path\": \"/etc/elasticsearch/elasticsearch.keystore\",\n      \"keystore_digest\": \"031757c262a50abe1b7e017230cdbab99c1be9fbd7116ff504b27a8787158f46\",\n      \"keystore_last_modified_time\": \"2025-12-09T22:06:00.408Z\"\n    }\n  }\n}"
    cluster.health-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cluster.health.HealthResponseBody'
          examples:
            ClusterHealthResponseExample1:
              description: 'A successful response from `GET _cluster/health`. It is the health status of a quiet single node cluster with a single index with one shard and one replica.

                '
              value: "{\n  \"cluster_name\" : \"testcluster\",\n  \"status\" : \"yellow\",\n  \"timed_out\" : false,\n  \"number_of_nodes\" : 1,\n  \"number_of_data_nodes\" : 1,\n  \"active_primary_shards\" : 1,\n  \"active_shards\" : 1,\n  \"relocating_shards\" : 0,\n  \"initializing_shards\" : 0,\n  \"unassigned_shards\" : 1,\n  \"delayed_unassigned_shards\": 0,\n  \"number_of_pending_tasks\" : 0,\n  \"number_of_in_flight_fetch\": 0,\n  \"task_max_waiting_in_queue_millis\": 0,\n  \"active_shards_percent_as_number\": 50.0\n}"
  securitySchemes:
    apiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
      description: "Elasticsearch APIs support key-based authentication.\nYou must create an API key and use the encoded value in the request header.\nFor example:\n\n\n```\ncurl -X GET \"${ES_URL}/_cat/indices?v=true\" \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n```\n\nTo get API keys, use the `/_security/api_key` APIs.\n"
    basicAuth:
      scheme: basic
      type: http
    bearerAuth:
      scheme: bearer
      type: http
      description: 'Elasticsearch APIs support the use of bearer tokens in the `Authorization` HTTP header to authenticate with the API.

        For examples, refer to [Token-based authentication services](https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/token-based-authentication-services)

        '
