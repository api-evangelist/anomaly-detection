    cluster.stats.CCSUsageStats:
      type: object
      properties:
        total:
          description: The total number of cross-cluster search requests that have been executed by the cluster.
          type: number
        success:
          description: The total number of cross-cluster search requests that have been successfully executed by the cluster.
          type: number
        skipped:
          description: The total number of cross-cluster search requests (successful or failed) that had at least one remote cluster skipped.
          type: number
        took:
          description: Statistics about the time taken to execute cross-cluster search requests.
          allOf:
          - $ref: '#/components/schemas/cluster.stats.CCSUsageTimeValue'
        took_mrt_true:
          description: Statistics about the time taken to execute cross-cluster search requests for which the `ccs_minimize_roundtrips` setting was set to `true`.
          allOf:
          - $ref: '#/components/schemas/cluster.stats.CCSUsageTimeValue'
        took_mrt_false:
          description: Statistics about the time taken to execute cross-cluster search requests for which the `ccs_minimize_roundtrips` setting was set to `false`.
          allOf:
          - $ref: '#/components/schemas/cluster.stats.CCSUsageTimeValue'
        remotes_per_search_max:
          description: The maximum number of remote clusters that were queried in a single cross-cluster search request.
          type: number
        remotes_per_search_avg:
          description: The average number of remote clusters that were queried in a single cross-cluster search request.
          type: number
        failure_reasons:
          description: Statistics about the reasons for cross-cluster search request failures. The keys are the failure reason names and the values are the number of requests that failed for that reason.
          type: object
          additionalProperties:
            type: number
        features:
          description: The keys are the names of the search feature, and the values are the number of requests that used that feature. Single request can use more than one feature (e.g. both `async` and `wildcard`).
          type: object
          additionalProperties:
            type: number
        clients:
          description: Statistics about the clients that executed cross-cluster search requests. The keys are the names of the clients, and the values are the number of requests that were executed by that client. Only known clients (such as `kibana` or `elasticsearch`) are counted.
          type: object
          additionalProperties:
            type: number
        clusters:
          description: Statistics about the clusters that were queried in cross-cluster search requests. The keys are cluster names, and the values are per-cluster telemetry data. This also includes the local cluster itself, which uses the name `(local)`.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/cluster.stats.CCSUsageClusterStats'
      required:
      - total
      - success
      - skipped
      - took
      - remotes_per_search_max
      - remotes_per_search_avg
      - failure_reasons
      - features
      - clients
      - clusters
