        content:
          application/json:
            schema:
              type: object
              properties:
                feature_states:
                  externalDocs:
                    url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore#feature-state
                  description: 'The feature states to restore.

                    If `include_global_state` is `true`, the request restores all feature states in the snapshot by default.

                    If `include_global_state` is `false`, the request restores no feature states by default.

                    Note that specifying an empty array will result in the default behavior.

                    To restore no feature states, regardless of the `include_global_state` value, specify an array containing only the value `none` (`["none"]`).'
                  type: array
                  items:
                    type: string
                ignore_index_settings:
                  description: 'The index settings to not restore from the snapshot.

                    You can''t use this option to ignore `index.number_of_shards`.


                    For data streams, this option applies only to restored backing indices.

                    New backing indices are configured using the data stream''s matching index template.'
                  type: array
                  items:
                    type: string
                ignore_unavailable:
                  description: 'If `true`, the request ignores any index or data stream in indices that''s missing from the snapshot.

                    If `false`, the request returns an error for any missing index or data stream.'
                  default: false
                  type: boolean
                include_aliases:
                  description: 'If `true`, the request restores aliases for any restored data streams and indices.

                    If `false`, the request doesn’t restore aliases.'
                  default: true
                  type: boolean
                include_global_state:
                  description: 'If `true`, restore the cluster state. The cluster state includes:


                    * Persistent cluster settings

                    * Index templates

                    * Legacy index templates

                    * Ingest pipelines

                    * Index lifecycle management (ILM) policies

                    * Stored scripts

                    * For snapshots taken after 7.12.0, feature states


                    If `include_global_state` is `true`, the restore operation merges the legacy index templates in your cluster with the templates contained in the snapshot, replacing any existing ones whose name matches one in the snapshot.

                    It completely removes all persistent settings, non-legacy index templates, ingest pipelines, and ILM lifecycle policies that exist in your cluster and replaces them with the corresponding items from the snapshot.


                    Use the `feature_states` parameter to configure how feature states are restored.


                    If `include_global_state` is `true` and a snapshot was created without a global state then the restore request will fail.'
                  default: false
                  type: boolean
                index_settings:
                  description: 'Index settings to add or change in restored indices, including backing indices.

                    You can''t use this option to change `index.number_of_shards`.


                    For data streams, this option applies only to restored backing indices.

                    New backing indices are configured using the data stream''s matching index template.'
                  allOf:
                  - $ref: '#/components/schemas/indices._types.IndexSettings'
                indices:
                  description: 'A comma-separated list of indices and data streams to restore.

                    It supports a multi-target syntax.

                    The default behavior is all regular indices and regular data streams in the snapshot.


                    You can''t use this parameter to restore system indices or system data streams.

                    Use `feature_states` instead.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Indices'
                partial:
                  description: 'If `false`, the entire restore operation will fail if one or more indices included in the snapshot do not have all primary shards available.


                    If true, it allows restoring a partial snapshot of indices with unavailable shards.

                    Only shards that were successfully included in the snapshot will be restored.

                    All missing shards will be recreated as empty.'
                  default: false
                  type: boolean
                rename_pattern:
                  externalDocs:
                    url: https://docs.oracle.com/javase/8/docs/api/java/util/regex/Matcher.html#appendReplacement-java.lang.StringBuffer-java.lang.String-
                  description: 'A rename pattern to apply to restored data streams and indices.

                    Data streams and indices matching the rename pattern will be renamed according to `rename_replacement`.


                    The rename pattern is applied as defined by the regular expression that supports referencing the original text, according to the `appendReplacement` logic.'
                  type: string
                rename_replacement:
                  description: The rename replacement string that is used with the `rename_pattern`.
                  type: string
            examples:
              SnapshotRestoreRequestExample1:
                summary: Restore with rename pattern
                description: 'Run `POST /_snapshot/my_repository/snapshot_2/_restore?wait_for_completion=true`. It restores `index_1` and `index_2` from `snapshot_2`. The `rename_pattern` and `rename_replacement` parameters indicate any index matching the regular expression `index_(.+)` will be renamed using the pattern `restored_index_$1`. For example, `index_1` will be renamed to `restored_index_1`.

                  '
                value: "{\n  \"indices\": \"index_1,index_2\",\n  \"ignore_unavailable\": true,\n  \"include_global_state\": false,\n  \"rename_pattern\": \"index_(.+)\",\n  \"rename_replacement\": \"restored_index_$1\",\n  \"include_aliases\": false\n}"
