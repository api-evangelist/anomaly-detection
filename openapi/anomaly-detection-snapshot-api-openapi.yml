    snapshot._types.Status:
      type: object
      properties:
        include_global_state:
          description: Indicates whether the current cluster state is included in the snapshot.
          type: boolean
        indices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/snapshot._types.SnapshotIndexStats'
        repository:
          description: The name of the repository that includes the snapshot.
          type: string
        shards_stats:
          description: Statistics for the shards in the snapshot.
          allOf:
          - $ref: '#/components/schemas/snapshot._types.ShardsStats'
        snapshot:
          description: The name of the snapshot.
          type: string
        state:
          description: 'The current snapshot state:


            * `STARTED`: The snapshot is currently running.

            * `SUCCESS`: All shard snapshots have completed. The snapshot may or may not have completed finalization.

            * `FAILED`: The snapshot finished with an error and failed to store any data.'
          type: string
        stats:
          description: Details about the number (`file_count`) and size (`size_in_bytes`) of files included in the snapshot.
          allOf:
          - $ref: '#/components/schemas/snapshot._types.SnapshotStats'
