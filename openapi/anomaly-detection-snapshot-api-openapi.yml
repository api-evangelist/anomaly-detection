                description: 'Close `index_1` then run `POST /_snapshot/my_repository/snapshot_2/_restore?wait_for_completion=true` to restore an index in-place. For example, you might want to perform this type of restore operation when no alternative options surface after the cluster allocation explain API reports `no_valid_shard_copy`.

                  '
                value: "{\n  \"indices\": \"index_1\"\n}"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  snapshot:
                    allOf:
                    - $ref: '#/components/schemas/snapshot.restore.SnapshotRestore'
