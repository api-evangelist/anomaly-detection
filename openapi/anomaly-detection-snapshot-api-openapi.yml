          s3: '#/components/schemas/snapshot._types.SourceOnlyRepositorySettingsForS3'
          url: '#/components/schemas/snapshot._types.SourceOnlyRepositorySettingsForReadOnlyUrl'
      oneOf:
      - $ref: '#/components/schemas/snapshot._types.SourceOnlyRepositorySettingsForSharedFileSystem'
      - $ref: '#/components/schemas/snapshot._types.SourceOnlyRepositorySettingsForReadOnlyUrl'
      - $ref: '#/components/schemas/snapshot._types.SourceOnlyRepositorySettingsForAzure'
      - $ref: '#/components/schemas/snapshot._types.SourceOnlyRepositorySettingsForGcs'
      - $ref: '#/components/schemas/snapshot._types.SourceOnlyRepositorySettingsForS3'
