          description: The total size of all the blobs or partial blobs read in the test, in bytes.
          type: number
        total_throttled:
          description: The total time spent waiting due to the `max_restore_bytes_per_sec` or `indices.recovery.max_bytes_per_sec` throttles.
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        total_throttled_nanos:
          description: The total time spent waiting due to the `max_restore_bytes_per_sec` or `indices.recovery.max_bytes_per_sec` throttles, in nanoseconds.
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitNanos'
        total_wait:
          description: The total time spent waiting for the first byte of each read request to be received.
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        total_wait_nanos:
          description: The total time spent waiting for the first byte of each read request to be received, in nanoseconds.
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitNanos'
      required:
      - count
      - max_wait
      - max_wait_nanos
      - total_elapsed
      - total_elapsed_nanos
      - total_size
      - total_size_bytes
      - total_throttled
      - total_throttled_nanos
      - total_wait
      - total_wait_nanos
    snapshot._types.ShardsStatsSummary:
      type: object
      properties:
        incremental:
          allOf:
          - $ref: '#/components/schemas/snapshot._types.ShardsStatsSummaryItem'
        total:
          allOf:
          - $ref: '#/components/schemas/snapshot._types.ShardsStatsSummaryItem'
        start_time_in_millis:
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        time:
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        time_in_millis:
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitMillis'
      required:
      - incremental
      - total
      - start_time_in_millis
      - time_in_millis
    _types.DateTime:
      description: 'A date and time, either as a string whose format can depend on the context (defaulting to ISO 8601), or a

        number of milliseconds since the Epoch. Elasticsearch accepts both as input, but will generally output a string

        representation.'
      oneOf:
      - type: string
      - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
  responses:
    snapshot.create-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              accepted:
                description: Equals `true` if the snapshot was accepted. Present when the request had `wait_for_completion` set to `false`
                x-state: Generally available; Added in 7.15.0
                type: boolean
              snapshot:
                description: Snapshot information. Present when the request had `wait_for_completion` set to `true`
                allOf:
                - $ref: '#/components/schemas/snapshot._types.SnapshotInfo'
          examples:
            SnapshotCreateResponseExample1:
              description: A successful response from `PUT /_snapshot/my_repository/snapshot_2?wait_for_completion=true`.
              value: "{\n  \"snapshot\": {\n    \"snapshot\": \"snapshot_2\",\n    \"uuid\": \"vdRctLCxSketdKb54xw67g\",\n    \"repository\": \"my_repository\",\n    \"version_id\": <version_id>,\n    \"version\": <version>,\n    \"indices\": [],\n    \"data_streams\": [],\n    \"feature_states\": [],\n    \"include_global_state\": false,\n    \"metadata\": {\n      \"taken_by\": \"user123\",\n      \"taken_because\": \"backup before upgrading\"\n    },\n    \"state\": \"SUCCESS\",\n    \"start_time\": \"2020-06-25T14:00:28.850Z\",\n    \"start_time_in_millis\": 1593093628850,\n    \"end_time\": \"2020-06-25T14:00:28.850Z\",\n    \"end_time_in_millis\": 1593094752018,\n    \"duration_in_millis\": 0,\n    \"failures\": [],\n    \"shards\": {\n      \"total\": 0,\n      \"failed\": 0,\n      \"successful\": 0\n    }\n  }\n}"
    snapshot.create_repository-200:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
    snapshot.get_repository-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/snapshot._types.Repository'
          examples:
            SnapshotGetRepositoryResponseExample1:
              description: A successful response from `GET /_snapshot/my_repository`.
              value: "{\n  \"my_repository\" : {\n    \"type\" : \"fs\",\n    \"uuid\" : \"0JLknrXbSUiVPuLakHjBrQ\",\n    \"settings\" : {\n      \"location\" : \"my_backup_location\"\n    }\n  }\n}"
    snapshot.status-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              snapshots:
                type: array
                items:
                  $ref: '#/components/schemas/snapshot._types.Status'
            required:
            - snapshots
          examples:
            SnapshotStatusResponseExample1:
              summary: All shard stats present
              description: 'A successful response from `GET _snapshot/my_repository/snapshot_2/_status`. The response contains detailed status information for `snapshot_2` in the `my_repository` repository.

                '
              value: "{\n  \"snapshots\" : [\n    {\n      \"snapshot\" : \"snapshot_2\",\n      \"repository\" : \"my_repository\",\n      \"uuid\" : \"lNeQD1SvTQCqqJUMQSwmGg\",\n      \"state\" : \"SUCCESS\",\n      \"include_global_state\" : false,\n      \"shards_stats\" : {\n        \"initializing\" : 0,\n        \"started\" : 0,\n        \"finalizing\" : 0,\n        \"done\" : 1,\n        \"failed\" : 0,\n        \"total\" : 1\n      },\n      \"stats\" : {\n        \"incremental\" : {\n          \"file_count\" : 3,\n          \"size_in_bytes\" : 5969\n        },\n        \"total\" : {\n          \"file_count\" : 4,\n          \"size_in_bytes\" : 6024\n        },\n        \"start_time_in_millis\" : 1594829326691,\n        \"time_in_millis\" : 205\n      },\n      \"indices\" : {\n        \"index_1\" : {\n          \"shards_stats\" : {\n            \"initializing\" : 0,\n            \"started\" : 0,\n            \"finalizing\" : 0,\n            \"done\" : 1,\n            \"failed\" : 0,\n            \"total\" : 1\n          },\n          \"stats\" : {\n            \"incremental\" : {\n              \"file_count\" : 3,\n              \"size_in_bytes\" : 5969\n            },\n            \"total\" : {\n              \"file_count\" : 4,\n              \"size_in_bytes\" : 6024\n            },\n            \"start_time_in_millis\" : 1594829326896,\n            \"time_in_millis\" : 0\n          },\n          \"shards\" : {\n            \"0\" : {\n              \"stage\" : \"DONE\",\n              \"stats\" : {\n                \"incremental\" : {\n                  \"file_count\" : 3,\n                  \"size_in_bytes\" : 5969\n                },\n                \"total\" : {\n                  \"file_count\" : 4,\n                  \"size_in_bytes\" : 6024\n                },\n                \"start_time_in_millis\" : 1594829326896,\n                \"time_in_millis\" : 0\n              }\n            }\n          }\n        }\n      }\n    }\n  ]\n}"
            SnapshotStatusResponseExample2:
              summary: Missing shard stats
              description: 'A successful response from `GET _snapshot/my_repository/snapshot_2/_status`. Note that in this example the stats for `index-2` shard `0` are missing, with explanatory details provided in the `description` field.

                '
              value: "{\n  \"snapshots\" : [\n    {\n      \"snapshot\" : \"snapshot_2\",\n      \"repository\" : \"my_repository\",\n      \"uuid\" : \"lNeQD1SvTQCqqJUMQSwmGg\",\n      \"state\" : \"STARTED\",\n      \"include_global_state\" : true,\n      \"shards_stats\" : {\n        \"initializing\" : 0,\n        \"started\" : 1,\n        \"finalizing\" : 0,\n        \"done\" : 1,\n        \"failed\" : 0,\n        \"total\" : 2\n      },\n      \"stats\" : {\n        \"incremental\" : {\n          \"file_count\" : 4,\n          \"size_in_bytes\" : 5412\n        },\n        \"processed\" : {\n          \"file_count\" : 2,\n          \"size_in_bytes\" : 658\n        },\n        \"total\" : {\n          \"file_count\" : 4,\n          \"size_in_bytes\" : 5412\n        },\n        \"start_time_in_millis\" : 1750452674327,\n        \"time_in_millis\" : 189\n      },\n      \"indices\" : {\n        \"index-1\" : {\n          \"shards_stats\" : {\n            \"initializing\" : 0,\n            \"started\" : 1,\n            \"finalizing\" : 0,\n            \"done\" : 0,\n            \"failed\" : 0,\n            \"total\" : 1\n          },\n          \"stats\" : {\n            \"incremental\" : {\n              \"file_count\" : 4,\n              \"size_in_bytes\" : 5412\n            },\n            \"processed\" : {\n              \"file_count\" : 2,\n              \"size_in_bytes\" : 658\n            },\n            \"total\" : {\n              \"file_count\" : 4,\n              \"size_in_bytes\" : 5412\n            },\n            \"start_time_in_millis\" : 1750452674379,\n            \"time_in_millis\" : 0\n          },\n          \"shards\" : {\n            \"0\" : {\n              \"stage\" : \"STARTED\",\n              \"stats\" : {\n                \"incremental\" : {\n                  \"file_count\" : 4,\n                  \"size_in_bytes\" : 5412\n                },\n                \"processed\" : {\n                  \"file_count\" : 2,\n                  \"size_in_bytes\" : 658\n                },\n                \"total\" : {\n                  \"file_count\" : 4,\n                  \"size_in_bytes\" : 5412\n                },\n                \"start_time_in_millis\" : 1750452674379,\n                \"time_in_millis\" : 0\n              },\n              \"node\" : \"VJzy6aKJSVKwcfjIFBPXxw\"\n            }\n          }\n        },\n        \"index-2\" : {\n          \"shards_stats\" : {\n            \"initializing\" : 0,\n            \"started\" : 0,\n            \"finalizing\" : 0,\n            \"done\" : 1,\n            \"failed\" : 0,\n            \"total\" : 1\n          },\n          \"stats\" : {\n            \"incremental\" : {\n              \"file_count\" : 0,\n              \"size_in_bytes\" : 0\n            },\n            \"total\" : {\n              \"file_count\" : 0,\n              \"size_in_bytes\" : 0\n            },\n            \"start_time_in_millis\" : 0,\n            \"time_in_millis\" : 0\n          },\n          \"shards\" : {\n            \"0\" : {\n              \"stage\" : \"DONE\",\n              \"stats\" : {\n                \"incremental\" : {\n                  \"file_count\" : -1,\n                  \"size_in_bytes\" : -1\n                },\n                \"total\" : {\n                  \"file_count\" : -1,\n                  \"size_in_bytes\" : -1\n                },\n                \"start_time_in_millis\" : 0,\n                \"time_in_millis\" : 0\n              },\n              \"description\" : \"Snapshot shard stats missing from a currently running snapshot due to a node leaving the cluster after completing the shard snapshot; retry once the snapshot has completed to load all shard stats from the repository.\"\n            }\n          }\n        }\n      }\n    }\n  ]\n}"
  requestBodies:
    snapshot.create:
      content:
        application/json:
          schema:
            type: object
            properties:
              expand_wildcards:
                description: "Determines how wildcard patterns in the `indices` parameter match data streams and indices.\nIt supports comma-separated values such as `open,hidden`.\n\nSupported values include:\n  - `all`: Match any data stream or index, including hidden ones.\n  - `open`: Match open, non-hidden indices. Also matches any non-hidden data stream.\n  - `closed`: Match closed, non-hidden indices. Also matches any non-hidden data stream. Data streams cannot be closed.\n  - `hidden`: Match hidden data streams and hidden indices. Must be combined with `open`, `closed`, or `both`.\n  - `none`: Wildcard expressions are not accepted.\n\n"
                default: all
                allOf:
                - $ref: '#/components/schemas/_types.ExpandWildcards'
              feature_states:
                externalDocs:
                  url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore#feature-state
                description: 'The feature states to include in the snapshot.

                  Each feature state includes one or more system indices containing related data.

                  You can view a list of eligible features using the get features API.


                  If `include_global_state` is `true`, all current feature states are included by default.

                  If `include_global_state` is `false`, no feature states are included by default.


                  Note that specifying an empty array will result in the default behavior.

                  To exclude all feature states, regardless of the `include_global_state` value, specify an array with only the value `none` (`["none"]`).'
                type: array
                items:
                  type: string
              ignore_unavailable:
                description: 'If `true`, the request ignores data streams and indices in `indices` that are missing or closed.

                  If `false`, the request returns an error for any data stream or index that is missing or closed.'
                default: false
                type: boolean
              include_global_state:
                description: 'If `true`, the current cluster state is included in the snapshot.

                  The cluster state includes persistent cluster settings, composable index templates, legacy index templates, ingest pipelines, and ILM policies.

                  It also includes data stored in system indices, such as Watches and task records (configurable via `feature_states`).'
                default: true
                type: boolean
              indices:
                description: 'A comma-separated list of data streams and indices to include in the snapshot.

                  It supports a multi-target syntax.

                  The default is an empty array (`[]`), which includes all regular data streams and regular indices.

                  To exclude all data streams and indices, use `-*`.


                  You can''t use this parameter to include or exclude system indices or system data streams from a snapshot.

                  Use `feature_states` instead.'
                allOf:
                - $ref: '#/components/schemas/_types.Indices'
              metadata:
                description: 'Arbitrary metadata to the snapshot, such as a record of who took the snapshot, why it was taken, or any other useful data.

                  It can have any contents but it must be less than 1024 bytes.

                  This information is not automatically generated by Elasticsearch.'
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
              partial:
                description: 'If `true`, allows the snapshot to proceed even if some of the target shards are unavailable.

                  In this case, the resulting snapshot will not contain snapshots of the unavailable target shards, and will report its state as `PARTIAL`.

                  Additionally, if `true`, allows index metadata operations such as deletions while the snapshot is in progress.

                  This is almost always preferable to failing the snapshot completely when a single shard is unavailable, and blocking index metadata operations.


                  If `false`, the entire restore operation will fail if one or more indices included in the snapshot do not have all primary shards available, and index metadata operations such as deletions will be forbidden until the snapshot completes.'
                default: false
                type: boolean
          examples:
            SnapshotCreateRequestExample1:
              description: Run `PUT /_snapshot/my_repository/snapshot_2?wait_for_completion=true` to take a snapshot of `index_1` and `index_2`.
              value: "{\n  \"partial\": true,\n  \"indices\": \"index_1,index_2\",\n  \"ignore_unavailable\": true,\n  \"include_global_state\": false,\n  \"metadata\": {\n    \"taken_by\": \"user123\",\n    \"taken_because\": \"backup before upgrading\"\n  }\n}"
    snapshot.create_repository:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/snapshot._types.Repository'
          examples:
            SnapshotCreateRepositoryRequestExample1:
              summary: A shared file system repository
              description: Run `PUT /_snapshot/my_repository` to create or update a shared file system snapshot repository.
              value: "{\n  \"type\": \"fs\",\n  \"settings\": {\n    \"location\": \"my_backup_location\"\n  }\n}"
            SnapshotCreateRepositoryRequestExample2:
              summary: An Azure repository
              description: Run `PUT /_snapshot/my_repository` to create or update an Azure snapshot repository.
              value: "{\n  \"type\": \"azure\",\n  \"settings\": {\n    \"client\": \"secondary\"\n  }\n}"
            SnapshotCreateRepositoryRequestExample3:
              summary: A Google Cloud Storage repository
              description: Run `PUT /_snapshot/my_gcs_repository` to create or update a Google Cloud Storage snapshot repository.
              value: "{\n  \"type\": \"gcs\",\n  \"settings\": {\n    \"bucket\": \"my_other_bucket\",\n    \"base_path\": \"dev\"\n  }\n}"
            SnapshotCreateRepositoryRequestExample4:
              summary: An S3 repository
              description: Run `PUT /_snapshot/my_s3_repository` to create or update an AWS S3 snapshot repository.
              value: "{\n  \"type\": \"s3\",\n  \"settings\": {\n    \"bucket\": \"my-bucket\"\n  }\n}"
            SnapshotCreateRepositoryRequestExample5:
              summary: A source-only repository
              description: Run `PUT _snapshot/my_src_only_repository` to create or update a source-only snapshot repository.
              value: "{\n  \"type\": \"source\",\n  \"settings\": {\n    \"delegate_type\": \"fs\",\n    \"location\": \"my_backup_repository\"\n  }\n}"
            SnapshotCreateRepositoryRequestExample6:
              summary: A read-only URL repository
              description: Run `PUT _snapshot/my_read_only_url_repository` to create or update a read-only URL snapshot repository.
              value: "{\n  \"type\": \"url\",\n  \"settings\": {\n    \"url\": \"file:/mount/backups/my_fs_backup_location\"\n  }\n}"
      required: true
  parameters:
    snapshot.get_repository-repository:
      in: path
      name: repository
      description: 'A comma-separated list of snapshot repository names used to limit the request.

        Wildcard (`*`) expressions are supported including combining wildcards with exclude patterns starting with `-`.


        To get information about all snapshot repositories registered in the cluster, omit this parameter or use `*` or `_all`.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Names'
      style: simple
    snapshot.create-master_timeout:
      in: query
      name: master_timeout
      description: 'The period to wait for a connection to the master node.

        If no response is received before the timeout expires, the request fails and returns an error.'
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    snapshot.create-snapshot:
      in: path
      name: snapshot
      description: 'The name of the snapshot.

        It supportes date math.

        It must be unique in the repository.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Name'
      style: simple
    snapshot.status-ignore_unavailable:
      in: query
      name: ignore_unavailable
      description: 'If `false`, the request returns an error for any snapshots that are unavailable.

        If `true`, the request ignores snapshots that are unavailable, such as those that are corrupted or temporarily cannot be returned.'
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    snapshot.create_repository-verify:
      in: query
      name: verify
      description: 'If `true`, the request verifies the repository is functional on all master and data nodes in the cluster.

        If `false`, this verification is skipped.

        You can also perform this verification with the verify snapshot repository API.'
      deprecated: false
      schema:
        default: true
        type: boolean
      style: form
    snapshot.status-snapshot:
      in: path
      name: snapshot
      description: 'A comma-separated list of snapshots to retrieve status for.

        The default is currently running snapshots.

        Wildcards (`*`) are not supported.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Names'
      style: simple
    snapshot.create-repository:
      in: path
      name: repository
      description: The name of the repository for the snapshot.
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Name'
      style: simple
    snapshot.create_repository-timeout:
      in: query
      name: timeout
      description: 'The period to wait for a response from all relevant nodes in the cluster after updating the cluster metadata.

        If no response is received before the timeout expires, the cluster metadata update still applies but the response will indicate that it was not completely acknowledged.

        To indicate that the request should never timeout, set it to `-1`.'
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    snapshot.create_repository-master_timeout:
      in: query
      name: master_timeout
      description: 'The period to wait for the master node.

        If the master node is not available before the timeout expires, the request fails and returns an error.

        To indicate that the request should never timeout, set it to `-1`.'
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    snapshot.status-master_timeout:
      in: query
      name: master_timeout
      description: 'The period to wait for the master node.

        If the master node is not available before the timeout expires, the request fails and returns an error.

        To indicate that the request should never timeout, set it to `-1`.'
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    snapshot.get_repository-master_timeout:
      in: query
      name: master_timeout
      description: 'The period to wait for the master node.

        If the master node is not available before the timeout expires, the request fails and returns an error.

        To indicate that the request should never timeout, set it to `-1`.'
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    snapshot.create-wait_for_completion:
      in: query
      name: wait_for_completion
      description: 'If `true`, the request returns a response when the snapshot is complete.

        If `false`, the request returns a response when the snapshot initializes.'
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    snapshot.get_repository-local:
      in: query
      name: local
      description: 'If `true`, the request gets information from the local node only.

        If `false`, the request gets information from the master node.'
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    snapshot.status-repository:
      in: path
      name: repository
      description: 'The snapshot repository name used to limit the request.

        It supports wildcards (`*`) if `<snapshot>` isn''t specified.'
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Name'
      style: simple
    snapshot.create_repository-repository:
      in: path
      name: repository
      description: The name of the snapshot repository to register or update.
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Name'
      style: simple
  securitySchemes:
    apiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
      description: "Elasticsearch APIs support key-based authentication.\nYou must create an API key and use the encoded value in the request header.\nFor example:\n\n\n```\ncurl -X GET \"${ES_URL}/_cat/indices?v=true\" \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n```\n\nTo get API keys, use the `/_security/api_key` APIs.\n"
    basicAuth:
      scheme: basic
      type: http
    bearerAuth:
      scheme: bearer
      type: http
      description: 'Elasticsearch APIs support the use of bearer tokens in the `Authorization` HTTP header to authenticate with the API.

        For examples, refer to [Token-based authentication services](https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/token-based-authentication-services)

        '
