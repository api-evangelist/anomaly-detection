        first_byte_time:
          description: 'The length of time waiting for the first byte of the read operation to be received.

            If the blob was not found, this detail is omitted.'
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        first_byte_time_nanos:
          description: 'The length of time waiting for the first byte of the read operation to be received, in nanoseconds.

            If the blob was not found, this detail is omitted.'
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitNanos'
