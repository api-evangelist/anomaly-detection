openapi: 3.2.0
info:
  title: Elasticsearch Snapshot API
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the `main` branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: Snapshot
  x-displayName: Snapshot and restore
  description: Snapshot and restore APIs enable you to set up snapshot repositories, manage snapshot backups, and restore snapshots to a running cluster.
  externalDocs:
    url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore
    description: Learn more about snapshot and restore operations.
paths:
  /_snapshot/{repository}/_cleanup:
    post:
      tags:
      - Snapshot
      summary: Clean up the snapshot repository
      description: 'Trigger the review of the contents of a snapshot repository and delete any stale data not referenced by existing snapshots.


        ## Required authorization


        * Cluster privileges: `manage`'
      externalDocs:
        description: About managing snapshot
        url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore/self-managed#snapshots-repository-cleanup
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/clean-up-snapshot-repo-api.html
      operationId: snapshot-cleanup-repository
      parameters:
      - in: path
        name: repository
        description: The name of the snapshot repository to clean up.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: query
        name: master_timeout
        description: 'The period to wait for a connection to the master node.

          If the master node is not available before the timeout expires, the request fails and returns an error.

          To indicate that the request should never timeout, set it to `-1`'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: 'The period to wait for a response from all relevant nodes in the cluster after updating the cluster metadata.

          If no response is received before the timeout expires, the cluster metadata update still applies but the response will indicate that it was not completely acknowledged.

          To indicate that the request should never timeout, set it to `-1`.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    description: Statistics for cleanup operations.
                    allOf:
                    - $ref: '#/components/schemas/snapshot.cleanup_repository.CleanupRepositoryResults'
                required:
                - results
              examples:
                SnapshotCleanupRepositoryResponseExample1:
                  description: A successful response from `POST /_snapshot/my_repository/_cleanup`.
                  value: "{\n  \"results\": {\n    \"deleted_bytes\": 20,\n    \"deleted_blobs\": 5\n  }\n}"
      x-state: Generally available; Added in 7.4.0
      x-codeSamples:
      - lang: Console
        source: 'POST /_snapshot/my_repository/_cleanup

          '
      - lang: Python
        source: "resp = client.snapshot.cleanup_repository(\n    name=\"my_repository\",\n)"
      - lang: JavaScript
        source: "const response = await client.snapshot.cleanupRepository({\n  name: \"my_repository\",\n});"
      - lang: Ruby
        source: "response = client.snapshot.cleanup_repository(\n  repository: \"my_repository\"\n)"
      - lang: PHP
        source: "$resp = $client->snapshot()->cleanupRepository([\n    \"repository\" => \"my_repository\",\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_snapshot/my_repository/_cleanup"'
      - lang: C#
        source: 'var response = await client.Snapshot.CleanupRepositoryAsync(name: "my_repository");'
      - lang: Java
        source: "client.snapshot().cleanupRepository(c -> c\n    .name(\"my_repository\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_snapshot/{repository}/{snapshot}/_clone/{target_snapshot}:
    put:
      tags:
      - Snapshot
      summary: Clone a snapshot
      description: 'Clone part of all of a snapshot into another snapshot in the same repository.


        ## Required authorization


        * Cluster privileges: `manage`'
      operationId: snapshot-clone
      parameters:
      - in: path
        name: repository
        description: The name of the snapshot repository that both source and target snapshot belong to.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: path
        name: snapshot
        description: The source snapshot name.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: path
        name: target_snapshot
        description: The target snapshot name.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: query
        name: master_timeout
        description: 'The period to wait for the master node.

          If the master node is not available before the timeout expires, the request fails and returns an error.

          To indicate that the request should never timeout, set it to `-1`.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                indices:
                  description: 'A comma-separated list of indices to include in the snapshot.

                    Multi-target syntax is supported.'
                  type: string
              required:
              - indices
            examples:
              SnapshotCloneRequestExample1:
                description: Run `PUT /_snapshot/my_repository/source_snapshot/_clone/target_snapshot` to clone the `source_snapshot` into a new `target_snapshot`.
                value: "{\n  \"indices\": \"index_a,index_b\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 7.10.0
      x-codeSamples:
      - lang: Console
        source: "PUT /_snapshot/my_repository/source_snapshot/_clone/target_snapshot\n{\n  \"indices\": \"index_a,index_b\"\n}"
      - lang: Python
        source: "resp = client.snapshot.clone(\n    repository=\"my_repository\",\n    snapshot=\"source_snapshot\",\n    target_snapshot=\"target_snapshot\",\n    indices=\"index_a,index_b\",\n)"
      - lang: JavaScript
        source: "const response = await client.snapshot.clone({\n  repository: \"my_repository\",\n  snapshot: \"source_snapshot\",\n  target_snapshot: \"target_snapshot\",\n  indices: \"index_a,index_b\",\n});"
      - lang: Ruby
        source: "response = client.snapshot.clone(\n  repository: \"my_repository\",\n  snapshot: \"source_snapshot\",\n  target_snapshot: \"target_snapshot\",\n  body: {\n    \"indices\": \"index_a,index_b\"\n  }\n)"
      - lang: PHP
        source: "$resp = $client->snapshot()->clone([\n    \"repository\" => \"my_repository\",\n    \"snapshot\" => \"source_snapshot\",\n    \"target_snapshot\" => \"target_snapshot\",\n    \"body\" => [\n        \"indices\" => \"index_a,index_b\",\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"indices":"index_a,index_b"}'' "$ELASTICSEARCH_URL/_snapshot/my_repository/source_snapshot/_clone/target_snapshot"'
      - lang: C#
        source: "var response = await client.Snapshot\n    .CloneAsync(repository: \"my_repository\", snapshot: \"source_snapshot\", targetSnapshot: \"target_snapshot\", d1 => d1\n        .Indices(\"index_a,index_b\")\n    );"
      - lang: Java
        source: "client.snapshot().clone(c -> c\n    .indices(\"index_a,index_b\")\n    .repository(\"my_repository\")\n    .snapshot(\"source_snapshot\")\n    .targetSnapshot(\"target_snapshot\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_snapshot/{repository}/{snapshot}:
    get:
      tags:
      - Snapshot
      summary: Get snapshot information
      description: 'NOTE: The `after` parameter and `next` field enable you to iterate through snapshots with some consistency guarantees regarding concurrent creation or deletion of snapshots.

        It is guaranteed that any snapshot that exists at the beginning of the iteration and is not concurrently deleted will be seen during the iteration.

        Snapshots concurrently created may be seen during an iteration.


        ## Required authorization


        * Cluster privileges: `monitor_snapshot`'
      operationId: snapshot-get
      parameters:
      - in: path
        name: repository
        description: 'A comma-separated list of snapshot repository names used to limit the request.

          Wildcard (`*`) expressions are supported.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: path
        name: snapshot
        description: 'A comma-separated list of snapshot names to retrieve

          Wildcards (`*`) are supported.


          * To get information about all snapshots in a registered repository, use a wildcard (`*`) or `_all`.

          * To get information about any snapshots that are currently running, use `_current`.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Names'
        style: simple
      - in: query
        name: after
        description: An offset identifier to start pagination from as returned by the next field in the response body.
        deprecated: false
        schema:
          type: string
        x-state: Generally available; Added in 7.14.0
        style: form
      - in: query
        name: from_sort_value
        description: 'The value of the current sort column at which to start retrieval.

          It can be a string `snapshot-` or a repository name when sorting by snapshot or repository name.

          It can be a millisecond time value or a number when sorting by `index-` or shard count.'
        deprecated: false
        schema:
          type: string
        x-state: Generally available; Added in 7.16.0
        style: form
      - in: query
        name: ignore_unavailable
        description: If `false`, the request returns an error for any snapshots that are unavailable.
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: index_details
        description: 'If `true`, the response includes additional information about each index in the snapshot comprising the number of shards in the index, the total size of the index in bytes, and the maximum number of segments per shard in the index.

          The default is `false`, meaning that this information is omitted.'
        deprecated: false
        schema:
          default: false
          type: boolean
        x-state: Generally available; Added in 7.13.0
        style: form
      - in: query
        name: index_names
        description: If `true`, the response includes the name of each index in each snapshot.
        deprecated: false
        schema:
          default: true
          type: boolean
        x-state: Generally available; Added in 8.3.0
        style: form
      - in: query
        name: include_repository
        description: If `true`, the response includes the repository name in each snapshot.
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: 'The period to wait for a connection to the master node.

          If no response is received before the timeout expires, the request fails and returns an error.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: order
        description: "The sort order.\nValid values are `asc` for ascending and `desc` for descending order.\nThe default behavior is ascending order.\n\nSupported values include:\n  - `asc`: Ascending (smallest to largest)\n  - `desc`: Descending (largest to smallest)\n\n"
        deprecated: false
        schema:
          default: asc
          allOf:
          - $ref: '#/components/schemas/_types.SortOrder'
        x-state: Generally available; Added in 7.14.0
        style: form
      - in: query
        name: offset
        description: Numeric offset to start pagination from based on the snapshots matching this request. Using a non-zero value for this parameter is mutually exclusive with using the after parameter. Defaults to 0.
        deprecated: false
        schema:
          default: 0
          type: number
        x-state: Generally available; Added in 7.15.0
        style: form
      - in: query
        name: size
        description: 'The maximum number of snapshots to return.

          The default is -1, which means to return all that match the request without limit.'
        deprecated: false
        schema:
          default: -1
          type: number
        x-state: Generally available; Added in 7.14.0
        style: form
      - in: query
        name: slm_policy_filter
        description: 'Filter snapshots by a comma-separated list of snapshot lifecycle management (SLM) policy names that snapshots belong to.


          You can use wildcards (`*`) and combinations of wildcards followed by exclude patterns starting with `-`.

          For example, the pattern `*,-policy-a-\*` will return all snapshots except for those that were created by an SLM policy with a name starting with `policy-a-`.

          Note that the wildcard pattern `*` matches all snapshots created by an SLM policy but not those snapshots that were not created by an SLM policy.

          To include snapshots that were not created by an SLM policy, you can use the special pattern `_none` that will match all snapshots without an SLM policy.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        x-state: Generally available; Added in 7.16.0
        style: form
      - in: query
        name: sort
        description: 'The sort order for the result.

          The default behavior is sorting by snapshot start time stamp.'
        deprecated: false
        schema:
          default: start_time
          allOf:
          - $ref: '#/components/schemas/snapshot._types.SnapshotSort'
        x-state: Generally available; Added in 7.14.0
        style: form
      - in: query
        name: state
        description: "Only return snapshots with a state found in the given comma-separated list of snapshot states.\nThe default is all snapshot states.\n\nSupported values include:\n  - `IN_PROGRESS`: The snapshot process has started.\n  - `SUCCESS`: The snapshot process completed successfully.\n  - `FAILED`: The snapshot failed.\n  - `PARTIAL`: The snapshot was partially successful.\n  - `INCOMPATIBLE`: The snapshot is incompatible with the current version of the cluster.\n\n"
        deprecated: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/snapshot._types.SnapshotState'
          - type: array
            items:
              $ref: '#/components/schemas/snapshot._types.SnapshotState'
        x-state: Generally available; Added in 9.1.0
        style: form
      - in: query
        name: verbose
        description: 'If `true`, returns additional information about each snapshot such as the version of Elasticsearch which took the snapshot, the start and end times of the snapshot, and the number of shards snapshotted.


          NOTE: The parameters `size`, `order`, `after`, `from_sort_value`, `offset`, `slm_policy_filter`, and `sort` are not supported when you set `verbose=false` and the sort order for requests with `verbose=false` is undefined.'
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  remaining:
                    description: The number of remaining snapshots that were not returned due to size limits and that can be fetched by additional requests using the `next` field value.
                    x-state: Generally available; Added in 7.15.0
                    type: number
                  total:
                    description: The total number of snapshots that match the request when ignoring the size limit or `after` query parameter.
                    x-state: Generally available; Added in 7.15.0
                    type: number
                  next:
                    description: 'If the request contained a size limit and there might be more results, a `next` field will be added to the response.

                      It can be used as the `after` query parameter to fetch additional results.'
                    type: string
                  responses:
                    type: array
                    items:
                      $ref: '#/components/schemas/snapshot.get.SnapshotResponseItem'
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/snapshot._types.SnapshotInfo'
                required:
                - remaining
                - total
              examples:
                SnapshotGetResponseExample1:
                  description: 'A successful response from `GET /_snapshot/my_repository/snapshot_*?sort=start_time&from_sort_value=1577833200000`. The response contains information for all snapshots with names starting with `snapshot_` and that started on or after timestamp `1577833200000` (Jan 1st 2020) when sorted by snapshot start time in the default ascending order.

                    '
                  value: "{\n  \"snapshots\": [\n    {\n      \"snapshot\": \"snapshot_1\",\n      \"uuid\": \"dKb54xw67gvdRctLCxSket\",\n      \"repository\": \"my_repository\",\n      \"version_id\": <version_id>,\n      \"version\": <version>,\n      \"indices\": [],\n      \"data_streams\": [],\n      \"feature_states\": [],\n      \"include_global_state\": true,\n      \"state\": \"SUCCESS\",\n      \"start_time\": \"2020-07-06T21:55:18.128Z\",\n      \"start_time_in_millis\": 1593093628849,\n      \"end_time\": \"2020-07-06T21:55:18.129Z\",\n      \"end_time_in_millis\": 1593093628850,\n      \"duration_in_millis\": 1,\n      \"failures\": [],\n      \"shards\": {\n        \"total\": 0,\n        \"failed\": 0,\n        \"successful\": 0\n      }\n    },\n    {\n      \"snapshot\": \"snapshot_2\",\n      \"uuid\": \"vdRctLCxSketdKb54xw67g\",\n      \"repository\": \"my_repository\",\n      \"version_id\": <version_id>,\n      \"version\": <version>,\n      \"indices\": [],\n      \"data_streams\": [],\n      \"feature_states\": [],\n      \"include_global_state\": true,\n      \"state\": \"SUCCESS\",\n      \"start_time\": \"2020-07-06T21:55:18.130Z\",\n      \"start_time_in_millis\": 1593093628851,\n      \"end_time\": \"2020-07-06T21:55:18.130Z\",\n      \"end_time_in_millis\": 1593093628851,\n      \"duration_in_millis\": 0,\n      \"failures\": [],\n      \"shards\": {\n        \"total\": 0,\n        \"failed\": 0,\n        \"successful\": 0\n      }\n    },\n    {\n      \"snapshot\": \"snapshot_3\",\n      \"uuid\": \"dRctdKb54xw67gvLCxSket\",\n      \"repository\": \"my_repository\",\n      \"version_id\": <version_id>,\n      \"version\": <version>,\n      \"indices\": [],\n      \"data_streams\": [],\n      \"feature_states\": [],\n      \"include_global_state\": true,\n      \"state\": \"SUCCESS\",\n      \"start_time\": \"2020-07-06T21:55:18.131Z\",\n      \"start_time_in_millis\": 1593093628852,\n      \"end_time\": \"2020-07-06T21:55:18.135Z\",\n      \"end_time_in_millis\": 1593093628856,\n      \"duration_in_millis\": 4,\n      \"failures\": [],\n      \"shards\": {\n        \"total\": 0,\n        \"failed\": 0,\n        \"successful\": 0\n      }\n    }\n  ],\n  \"total\": 3,\n  \"remaining\": 0\n}"
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: 'GET /_snapshot/my_repository/snapshot_*?sort=start_time&from_sort_value=1577833200000

          '
      - lang: Python
        source: "resp = client.snapshot.get(\n    repository=\"my_repository\",\n    snapshot=\"snapshot_*\",\n    sort=\"start_time\",\n    from_sort_value=\"1577833200000\",\n)"
      - lang: JavaScript
        source: "const response = await client.snapshot.get({\n  repository: \"my_repository\",\n  snapshot: \"snapshot_*\",\n  sort: \"start_time\",\n  from_sort_value: 1577833200000,\n});"
      - lang: Ruby
        source: "response = client.snapshot.get(\n  repository: \"my_repository\",\n  snapshot: \"snapshot_*\",\n  sort: \"start_time\",\n  from_sort_value: \"1577833200000\"\n)"
      - lang: PHP
        source: "$resp = $client->snapshot()->get([\n    \"repository\" => \"my_repository\",\n    \"snapshot\" => \"snapshot_*\",\n    \"sort\" => \"start_time\",\n    \"from_sort_value\" => \"1577833200000\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_snapshot/my_repository/snapshot_*?sort=start_time&from_sort_value=1577833200000"'
      - lang: C#
        source: "var response = await client.Snapshot\n    .GetAsync(repository: \"my_repository\", snapshot: new[] { \"snapshot_*\" }, d1 => d1\n        .FromSortValue(\"1577833200000\")\n        .Sort(SnapshotSort.StartTime)\n    );"
      - lang: Java
        source: "client.snapshot().get(g -> g\n    .fromSortValue(\"1577833200000\")\n    .repository(\"my_repository\")\n    .snapshot(\"snapshot_*\")\n    .sort(SnapshotSort.StartTime)\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    post:
      tags:
      - Snapshot
      summary: Create a snapshot
      description: '**All methods and paths for this operation:**


        PUT

        /_snapshot/{repository}/{snapshot}


        POST

        /_snapshot/{repository}/{snapshot}


        Take a snapshot of a cluster or of data streams and indices.


        ## Required authorization


        * Cluster privileges: `create_snapshot`'
      externalDocs:
        description: More about managing snapshots
        url: https://www.elastic.co/docs/deploy-manage/tools/snapshot-and-restore/create-snapshots
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/create-snapshot-api.html
      operationId: snapshot-create
      parameters:
      - $ref: '#/components/parameters/snapshot.create-repository'
      - $ref: '#/components/parameters/snapshot.create-snapshot'
      - $ref: '#/components/parameters/snapshot.create-master_timeout'
      - $ref: '#/components/parameters/snapshot.create-wait_for_completion'
      requestBody:
        $ref: '#/components/requestBodies/snapshot.create'
      responses:
        '200':
          $ref: '#/components/responses/snapshot.create-200'
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: "PUT /_snapshot/my_repository/snapshot_2?wait_for_completion=true\n{\n  \"partial\": true,\n  \"indices\": \"index_1,index_2\",\n  \"ignore_unavailable\": true,\n  \"include_global_state\": false,\n  \"metadata\": {\n    \"taken_by\": \"user123\",\n    \"taken_because\": \"backup before upgrading\"\n  }\n}"
      - lang: Python
        source: "resp = client.snapshot.create(\n    repository=\"my_repository\",\n    snapshot=\"snapshot_2\",\n    wait_for_completion=True,\n    partial=True,\n    indices=\"index_1,index_2\",\n    ignore_unavailable=True,\n    include_global_state=False,\n    metadata={\n        \"taken_by\": \"user123\",\n        \"taken_because\": \"backup before upgrading\"\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.snapshot.create({\n  repository: \"my_repository\",\n  snapshot: \"snapshot_2\",\n  wait_for_completion: \"true\",\n  partial: true,\n  indices: \"index_1,index_2\",\n  ignore_unavailable: true,\n  include_global_state: false,\n  metadata: {\n    taken_by: \"user123\",\n    taken_because: \"backup before upgrading\",\n  },\n});"
      - lang: Ruby
        source: "response = client.snapshot.create(\n  repository: \"my_repository\",\n  snapshot: \"snapshot_2\",\n  wait_for_completion: \"true\",\n  body: {\n    \"partial\": true,\n    \"indices\": \"index_1,index_2\",\n    \"ignore_unavailable\": true,\n    \"include_global_state\": false,\n    \"metadata\": {\n      \"taken_by\": \"user123\",\n      \"taken_because\": \"backup before upgrading\"\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->snapshot()->create([\n    \"repository\" => \"my_repository\",\n    \"snapshot\" => \"snapshot_2\",\n    \"wait_for_completion\" => \"true\",\n    \"body\" => [\n        \"partial\" => true,\n        \"indices\" => \"index_1,index_2\",\n        \"ignore_unavailable\" => true,\n        \"include_global_state\" => false,\n        \"metadata\" => [\n            \"taken_by\" => \"user123\",\n            \"taken_because\" => \"backup before upgrading\",\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"partial":true,"indices":"index_1,index_2","ignore_unavailable":true,"include_global_state":false,"metadata":{"taken_by":"user123","taken_because":"backup before upgrading"}}'' "$ELASTICSEARCH_URL/_snapshot/my_repository/snapshot_2?wait_for_completion=true"'
      - lang: C#
        source: "var response = await client.Snapshot\n    .CreateAsync(repository: \"my_repository\", snapshot: \"snapshot_2\", d1 => d1\n        .WaitForCompletion(true)\n        .IgnoreUnavailable(true)\n        .IncludeGlobalState(false)\n        .Indices(new[] { \"index_1,index_2\" })\n        .Metadata(new Dictionary<string, object>()\n        {\n            { \"taken_by\", \"user123\" },\n            { \"taken_because\", \"backup before upgrading\" }\n        })\n        .Partial(true)\n    );"
      - lang: Java
