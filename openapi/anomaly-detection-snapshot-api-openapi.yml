                  delete_elapsed:
                    description: The time it took to delete all the blobs in the container.
                    allOf:
                    - $ref: '#/components/schemas/_types.Duration'
                  delete_elapsed_nanos:
                    description: The time it took to delete all the blobs in the container, in nanoseconds.
                    allOf:
                    - $ref: '#/components/schemas/_types.DurationValueUnitNanos'
                  details:
                    description: A description of every read and write operation performed during the test.
                    allOf:
                    - $ref: '#/components/schemas/snapshot.repository_analyze.DetailsInfo'
                  early_read_node_count:
                    description: The limit on the number of nodes on which early read operations were performed after writing each blob.
                    type: number
                  issues_detected:
                    description: 'A list of correctness issues detected, which is empty if the API succeeded.

                      It is included to emphasize that a successful response does not guarantee correct behaviour in future.'
                    type: array
                    items:
                      type: string
                  listing_elapsed:
                    description: The time it took to retrieve a list of all the blobs in the container.
                    allOf:
                    - $ref: '#/components/schemas/_types.Duration'
                  listing_elapsed_nanos:
                    description: The time it took to retrieve a list of all the blobs in the container, in nanoseconds.
                    allOf:
                    - $ref: '#/components/schemas/_types.DurationValueUnitNanos'
                  max_blob_size:
                    description: The limit on the size of a blob written during the test.
                    allOf:
                    - $ref: '#/components/schemas/_types.ByteSize'
                  max_blob_size_bytes:
                    description: The limit, in bytes, on the size of a blob written during the test.
                    type: number
                  max_total_data_size:
                    description: The limit on the total size of all blob written during the test.
                    allOf:
                    - $ref: '#/components/schemas/_types.ByteSize'
                  max_total_data_size_bytes:
                    description: The limit, in bytes, on the total size of all blob written during the test.
                    type: number
                  rare_action_probability:
                    description: The probability of performing rare actions during the test.
                    type: number
                  read_node_count:
                    description: The limit on the number of nodes on which read operations were performed after writing each blob.
                    type: number
                  repository:
                    description: The name of the repository that was the subject of the analysis.
                    type: string
                  seed:
                    description: The seed for the pseudo-random number generator used to generate the operations used during the test.
                    type: number
                  summary:
                    description: A collection of statistics that summarize the results of the test.
                    allOf:
                    - $ref: '#/components/schemas/snapshot.repository_analyze.SummaryInfo'
                required:
