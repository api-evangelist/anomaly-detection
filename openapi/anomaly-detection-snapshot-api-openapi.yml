  /_snapshot/{repository}/_analyze:
    post:
      tags:
      - Snapshot
      summary: Analyze a snapshot repository
      description: Performs operations on a snapshot repository in order to check for incorrect behaviour. There are a large number of third-party storage systems available, not all of which are suitable for use as a snapshot repository by Elasticsearch. Some storage systems behave incorrectly, or perform poorly, especially when accessed concurrently by multiple clients as the nodes of an Elasticsearch cluster do. This API performs a collection of read and write operations on your repository which are designed to detect incorrect behaviour and to measure the performance characteristics of your storage system. The default values for the parameters are deliberately low to reduce the impact of running an analysis inadvertently and to provide a sensible starting point for your investigations. Run your first analysis with the default parameter values to check for simple problems. Some repositories may behave correctly when lightly loaded but incorrectly under production-like workloads. If the first analysis is successful, run a sequence of increasingly large analyses until you encounter a failure or you reach a `blob_count` of at least `2000`, a `max_blob_size` of at least `2gb`, a `max_total_data_size` of at least `1tb`, and a `register_operation_count` of at least `100`. Always specify a generous timeout, possibly `1h` or longer, to allow time for each analysis to run to completion. Some repositories may behave correctly when accessed by a small number of Elasticsearch nodes but incorrectly when accessed concurrently by a production-scale cluster. Perform the analyses using a multi-node cluster of a similar size to your production cluster so that it can detect any problems that only arise when the repository is accessed by many nodes at once. If the analysis fails, Elasticsearch detected that your repository behaved unexpectedly. This usually means you are using a third-party storage system with an incorrect or incompatible implementation of the API it claims to support. If so, this storage system is not suitable for use as a snapshot repository. Repository analysis triggers conditions that occur only rarely when taking snapshots in a production system. Snapshotting to unsuitable storage may appear to work correctly most of the time despite repository analysis failures. However your snapshot data is at risk if you store it in a snapshot repository that does not reliably pass repository analysis. You can demonstrate that the analysis failure is due to an incompatible storage implementation by verifying that Elasticsearch does not detect the same problem when analysing the reference implementation of the storage protocol you are using. For instance, if you are using storage that offers an API which the supplier claims to be compatible with AWS S3, verify that repositories in AWS S3 do not fail repository analysis. This allows you to demonstrate to your storage supplier that a repository analysis failure must only be caused by an incompatibility with AWS S3 and cannot be attributed to a problem in Elasticsearch. Please do not report Elasticsearch issues involving third-party storage systems unless you can demonstrate that the same issue exists when analysing a repository that uses the reference implementation of the same storage protocol. You will need to work with the supplier of your storage system to address the incompatibilities that Elasticsearch detects. The analysis may also report a failure if your repository experienced a service disruption while the analysis was running. In practice, occasional service disruptions are inevitable, but the analysis cannot itself distinguish such disruptions from incorrect behavior so must report all deviations from the expected behavior as failures. If you are certain that you can ascribe an analysis failure to such a service disruption, wait for your service provider to resolve the disruption and then re-run the analysis.
      operationId: snapshot-repository-analyze
      parameters:
      - in: path
        name: repository
        description: The name of the repository.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: query
        name: blob_count
        description: 'The total number of blobs to write to the repository during the test.

          For realistic experiments, set this parameter to at least `2000`.'
        deprecated: false
        schema:
          default: 100
          type: number
        style: form
      - in: query
        name: check_overwrite_protection
        description: 'Whether to run the overwrite protection check.

          For realistic experiments, leave this parameter unset.'
        deprecated: false
        schema:
          default: true
          type: boolean
        x-state: Generally available; Added in 9.5.0
        style: form
      - in: query
        name: concurrency
        description: 'The number of operations to run concurrently during the test.

          For realistic experiments, leave this parameter unset.'
        deprecated: false
        schema:
          default: 10
          type: number
        style: form
      - in: query
        name: detailed
        description: 'Indicates whether to return detailed results, including timing information for every operation performed during the analysis.

          If false, it returns only a summary of the analysis.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: early_read_node_count
        description: 'The number of nodes on which to perform an early read operation while writing each blob.

          Early read operations are only rarely performed.

          For realistic experiments, leave this parameter unset.'
        deprecated: false
        schema:
          default: 2
          type: number
        style: form
      - in: query
        name: max_blob_size
        description: 'The maximum size of a blob to be written during the test.

          For realistic experiments, set this parameter to at least `2gb`.'
        deprecated: false
        schema:
          default: 10mb
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        style: form
      - in: query
        name: max_total_data_size
        description: 'An upper limit on the total size of all the blobs written during the test.

          For realistic experiments, set this parameter to at least `1tb`.'
        deprecated: false
        schema:
          default: 1gb
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        style: form
      - in: query
        name: rare_action_probability
        description: 'The probability of performing a rare action such as an early read, an overwrite, or an aborted write on each blob.

          For realistic experiments, leave this parameter unset.'
        deprecated: false
