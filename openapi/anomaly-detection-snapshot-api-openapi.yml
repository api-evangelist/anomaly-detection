        throttled_nanos:
          description: 'The length of time spent waiting due to the `max_restore_bytes_per_sec` or `indices.recovery.max_bytes_per_sec` throttles during the read of the blob, in nanoseconds.

            If the blob was not found, this detail is omitted.'
