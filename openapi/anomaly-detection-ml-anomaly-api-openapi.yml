  /_ml/anomaly_detectors/{job_id}/_update:
    post:
      tags:
      - ml anomaly
      summary: Update an anomaly detection job
      description: 'Updates certain properties of an anomaly detection job.


        ## Required authorization


        * Cluster privileges: `manage_ml`'
      operationId: ml-update-job
      parameters:
      - in: path
        name: job_id
        description: Identifier for the job.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_lazy_open:
                  description: 'Advanced configuration option. Specifies whether this job can open when

                    there is insufficient machine learning node capacity for it to be

                    immediately assigned to a node. If `false` and a machine learning node

                    with capacity to run the job cannot immediately be found, the open

                    anomaly detection jobs API returns an error. However, this is also

                    subject to the cluster-wide `xpack.ml.max_lazy_ml_nodes` setting. If this

                    option is set to `true`, the open anomaly detection jobs API does not

                    return an error and the job waits in the opening state until sufficient

                    machine learning node capacity is available.'
                  default: false
                  type: boolean
                analysis_limits:
                  allOf:
                  - $ref: '#/components/schemas/ml._types.AnalysisMemoryLimit'
                background_persist_interval:
                  description: 'Advanced configuration option. The time between each periodic persistence

                    of the model.

                    The default value is a randomized value between 3 to 4 hours, which

                    avoids all jobs persisting at exactly the same time. The smallest allowed

                    value is 1 hour.

                    For very large models (several GB), persistence could take 10-20 minutes,

                    so do not set the value too low.

                    If the job is open when you make the update, you must stop the datafeed,

                    close the job, then reopen the job and restart the datafeed for the

                    changes to take effect.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                custom_settings:
                  description: 'Advanced configuration option. Contains custom meta data about the job.

                    For example, it can contain custom URL information as shown in Adding

                    custom URLs to machine learning results.'
                  type: object
                  additionalProperties:
                    type: object
                categorization_filters:
                  type: array
                  items:
                    type: string
                description:
                  description: A description of the job.
                  type: string
                model_plot_config:
                  allOf:
                  - $ref: '#/components/schemas/ml._types.ModelPlotConfig'
                model_prune_window:
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                daily_model_snapshot_retention_after_days:
                  description: 'Advanced configuration option, which affects the automatic removal of old

                    model snapshots for this job. It specifies a period of time (in days)

                    after which only the first snapshot per day is retained. This period is

                    relative to the timestamp of the most recent snapshot for this job. Valid

                    values range from 0 to `model_snapshot_retention_days`. For jobs created

                    before version 7.8.0, the default value matches

                    `model_snapshot_retention_days`.'
                  default: 1
                  type: number
                model_snapshot_retention_days:
                  description: 'Advanced configuration option, which affects the automatic removal of old

                    model snapshots for this job. It specifies the maximum period of time (in

                    days) that snapshots are retained. This period is relative to the

                    timestamp of the most recent snapshot for this job.'
                  default: 10
                  type: number
                renormalization_window_days:
                  description: 'Advanced configuration option. The period over which adjustments to the

                    score are applied, as new data is seen.'
                  type: number
                results_retention_days:
                  description: 'Advanced configuration option. The period of time (in days) that results

                    are retained. Age is calculated relative to the timestamp of the latest

                    bucket result. If this property has a non-null value, once per day at

                    00:30 (server time), results that are the specified number of days older

                    than the latest bucket result are deleted from Elasticsearch. The default

                    value is null, which means all results are retained.'
                  type: number
                groups:
                  description: A list of job groups. A job can belong to no groups or many.
                  type: array
                  items:
                    type: string
                detectors:
                  description: An array of detector update objects.
                  type: array
                  items:
                    $ref: '#/components/schemas/ml._types.DetectorUpdate'
                per_partition_categorization:
                  description: Settings related to how categorization interacts with partition fields.
                  allOf:
                  - $ref: '#/components/schemas/ml._types.PerPartitionCategorization'
            examples:
              MlUpdateJobExample1:
                description: An example body for a `POST _ml/anomaly_detectors/low_request_rate/_update` request.
                value: "{\n  \"description\":\"An updated job\",\n  \"detectors\": {\n    \"detector_index\": 0,\n    \"description\": \"An updated detector description\"\n  },\n  \"groups\": [\"kibana_sample_data\",\"kibana_sample_web_logs\"],\n  \"model_plot_config\": {\n    \"enabled\": true\n  },\n  \"renormalization_window_days\": 30,\n  \"background_persist_interval\": \"2h\",\n  \"model_snapshot_retention_days\": 7,\n  \"results_retention_days\": 60\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  allow_lazy_open:
                    type: boolean
                  analysis_config:
                    allOf:
                    - $ref: '#/components/schemas/ml._types.AnalysisConfigRead'
                  analysis_limits:
                    allOf:
                    - $ref: '#/components/schemas/ml._types.AnalysisLimits'
                  background_persist_interval:
                    allOf:
                    - $ref: '#/components/schemas/_types.Duration'
                  create_time:
                    allOf:
                    - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
                  finished_time:
                    allOf:
                    - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
                  custom_settings:
                    type: object
                    additionalProperties:
                      type: string
                  daily_model_snapshot_retention_after_days:
                    type: number
                  data_description:
                    allOf:
                    - $ref: '#/components/schemas/ml._types.DataDescription'
                  datafeed_config:
                    allOf:
                    - $ref: '#/components/schemas/ml._types.Datafeed'
                  description:
                    type: string
                  groups:
                    type: array
                    items:
                      type: string
                  job_id:
                    allOf:
                    - $ref: '#/components/schemas/_types.Id'
                  job_type:
                    type: string
                  job_version:
                    allOf:
                    - $ref: '#/components/schemas/_types.VersionString'
                  model_plot_config:
                    allOf:
                    - $ref: '#/components/schemas/ml._types.ModelPlotConfig'
                  model_snapshot_id:
                    allOf:
                    - $ref: '#/components/schemas/_types.Id'
                  model_snapshot_retention_days:
                    type: number
                  renormalization_window_days:
                    type: number
                  results_index_name:
                    allOf:
                    - $ref: '#/components/schemas/_types.IndexName'
                  results_retention_days:
                    type: number
                required:
                - allow_lazy_open
                - analysis_config
                - analysis_limits
                - create_time
                - daily_model_snapshot_retention_after_days
                - data_description
                - job_id
                - job_type
                - job_version
                - model_snapshot_retention_days
                - results_index_name
      x-state: Generally available; Added in 5.5.0
      x-codeSamples:
      - lang: Console
        source: "POST _ml/anomaly_detectors/low_request_rate/_update\n{\n  \"description\":\"An updated job\",\n  \"detectors\": {\n    \"detector_index\": 0,\n    \"description\": \"An updated detector description\"\n  },\n  \"groups\": [\"kibana_sample_data\",\"kibana_sample_web_logs\"],\n  \"model_plot_config\": {\n    \"enabled\": true\n  },\n  \"renormalization_window_days\": 30,\n  \"background_persist_interval\": \"2h\",\n  \"model_snapshot_retention_days\": 7,\n  \"results_retention_days\": 60\n}"
      - lang: Python
