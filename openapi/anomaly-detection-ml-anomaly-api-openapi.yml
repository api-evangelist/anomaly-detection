        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: duration
        description: 'A period of time that indicates how far into the future to forecast. For

          example, `30d` corresponds to 30 days. The forecast starts at the last

          record that was processed.'
