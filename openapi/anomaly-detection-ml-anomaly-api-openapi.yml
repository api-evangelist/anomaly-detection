          include:
            description: Terms to include.
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.TermsInclude'
          jlh:
            description: Use JLH score as the significance score.
            allOf:
            - $ref: '#/components/schemas/_types.EmptyObject'
