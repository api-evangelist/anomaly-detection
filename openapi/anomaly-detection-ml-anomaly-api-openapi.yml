  /_ml/datafeeds/{datafeed_id}/_update:
    post:
      tags:
      - ml anomaly
      summary: Update a datafeed
      description: 'You must stop and start the datafeed for the changes to be applied.

        When Elasticsearch security features are enabled, your datafeed remembers which roles the user who updated it had at

        the time of the update and runs the query using those same roles. If you provide secondary authorization headers,

        those credentials are used instead.


        ## Required authorization


        * Cluster privileges: `manage_ml`'
      operationId: ml-update-datafeed
      parameters:
      - in: path
        name: datafeed_id
        description: 'A numerical character string that uniquely identifies the datafeed.

          This identifier can contain lowercase alphanumeric characters (a-z and 0-9), hyphens, and underscores.

          It must start and end with alphanumeric characters.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: allow_no_indices
        description: 'A setting that does two separate checks on the index expression.

          If `false`, the request returns an error (1) if any wildcard expression

          (including `_all` and `*`) resolves to zero matching indices or (2) if the

          complete set of resolved indices, aliases or data streams is empty after all

          expressions are evaluated. If `true`, index expressions that resolve to no

          indices are allowed and the request returns an empty result.'
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      - in: query
        name: expand_wildcards
        description: "Type of index that wildcard patterns can match. If the request can target data streams, this argument determines\nwhether wildcard expressions match hidden data streams. Supports comma-separated values.\n\nSupported values include:\n  - `all`: Match any data stream or index, including hidden ones.\n  - `open`: Match open, non-hidden indices. Also matches any non-hidden data stream.\n  - `closed`: Match closed, non-hidden indices. Also matches any non-hidden data stream. Data streams cannot be closed.\n  - `hidden`: Match hidden data streams and hidden indices. Must be combined with `open`, `closed`, or `both`.\n  - `none`: Wildcard expressions are not accepted.\n\n"
        deprecated: false
        schema:
          default: open
          allOf:
          - $ref: '#/components/schemas/_types.ExpandWildcards'
        style: form
      - in: query
        name: ignore_throttled
        description: If `true`, concrete, expanded or aliased indices are ignored when frozen.
        deprecated: true
        schema:
          default: true
          type: boolean
        style: form
      - in: query
        name: ignore_unavailable
        description: 'If `false`, the request returns an error if it targets a concrete (non-wildcarded)

          index, alias, or data stream that is missing, closed, or otherwise unavailable.

          If `true`, unavailable concrete targets are silently ignored.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                aggregations:
                  description: 'If set, the datafeed performs aggregation searches. Support for aggregations is limited and should be used only

                    with low cardinality data.'
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/_types.aggregations.AggregationContainer'
                chunking_config:
                  description: 'Datafeeds might search over long time periods, for several months or years. This search is split into time

                    chunks in order to ensure the load on Elasticsearch is managed. Chunking configuration controls how the size of

                    these time chunks are calculated; it is an advanced configuration option.'
                  allOf:
                  - $ref: '#/components/schemas/ml._types.ChunkingConfig'
                delayed_data_check_config:
                  description: 'Specifies whether the datafeed checks for missing data and the size of the window. The datafeed can optionally

                    search over indices that have already been read in an effort to determine whether any data has subsequently been

                    added to the index. If missing data is found, it is a good indication that the `query_delay` is set too low and

                    the data is being indexed after the datafeed has passed that moment in time. This check runs only on real-time

                    datafeeds.'
                  allOf:
                  - $ref: '#/components/schemas/ml._types.DelayedDataCheckConfig'
                frequency:
                  description: 'The interval at which scheduled queries are made while the datafeed runs in real time. The default value is

                    either the bucket span for short bucket spans, or, for longer bucket spans, a sensible fraction of the bucket

                    span. When `frequency` is shorter than the bucket span, interim results for the last (partial) bucket are

                    written then eventually overwritten by the full bucket results. If the datafeed uses aggregations, this value

                    must be divisible by the interval of the date histogram aggregation.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                indices:
                  description: 'An array of index names. Wildcards are supported. If any of the indices are in remote clusters, the machine

                    learning nodes must have the `remote_cluster_client` role.'
                  type: array
                  items:
                    type: string
                indices_options:
                  description: Specifies index expansion options that are used during search.
                  allOf:
                  - $ref: '#/components/schemas/_types.IndicesOptions'
                job_id:
                  allOf:
                  - $ref: '#/components/schemas/_types.Id'
                max_empty_searches:
                  description: 'If a real-time datafeed has never seen any data (including during any initial training period), it automatically

                    stops and closes the associated job after this many real-time searches return no documents. In other words,

                    it stops after `frequency` times `max_empty_searches` of real-time operation. If not set, a datafeed with no

                    end time that sees no data remains started until it is explicitly stopped. By default, it is not set.'
                  type: number
                max_consecutive_extraction_failures:
                  description: 'The maximum number of consecutive real-time data extraction failures the datafeed tolerates before it

                    automatically stops itself, leaving the associated job open. The consecutive-failure counter resets on any

                    cycle that extracts successfully, including empty-data cycles. If not set, the threshold defaults to roughly

                    one day''s worth of searches based on the datafeed `frequency` (floored at 1). Set to `-1` to disable auto-stop

                    and retry indefinitely. Values of `0` or less than `-1` are rejected.'
                  type: number
                query:
                  description: 'The Elasticsearch query domain-specific language (DSL). This value corresponds to the query object in an

                    Elasticsearch search POST body. All the options that are supported by Elasticsearch can be used, as this

                    object is passed verbatim to Elasticsearch. Note that if you change the query, the analyzed data is also

                    changed. Therefore, the time required to learn might be long and the understandability of the results is

                    unpredictable. If you want to make significant changes to the source data, it is recommended that you

                    clone the job and datafeed and make the amendments in the clone. Let both run in parallel and close one

                    when you are satisfied with the results of the job.'
                  default: '{"match_all": {"boost": 1}}'
                  allOf:
                  - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
                query_delay:
                  description: 'The number of seconds behind real time that data is queried. For example, if data from 10:04 a.m. might

                    not be searchable in Elasticsearch until 10:06 a.m., set this property to 120 seconds. The default

                    value is randomly selected between `60s` and `120s`. This randomness improves the query performance

                    when there are multiple jobs running on the same node.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                runtime_mappings:
                  description: Specifies runtime fields for the datafeed search.
                  allOf:
                  - $ref: '#/components/schemas/_types.mapping.RuntimeFields'
                script_fields:
