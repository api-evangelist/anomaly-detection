  /_ml/anomaly_detectors/_estimate_model_memory:
    post:
      tags:
      - ml anomaly
      summary: Estimate job model memory usage
      description: 'Make an estimation of the memory usage for an anomaly detection job model.

        The estimate is based on analysis configuration details for the job and cardinality

        estimates for the fields it references.


        ## Required authorization


        * Cluster privileges: `manage_ml`'
      operationId: ml-estimate-model-memory
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                analysis_config:
                  description: 'For a list of the properties that you can specify in the

                    `analysis_config` component of the body of this API.'
                  allOf:
                  - $ref: '#/components/schemas/ml._types.AnalysisConfig'
                max_bucket_cardinality:
                  description: 'Estimates of the highest cardinality in a single bucket that is observed

                    for influencer fields over the time period that the job analyzes data.

                    To produce a good answer, values must be provided for all influencer

                    fields. Providing values for fields that are not listed as `influencers`

                    has no effect on the estimation.'
                  type: object
                  additionalProperties:
                    type: number
                overall_cardinality:
                  description: 'Estimates of the cardinality that is observed for fields over the whole

                    time period that the job analyzes data. To produce a good answer, values

                    must be provided for fields referenced in the `by_field_name`,

                    `over_field_name` and `partition_field_name` of any detectors. Providing

                    values for other fields has no effect on the estimation. It can be

                    omitted from the request if no detectors have a `by_field_name`,

                    `over_field_name` or `partition_field_name`.'
                  type: object
                  additionalProperties:
                    type: number
            examples:
              MlEstimateModelMemoryRequestExample1:
                description: Run `POST _ml/anomaly_detectors/_estimate_model_memory` to estimate the model memory limit based on the analysis configuration details provided in the request body.
                value: "{\n  \"analysis_config\": {\n    \"bucket_span\": \"5m\",\n    \"detectors\": [\n      {\n        \"function\": \"sum\",\n        \"field_name\": \"bytes\",\n        \"by_field_name\": \"status\",\n        \"partition_field_name\": \"app\"\n      }\n    ],\n    \"influencers\": [\n      \"source_ip\",\n      \"dest_ip\"\n    ]\n  },\n  \"overall_cardinality\": {\n    \"status\": 10,\n    \"app\": 50\n  },\n  \"max_bucket_cardinality\": {\n    \"source_ip\": 300,\n    \"dest_ip\": 30\n  }\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_memory_estimate:
                    type: string
                required:
                - model_memory_estimate
              examples:
                MlEstimateModelMemoryResponseExample1:
                  description: A successful response from `POST _ml/anomaly_detectors/_estimate_model_memory`.
                  value: "{\n  \"model_memory_estimate\": \"21mb\"\n}"
