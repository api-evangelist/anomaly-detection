        name: advance_time
        description: 'Specifies to advance to a particular time value. Results are generated

          and the model is updated for data from the specified time interval.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.DateTime'
        style: form
      - in: query
        name: calc_interim
        description: 'If true, calculates the interim results for the most recent bucket or all

          buckets within the latency period.'
        deprecated: false
        schema:
          type: boolean
        style: form
      - in: query
        name: end
        description: 'When used in conjunction with `calc_interim` and `start`, specifies the

          range of buckets on which to calculate interim results.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.DateTime'
        style: form
      - in: query
        name: skip_time
        description: 'Specifies to skip to a particular time value. Results are not generated

          and the model is not updated for data from the specified time interval.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.DateTime'
        style: form
      - in: query
        name: start
        description: 'When used in conjunction with `calc_interim`, specifies the range of

