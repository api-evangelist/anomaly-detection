        schema:
          default: 1d
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: expires_in
        description: 'The period of time that forecast results are retained. After a forecast

          expires, the results are deleted. If set to a value of 0, the forecast is

          never automatically deleted.'
        deprecated: false
        schema:
          default: 14d
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: max_model_memory
        description: 'The maximum memory the forecast can use. If the forecast needs to use

          more than the provided amount, it will spool to disk. Default is 20mb,

          maximum is 500mb and minimum is 1mb. If set to 40% or more of the job’s

          configured memory limit, it is automatically reduced to below that

          amount.'
        deprecated: false
        schema:
