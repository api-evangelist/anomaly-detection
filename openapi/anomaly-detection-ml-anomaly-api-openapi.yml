  /_ml/anomaly_detectors/{job_id}/model_snapshots/{snapshot_id}/_upgrade:
    post:
      tags:
      - ml anomaly
      summary: Upgrade a snapshot
      description: 'Upgrade an anomaly detection model snapshot to the latest major version.

        Over time, older snapshot formats are deprecated and removed. Anomaly

        detection jobs support only snapshots that are from the current or previous

        major version.

        This API provides a means to upgrade a snapshot to the current major version.

        This aids in preparing the cluster for an upgrade to the next major version.

        Only one snapshot per anomaly detection job can be upgraded at a time and the

        upgraded snapshot cannot be the current snapshot of the anomaly detection

        job.


        ## Required authorization


        * Cluster privileges: `manage_ml`'
      operationId: ml-upgrade-job-snapshot
      parameters:
      - in: path
        name: job_id
        description: Identifier for the anomaly detection job.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: path
        name: snapshot_id
        description: A numerical character string that uniquely identifies the model snapshot.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: wait_for_completion
        description: 'When true, the API won’t respond until the upgrade is complete.

          Otherwise, it responds as soon as the upgrade task is assigned to a node.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: timeout
        description: Controls the time to wait for the request to complete.
        deprecated: false
        schema:
          default: 30m
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  node:
                    description: The ID of the node that the upgrade task was started on if it is still running. In serverless this will be the "serverless".
                    allOf:
                    - $ref: '#/components/schemas/_types.NodeId'
                  completed:
                    description: When true, this means the task is complete. When false, it is still running.
                    type: boolean
                required:
                - node
                - completed
      x-state: Generally available; Added in 5.4.0
      x-codeSamples:
