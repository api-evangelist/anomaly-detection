  /_ml/datafeeds/{datafeed_id}/_start:
    post:
      tags:
      - ml anomaly
      summary: Start datafeeds
      description: 'A datafeed must be started in order to retrieve data from Elasticsearch. A datafeed can be started and stopped

        multiple times throughout its lifecycle.


        Before you can start a datafeed, the anomaly detection job must be open. Otherwise, an error occurs.


        If you restart a stopped datafeed, it continues processing input data from the next millisecond after it was stopped.

        If new data was indexed for that exact millisecond between stopping and starting, it will be ignored.


        When Elasticsearch security features are enabled, your datafeed remembers which roles the last user to create or

        update it had at the time of creation or update and runs the query using those same roles. If you provided secondary

        authorization headers when you created or updated the datafeed, those credentials are used instead.


        ## Required authorization


        * Cluster privileges: `manage_ml`'
      operationId: ml-start-datafeed
      parameters:
      - in: path
        name: datafeed_id
        description: 'A numerical character string that uniquely identifies the datafeed. This identifier can contain lowercase

          alphanumeric characters (a-z and 0-9), hyphens, and underscores. It must start and end with alphanumeric

          characters.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: end
        description: 'The time that the datafeed should end, which can be specified by using one of the following formats:


          * ISO 8601 format with milliseconds, for example `2017-01-22T06:00:00.000Z`

          * ISO 8601 format without milliseconds, for example `2017-01-22T06:00:00+00:00`

          * Milliseconds since the epoch, for example `1485061200000`


          Date-time arguments using either of the ISO 8601 formats must have a time zone designator, where `Z` is accepted

          as an abbreviation for UTC time. When a URL is expected (for example, in browsers), the `+` used in time zone

          designators must be encoded as `%2B`.

          The end time value is exclusive. If you do not specify an end time, the datafeed

          runs continuously.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.DateTime'
        style: form
      - in: query
        name: start
        description: 'The time that the datafeed should begin, which can be specified by using the same formats as the `end` parameter.

          This value is inclusive.

          If you do not specify a start time and the datafeed is associated with a new anomaly detection job, the analysis

          starts from the earliest time for which data is available.

          If you restart a stopped datafeed and specify a start value that is earlier than the timestamp of the latest

          processed record, the datafeed continues from 1 millisecond after the timestamp of the latest processed record.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.DateTime'
        style: form
      - in: query
        name: timeout
        description: Specifies the amount of time to wait until a datafeed starts.
        deprecated: false
        schema:
          default: 20s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                end:
                  description: Refer to the description for the `end` query parameter.
                  allOf:
                  - $ref: '#/components/schemas/_types.DateTime'
                start:
                  description: Refer to the description for the `start` query parameter.
                  allOf:
                  - $ref: '#/components/schemas/_types.DateTime'
                timeout:
                  description: Refer to the description for the `timeout` query parameter.
                  default: 20s
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
            examples:
              MlStartDatafeedExample1:
                description: An example body for a `POST _ml/datafeeds/datafeed-low_request_rate/_start` request.
                value: "{\n  \"start\": \"2019-04-07T18:22:16Z\"\n}"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  node:
                    description: 'The ID of the node that the job was started on. In serverless this will be the "serverless".

                      If the job is allowed to open lazily and has not yet been assigned to a node, this value is an empty string.'
                    allOf:
                    - $ref: '#/components/schemas/_types.NodeIds'
                  started:
                    description: For a successful response, this value is always `true`. On failure, an exception is returned instead.
                    type: boolean
                required:
                - node
                - started
      x-state: Generally available; Added in 5.5.0
      x-codeSamples:
      - lang: Console
        source: "POST _ml/datafeeds/datafeed-low_request_rate/_start\n{\n  \"start\": \"2019-04-07T18:22:16Z\"\n}"
      - lang: Python
        source: "resp = client.ml.start_datafeed(\n    datafeed_id=\"datafeed-low_request_rate\",\n    start=\"2019-04-07T18:22:16Z\",\n)"
      - lang: JavaScript
        source: "const response = await client.ml.startDatafeed({\n  datafeed_id: \"datafeed-low_request_rate\",\n  start: \"2019-04-07T18:22:16Z\",\n});"
      - lang: Ruby
        source: "response = client.ml.start_datafeed(\n  datafeed_id: \"datafeed-low_request_rate\",\n  body: {\n    \"start\": \"2019-04-07T18:22:16Z\"\n  }\n)"
      - lang: PHP
        source: "$resp = $client->ml()->startDatafeed([\n    \"datafeed_id\" => \"datafeed-low_request_rate\",\n    \"body\" => [\n        \"start\" => \"2019-04-07T18:22:16Z\",\n    ],\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"start":"2019-04-07T18:22:16Z"}'' "$ELASTICSEARCH_URL/_ml/datafeeds/datafeed-low_request_rate/_start"'
      - lang: C#
        source: "var response = await client.MachineLearning\n    .StartDatafeedAsync(datafeedId: \"datafeed-low_request_rate\", d1 => d1\n        .Start(DateTimeOffset.Parse(\"2019-04-07T18:22:16.0000000+00:00\", CultureInfo.InvariantCulture, DateTimeStyles.RoundtripKind))\n    );"
      - lang: Java
        source: "client.ml().startDatafeed(s -> s\n    .datafeedId(\"datafeed-low_request_rate\")\n    .start(DateTime.of(\"2019-04-07T18:22:16Z\"))\n);\n"
      x-metaTags:
      - content: Elasticsearch, Machine Learning
        name: product_name
  /_ml/datafeeds/{datafeed_id}/_stop:
    post:
      tags:
      - ml anomaly
      summary: Stop datafeeds
      description: 'A datafeed that is stopped ceases to retrieve data from Elasticsearch. A datafeed can be started and stopped

        multiple times throughout its lifecycle.


        ## Required authorization


        * Cluster privileges: `manage_ml`'
      operationId: ml-stop-datafeed
      parameters:
      - in: path
        name: datafeed_id
        description: 'Identifier for the datafeed. You can stop multiple datafeeds in a single API request by using a comma-separated

          list of datafeeds or a wildcard expression. You can close all datafeeds by using `_all` or by specifying `*` as

          the identifier.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      - in: query
        name: allow_no_match
        description: 'Specifies what to do when the request:


          * Contains wildcard expressions and there are no datafeeds that match.

          * Contains the `_all` string or no identifiers and there are no matches.

          * Contains wildcard expressions and there are only partial matches.


          If `true`, the API returns an empty datafeeds array when there are no matches and the subset of results when

          there are partial matches. If `false`, the API returns a 404 status code when there are no matches or only

          partial matches.'
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      - in: query
        name: force
        description: If `true`, the datafeed is stopped forcefully.
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: timeout
        description: Specifies the amount of time to wait until a datafeed stops.
        deprecated: false
        schema:
          default: 20s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: close_job
        description: If `true` the job associated with the datafeed is closed.
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_no_match:
                  description: Refer to the description for the `allow_no_match` query parameter.
                  default: true
                  type: boolean
                force:
                  description: Refer to the description for the `force` query parameter.
                  default: false
                  type: boolean
                timeout:
                  description: Refer to the description for the `timeout` query parameter.
                  default: 20s
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                close_job:
                  description: Refer to the description for the `close_job` query parameter.
                  default: false
                  type: boolean
            examples:
              MlStopDatafeedExample1:
                description: An example body for a `POST _ml/datafeeds/datafeed-low_request_rate/_stop` request.
                value: "{\n  \"timeout\": \"30s\"\n}"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
