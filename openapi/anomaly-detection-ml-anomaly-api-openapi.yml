                    allOf:
                    - $ref: '#/components/schemas/_types.mapping.RuntimeFields'
                  script_fields:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/_types.ScriptField'
                  scroll_size:
                    type: number
                required:
                - chunking_config
                - datafeed_id
                - indices
                - job_id
                - query
                - query_delay
                - scroll_size
