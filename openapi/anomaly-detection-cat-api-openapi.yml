              $ref: '#/components/schemas/cat.thread_pool.ThreadPoolRecord'
          examples:
            CatThreadPoolResponseExample1:
              summary: Default columns
              description: 'A successful response from `GET /_cat/thread_pool?format=json`.

                '
              value: "[\n  {\n    \"node_name\": \"node-0\",\n    \"name\": \"analyze\",\n    \"active\": \"0\",\n    \"queue\": \"0\",\n    \"rejected\": \"0\"\n  },\n  {\n    \"node_name\": \"node-0\",\n    \"name\": \"fetch_shard_started\",\n    \"active\": \"0\",\n    \"queue\": \"0\",\n    \"rejected\": \"0\"\n  },\n  {\n    \"node_name\": \"node-0\",\n    \"name\": \"fetch_shard_store\",\n    \"active\": \"0\",\n    \"queue\": \"0\",\n    \"rejected\": \"0\"\n  },\n  {\n    \"node_name\": \"node-0\",\n    \"name\": \"flush\",\n    \"active\": \"0\",\n    \"queue\": \"0\",\n    \"rejected\": \"0\"\n  },\n  {\n    \"node_name\": \"node-0\",\n    \"name\": \"write\",\n    \"active\": \"0\",\n    \"queue\": \"0\",\n    \"rejected\": \"0\"\n  }\n]"
            CatThreadPoolResponseExample2:
              summary: Explicit columns
              description: 'A successful response from `GET /_cat/thread_pool/generic?v=true&h=id,name,active,rejected,completed&format=json`. It returns the `id`, `name`, `active`, `rejected`, and `completed` columns. It also limits returned information to the generic thread pool.

                '
              value: "[\n  {\n    \"id\": \"0EWUhXeBQtaVGlexUeVwMg\",\n    \"name\": \"generic\",\n    \"active\": \"0\",\n    \"rejected\": \"0\",\n    \"completed\": \"70\"\n  }\n]"
    cat.shards-200:
      description: ''
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/cat.shards.ShardsRecord'
          examples:
            CatShardsResponseExample1:
              summary: A single data stream or index
              description: 'A successful response from `GET _cat/shards?format=json`.

                '
              value: "[\n  {\n    \"index\": \"my-index-000001\",\n    \"shard\": \"0\",\n    \"prirep\": \"p\",\n    \"state\": \"STARTED\",\n    \"docs\": \"3014\",\n    \"store\": \"31.1mb\",\n    \"dataset\": \"249b\",\n    \"ip\": \"192.168.56.10\",\n    \"node\": \"H5dfFeA\"\n  }\n]"
            CatShardsResponseExample2:
              summary: A wildcard pattern
              description: 'A successful response from `GET _cat/shards/my-index-*?format=json`. It returns information for any data streams or indices beginning with `my-index-`.

                '
              value: "[\n  {\n    \"index\": \"my-index-000001\",\n    \"shard\": \"0\",\n    \"prirep\": \"p\",\n    \"state\": \"STARTED\",\n    \"docs\": \"3014\",\n    \"store\": \"31.1mb\",\n    \"dataset\": \"249b\",\n    \"ip\": \"192.168.56.10\",\n    \"node\": \"H5dfFeA\"\n  }\n]"
            CatShardsResponseExample3:
              summary: A relocating shard
