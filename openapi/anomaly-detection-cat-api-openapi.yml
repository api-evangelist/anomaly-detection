  /_cat/health:
    get:
      tags:
      - Cat
      summary: Get the cluster health status
      description: 'IMPORTANT: CAT APIs are only intended for human consumption using the command line or Kibana console.

        They are not intended for use by applications. For application consumption, use the cluster health API.

        This API is often used to check malfunctioning clusters.

        To help you track cluster health alongside log files and alerting systems, the API returns timestamps in two formats:

        `HH:MM:SS`, which is human-readable but includes no date information;

        `Unix epoch time`, which is machine-sortable and includes date information.

        The latter format is useful for cluster recoveries that take multiple days.

        You can use the cat health API to verify cluster health across multiple nodes.

        You also can use the API to track the recovery of a large cluster over a longer period of time.


        ## Required authorization


        * Cluster privileges: `monitor`'
      operationId: cat-health
      parameters:
      - in: query
        name: ts
        description: If true, returns `HH:MM:SS` and Unix epoch timestamps.
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      - in: query
        name: h
        description: "A comma-separated list of columns names to display. It supports simple wildcards.\n\nSupported values include:\n  - `epoch` (or `t`, `time`): The number of seconds since 1970-01-01 00:00:00.\n  - `timestamp` (or `ts`, `hms`, `hhmmss`): The time in HH:MM:SS format.\n  - `cluster` (or `cl`): The cluster name.\n  - `status` (or `st`): The health status.\n  - `node.total` (or `nt`, `nodeTotal`): The total number of nodes that can store data.\n  - `node.data` (or `nd`, `nodeData`): The number of nodes that can store data.\n  - `shards` (or `t`, `sh`, `shards.total`, `shardsTotal`): The total number of shards.\n  - `pri` (or `p`, `shards.primary`, `shardsPrimary`): The number of primary shards.\n  - `relo` (or `r`, `shards.relocating`, `shardsRelocating`): The number of relocating nodes.\n  - `init` (or `i`, `shards.initializing`, `shardsInitializing`): The number of initializing nodes.\n  - `unassign` (or `u`, `shards.unassigned`, `shardsUnassigned`): The number of unassigned shards.\n  - `unassign.pri` (or `up`, `shards.unassigned.primary`, `shardsUnassignedPrimary`): The number of unassigned primary shards.\n  - `pending_tasks` (or `pt`, `pendingTasks`): The number of pending tasks.\n  - `max_task_wait_time` (or `mtwt`, `maxTaskWaitTime`): The wait time of the longest pending task.\n  - `active_shards_percent` (or `asp`, `activeShardsPercent`): The percentage of active shards.\n\n"
        deprecated: false
        schema:
          $ref: '#/components/schemas/cat._types.CatHealthColumns'
        style: form
      - in: query
        name: s
        description: 'List of columns that determine how the table should be sorted.

          Sorting defaults to ascending and can be changed by setting `:asc`

          or `:desc` as a suffix to the column name.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Names'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/cat.health.HealthRecord'
              examples:
                CatHealthResponseExample1:
                  description: 'A successful response from `GET /_cat/health?v=true&format=json`. By default, it returns `HH:MM:SS` and Unix epoch timestamps.

                    '
                  value: "[\n  {\n    \"epoch\": \"1475871424\",\n    \"timestamp\": \"16:17:04\",\n    \"cluster\": \"elasticsearch\",\n    \"status\": \"green\",\n    \"node.total\": \"1\",\n    \"node.data\": \"1\",\n    \"shards\": \"1\",\n    \"pri\": \"1\",\n    \"relo\": \"0\",\n    \"init\": \"0\",\n    \"unassign\": \"0\",\n    \"unassign.pri\": \"0\",\n    \"pending_tasks\": \"0\",\n    \"max_task_wait_time\": \"-\",\n    \"active_shards_percent\": \"100.0%\"\n  }\n]"
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: 'GET /_cat/health?v=true&format=json

          '
      - lang: Python
        source: "resp = client.cat.health(\n    v=True,\n    format=\"json\",\n)"
      - lang: JavaScript
        source: "const response = await client.cat.health({\n  v: \"true\",\n  format: \"json\",\n});"
      - lang: Ruby
        source: "response = client.cat.health(\n  v: \"true\",\n  format: \"json\"\n)"
      - lang: PHP
        source: "$resp = $client->cat()->health([\n    \"v\" => \"true\",\n    \"format\" => \"json\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_cat/health?v=true&format=json"'
      - lang: Java
        source: 'client.cat().health(h -> h);

          '
      x-metaTags:
      - content: Elasticsearch
        name: product_name
