      description: ''
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/cat.count.CountRecord'
          examples:
            CatCountResponseExample1:
              summary: Single data stream or index count
              description: 'A successful response from `GET /_cat/count/my-index-000001?v=true&format=json`. It retrieves the document count for the `my-index-000001` data stream or index.

