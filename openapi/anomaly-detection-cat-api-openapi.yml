                '
              value: "[\n  {\n    \"index\": \"my-index-000001\",\n    \"shard\": \"0\",\n    \"prirep\": \"p\",\n    \"state\": \"RELOCATING\",\n    \"docs\": \"3014\",\n    \"store\": \"31.1mb\",\n    \"dataset\": \"249b\",\n    \"ip\": \"192.168.56.10\",\n    \"node\": \"H5dfFeA -> -> 192.168.56.30 bGG90GE\"\n  }\n]"
            CatShardsResponseExample4:
              summary: Shard states
