    cat.recovery.RecoveryRecord:
      type: object
      properties:
        index:
          description: The index name.
          allOf:
          - $ref: '#/components/schemas/_types.IndexName'
        shard:
          description: The shard name.
          type: string
        start_time:
          description: 'The recovery start time.

            For recoveries in the `created` stage (not yet started), this value is the Unix epoch (1970-01-01T00:00:00.000Z).'
          allOf:
          - $ref: '#/components/schemas/_types.DateTime'
        start_time_millis:
          description: 'The recovery start time in epoch milliseconds.

            For recoveries in the `created` stage (not yet started), this value is 0.'
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        stop_time:
          description: 'The recovery stop time.

            For recoveries that have not yet completed, this value is the Unix epoch (1970-01-01T00:00:00.000Z).'
          allOf:
          - $ref: '#/components/schemas/_types.DateTime'
        stop_time_millis:
          description: 'The recovery stop time in epoch milliseconds.

            For recoveries that have not yet completed, this value is 0.'
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        time:
          description: 'The recovery time.

            For recoveries in the `created` stage (not yet started), this value is 0.'
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        type:
          description: The recovery type.
          type: string
        stage:
          description: The recovery stage.
          type: string
        local_retries:
          description: The number of times this recovery has failed in a way which is retried locally (i.e. on the data node).
          x-state: Generally available; Added in 9.6.0
          type: string
        priority:
          description: The recovery priority.
          x-state: Generally available; Added in 9.6.0
          type: string
        gate:
          description: 'The name of the recovery gate that blocked recovery on the target node.


            The value is `n/a` unless the recovery is queued in the `created` stage and blocked by a recovery gate.'
          x-state: Generally available; Added in 9.6.0
          type: string
        blocked_for_millis:
          description: 'The elapsed time in milliseconds recovery is blocked for.


            The value is `n/a` when the recovery is not blocked by a recovery gate.'
          x-state: Generally available; Added in 9.6.0
          type: string
        source_host:
          description: The source host.
          type: string
        source_node:
          description: The source node name.
          type: string
        target_host:
          description: The target host.
          type: string
        target_node:
          description: The target node name.
          type: string
        repository:
          description: The repository name.
          type: string
        snapshot:
          description: The snapshot name.
          type: string
        files:
          description: The number of files to recover.
          type: string
        files_recovered:
          description: The files recovered.
