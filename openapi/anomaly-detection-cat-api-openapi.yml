  /_cat/indices/{index}:
    get:
      tags:
      - Cat
      summary: Get index information
      description: '**All methods and paths for this operation:**


        GET

        /_cat/indices


        GET

        /_cat/indices/{index}


        Get high-level information about indices in a cluster, including backing indices for data streams.


        Use this request to get the following information for each index in a cluster:

        - shard count

        - document count

        - deleted document count

        - primary store size

        - total store size of all shards, including shard replicas


        These metrics are retrieved directly from Lucene, which Elasticsearch uses internally to power indexing and search. As a result, all document counts include hidden nested documents.

        To get an accurate count of Elasticsearch documents, use the cat count or count APIs.


        NOTE: Storage metrics reported by this API reflect the post-compression size of the indices on disk. Because these values are calculated after Elasticsearch compresses the data and processes deletions, they are typically significantly smaller than the raw, uncompressed data volume ingested.


        IMPORTANT: For Elastic Cloud Serverless, ingest billing is based on the raw, uncompressed data volume, not the post-compression metrics reported here. To learn more, refer to Elasticsearch billing dimensions.


        CAT APIs are only intended for human consumption using the command line or Kibana console.

        They are not intended for use by applications. For application consumption, use an index endpoint.


        ## Required authorization


        * Index privileges: `monitor`

        * Cluster privileges: `monitor`'
      operationId: cat-indices
      parameters:
      - $ref: '#/components/parameters/cat.indices-index'
      - $ref: '#/components/parameters/cat.indices-expand_wildcards'
      - $ref: '#/components/parameters/cat.indices-health'
      - $ref: '#/components/parameters/cat.indices-include_unloaded_segments'
      - $ref: '#/components/parameters/cat.indices-pri'
      - $ref: '#/components/parameters/cat.indices-master_timeout'
      - $ref: '#/components/parameters/cat.indices-h'
      - $ref: '#/components/parameters/cat.indices-s'
      responses:
        '200':
          $ref: '#/components/responses/cat.indices-200'
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: 'GET /_cat/indices/my-index-*?v=true&s=index&format=json

          '
      - lang: Python
        source: "resp = client.cat.indices(\n    index=\"my-index-*\",\n    v=True,\n    s=\"index\",\n    format=\"json\",\n)"
      - lang: JavaScript
        source: "const response = await client.cat.indices({\n  index: \"my-index-*\",\n  v: \"true\",\n  s: \"index\",\n  format: \"json\",\n});"
      - lang: Ruby
        source: "response = client.cat.indices(\n  index: \"my-index-*\",\n  v: \"true\",\n  s: \"index\",\n  format: \"json\"\n)"
      - lang: PHP
        source: "$resp = $client->cat()->indices([\n    \"index\" => \"my-index-*\",\n    \"v\" => \"true\",\n    \"s\" => \"index\",\n    \"format\" => \"json\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_cat/indices/my-index-*?v=true&s=index&format=json"'
      - lang: Java
        source: "client.cat().indices(i -> i\n    .index(\"my-index-*\")\n    .s(\"index\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_cat/master:
    get:
      tags:
      - Cat
      summary: Get master node information
      description: 'Get information about the master node, including the ID, bound IP address, and name.


        IMPORTANT: cat APIs are only intended for human consumption using the command line or Kibana console. They are not intended for use by applications. For application consumption, use the nodes info API.


        ## Required authorization


        * Cluster privileges: `monitor`'
      operationId: cat-master
      parameters:
      - in: query
        name: h
        description: "A comma-separated list of columns names to display. It supports simple wildcards.\n\nSupported values include:\n  - `id`: The node ID.\n  - `host` (or `h`): The host name of the node.\n  - `ip`: The IP address of the node.\n  - `node` (or `n`): The node name.\n\n"
        deprecated: false
        schema:
          $ref: '#/components/schemas/cat._types.CatMasterColumns'
        style: form
      - in: query
        name: s
        description: 'List of columns that determine how the table should be sorted.

          Sorting defaults to ascending and can be changed by setting `:asc`

          or `:desc` as a suffix to the column name.'
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Names'
        style: form
      - in: query
        name: local
        description: 'If `true`, the request computes the list of selected nodes from the

          local cluster state. If `false` the list of selected nodes are computed

          from the cluster state of the master node. In both cases the coordinating

          node will send requests for further information to each selected node.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/cat.master.MasterRecord'
              examples:
                CatMasterResponseExample1:
                  description: 'A successful response from `GET /_cat/master?v=true&format=json`.

                    '
                  value: "[\n  {\n    \"id\": \"YzWoH_2BT-6UjVGDyPdqYg\",\n    \"host\": \"127.0.0.1\",\n    \"ip\": \"127.0.0.1\",\n    \"node\": \"YzWoH_2\"\n  }\n]"
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: 'GET /_cat/master?v=true&format=json

          '
      - lang: Python
