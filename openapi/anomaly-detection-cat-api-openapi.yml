openapi: 3.2.0
info:
  title: Elasticsearch Cat API
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the `main` branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: Cat
  x-displayName: Compact and aligned text (CAT)
  description: 'The compact and aligned text (CAT) APIs aim are intended only for human consumption using the Kibana console or command line. They are not intended for use by applications. For application consumption, it''s recommend to use a corresponding JSON API.

    All the cat commands accept a query string parameter `help` to see all the headers and info they provide, and the `/_cat` command alone lists all the available commands.'
paths:
  /_cat/aliases/{name}:
    get:
      tags:
      - Cat
      summary: Get aliases
      description: '**All methods and paths for this operation:**


        GET

        /_cat/aliases


        GET

        /_cat/aliases/{name}


        Get the cluster''s index aliases, including filter and routing information.

        This API does not return data stream aliases.


        IMPORTANT: CAT APIs are only intended for human consumption using the command line or the Kibana console. They are not intended for use by applications. For application consumption, use the aliases API.


        ## Required authorization


        * Index privileges: `view_index_metadata`'
      operationId: cat-aliases
      parameters:
      - $ref: '#/components/parameters/cat.aliases-name'
      - $ref: '#/components/parameters/cat.aliases-h'
      - $ref: '#/components/parameters/cat.aliases-s'
      - $ref: '#/components/parameters/cat.aliases-expand_wildcards'
      - $ref: '#/components/parameters/cat.aliases-master_timeout'
      responses:
        '200':
          $ref: '#/components/responses/cat.aliases-200'
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: 'GET _cat/aliases?format=json&v=true

          '
      - lang: Python
        source: "resp = client.cat.aliases(\n    format=\"json\",\n    v=True,\n)"
      - lang: JavaScript
        source: "const response = await client.cat.aliases({\n  format: \"json\",\n  v: \"true\",\n});"
      - lang: Ruby
        source: "response = client.cat.aliases(\n  format: \"json\",\n  v: \"true\"\n)"
      - lang: PHP
        source: "$resp = $client->cat()->aliases([\n    \"format\" => \"json\",\n    \"v\" => \"true\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_cat/aliases?format=json&v=true"'
      - lang: Java
        source: 'client.cat().aliases(a -> a);

          '
      x-metaTags:
      - content: Elasticsearch
        name: product_name
