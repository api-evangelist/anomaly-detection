components:
  schemas:
    xpack.info.Feature:
      type: object
      properties:
        available:
          type: boolean
        description:
          type: string
        enabled:
          type: boolean
        native_code_info:
          allOf:
          - $ref: '#/components/schemas/xpack.info.NativeCodeInformation'
      required:
      - available
      - enabled
    xpack.usage.GpuNodeStats:
      description: Per-node GPU statistics for vector indexing.
      type: object
      properties:
        type:
          description: GPU device type (e.g., "NVIDIA L4", "NVIDIA A100").
          type: string
        memory_in_bytes:
          description: GPU memory in bytes.
          type: number
        enabled:
          description: Whether GPU vector indexing is enabled on this node.
          type: boolean
        index_build_count:
          description: Number of GPU index builds performed on this node.
          type: number
      required:
      - type
      - memory_in_bytes
      - enabled
      - index_build_count
    xpack.usage.EqlFeaturesKeys:
      type: object
      properties:
        join_keys_two:
          allOf:
          - $ref: '#/components/schemas/_types.uint'
        join_keys_one:
          allOf:
          - $ref: '#/components/schemas/_types.uint'
        join_keys_three:
          allOf:
          - $ref: '#/components/schemas/_types.uint'
        join_keys_five_or_more:
          allOf:
          - $ref: '#/components/schemas/_types.uint'
        join_keys_four:
          allOf:
          - $ref: '#/components/schemas/_types.uint'
      required:
      - join_keys_two
      - join_keys_one
      - join_keys_three
      - join_keys_five_or_more
      - join_keys_four
    _types.VersionString:
      type: string
    xpack.usage.MlInferenceTrainedModelsCount:
      type: object
      properties:
        total:
          type: number
        prepackaged:
          type: number
        other:
          type: number
