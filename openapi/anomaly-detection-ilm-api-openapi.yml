openapi: 3.2.0
info:
  title: Elasticsearch Ilm API
  license:
    name: Apache 2.0
    url: https://github.com/elastic/elasticsearch-specification/blob/main/LICENSE
  version: ''
  description: 'Elasticsearch provides REST APIs that are used by the UI components and can be called directly to configure and access Elasticsearch features.

    ## Documentation source and versions

    This documentation is derived from the `main` branch of the elasticsearch-specification repository. It is provided under license Attribution-NonCommercial-NoDerivatives 4.0 International.

    This documentation contains work-in-progress information for future Elastic Stack releases.'
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+
security:
- apiKeyAuth: []
- basicAuth: []
- bearerAuth: []
tags:
- name: ilm
  x-displayName: Index lifecycle management
  description: The index lifecycle management APIs enable you to set up policies to automatically manage the index lifecycle.
  externalDocs:
    url: https://www.elastic.co/docs/manage-data/lifecycle/index-lifecycle-management
    description: Learn more about managing the index lifecycle.
paths:
  /_ilm/policy/{policy}:
    get:
      tags:
      - ilm
      summary: Get lifecycle policies
      description: '**All methods and paths for this operation:**


        GET

        /_ilm/policy


        GET

        /_ilm/policy/{policy}


        ## Required authorization


        * Cluster privileges: `manage_ilm`,`read_ilm`'
      operationId: ilm-get-lifecycle
      parameters:
      - $ref: '#/components/parameters/ilm.get_lifecycle-policy'
      - $ref: '#/components/parameters/ilm.get_lifecycle-master_timeout'
      - $ref: '#/components/parameters/ilm.get_lifecycle-timeout'
      responses:
        '200':
          $ref: '#/components/responses/ilm.get_lifecycle-200'
      x-state: Generally available; Added in 6.6.0
      x-codeSamples:
      - lang: Console
        source: 'GET _ilm/policy/my_policy

          '
      - lang: Python
        source: "resp = client.ilm.get_lifecycle(\n    name=\"my_policy\",\n)"
      - lang: JavaScript
        source: "const response = await client.ilm.getLifecycle({\n  name: \"my_policy\",\n});"
      - lang: Ruby
        source: "response = client.ilm.get_lifecycle(\n  policy: \"my_policy\"\n)"
      - lang: PHP
        source: "$resp = $client->ilm()->getLifecycle([\n    \"policy\" => \"my_policy\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ilm/policy/my_policy"'
      - lang: C#
        source: "var response = await client.IndexLifecycleManagement\n    .GetLifecycleAsync(d1 => d1\n        .Name(\"my_policy\")\n    );"
      - lang: Java
        source: "client.ilm().getLifecycle(g -> g\n    .name(\"my_policy\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    put:
      tags:
      - ilm
      summary: Create or update a lifecycle policy
      description: 'If the specified policy exists, it is replaced and the policy version is incremented.


        NOTE: Only the latest version of the policy is stored, you cannot revert to previous versions.


        ## Required authorization


        * Index privileges: `manage`

        * Cluster privileges: `manage_ilm`'
      externalDocs:
        description: About index lifecycle management
        url: https://www.elastic.co/docs/manage-data/lifecycle/index-lifecycle-management/index-lifecycle
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/ilm-put-lifecycle.html
      operationId: ilm-put-lifecycle
      parameters:
      - in: path
        name: policy
        description: Identifier for the policy.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: Period to wait for a response. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                policy:
                  allOf:
                  - $ref: '#/components/schemas/ilm._types.Policy'
            examples:
              PutLifecycleRequestExample1:
                description: 'Run `PUT _ilm/policy/my_policy` to create a new policy with arbitrary metadata.

                  '
                value: "{\n  \"policy\": {\n    \"_meta\": {\n      \"description\": \"used for nginx log\",\n      \"project\": {\n        \"name\": \"myProject\",\n        \"department\": \"myDepartment\"\n      }\n    },\n    \"phases\": {\n      \"warm\": {\n        \"min_age\": \"10d\",\n        \"actions\": {\n          \"forcemerge\": {\n            \"max_num_segments\": 1\n          }\n        }\n      },\n      \"delete\": {\n        \"min_age\": \"30d\",\n        \"actions\": {\n          \"delete\": {}\n        }\n      }\n    }\n  }\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
              examples:
                PutLifecycleResponseExample1:
                  description: A successful response when creating a new lifecycle policy.
                  value: "{\n  \"acknowledged\": true\n}"
      x-state: Generally available; Added in 6.6.0
      x-codeSamples:
      - lang: Console
        source: "PUT _ilm/policy/my_policy\n{\n  \"policy\": {\n    \"_meta\": {\n      \"description\": \"used for nginx log\",\n      \"project\": {\n        \"name\": \"myProject\",\n        \"department\": \"myDepartment\"\n      }\n    },\n    \"phases\": {\n      \"warm\": {\n        \"min_age\": \"10d\",\n        \"actions\": {\n          \"forcemerge\": {\n            \"max_num_segments\": 1\n          }\n        }\n      },\n      \"delete\": {\n        \"min_age\": \"30d\",\n        \"actions\": {\n          \"delete\": {}\n        }\n      }\n    }\n  }\n}"
      - lang: Python
        source: "resp = client.ilm.put_lifecycle(\n    name=\"my_policy\",\n    policy={\n        \"_meta\": {\n            \"description\": \"used for nginx log\",\n            \"project\": {\n                \"name\": \"myProject\",\n                \"department\": \"myDepartment\"\n            }\n        },\n        \"phases\": {\n            \"warm\": {\n                \"min_age\": \"10d\",\n                \"actions\": {\n                    \"forcemerge\": {\n                        \"max_num_segments\": 1\n                    }\n                }\n            },\n            \"delete\": {\n                \"min_age\": \"30d\",\n                \"actions\": {\n                    \"delete\": {}\n                }\n            }\n        }\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.ilm.putLifecycle({\n  name: \"my_policy\",\n  policy: {\n    _meta: {\n      description: \"used for nginx log\",\n      project: {\n        name: \"myProject\",\n        department: \"myDepartment\",\n      },\n    },\n    phases: {\n      warm: {\n        min_age: \"10d\",\n        actions: {\n          forcemerge: {\n            max_num_segments: 1,\n          },\n        },\n      },\n      delete: {\n        min_age: \"30d\",\n        actions: {\n          delete: {},\n        },\n      },\n    },\n  },\n});"
      - lang: Ruby
        source: "response = client.ilm.put_lifecycle(\n  policy: \"my_policy\",\n  body: {\n    \"policy\": {\n      \"_meta\": {\n        \"description\": \"used for nginx log\",\n        \"project\": {\n          \"name\": \"myProject\",\n          \"department\": \"myDepartment\"\n        }\n      },\n      \"phases\": {\n        \"warm\": {\n          \"min_age\": \"10d\",\n          \"actions\": {\n            \"forcemerge\": {\n              \"max_num_segments\": 1\n            }\n          }\n        },\n        \"delete\": {\n          \"min_age\": \"30d\",\n          \"actions\": {\n            \"delete\": {}\n          }\n        }\n      }\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->ilm()->putLifecycle([\n    \"policy\" => \"my_policy\",\n    \"body\" => [\n        \"policy\" => [\n            \"_meta\" => [\n                \"description\" => \"used for nginx log\",\n                \"project\" => [\n                    \"name\" => \"myProject\",\n                    \"department\" => \"myDepartment\",\n                ],\n            ],\n            \"phases\" => [\n                \"warm\" => [\n                    \"min_age\" => \"10d\",\n                    \"actions\" => [\n                        \"forcemerge\" => [\n                            \"max_num_segments\" => 1,\n                        ],\n                    ],\n                ],\n                \"delete\" => [\n                    \"min_age\" => \"30d\",\n                    \"actions\" => [\n                        \"delete\" => new ArrayObject([]),\n                    ],\n                ],\n            ],\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"policy":{"_meta":{"description":"used for nginx log","project":{"name":"myProject","department":"myDepartment"}},"phases":{"warm":{"min_age":"10d","actions":{"forcemerge":{"max_num_segments":1}}},"delete":{"min_age":"30d","actions":{"delete":{}}}}}}'' "$ELASTICSEARCH_URL/_ilm/policy/my_policy"'
      - lang: C#
        source: "var response = await client.IndexLifecycleManagement\n    .PutLifecycleAsync(name: \"my_policy\", d1 => d1\n        .Policy(d2 => d2\n            .Meta(new Dictionary<string, object>()\n            {\n                { \"description\", \"used for nginx log\" },\n                { \"project\", JsonSerializer.Deserialize<JsonElement>(\"\"\"\n                {\n                  \"name\": \"myProject\",\n                  \"department\": \"myDepartment\"\n                }\n                \"\"\") }\n            })\n            .Phases(d3 => d3\n                .Delete(d4 => d4\n                    .Actions(d5 => d5\n                        .Delete()\n                    )\n                    .MinAge(\"30d\")\n                )\n                .Warm(d4 => d4\n                    .Actions(d5 => d5\n                        .Forcemerge(d6 => d6\n                            .MaxNumSegments(1)\n                        )\n                    )\n                    .MinAge(\"10d\")\n                )\n            )\n        )\n    );"
      - lang: Java
        source: "client.ilm().putLifecycle(p -> p\n    .name(\"my_policy\")\n    .policy(po -> po\n        .phases(ph -> ph\n            .delete(d -> d\n                .actions(a -> a\n                    .delete(de -> de)\n                )\n                .minAge(m -> m\n                    .time(\"30d\")\n                )\n            )\n            .warm(w -> w\n                .actions(a -> a\n                    .forcemerge(f -> f\n                        .maxNumSegments(1)\n                    )\n                )\n                .minAge(m -> m\n                    .time(\"10d\")\n                )\n            )\n        )\n        .meta(Map.of(\"description\", JsonData.fromJson(\"\\\"used for nginx log\\\"\"),\"project\", JsonData.fromJson(\"\"\"\n{\"name\":\"myProject\",\"department\":\"myDepartment\"}\n\"\"\")))\n    )\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    delete:
      tags:
      - ilm
      summary: Delete a lifecycle policy
      description: 'You cannot delete policies that are currently in use. If the policy is being used to manage any indices, the request fails and returns an error.


        ## Required authorization


        * Cluster privileges: `manage_ilm`'
      operationId: ilm-delete-lifecycle
      parameters:
      - in: path
        name: policy
        description: Identifier for the policy.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Name'
        style: simple
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: Period to wait for a response. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
              examples:
                DeleteLifecycleResponseExample1:
                  description: A successful response when deleting a lifecycle policy.
                  value: "{\n  \"acknowledged\": true\n}"
      x-state: Generally available; Added in 6.6.0
      x-codeSamples:
      - lang: Console
        source: 'DELETE _ilm/policy/my_policy

          '
      - lang: Python
        source: "resp = client.ilm.delete_lifecycle(\n    name=\"my_policy\",\n)"
      - lang: JavaScript
        source: "const response = await client.ilm.deleteLifecycle({\n  name: \"my_policy\",\n});"
      - lang: Ruby
        source: "response = client.ilm.delete_lifecycle(\n  policy: \"my_policy\"\n)"
      - lang: PHP
        source: "$resp = $client->ilm()->deleteLifecycle([\n    \"policy\" => \"my_policy\",\n]);"
      - lang: curl
        source: 'curl -X DELETE -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ilm/policy/my_policy"'
      - lang: C#
        source: 'var response = await client.IndexLifecycleManagement.DeleteLifecycleAsync(name: "my_policy");'
      - lang: Java
        source: "client.ilm().deleteLifecycle(d -> d\n    .name(\"my_policy\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /{index}/_ilm/explain:
    get:
      tags:
      - ilm
      summary: Explain the lifecycle state
      description: 'Get the current lifecycle status for one or more indices.

        For data streams, the API retrieves the current lifecycle status for the stream''s backing indices.


        The response indicates when the index entered each lifecycle state, provides the definition of the running phase, and information about any failures.


        ## Required authorization


        * Index privileges: `view_index_metadata`,`manage_ilm`'
      externalDocs:
        description: About explaining lifecycle state
        url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/explain-lifecycle
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/ilm-explain-lifecycle.html
      operationId: ilm-explain-lifecycle
      parameters:
      - in: path
        name: index
        description: 'Comma-separated list of data streams, indices, and aliases to target. Supports wildcards (`*`).

          To target all data streams and indices, use `*` or `_all`.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.IndexName'
        style: simple
      - in: query
        name: only_errors
        description: Filters the returned indices to only indices that are managed by ILM and are in an error state, either due to an encountering an error while executing the policy, or attempting to use a policy that does not exist.
        deprecated: false
        schema:
          type: boolean
        style: form
      - in: query
        name: only_managed
        description: Filters the returned indices to only indices that are managed by ILM.
        deprecated: false
        schema:
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: Period to wait for a connection to the master node. If no response is received before the timeout expires, the request fails and returns an error.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  indices:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ilm.explain_lifecycle.LifecycleExplain'
                required:
                - indices
              examples:
                ExplainLifecycleResponseExample1:
                  description: A successful response when retrieving the current ILM status for an index.
                  value: "{\n  \"indices\": {\n    \"my-index-000001\": {\n      \"index\": \"my-index-000001\",\n      \"index_creation_date_millis\": 1538475653281,\n      \"index_creation_date\": \"2018-10-15T13:45:21.981Z\",\n      \"time_since_index_creation\": \"15s\",\n      \"managed\": true,\n      \"policy\": \"my_policy\",\n      \"lifecycle_date_millis\": 1538475653281,\n      \"lifecycle_date\": \"2018-10-15T13:45:21.981Z\",\n      \"age\": \"15s\",\n      \"phase\": \"new\",\n      \"phase_time_millis\": 1538475653317,\n      \"phase_time\": \"2018-10-15T13:45:22.577Z\",\n      \"action\": \"complete\"\n      \"action_time_millis\": 1538475653317,\n      \"action_time\": \"2018-10-15T13:45:22.577Z\",\n      \"step\": \"complete\",\n      \"step_time_millis\": 1538475653317,\n      \"step_time\": \"2018-10-15T13:45:22.577Z\"\n    }\n  }\n}"
      x-state: Generally available; Added in 6.6.0
      x-codeSamples:
      - lang: Console
        source: 'GET .ds-timeseries-*/_ilm/explain

          '
      - lang: Python
        source: "resp = client.ilm.explain_lifecycle(\n    index=\".ds-timeseries-*\",\n)"
      - lang: JavaScript
        source: "const response = await client.ilm.explainLifecycle({\n  index: \".ds-timeseries-*\",\n});"
      - lang: Ruby
        source: "response = client.ilm.explain_lifecycle(\n  index: \".ds-timeseries-*\"\n)"
      - lang: PHP
        source: "$resp = $client->ilm()->explainLifecycle([\n    \"index\" => \".ds-timeseries-*\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/.ds-timeseries-*/_ilm/explain"'
      - lang: Java
        source: "client.ilm().explainLifecycle(e -> e\n    .index(\".ds-timeseries-*\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_ilm/status:
    get:
      tags:
      - ilm
      summary: Get the ILM status
      description: 'Get the current index lifecycle management status.


        ## Required authorization


        * Cluster privileges: `read_ilm`'
      operationId: ilm-get-status
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation_mode:
                    allOf:
                    - $ref: '#/components/schemas/_types.LifecycleOperationMode'
                required:
                - operation_mode
              examples:
                GetILMStatusResponseExample1:
                  description: A successful response when retrieving the current ILM status.
                  value: "{\n  \"operation_mode\": \"RUNNING\"\n}"
      x-state: Generally available; Added in 6.6.0
      x-codeSamples:
      - lang: Console
        source: 'GET _ilm/status

          '
      - lang: Python
        source: resp = client.ilm.get_status()
      - lang: JavaScript
        source: const response = await client.ilm.getStatus();
      - lang: Ruby
        source: response = client.ilm.get_status
      - lang: PHP
        source: $resp = $client->ilm()->getStatus();
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ilm/status"'
      - lang: C#
        source: var response = await client.IndexLifecycleManagement.GetStatusAsync();
      - lang: Java
        source: 'client.ilm().getStatus();

          '
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_ilm/migrate_to_data_tiers:
    post:
      tags:
      - ilm
      summary: Migrate to data tiers routing
      description: 'Switch the indices, ILM policies, and legacy, composable, and component templates from using custom node attributes and attribute-based allocation filters to using data tiers.

        Optionally, delete one legacy index template.

        Using node roles enables ILM to automatically move the indices between data tiers.


        Migrating away from custom node attributes routing can be manually performed.

        This API provides an automated way of performing three out of the four manual steps listed in the migration guide:


        1. Stop setting the custom hot attribute on new indices.

        1. Remove custom allocation settings from existing ILM policies.

        1. Replace custom allocation settings from existing indices with the corresponding tier preference.


        ILM must be stopped before performing the migration.

        Use the stop ILM and get ILM status APIs to wait until the reported operation mode is `STOPPED`.'
      externalDocs:
        description: About migrating index allocation
        url: https://www.elastic.co/docs/manage-data/lifecycle/index-lifecycle-management/migrate-index-allocation-filters-to-node-roles
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/ilm-migrate-to-data-tiers.html
      operationId: ilm-migrate-to-data-tiers
      parameters:
      - in: query
        name: dry_run
        description: 'If true, simulates the migration from node attributes based allocation filters to data tiers, but does not perform the migration.

          This provides a way to retrieve the indices and ILM policies that need to be migrated.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: 'The period to wait for a connection to the master node.

          If no response is received before the timeout expires, the request fails and returns an error.

          It can also be set to `-1` to indicate that the request should never timeout.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legacy_template_to_delete:
                  type: string
                node_attribute:
                  type: string
            examples:
              MigrateToDataTiersRequestExample1:
                description: 'Run `POST /_ilm/migrate_to_data_tiers` to migrate the indices, ILM policies, legacy templates, composable, and component templates away from defining custom allocation filtering using the `custom_attribute_name` node attribute. It also deletes the legacy template with name `global-template` if it exists in the system.

                  '
                value: "{\n  \"legacy_template_to_delete\": \"global-template\",\n  \"node_attribute\": \"custom_attribute_name\"\n}"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run:
                    type: boolean
                  removed_legacy_template:
                    description: 'The name of the legacy index template that was deleted.

                      This information is missing if no legacy index templates were deleted.'
                    type: string
                  migrated_ilm_policies:
                    description: The ILM policies that were updated.
                    type: array
                    items:
                      type: string
                  migrated_indices:
                    description: The indices that were migrated to tier preference routing.
                    allOf:
                    - $ref: '#/components/schemas/_types.Indices'
                  migrated_legacy_templates:
                    description: The legacy index templates that were updated to not contain custom routing settings for the provided data attribute.
                    type: array
                    items:
                      type: string
                  migrated_composable_templates:
                    description: The composable index templates that were updated to not contain custom routing settings for the provided data attribute.
                    type: array
                    items:
                      type: string
                  migrated_component_templates:
                    description: The component templates that were updated to not contain custom routing settings for the provided data attribute.
                    type: array
                    items:
                      type: string
                required:
                - dry_run
                - removed_legacy_template
                - migrated_ilm_policies
                - migrated_indices
                - migrated_legacy_templates
                - migrated_composable_templates
                - migrated_component_templates
              examples:
                MigrateToDataTiersResponseExample1:
                  description: 'A successful response when migrating indices, ILMs, and templates from custom node attributes to data tiers.

                    '
                  value: "{\n  \"dry_run\": false,\n  \"removed_legacy_template\":\"global-template\",\n  \"migrated_ilm_policies\":[\"policy_with_allocate_action\"],\n  \"migrated_indices\":[\"warm-index-to-migrate-000001\"],\n  \"migrated_legacy_templates\":[\"a-legacy-template\"],\n  \"migrated_composable_templates\":[\"a-composable-template\"],\n  \"migrated_component_templates\":[\"a-component-template\"]\n}"
      x-state: Generally available; Added in 7.14.0
      x-codeSamples:
      - lang: Console
        source: "POST /_ilm/migrate_to_data_tiers\n{\n  \"legacy_template_to_delete\": \"global-template\",\n  \"node_attribute\": \"custom_attribute_name\"\n}"
      - lang: Python
        source: "resp = client.ilm.migrate_to_data_tiers(\n    legacy_template_to_delete=\"global-template\",\n    node_attribute=\"custom_attribute_name\",\n)"
      - lang: JavaScript
        source: "const response = await client.ilm.migrateToDataTiers({\n  legacy_template_to_delete: \"global-template\",\n  node_attribute: \"custom_attribute_name\",\n});"
      - lang: Ruby
        source: "response = client.ilm.migrate_to_data_tiers(\n  body: {\n    \"legacy_template_to_delete\": \"global-template\",\n    \"node_attribute\": \"custom_attribute_name\"\n  }\n)"
      - lang: PHP
        source: "$resp = $client->ilm()->migrateToDataTiers([\n    \"body\" => [\n        \"legacy_template_to_delete\" => \"global-template\",\n        \"node_attribute\" => \"custom_attribute_name\",\n    ],\n]);"
      - lang: curl
