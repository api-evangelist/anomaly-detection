  /_ilm/move/{index}:
    post:
      tags:
      - ilm
      summary: Move to a lifecycle step
      description: 'Manually move an index into a specific step in the lifecycle policy and run that step.


        WARNING: This operation can result in the loss of data. Manually moving an index into a specific step runs that step even if it has already been performed. This is a potentially destructive action and this should be considered an expert level API.


        You must specify both the current step and the step to be executed in the body of the request.

        The request will fail if the current step does not match the step currently running for the index

        This is to prevent the index from being moved from an unexpected step into the next step.


        When specifying the target (`next_step`) to which the index will be moved, either the name or both the action and name fields are optional.

        If only the phase is specified, the index will move to the first step of the first action in the target phase.

        If the phase and action are specified, the index will move to the first step of the specified action in the specified phase.

        Only actions specified in the ILM policy are considered valid.

        An index cannot move to a step that is not part of its policy.


        ## Required authorization


        * Index privileges: `manage_ilm`'
      operationId: ilm-move-to-step
      parameters:
      - in: path
        name: index
        description: The name of the index whose lifecycle step is to change
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.IndexName'
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_step:
                  description: The step that the index is expected to be in.
                  allOf:
                  - $ref: '#/components/schemas/ilm.move_to_step.StepKey'
                next_step:
                  description: The step that you want to run.
                  allOf:
                  - $ref: '#/components/schemas/ilm.move_to_step.StepKey'
              required:
              - current_step
              - next_step
            examples:
              MoveToStepRequestExample1:
                summary: Move to forcemerge step
                description: 'Run `POST _ilm/move/my-index-000001` to move `my-index-000001` from the initial step to the `forcemerge` step.

                  '
                value: "{\n  \"current_step\": {\n    \"phase\": \"new\",\n    \"action\": \"complete\",\n    \"name\": \"complete\"\n  },\n  \"next_step\": {\n    \"phase\": \"warm\",\n    \"action\": \"forcemerge\",\n    \"name\": \"forcemerge\"\n  }\n}"
              MoveToStepRequestExample2:
                summary: Move to warm step
                description: 'Run `POST _ilm/move/my-index-000001` to move `my-index-000001` from the end of hot phase into the start of warm.

                  '
                value: "{\n  \"current_step\": {\n    \"phase\": \"hot\",\n    \"action\": \"complete\",\n    \"name\": \"complete\"\n  },\n  \"next_step\": {\n    \"phase\": \"warm\"\n  }\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
              examples:
                MoveToStepResponseExample1:
                  description: 'A successful response when running a specific step in a lifecycle policy.

                    '
                  value: "{\n  \"acknowledged\": true\n}"
      x-state: Generally available; Added in 6.6.0
      x-codeSamples:
      - lang: Console
        source: "POST _ilm/move/my-index-000001\n{\n  \"current_step\": {\n    \"phase\": \"new\",\n    \"action\": \"complete\",\n    \"name\": \"complete\"\n  },\n  \"next_step\": {\n    \"phase\": \"warm\",\n    \"action\": \"forcemerge\",\n    \"name\": \"forcemerge\"\n  }\n}"
      - lang: Python
        source: "resp = client.ilm.move_to_step(\n    index=\"my-index-000001\",\n    current_step={\n        \"phase\": \"new\",\n        \"action\": \"complete\",\n        \"name\": \"complete\"\n    },\n    next_step={\n        \"phase\": \"warm\",\n        \"action\": \"forcemerge\",\n        \"name\": \"forcemerge\"\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.ilm.moveToStep({\n  index: \"my-index-000001\",\n  current_step: {\n    phase: \"new\",\n    action: \"complete\",\n    name: \"complete\",\n  },\n  next_step: {\n    phase: \"warm\",\n    action: \"forcemerge\",\n    name: \"forcemerge\",\n  },\n});"
      - lang: Ruby
        source: "response = client.ilm.move_to_step(\n  index: \"my-index-000001\",\n  body: {\n    \"current_step\": {\n      \"phase\": \"new\",\n      \"action\": \"complete\",\n      \"name\": \"complete\"\n    },\n    \"next_step\": {\n      \"phase\": \"warm\",\n      \"action\": \"forcemerge\",\n      \"name\": \"forcemerge\"\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->ilm()->moveToStep([\n    \"index\" => \"my-index-000001\",\n    \"body\" => [\n        \"current_step\" => [\n            \"phase\" => \"new\",\n            \"action\" => \"complete\",\n            \"name\" => \"complete\",\n        ],\n        \"next_step\" => [\n            \"phase\" => \"warm\",\n            \"action\" => \"forcemerge\",\n            \"name\" => \"forcemerge\",\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"current_step":{"phase":"new","action":"complete","name":"complete"},"next_step":{"phase":"warm","action":"forcemerge","name":"forcemerge"}}'' "$ELASTICSEARCH_URL/_ilm/move/my-index-000001"'
      - lang: C#
        source: "var response = await client.IndexLifecycleManagement\n    .MoveToStepAsync(index: \"my-index-000001\", d1 => d1\n        .CurrentStep(d2 => d2\n            .Action(\"complete\")\n            .Name(\"complete\")\n            .Phase(\"new\")\n        )\n        .NextStep(d2 => d2\n            .Action(\"forcemerge\")\n            .Name(\"forcemerge\")\n            .Phase(\"warm\")\n        )\n    );"
      - lang: Java
        source: "client.ilm().moveToStep(m -> m\n    .currentStep(c -> c\n        .action(\"complete\")\n        .name(\"complete\")\n        .phase(\"new\")\n    )\n    .index(\"my-index-000001\")\n    .nextStep(n -> n\n        .action(\"forcemerge\")\n        .name(\"forcemerge\")\n        .phase(\"warm\")\n    )\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
