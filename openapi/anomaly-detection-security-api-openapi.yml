    delete:
      tags:
      - Security
      summary: Invalidate a token
      description: 'The access tokens returned by the get token API have a finite period of time for which they are valid.

        After that time period, they can no longer be used.

        The time period is defined by the `xpack.security.authc.token.timeout` setting.


        The refresh tokens returned by the get token API are only valid for 24 hours.

        They can also be used exactly once.

        If you want to invalidate one or more access or refresh tokens immediately, use this invalidate token API.


        NOTE: While all parameters are optional, at least one of them is required.

        More specifically, either one of `token` or `refresh_token` parameters is required.

        If none of these two are specified, then `realm_name` and/or `username` need to be specified.'
      operationId: security-invalidate-token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  description: 'An access token.

                    This parameter cannot be used if any of `refresh_token`, `realm_name`, or `username` are used.'
                  type: string
                refresh_token:
                  description: 'A refresh token.

                    This parameter cannot be used if any of `refresh_token`, `realm_name`, or `username` are used.'
                  type: string
                realm_name:
                  description: 'The name of an authentication realm.

                    This parameter cannot be used with either `refresh_token` or `token`.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Name'
                username:
                  description: 'The username of a user.

                    This parameter cannot be used with either `refresh_token` or `token`.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Username'
            examples:
              SecurityInvalidateTokenRequestExample1:
                summary: Invalidate an access token
                description: 'Run `DELETE /_security/oauth2/token` to invalidate an access token.

                  '
                value: "{\n  \"token\" : \"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\"\n}"
              SecurityInvalidateTokenRequestExample2:
                summary: Invalidate a refresh token
                description: 'Run `DELETE /_security/oauth2/token` to invalidate a refresh token.

                  '
                value: "{\n  \"refresh_token\" : \"vLBPvmAB6KvwvJZr27cS\"\n}"
              SecurityInvalidateTokenRequestExample3:
                summary: Invalidate tokens by realm
                description: Run `DELETE /_security/oauth2/token` to invalidate all access tokens and refresh tokens for the `saml1` realm.
                value: "{\n  \"realm_name\" : \"saml1\"\n}"
              SecurityInvalidateTokenRequestExample4:
                summary: Invalidate tokens by user
                description: Run `DELETE /_security/oauth2/token` to invalidate all access tokens and refresh tokens for the user `myuser` in all realms.
                value: "{\n  \"username\" : \"myuser\"\n}"
              SecurityInvalidateTokenRequestExample5:
                summary: Invalidate tokens by user and realm
                description: Run `DELETE /_security/oauth2/token` to invalidate all access tokens and refresh tokens for the user `myuser` in the `saml1` realm.
                value: "{\n  \"username\" : \"myuser\",\n  \"realm_name\" : \"saml1\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_count:
                    description: The number of errors that were encountered when invalidating the tokens.
                    type: number
                  error_details:
                    description: 'Details about the errors.

                      This field is not present in the response when `error_count` is `0`.'
                    type: array
                    items:
                      $ref: '#/components/schemas/_types.ErrorCause'
                  invalidated_tokens:
                    description: The number of the tokens that were invalidated as part of this request.
                    type: number
                  previously_invalidated_tokens:
                    description: The number of tokens that were already invalidated.
                    type: number
                required:
                - error_count
                - invalidated_tokens
                - previously_invalidated_tokens
              examples:
                SecurityInvalidateTokenResponseExample1:
                  description: 'A partially successful response from `DELETE /_security/oauth2/token`. The response includes the number of the tokens that were invalidated, the number of errors that were encountered when invalidating the tokens, and details about these errors.

                    '
                  value: "{\n  \"invalidated_tokens\":9, \n  \"previously_invalidated_tokens\":15, \n  \"error_count\":2, \n  \"error_details\":[ \n    {\n      \"type\":\"exception\",\n      \"reason\":\"Elasticsearch exception [type=exception, reason=foo]\",\n      \"caused_by\":{\n        \"type\":\"exception\",\n        \"reason\":\"Elasticsearch exception [type=illegal_argument_exception, reason=bar]\"\n      }\n    },\n    {\n      \"type\":\"exception\",\n      \"reason\":\"Elasticsearch exception [type=exception, reason=boo]\",\n      \"caused_by\":{\n        \"type\":\"exception\",\n        \"reason\":\"Elasticsearch exception [type=illegal_argument_exception, reason=far]\"\n      }\n    }\n  ]\n}"
      x-state: Generally available; Added in 5.5.0
      x-codeSamples:
      - lang: Console
        source: "DELETE /_security/oauth2/token\n{\n  \"token\" : \"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\"\n}"
      - lang: Python
        source: "resp = client.security.invalidate_token(\n    token=\"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\",\n)"
      - lang: JavaScript
        source: "const response = await client.security.invalidateToken({\n  token:\n    \"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\",\n});"
      - lang: Ruby
        source: "response = client.security.invalidate_token(\n  body: {\n    \"token\": \"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\"\n  }\n)"
      - lang: PHP
        source: "$resp = $client->security()->invalidateToken([\n    \"body\" => [\n        \"token\" => \"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\",\n    ],\n]);"
      - lang: curl
        source: 'curl -X DELETE -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"token":"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ=="}'' "$ELASTICSEARCH_URL/_security/oauth2/token"'
      - lang: C#
        source: "var response = await client.Security\n    .InvalidateTokenAsync(d1 => d1\n        .Token(\"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\")\n    );"
      - lang: Java
        source: "client.security().invalidateToken(i -> i\n    .token(\"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
