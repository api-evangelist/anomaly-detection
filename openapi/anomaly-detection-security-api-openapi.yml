  /_security/api_key/{id}:
    put:
      tags:
      - Security
      summary: Update an API key
      description: 'Update attributes of an existing API key.

        This API supports updates to an API key''s access scope, expiration, and metadata.


        To use this API, you must have at least the `manage_own_api_key` cluster privilege.

        Users can only update API keys that they created or that were granted to them.

        To update another user’s API key, use the `run_as` feature to submit a request on behalf of another user.


        IMPORTANT: It''s not possible to use an API key as the authentication credential for this API. The owner user’s credentials are required.


        Use this API to update API keys created by the create API key or grant API Key APIs.

        If you need to apply the same update to many API keys, you can use the bulk update API keys API to reduce overhead.

        It''s not possible to update expired API keys or API keys that have been invalidated by the invalidate API key API.


        The access scope of an API key is derived from the `role_descriptors` you specify in the request and a snapshot of the owner user''s permissions at the time of the request.

        The snapshot of the owner''s permissions is updated automatically on every call.


        IMPORTANT: If you don''t specify `role_descriptors` in the request, a call to this API might still change the API key''s access scope.

        This change can occur if the owner user''s permissions have changed since the API key was created or last modified.


        ## Required authorization


        * Cluster privileges: `manage_own_api_key`'
      operationId: security-update-api-key
      parameters:
      - in: path
        name: id
        description: The ID of the API key to update.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_descriptors:
                  description: 'The role descriptors to assign to this API key.

                    The API key''s effective permissions are an intersection of its assigned privileges and the point in time snapshot of permissions of the owner user.

                    You can assign new privileges by specifying them in this parameter.

                    To remove assigned privileges, you can supply an empty `role_descriptors` parameter, that is to say, an empty object `{}`.

                    If an API key has no assigned privileges, it inherits the owner user''s full permissions.

                    The snapshot of the owner''s permissions is always updated, whether you supply the `role_descriptors` parameter or not.

                    The structure of a role descriptor is the same as the request for the create API keys API.'
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/security._types.RoleDescriptor'
                metadata:
                  description: 'Arbitrary metadata that you want to associate with the API key.

                    It supports a nested data structure.

                    Within the metadata object, keys beginning with `_` are reserved for system usage.

                    When specified, this value fully replaces the metadata previously associated with the API key.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Metadata'
                expiration:
                  description: 'The expiration time for the API key.

                    By default, API keys never expire.

                    This property can be omitted to leave the expiration unchanged.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
            examples:
              UpdateApiKeyRequestExample1:
                summary: Update role and metadata
                description: 'Run `PUT /_security/api_key/VuaCfGcBCdbkQm-e5aOx` to assign new role descriptors and metadata to an API key.

                  '
                value: "{\n  \"role_descriptors\": {\n    \"role-a\": {\n      \"indices\": [\n        {\n          \"names\": [\"*\"],\n          \"privileges\": [\"write\"]\n        }\n      ]\n    }\n  },\n  \"metadata\": {\n    \"environment\": {\n      \"level\": 2,\n      \"trusted\": true,\n      \"tags\": [\"production\"]\n    }\n  }\n}"
              UpdateApiKeyRequestExample2:
                summary: Remove permissions
                description: 'Run `PUT /_security/api_key/VuaCfGcBCdbkQm-e5aOx` to remove the API key''s previously assigned permissions. It will inherit the owner user''s full permissions.

                  '
                value: "{\n  \"role_descriptors\": {}\n}"
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    description: 'If `true`, the API key was updated.

                      If `false`, the API key didn''t change because no change was detected.'
                    type: boolean
                required:
                - updated
              examples:
                UpdateApiKeyResponseExample1:
                  summary: Update role and metadata
                  description: 'A successful response from `PUT /_security/api_key/VuaCfGcBCdbkQm-e5aOx`. The API key''s effective permissions after the update will be the intersection of the supplied role descriptors and the owner user''s permissions.

                    '
                  value: "{\n  \"updated\": true\n}"
      x-state: Generally available; Added in 8.4.0
      x-codeSamples:
      - lang: Console
        source: "PUT /_security/api_key/VuaCfGcBCdbkQm-e5aOx\n{\n  \"role_descriptors\": {\n    \"role-a\": {\n      \"indices\": [\n        {\n          \"names\": [\"*\"],\n          \"privileges\": [\"write\"]\n        }\n      ]\n    }\n  },\n  \"metadata\": {\n    \"environment\": {\n      \"level\": 2,\n      \"trusted\": true,\n      \"tags\": [\"production\"]\n    }\n  }\n}"
      - lang: Python
        source: "resp = client.security.update_api_key(\n    id=\"VuaCfGcBCdbkQm-e5aOx\",\n    role_descriptors={\n        \"role-a\": {\n            \"indices\": [\n                {\n                    \"names\": [\n                        \"*\"\n                    ],\n                    \"privileges\": [\n                        \"write\"\n                    ]\n                }\n            ]\n        }\n    },\n    metadata={\n        \"environment\": {\n            \"level\": 2,\n            \"trusted\": True,\n            \"tags\": [\n                \"production\"\n            ]\n        }\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.security.updateApiKey({\n  id: \"VuaCfGcBCdbkQm-e5aOx\",\n  role_descriptors: {\n    \"role-a\": {\n      indices: [\n        {\n          names: [\"*\"],\n          privileges: [\"write\"],\n        },\n      ],\n    },\n  },\n  metadata: {\n    environment: {\n      level: 2,\n      trusted: true,\n      tags: [\"production\"],\n    },\n  },\n});"
      - lang: Ruby
        source: "response = client.security.update_api_key(\n  id: \"VuaCfGcBCdbkQm-e5aOx\",\n  body: {\n    \"role_descriptors\": {\n      \"role-a\": {\n        \"indices\": [\n          {\n            \"names\": [\n              \"*\"\n            ],\n            \"privileges\": [\n              \"write\"\n            ]\n          }\n        ]\n      }\n    },\n    \"metadata\": {\n      \"environment\": {\n        \"level\": 2,\n        \"trusted\": true,\n        \"tags\": [\n          \"production\"\n        ]\n      }\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->security()->updateApiKey([\n    \"id\" => \"VuaCfGcBCdbkQm-e5aOx\",\n    \"body\" => [\n        \"role_descriptors\" => [\n            \"role-a\" => [\n                \"indices\" => array(\n                    [\n                        \"names\" => array(\n                            \"*\",\n                        ),\n                        \"privileges\" => array(\n                            \"write\",\n                        ),\n                    ],\n                ),\n            ],\n        ],\n        \"metadata\" => [\n            \"environment\" => [\n                \"level\" => 2,\n                \"trusted\" => true,\n                \"tags\" => array(\n                    \"production\",\n                ),\n            ],\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"role_descriptors":{"role-a":{"indices":[{"names":["*"],"privileges":["write"]}]}},"metadata":{"environment":{"level":2,"trusted":true,"tags":["production"]}}}'' "$ELASTICSEARCH_URL/_security/api_key/VuaCfGcBCdbkQm-e5aOx"'
      - lang: C#
        source: "var response = await client.Security\n    .UpdateApiKeyAsync(id: \"VuaCfGcBCdbkQm-e5aOx\", d1 => d1\n        .Metadata(new Dictionary<string, object>()\n        {\n            { \"environment\", JsonSerializer.Deserialize<JsonElement>(\"\"\"\n            {\n              \"level\": 2,\n              \"trusted\": true,\n              \"tags\": [\n                \"production\"\n              ]\n            }\n            \"\"\") }\n        })\n        .RoleDescriptors(d2 => d2\n            .Add(\"role-a\", d3 => d3\n                .Indices(d4 => d4\n                    .Names([\"*\"])\n                    .Privileges(IndexPrivilege.Write)\n                )\n            )\n        )\n    );"
