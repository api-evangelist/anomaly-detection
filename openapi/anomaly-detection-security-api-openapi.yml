            SecurityGetPrivilegesResponseExample1:
              description: 'A successful response from `GET /_security/privilege/myapp/read`. The response contains information about the `read` privilege for the `app01` application.

                '
              value: "{\n  \"myapp\": {\n    \"read\": {\n      \"application\": \"myapp\",\n      \"name\": \"read\",\n      \"actions\": [\n        \"data:read/*\",\n        \"action:login\"\n      ],\n      \"metadata\": {\n        \"description\": \"Read access to myapp\"\n      }\n    }\n  }\n}"
