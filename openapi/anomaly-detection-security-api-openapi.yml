      - lang: Python
        source: "resp = client.security.put_user_managed_service_account(\n    namespace=\"my-namespace\",\n    service=\"my-service\",\n    roles=[\n        \"my_role\"\n    ],\n    enabled=True,\n)"
      - lang: JavaScript
        source: "const response = await client.security.putUserManagedServiceAccount({\n  namespace: \"my-namespace\",\n  service: \"my-service\",\n  roles: [\"my_role\"],\n  enabled: true,\n});"
