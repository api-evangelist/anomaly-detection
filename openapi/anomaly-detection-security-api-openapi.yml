  /_security/saml/complete_logout:
    post:
      tags:
      - Security
      summary: Logout of SAML completely
      description: 'Verifies the logout response sent from the SAML IdP.


        NOTE: This API is intended for use by custom web applications other than Kibana.

        If you are using Kibana, refer to the documentation for configuring SAML single-sign-on on the Elastic Stack.


        The SAML IdP may send a logout response back to the SP after handling the SP-initiated SAML Single Logout.

        This API verifies the response by ensuring the content is relevant and validating its signature.

        An empty response is returned if the verification process is successful.

        The response can be sent by the IdP with either the HTTP-Redirect or the HTTP-Post binding.

        The caller of this API must prepare the request accordingly so that this API can handle either of them.'
      externalDocs:
        description: More about SAML authentication
        url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/saml
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-saml-complete-logout.html
      operationId: security-saml-complete-logout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                realm:
                  description: The name of the SAML realm in Elasticsearch for which the configuration is used to verify the logout response.
                  type: string
                ids:
                  description: A JSON array with all the valid SAML Request Ids that the caller of the API has for the current user.
                  allOf:
                  - $ref: '#/components/schemas/_types.Ids'
                query_string:
                  description: If the SAML IdP sends the logout response with the HTTP-Redirect binding, this field must be set to the query string of the redirect URI.
                  type: string
                content:
                  description: If the SAML IdP sends the logout response with the HTTP-Post binding, this field must be set to the value of the SAMLResponse form parameter from the logout response.
                  type: string
              required:
              - realm
              - ids
            examples:
              SamlCompleteLogoutRequestExample1:
                summary: HTTP-Redirect binding
                description: 'Run `POST /_security/saml/complete_logout` to verify the logout response sent by the SAML IdP using the HTTP-Redirect binding.

                  '
                value: "{\n  \"realm\": \"saml1\",\n  \"ids\": [ \"_1c368075e0b3...\" ],\n  \"query_string\": \"SAMLResponse=fZHLasMwEEVbfb1bf...&SigAlg=http%3A%2F%2Fwww.w3.org%2F2000%2F09%2Fxmldsig%23rsa-sha1&Signature=CuCmFn%2BLqnaZGZJqK...\"\n}"
              SamlCompleteLogoutRequestExample2:
                summary: HTTP-Post binding
                description: 'Run `POST /_security/saml/complete_logout` to verify the logout response sent by the SAML IdP using the HTTP-Post binding.

                  '
                value: "{\n  \"realm\": \"saml1\",\n  \"ids\": [ \"_1c368075e0b3...\" ],\n  \"content\": \"PHNhbWxwOkxvZ291dFJlc3BvbnNlIHhtbG5zOnNhbWxwPSJ1cm46...\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json: {}
      x-state: Generally available; Added in 7.14.0
      x-codeSamples:
      - lang: Console
        source: "POST /_security/saml/complete_logout\n{\n  \"realm\": \"saml1\",\n  \"ids\": [ \"_1c368075e0b3...\" ],\n  \"query_string\": \"SAMLResponse=fZHLasMwEEVbfb1bf...&SigAlg=http%3A%2F%2Fwww.w3.org%2F2000%2F09%2Fxmldsig%23rsa-sha1&Signature=CuCmFn%2BLqnaZGZJqK...\"\n}"
      - lang: Python
        source: "resp = client.security.saml_complete_logout(\n    realm=\"saml1\",\n    ids=[\n        \"_1c368075e0b3...\"\n    ],\n    query_string=\"SAMLResponse=fZHLasMwEEVbfb1bf...&SigAlg=http%3A%2F%2Fwww.w3.org%2F2000%2F09%2Fxmldsig%23rsa-sha1&Signature=CuCmFn%2BLqnaZGZJqK...\",\n)"
      - lang: JavaScript
