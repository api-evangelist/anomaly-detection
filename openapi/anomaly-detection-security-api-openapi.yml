  /_security/saml/authenticate:
    post:
      tags:
      - Security
      summary: Authenticate SAML
      description: 'Submit a SAML response message to Elasticsearch for consumption.


        NOTE: This API is intended for use by custom web applications other than Kibana.

        If you are using Kibana, refer to the documentation for configuring SAML single-sign-on on the Elastic Stack.


        The SAML message that is submitted can be:


        * A response to a SAML authentication request that was previously created using the SAML prepare authentication API.

        * An unsolicited SAML message in the case of an IdP-initiated single sign-on (SSO) flow.


        In either case, the SAML message needs to be a base64 encoded XML document with a root element of ``.


        After successful validation, Elasticsearch responds with an Elasticsearch internal access token and refresh token that can be subsequently used for authentication.

        This API endpoint essentially exchanges SAML responses that indicate successful authentication in the IdP for Elasticsearch access and refresh tokens, which can be used for authentication against Elasticsearch.'
      externalDocs:
        description: More about SAML authentication
        url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/saml
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-saml-authenticate.html
      operationId: security-saml-authenticate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  description: The SAML response as it was sent by the user's browser, usually a Base64 encoded XML document.
                  type: string
                ids:
                  description: A JSON array with all the valid SAML Request Ids that the caller of the API has for the current user.
                  allOf:
                  - $ref: '#/components/schemas/_types.Ids'
                realm:
                  description: The name of the realm that should authenticate the SAML response. Useful in cases where many SAML realms are defined.
                  type: string
              required:
              - content
              - ids
            examples:
              SamlAuthenticateRequestExample1:
                description: 'Run `POST /_security/saml/authenticate` to exchange a SAML Response indicating a successful authentication at the SAML IdP for an Elasticsearch access token and refresh token to be used in subsequent requests.

                  '
                value: "{\n  \"content\" : \"PHNhbWxwOlJlc3BvbnNlIHhtbG5zOnNhbWxwPSJ1cm46b2FzaXM6bmFtZXM6dGM6U0FNTDoyLjA6cHJvdG9jb2wiIHhtbG5zOnNhbWw9InVybjpvYXNpczpuYW1lczp0YzpTQU1MOjIuMD.....\",\n  \"ids\" : [\"4fee3b046395c4e751011e97f8900b5273d56685\"]\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    description: The access token that was generated by Elasticsearch.
                    type: string
                  username:
                    description: The authenticated user's name.
                    type: string
                  expires_in:
                    description: The amount of time (in seconds) left until the token expires.
                    type: number
                  refresh_token:
                    description: The refresh token that was generated by Elasticsearch.
                    type: string
                  realm:
                    description: The name of the realm where the user was authenticated.
                    type: string
                  in_response_to:
                    description: The id of the request that initiated the authentication process.
                    type: string
                required:
                - access_token
                - username
                - expires_in
                - refresh_token
                - realm
              examples:
                SamlAuthenticateResponseExample1:
                  description: A successful response from `POST /_security/saml/authenticate`.
                  value: "{\n  \"access_token\" : \"46ToAxZVaXVVZTVKOVF5YU04ZFJVUDVSZlV3\",\n  \"username\" : \"Bearer\",\n  \"expires_in\" : 1200,\n  \"refresh_token\": \"mJdXLtmvTUSpoLwMvdBt_w\",\n  \"realm\": \"saml1\",\n  \"in_response_to\": \"4fee3b046395c4e751011e97f8900b5273d56685\"\n}"
      x-state: Generally available; Added in 7.5.0
      x-codeSamples:
      - lang: Console
        source: "POST /_security/saml/authenticate\n{\n  \"content\" : \"PHNhbWxwOlJlc3BvbnNlIHhtbG5zOnNhbWxwPSJ1cm46b2FzaXM6bmFtZXM6dGM6U0FNTDoyLjA6cHJvdG9jb2wiIHhtbG5zOnNhbWw9InVybjpvYXNpczpuYW1lczp0YzpTQU1MOjIuMD.....\",\n  \"ids\" : [\"4fee3b046395c4e751011e97f8900b5273d56685\"]\n}"
