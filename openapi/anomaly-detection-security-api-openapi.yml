              description: 'A successful response from `GET /_security/role/my_admin_role`. The response contains information about the `my_admin_role` role in the native realm.

                '
              value: "{\n  \"my_admin_role\": {\n    \"description\": \"Grants full access to all management features within the cluster.\",\n    \"cluster\" : [ \"all\" ],\n    \"indices\" : [\n      {\n        \"names\" : [ \"index1\", \"index2\" ],\n        \"privileges\" : [ \"all\" ],\n        \"allow_restricted_indices\" : false,\n        \"field_security\" : {\n          \"grant\" : [ \"title\", \"body\" ]}\n      }\n    ],\n    \"applications\" : [ ],\n    \"run_as\" : [ \"other_user\" ],\n    \"metadata\" : {\n      \"version\" : 1\n    },\n    \"transient_metadata\": {\n      \"enabled\": true\n    }\n  }\n}"
    security.suggest_user_profiles-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                description: Metadata about the number of matching profiles.
                allOf:
                - $ref: '#/components/schemas/security.suggest_user_profiles.TotalUserProfiles'
              took:
                description: The number of milliseconds it took Elasticsearch to run the request.
                type: number
              profiles:
                description: A list of profile documents, ordered by relevance, that match the search criteria.
                type: array
                items:
                  $ref: '#/components/schemas/security._types.UserProfile'
            required:
            - total
            - took
            - profiles
          examples:
            SuggestUserProfilesResponseExample1:
              description: 'A successful response from `GET /_security/saml/metadata/saml1`. It contains the SAML metadata that was generated for the SAML realm as an XML string.

                '
              value: "{\n    \"metadata\" : \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\"?><md:EntityDescriptor xmlns:md=\\\"urn:oasis:names:tc:SAML:2.0:metadata\\\" entityID=\\\"https://kibana.org\\\"><md:SPSSODescriptor AuthnRequestsSigned=\\\"false\\\" WantAssertionsSigned=\\\"true\\\" protocolSupportEnumeration=\\\"urn:oasis:names:tc:SAML:2.0:protocol\\\"><md:SingleLogoutService Binding=\\\"urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect\\\" Location=\\\"https://kibana.org/logout\\\"/><md:AssertionConsumerService Binding=\\\"urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST\\\" Location=\\\"https://kibana.org/api/security/saml/callback\\\" index=\\\"1\\\" isDefault=\\\"true\\\"/></md:SPSSODescriptor></md:EntityDescriptor>\"\n}"
    security.query_user-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                description: The total number of users found.
                type: number
              count:
                description: The number of users returned in the response.
                type: number
              users:
                description: A list of users that match the query.
                type: array
                items:
                  $ref: '#/components/schemas/security.query_user.QueryUser'
            required:
            - total
            - count
            - users
          examples:
            SecurityQueryUserResponseExample1:
              summary: Query users by role prefix
              description: 'A successful response from `POST /_security/_query/user?with_profile_uid=true` that contains users that have roles that are prefixed with `other`. It also includes the user `profile_uid` in the response.

                '
              value: "{\n    \"total\": 1,\n    \"count\": 1,\n    \"users\": [\n        {\n            \"username\": \"jacknich\",\n            \"roles\": [\n                \"admin\",\n                \"other_role1\"\n            ],\n            \"full_name\": \"Jack Nicholson\",\n            \"email\": \"jacknich@example.com\",\n            \"metadata\": {\n                \"intelligence\": 7\n            },\n            \"enabled\": true,\n            \"profile_uid\": \"u_79HkWkwmnBH5gqFKwoxggWPjEBOur1zLPXQPEl1VBW0_0\"\n        }\n    ]\n}"
            SecurityQueryUserResponseExample2:
              summary: Query users with multiple conditions
              description: 'A successful response from `POST /_security/_query/user` that uses a `bool` query to issue complex logical conditions and uses `from`, `size`, and `sort` to help paginate the result. The sort value is `username`.

                '
              value: "{\n    \"total\": 5,\n    \"count\": 2,\n    \"users\": [\n        {\n            \"username\": \"ray\",\n            \"roles\": [\n                \"other_role3\"\n            ],\n            \"full_name\": \"Ray Nicholson\",\n            \"email\": \"rayn@example.com\",\n            \"metadata\": {\n                \"intelligence\": 7\n            },\n            \"enabled\": true,\n            \"_sort\": [\n                \"ray\" \n            ]\n        },\n        {\n            \"username\": \"lorraine\",\n            \"roles\": [\n                \"other_role3\"\n            ],\n            \"full_name\": \"Lorraine Nicholson\",\n            \"email\": \"lorraine@example.com\",\n            \"metadata\": {\n                \"intelligence\": 7\n            },\n            \"enabled\": true,\n            \"_sort\": [\n                \"lorraine\"\n            ]\n        }\n    ]\n}"
            SecurityQueryUserResponseExample3:
              summary: Query all users
              description: 'A successful response from `GET /_security/_query/user`, which lists all users. It returns a JSON structure that contains the information retrieved from one or more users.

                '
              value: "{\n    \"total\": 2,\n    \"count\": 2,\n    \"users\": [ \n        {\n            \"username\": \"jacknich\",\n            \"roles\": [\n                \"admin\",\n                \"other_role1\"\n            ],\n            \"full_name\": \"Jack Nicholson\",\n            \"email\": \"jacknich@example.com\",\n            \"metadata\": {\n                \"intelligence\": 7\n            },\n            \"enabled\": true\n        },\n        {\n            \"username\": \"sandrakn\",\n            \"roles\": [\n                \"admin\",\n                \"other_role1\"\n            ],\n            \"full_name\": \"Sandra Knight\",\n            \"email\": \"sandrakn@example.com\",\n            \"metadata\": {\n                \"intelligence\": 7\n            },\n            \"enabled\": true\n        }\n    ]\n}"
    security.put_privileges-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/security._types.CreatedStatus'
          examples:
            SecurityPutPrivilegesResponseExample1:
              description: A successful response from `PUT /_security/privilege`.
              value: "{\n  \"myapp\": {\n    \"read\": {\n      \"created\": true \n    }\n  }\n}"
            SecurityPutPrivilegesResponseExample2:
              description: 'A successful response from `PUT /_security/privilege`. The `created` property indicates whether the privileges have been created or updated.

                '
              value: "{\n  \"app02\": {\n    \"all\": {\n      \"created\": true\n    }\n  },\n  \"app01\": {\n    \"read\": {\n      \"created\": true\n    },\n    \"write\": {\n      \"created\": true\n    }\n  }\n}"
  requestBodies:
    security.has_privileges_user_profile:
      content:
        application/json:
          schema:
            type: object
            properties:
              uids:
                description: A list of profile IDs. The privileges are checked for associated users of the profiles.
                type: array
                items:
                  $ref: '#/components/schemas/security._types.UserProfileId'
              privileges:
                description: An object containing all the privileges to be checked.
                allOf:
                - $ref: '#/components/schemas/security.has_privileges_user_profile.PrivilegesCheck'
            required:
            - uids
            - privileges
          examples:
            HasPrivilegesUserProfileRequestExample1:
              description: 'Run `POST /_security/profile/_has_privileges` to check whether the two users associated with the specified profiles have all the requested set of cluster, index, and application privileges.

                '
              value: "{\n  \"uids\": [\n    \"u_LQPnxDxEjIH0GOUoFkZr5Y57YUwSkL9Joiq-g4OCbPc_0\",\n    \"u_rzRnxDgEHIH0GOUoFkZr5Y27YUwSk19Joiq=g4OCxxB_1\",\n    \"u_does-not-exist_0\"\n  ],\n  \"privileges\": {\n    \"cluster\": [ \"monitor\", \"create_snapshot\", \"manage_ml\" ],\n    \"index\" : [\n      {\n        \"names\": [ \"suppliers\", \"products\" ],\n        \"privileges\": [ \"create_doc\"]\n      },\n      {\n        \"names\": [ \"inventory\" ],\n        \"privileges\" : [ \"read\", \"write\" ]\n      }\n    ],\n    \"application\": [\n      {\n        \"application\": \"inventory_manager\",\n        \"privileges\" : [ \"read\", \"data:write/inventory\" ],\n        \"resources\" : [ \"product/1852563\" ]\n      }\n    ]\n  }\n}"
      required: true
    security.update_user_profile_data:
      content:
        application/json:
          schema:
            type: object
            properties:
              labels:
                description: 'Searchable data that you want to associate with the user profile.

                  This field supports a nested data structure.

                  Within the labels object, top-level keys cannot begin with an underscore (`_`) or contain a period (`.`).'
                type: object
                additionalProperties:
                  type: object
              data:
                description: 'Non-searchable data that you want to associate with the user profile.

                  This field supports a nested data structure.

                  Within the `data` object, top-level keys cannot begin with an underscore (`_`) or contain a period (`.`).

                  The data object is not searchable, but can be retrieved with the get user profile API.'
                type: object
                additionalProperties:
                  type: object
          examples:
            UpdateUserProfileDataRequestExample1:
              description: 'Run `POST /_security/profile/u_P_0BMHgaOK3p7k-PFWUCbw9dQ-UFjt01oWJ_Dp2PmPc_0/_data` to update a profile document for the `u_P_0BMHgaOK3p7k-PFWUCbw9dQ-UFjt01oWJ_Dp2PmPc_0` user profile.

                '
              value: "{\n  \"labels\": {\n    \"direction\": \"east\"\n  },\n  \"data\": {\n    \"app1\": {\n      \"theme\": \"default\"\n    }\n  }\n}"
      required: true
    security.suggest_user_profiles:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                description: 'A query string used to match name-related fields in user profile documents.

                  Name-related fields are the user''s `username`, `full_name`, and `email`.'
                type: string
              size:
                description: The number of profiles to return.
                default: 10
                type: number
              data:
                description: 'A comma-separated list of filters for the `data` field of the profile document.

                  To return all content use `data=*`.

                  To return a subset of content, use `data=<key>` to retrieve content nested under the specified `<key>`.

                  By default, the API returns no `data` content.

                  It is an error to specify `data` as both the query parameter and the request body field.'
                oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              hint:
                description: 'Extra search criteria to improve relevance of the suggestion result.

                  Profiles matching the spcified hint are ranked higher in the response.

                  Profiles not matching the hint aren''t excluded from the response as long as the profile matches the `name` field query.'
                allOf:
                - $ref: '#/components/schemas/security.suggest_user_profiles.Hint'
          examples:
            SuggestUserProfilesRequestExample1:
              description: 'Run `POST /_security/profile/_suggest` to get suggestions for profile documents with name-related fields matching `jack`. It specifies both `uids` and `labels` hints for better relevance. The `labels` hint ranks profiles higher if their `direction` label matches either `north` or `east`.

                '
              value: "{\n  \"name\": \"jack\",  \n  \"hint\": {\n    \"uids\": [  \n      \"u_8RKO7AKfEbSiIHZkZZ2LJy2MUSDPWDr3tMI_CkIGApU_0\",\n      \"u_79HkWkwmnBH5gqFKwoxggWPjEBOur1zLPXQPEl1VBW0_0\"\n    ],\n    \"labels\": {\n      \"direction\": [\"north\", \"east\"]  \n    }\n  }\n}"
    security.change_password:
      content:
        application/json:
          schema:
            type: object
            properties:
              password:
                description: The new password value. Passwords must be at least 6 characters long.
                allOf:
                - $ref: '#/components/schemas/_types.Password'
              password_hash:
                description: 'A hash of the new password value. This must be produced using the same

                  hashing algorithm as has been configured for password storage. For more details,

                  see the explanation of the `xpack.security.authc.password_hashing.algorithm`

                  setting.'
                type: string
          examples:
            SecurityChangePasswordRequestExample1:
              description: 'Run `POST /_security/user/jacknich/_password` to update the password for the `jacknich` user.

                '
              value: "{\n  \"password\" : \"new-test-password\"\n}"
      required: true
    security.query_api_keys:
      content:
        application/json:
          schema:
            type: object
            properties:
              aggregations:
                description: 'Any aggregations to run over the corpus of returned API keys.

                  Aggregations and queries work together. Aggregations are computed only on the API keys that match the query.

                  This supports only a subset of aggregation types, namely: `terms`, `range`, `date_range`, `missing`,

                  `cardinality`, `value_count`, `composite`, `filter`, and `filters`.

                  Additionally, aggregations only run over the same subset of fields that query works with.'
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/security.query_api_keys.ApiKeyAggregationContainer'
              query:
                description: 'A query to filter which API keys to return.

                  If the query parameter is missing, it is equivalent to a `match_all` query.

                  The query supports a subset of query types, including `match_all`, `bool`, `term`, `terms`, `match`,

                  `ids`, `prefix`, `wildcard`, `exists`, `range`, and `simple_query_string`.

                  You can query the following public information associated with an API key: `id`, `type`, `name`,

                  `creation`, `expiration`, `invalidated`, `invalidation`, `username`, `realm`, and `metadata`.


                  NOTE: The queryable string values associated with API keys are internally mapped as keywords.

                  Consequently, if no `analyzer` parameter is specified for a `match` query, then the provided match query string is interpreted as a single keyword value.

                  Such a match query is hence equivalent to a `term` query.'
                allOf:
                - $ref: '#/components/schemas/security.query_api_keys.ApiKeyQueryContainer'
              from:
                description: 'The starting document offset.

                  It must not be negative.

                  By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                default: 0
                type: number
              sort:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/sort-search-results
                description: 'The sort definition.

                  Other than `id`, all public fields of an API key are eligible for sorting.

                  In addition, sort can also be applied to the `_doc` field to sort by index order.'
                allOf:
                - $ref: '#/components/schemas/_types.Sort'
              size:
                description: 'The number of hits to return.

                  It must not be negative.

                  The `size` parameter can be set to `0`, in which case no API key matches are returned, only the aggregation results.

                  By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                default: 10
                type: number
              search_after:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results#search-after
                description: The search after definition.
                allOf:
                - $ref: '#/components/schemas/_types.SortResults'
          examples:
            QueryApiKeysRequestExample1:
              summary: Query API keys by ID
              description: Run `GET /_security/_query/api_key?with_limited_by=true` to retrieve an API key by ID.
              value: "{\n  \"query\": {\n    \"ids\": {\n      \"values\": [\n        \"VuaCfGcBCdbkQm-e5aOx\"\n      ]\n    }\n  }\n}"
            QueryApiKeysRequestExample2:
              summary: Query API keys with pagination
              description: 'Run `GET /_security/_query/api_key`. Use a `bool` query to issue complex logical conditions and use `from`, `size`, and `sort` to help paginate the result. For example, the API key name must begin with `app1-key-` and must not be `app1-key-01`. It must be owned by a username with the wildcard pattern `org-*-user` and the `environment` metadata field must have a `production` value. The offset to begin the search result is the twentieth (zero-based index) API key. The page size of the response is 10 API keys. The result is first sorted by creation date in descending order, then by name in ascending order.

                '
              value: "{\n  \"query\": {\n    \"bool\": {\n      \"must\": [\n        {\n          \"prefix\": {\n            \"name\": \"app1-key-\" \n          }\n        },\n        {\n          \"term\": {\n            \"invalidated\": \"false\" \n          }\n        }\n      ],\n      \"must_not\": [\n        {\n          \"term\": {\n            \"name\": \"app1-key-01\" \n          }\n        }\n      ],\n      \"filter\": [\n        {\n          \"wildcard\": {\n            \"username\": \"org-*-user\" \n          }\n        },\n        {\n          \"term\": {\n            \"metadata.environment\": \"production\" \n          }\n        }\n      ]\n    }\n  },\n  \"from\": 20, \n  \"size\": 10, \n  \"sort\": [ \n    { \"creation\": { \"order\": \"desc\", \"format\": \"date_time\" } },\n    \"name\"\n  ]\n}"
            QueryApiKeysRequestExample3:
              summary: Query API keys by name
              description: Run `GET /_security/_query/api_key` to retrieve the API key by name.
              value: "{\n  \"query\": {\n    \"term\": {\n      \"name\": {\n        \"value\": \"application-key-1\"\n      }\n    }\n  }\n}"
    security.put_role_mapping:
      content:
        application/json:
          schema:
            type: object
            properties:
              enabled:
                description: Mappings that have `enabled` set to `false` are ignored when role mapping is performed.
                type: boolean
              metadata:
                description: 'Additional metadata that helps define which roles are assigned to each user.

                  Within the metadata object, keys beginning with `_` are reserved for system usage.'
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
              roles:
                description: 'A list of role names that are granted to the users that match the role mapping rules.

                  Exactly one of `roles` or `role_templates` must be specified.'
                type: array
                items:
                  type: string
              role_templates:
                description: 'A list of Mustache templates that will be evaluated to determine the roles names that should granted to the users that match the role mapping rules.

                  Exactly one of `roles` or `role_templates` must be specified.'
                type: array
                items:
                  $ref: '#/components/schemas/security._types.RoleTemplate'
              rules:
                description: 'The rules that determine which users should be matched by the mapping.

                  A rule is a logical condition that is expressed by using a JSON DSL.'
                allOf:
                - $ref: '#/components/schemas/security._types.RoleMappingRule'
              run_as:
                type: array
                items:
                  type: string
          examples:
            SecurityPutRoleMappingRequestExample1:
              summary: Roles for all users
              description: 'Run `POST /_security/role_mapping/mapping1` to assign the `user` role to all users.

                '
              value: "{\n  \"roles\": [ \"user\"],\n  \"enabled\": true, \n  \"rules\": {\n    \"field\" : { \"username\" : \"*\" }\n  },\n  \"metadata\" : { \n    \"version\" : 1\n  }\n}"
            SecurityPutRoleMappingRequestExample2:
              summary: Roles for specific users
              description: 'Run `POST /_security/role_mapping/mapping2` to assign the "user" and "admin" roles to specific users.

                '
              value: "{\n  \"roles\": [ \"user\", \"admin\" ],\n  \"enabled\": true,\n  \"rules\": {\n    \"field\" : { \"username\" : [ \"esadmin01\", \"esadmin02\" ] }\n  }\n}"
            SecurityPutRoleMappingRequestExample3:
              summary: Roles for specific realms
              description: 'Run `POST /_security/role_mapping/mapping3` to match users who authenticated against a specific realm.

                '
              value: "{\n  \"roles\": [ \"ldap-user\" ],\n  \"enabled\": true,\n  \"rules\": {\n    \"field\" : { \"realm.name\" : \"ldap1\" }\n  }\n}"
            SecurityPutRoleMappingRequestExample4:
              summary: Roles for specific groups
              description: 'Run `POST /_security/role_mapping/mapping4` to match any user where either the username is `esadmin` or the user is in the `cn=admin,dc=example,dc=com group`. This example is useful when the group names in your identity management system (such as Active Directory, or a SAML Identity Provider) do not have a one-to-one correspondence with the names of roles in Elasticsearch. The role mapping is the means by which you link a group name with a role name.

                '
              value: "{\n  \"roles\": [ \"superuser\" ],\n  \"enabled\": true,\n  \"rules\": {\n    \"any\": [\n      {\n        \"field\": {\n          \"username\": \"esadmin\"\n        }\n      },\n      {\n        \"field\": {\n          \"groups\": \"cn=admins,dc=example,dc=com\"\n        }\n      }\n    ]\n  }\n}"
            SecurityPutRoleMappingRequestExample5:
              summary: Roles for multiple groups
              description: 'Run `POST /_security/role_mapping/mapping5` to use an array syntax for the groups field when there are multiple groups. This pattern matches any of the groups (rather than all of the groups).

                '
              value: "{\n  \"role_templates\": [\n    {\n      \"template\": { \"source\": \"{{#tojson}}groups{{/tojson}}\" }, \n      \"format\" : \"json\" \n    }\n  ],\n  \"rules\": {\n    \"field\" : { \"realm.name\" : \"saml1\" }\n  },\n  \"enabled\": true\n}"
            SecurityPutRoleMappingRequestExample6:
              summary: Templated roles for groups
              description: 'Run `POST /_security/role_mapping/mapping6` for rare cases when the names of your groups may be an exact match for the names of your Elasticsearch roles. This can be the case when your SAML Identity Provider includes its own "group mapping" feature and can be configured to release Elasticsearch role names in the user''s SAML attributes. In these cases it is possible to use a template that treats the group names as role names.

                NOTE: This should only be done if you intend to define roles for all of the provided groups.  Mapping a user to a large number of unnecessary or undefined roles is inefficient and can have a negative effect on system performance. If you only need to map a subset of the groups, you should do it by using explicit mappings.

                The `tojson` mustache function is used to convert the list of group names into a valid JSON array. Because the template produces a JSON array, the `format` must be set to `json`.

                '
              value: "{\n  \"role_templates\": [\n    {\n      \"template\": { \"source\": \"{{#tojson}}groups{{/tojson}}\" }, \n      \"format\" : \"json\" \n    }\n  ],\n  \"rules\": {\n    \"field\" : { \"realm.name\" : \"saml1\" }\n  },\n  \"enabled\": true\n}"
            SecurityPutRoleMappingRequestExample7:
              summary: Users in a LDAP sub-tree and realm
              description: 'Run `POST /_security/role_mapping/mapping7` to match users within a particular LDAP sub-tree in a specific realm.

                '
              value: "{\n  \"roles\": [ \"ldap-example-user\" ],\n  \"enabled\": true,\n  \"rules\": {\n    \"all\": [\n      { \"field\" : { \"dn\" : \"*,ou=subtree,dc=example,dc=com\" } },\n      { \"field\" : { \"realm.name\" : \"ldap1\" } }\n    ]\n  }\n}"
            SecurityPutRoleMappingRequestExample8:
              summary: Complex roles
              description: 'Run `POST /_security/role_mapping/mapping8` to assign rules that are complex and include wildcard matching. For example, this mapping matches any user where all of these conditions are met: the Distinguished Name matches the pattern `*,ou=admin,dc=example,dc=com`, or the `username` is `es-admin`, or the `username` is `es-system`; the user is in the `cn=people,dc=example,dc=com` group; the user does not have a `terminated_date`.

                '
              value: "{\n  \"roles\": [ \"superuser\" ],\n  \"enabled\": true,\n  \"rules\": {\n    \"all\": [\n      {\n        \"any\": [\n          {\n            \"field\": {\n              \"dn\": \"*,ou=admin,dc=example,dc=com\"\n            }\n          },\n          {\n            \"field\": {\n              \"username\": [ \"es-admin\", \"es-system\" ]\n            }\n          }\n        ]\n      },\n      {\n        \"field\": {\n          \"groups\": \"cn=people,dc=example,dc=com\"\n        }\n      },\n      {\n        \"except\": {\n          \"field\": {\n            \"metadata.terminated_date\": null\n          }\n        }\n      }\n    ]\n  }\n}"
            SecurityPutRoleMappingRequestExample9:
              summary: Templated roles
              description: 'Run `POST /_security/role_mapping/mapping9` to use templated roles to automatically map every user to their own custom role. In this example every user who authenticates using the `cloud-saml` realm will be automatically mapped to two roles: the `saml_user` role and a role that is their username prefixed with `_user_`. For example, the user `nwong` would be assigned the `saml_user` and `_user_nwong` roles.

                '
              value: "{\n  \"rules\": { \"field\": { \"realm.name\": \"cloud-saml\" } },\n  \"role_templates\": [\n    { \"template\": { \"source\" : \"saml_user\" } }, \n    { \"template\": { \"source\" : \"_user_{{username}}\" } }\n  ],\n  \"enabled\": true\n}"
      required: true
    security.create_api_key:
      content:
        application/json:
          schema:
            type: object
            properties:
              expiration:
                description: 'The expiration time for the API key.

                  By default, API keys never expire.'
                allOf:
                - $ref: '#/components/schemas/_types.Duration'
              name:
                description: A name for the API key.
                allOf:
                - $ref: '#/components/schemas/_types.Name'
              role_descriptors:
                externalDocs:
                  url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-security-put-role
                description: 'An array of role descriptors for this API key.

                  When it is not specified or it is an empty array, the API key will have a point in time snapshot of permissions of the authenticated user.

                  If you supply role descriptors, the resultant permissions are an intersection of API keys permissions and the authenticated user''s permissions thereby limiting the access scope for API keys.

                  The structure of role descriptor is the same as the request for the create role API.

                  For more details, refer to the create or update roles API.


                  NOTE: Due to the way in which this permission intersection is calculated, it is not possible to create an API key that is a child of another API key, unless the derived key is created without any privileges.

                  In this case, you must explicitly specify a role descriptor with no privileges.

                  The derived API key can be used for authentication; it will not have authority to call Elasticsearch APIs.'
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/security._types.RoleDescriptor'
              metadata:
                description: Arbitrary metadata that you want to associate with the API key. It supports nested data structure. Within the metadata object, keys beginning with `_` are reserved for system usage.
                x-state: Generally available; Added in 7.13.0
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
          examples:
            SecurityCreateApiKeyRequestExample1:
              description: 'Run `POST /_security/api_key` to create an API key. If `expiration` is not provided, the API keys do not expire. If `role_descriptors` is not provided, the permissions of the authenticated user are applied.

                '
              value: "{\n  \"name\": \"my-api-key\",\n  \"expiration\": \"1d\",   \n  \"role_descriptors\": { \n    \"role-a\": {\n      \"cluster\": [\"all\"],\n      \"indices\": [\n        {\n          \"names\": [\"index-a*\"],\n          \"privileges\": [\"read\"]\n        }\n      ]\n    },\n    \"role-b\": {\n      \"cluster\": [\"all\"],\n      \"indices\": [\n        {\n          \"names\": [\"index-b*\"],\n          \"privileges\": [\"all\"]\n        }\n      ]\n    }\n  },\n  \"metadata\": {\n    \"application\": \"my-application\",\n    \"environment\": {\n      \"level\": 1,\n      \"trusted\": true,\n      \"tags\": [\"dev\", \"staging\"]\n    }\n  }\n}"
      required: true
    security.query_role:
      content:
        application/json:
          schema:
            type: object
            properties:
              query:
                description: 'A query to filter which roles to return.

                  If the query parameter is missing, it is equivalent to a `match_all` query.

                  The query supports a subset of query types, including `match_all`, `bool`, `term`, `terms`, `match`,

                  `ids`, `prefix`, `wildcard`, `exists`, `range`, and `simple_query_string`.

                  You can query the following information associated with roles: `name`, `description`, `metadata`,

                  `applications.application`, `applications.privileges`, and `applications.resources`.'
                allOf:
                - $ref: '#/components/schemas/security.query_role.RoleQueryContainer'
              from:
                description: 'The starting document offset.

                  It must not be negative.

                  By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                default: 0
                type: number
              sort:
                description: 'The sort definition.

                  You can sort on `name`, `description`, `metadata`, `applications.application`, `applications.privileges`,

                  and `applications.resources`.

                  In addition, sort can also be applied to the `_doc` field to sort by index order.'
                allOf:
                - $ref: '#/components/schemas/_types.Sort'
              size:
                description: 'The number of hits to return.

                  It must not be negative.

                  By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                default: 10
                type: number
              search_after:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results#search-after
                description: The search after definition.
                allOf:
                - $ref: '#/components/schemas/_types.SortResults'
          examples:
            QueryRolesRequestExample1:
              summary: Query roles by name
              description: Run `POST /_security/_query/role` to lists all roles, sorted by the role name.
              value: "{\n    \"sort\": [\"name\"]\n}"
            QueryRolesRequestExample2:
              summary: Query roles by description
              description: 'Run `POST /_security/_query/role` to query only the user access role, given its description. It returns only the best matching role because `size` is set to `1`.

                '
              value: "{\n  \"query\": {\n    \"match\": {\n      \"description\": {\n        \"query\": \"user access\"\n      }\n    }\n  },\n  \"size\": 1 \n}"
    security.put_role:
      content:
        application/json:
          schema:
            type: object
            properties:
              applications:
                description: A list of application privilege entries.
                type: array
                items:
                  $ref: '#/components/schemas/security._types.ApplicationPrivileges'
              cluster:
                description: A list of cluster privileges. These privileges define the cluster-level actions for users with this role.
                type: array
                items:
                  $ref: '#/components/schemas/security._types.ClusterPrivilege'
              global:
                description: An object defining global privileges. A global privilege is a form of cluster privilege that is request-aware. Support for global privileges is currently limited to the management of application privileges.
                type: object
                additionalProperties:
                  type: object
              indices:
                description: A list of indices permissions entries.
                type: array
                items:
                  $ref: '#/components/schemas/security._types.IndicesPrivileges'
              remote_indices:
                description: 'A list of remote indices permissions entries.


                  NOTE: Remote indices are effective for remote clusters configured with the API key based model.

                  They have no effect for remote clusters configured with the certificate based model.'
                x-state: Generally available; Added in 8.14.0
                type: array
                items:
                  $ref: '#/components/schemas/security._types.RemoteIndicesPrivileges'
              remote_cluster:
                description: A list of remote cluster permissions entries.
                x-state: Generally available; Added in 8.15.0
                type: array
                items:
                  $ref: '#/components/schemas/security._types.RemoteClusterPrivileges'
              metadata:
                description: Optional metadata. Within the metadata object, keys that begin with an underscore (`_`) are reserved for system use.
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
              run_as:
                externalDocs:
                  url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/submitting-requests-on-behalf-of-other-users
                description: 'A list of users that the owners of this role can impersonate. *Note*: in Serverless, the run-as feature is disabled. For API compatibility, you can still specify an empty `run_as` field, but a non-empty list will be rejected.'
                type: array
                items:
                  type: string
              description:
                description: Optional description of the role descriptor
                type: string
              transient_metadata:
                description: Indicates roles that might be incompatible with the current cluster license, specifically roles with document and field level security. When the cluster license doesn’t allow certain features for a given role, this parameter is updated dynamically to list the incompatible features. If `enabled` is `false`, the role is ignored, but is still listed in the response from the authenticate API.
                type: object
                additionalProperties:
                  type: object
          examples:
            SecurityPutRoleRequestExample1:
              summary: Role example 1
              description: Run `POST /_security/role/my_admin_role` to create a role.
              value: "{\n  \"description\": \"Grants full access to all management features within the cluster.\",\n  \"cluster\": [\"all\"],\n  \"indices\": [\n    {\n      \"names\": [ \"index1\", \"index2\" ],\n      \"privileges\": [\"all\"],\n      \"field_security\" : { // optional\n        \"grant\" : [ \"title\", \"body\" ]\n      },\n      \"query\": \"{\\\"match\\\": {\\\"title\\\": \\\"foo\\\"}}\" // optional\n    }\n  ],\n  \"applications\": [\n    {\n      \"application\": \"myapp\",\n      \"privileges\": [ \"admin\", \"read\" ],\n      \"resources\": [ \"*\" ]\n    }\n  ],\n  \"run_as\": [ \"other_user\" ], // optional\n  \"metadata\" : { // optional\n    \"version\" : 1\n  }\n}"
            SecurityPutRoleRequestExample2:
              summary: Role example 2
              description: Run `POST /_security/role/cli_or_drivers_minimal` to configure a role that can run SQL in JDBC.
              value: "{\n  \"cluster\": [\"cluster:monitor/main\"],\n  \"indices\": [\n    {\n      \"names\": [\"test\"],\n      \"privileges\": [\"read\", \"indices:admin/get\"]\n    }\n  ]\n}"
            SecurityPutRoleRequestExample3:
              summary: Role example 3
              description: Run `POST /_security/role/only_remote_access_role` to configure a role with remote indices and remote cluster privileges for a remote cluster.
              value: "{\n  \"remote_indices\": [\n    {\n      \"clusters\": [\"my_remote\"], \n      \"names\": [\"logs*\"], \n      \"privileges\": [\"read\", \"read_cross_cluster\", \"view_index_metadata\"] \n    }\n  ],\n  \"remote_cluster\": [\n    {\n      \"clusters\": [\"my_remote\"], \n      \"privileges\": [\"monitor_stats\"]  \n    }\n  ]\n}"
      required: true
    security.put_user:
      content:
        application/json:
          schema:
            type: object
            properties:
              username:
                allOf:
                - $ref: '#/components/schemas/_types.Username'
              email:
                description: The email of the user.
                oneOf:
                - type: string
                - type:
                  - string
                  - 'null'
              full_name:
                description: The full name of the user.
                oneOf:
                - type: string
                - type:
                  - string
                  - 'null'
              metadata:
                description: Arbitrary metadata that you want to associate with the user.
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
              password:
                description: 'The user''s password.

                  Passwords must be at least 6 characters long.

                  When adding a user, one of `password` or `password_hash` is required.

                  When updating an existing user, the password is optional, so that other fields on the user (such as their roles) may be updated without modifying the user''s password'
                allOf:
                - $ref: '#/components/schemas/_types.Password'
              password_hash:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/configuration-reference/security-settings#hashing-settings
                description: 'A hash of the user''s password.

                  This must be produced using the same hashing algorithm as has been configured for password storage.

                  For more details, see the explanation of the `xpack.security.authc.password_hashing.algorithm` setting in the user cache and password hash algorithm documentation.

                  Using this parameter allows the client to pre-hash the password for performance and/or confidentiality reasons.

                  The `password` parameter and the `password_hash` parameter cannot be used in the same request.'
                type: string
              roles:
                description: 'A set of roles the user has.

                  The roles determine the user''s access permissions.

                  To create a user without any roles, specify an empty list (`[]`).'
                type: array
                items:
                  type: string
              enabled:
                description: Specifies whether the user is enabled.
                default: true
                type: boolean
          examples:
            SecurityPutUserRequestExample1:
              description: Run `POST /_security/user/jacknich` to activate a user profile.
              value: "{\n  \"password\" : \"l0ng-r4nd0m-p@ssw0rd\",\n  \"roles\" : [ \"admin\", \"other_role1\" ],\n  \"full_name\" : \"Jack Nicholson\",\n  \"email\" : \"jacknich@example.com\",\n  \"metadata\" : {\n    \"intelligence\" : 7\n  }\n}"
      required: true
    security.query_user:
      content:
        application/json:
          schema:
            type: object
            properties:
              query:
                description: 'A query to filter which users to return.

                  If the query parameter is missing, it is equivalent to a `match_all` query.

                  The query supports a subset of query types, including `match_all`, `bool`, `term`, `terms`, `match`,

                  `ids`, `prefix`, `wildcard`, `exists`, `range`, and `simple_query_string`.

                  You can query the following information associated with user: `username`, `roles`, `enabled`, `full_name`, and `email`.'
                allOf:
                - $ref: '#/components/schemas/security.query_user.UserQueryContainer'
              from:
                description: 'The starting document offset.

                  It must not be negative.

                  By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                default: 0
                type: number
              sort:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/sort-search-results
                description: 'The sort definition.

                  Fields eligible for sorting are: `username`, `roles`, `enabled`.

                  In addition, sort can also be applied to the `_doc` field to sort by index order.'
                allOf:
                - $ref: '#/components/schemas/_types.Sort'
              size:
                description: 'The number of hits to return.

                  It must not be negative.

                  By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                default: 10
                type: number
              search_after:
                externalDocs:
                  url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results#search-after
                description: The search after definition
                allOf:
                - $ref: '#/components/schemas/_types.SortResults'
          examples:
            SecurityQueryUserRequestExample1:
              summary: Query users by role prefix
              description: 'Run `POST /_security/_query/user?with_profile_uid=true` to get users that have roles that are prefixed with `other`. It will also include the user `profile_uid` in the response.

                '
              value: "{\n    \"query\": {\n        \"prefix\": {\n            \"roles\": \"other\"\n        }\n    }\n}"
            SecurityQueryUserRequestExample2:
              summary: Query users with multiple conditions
              description: 'Run `POST /_security/_query/user`. Use a `bool` query to issue complex logical conditions: The `email` must end with `example.com`. The user must be enabled. The result will be filtered to only contain users with at least one role that contains the substring `other`. The offset to begin the search result is the second (zero-based index) user. The page size of the response is two users. The result is sorted by `username` in descending order.

                '
              value: "{\n  \"query\": {\n    \"bool\": {\n      \"must\": [\n        {\n          \"wildcard\": {\n            \"email\": \"*example.com\" \n          }\n        },\n        {\n          \"term\": {\n            \"enabled\": true \n          }\n        }\n      ],\n      \"filter\": [\n        {\n          \"wildcard\": {\n            \"roles\": \"*other*\" \n          }\n        }\n      ]\n    }\n  },\n  \"from\": 1, \n  \"size\": 2, \n  \"sort\": [\n    { \"username\": { \"order\": \"desc\"} } \n  ]\n}"
    security.clone_api_key:
      content:
        application/json:
          schema:
            type: object
            properties:
              api_key:
                description: 'The credentials of the API key to clone.

                  This is the secret value returned when the key was originally created.'
                type: string
              name:
                description: 'A name for the cloned API key.

                  If not provided, the name of the source key is used.'
                allOf:
                - $ref: '#/components/schemas/_types.Name'
              expiration:
                description: 'The expiration time for the cloned API key.

                  By default, API keys never expire.

                  Set to `null` to explicitly create a key with no expiration.'
                allOf:
                - $ref: '#/components/schemas/_types.Duration'
              metadata:
                description: 'Arbitrary metadata to associate with the cloned API key.

                  It supports nested data structure.

                  Within the metadata object, keys beginning with `_` are reserved for system usage.'
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
            required:
            - api_key
      required: true
    security.has_privileges:
      content:
        application/json:
          schema:
            type: object
            properties:
              application:
                type: array
                items:
                  $ref: '#/components/schemas/security.has_privileges.ApplicationPrivilegesCheck'
              cluster:
                description: A list of the cluster privileges that you want to check.
                type: array
                items:
                  $ref: '#/components/schemas/security._types.ClusterPrivilege'
              index:
                type: array
                items:
                  $ref: '#/components/schemas/security.has_privileges.IndexPrivilegesCheck'
          examples:
            SecurityHasPrivilegesRequestExample1:
              description: Run `GET /_security/user/_has_privileges` to check whether the current user has a specific set of cluster, index, and application privileges.
              value: "{\n  \"cluster\": [ \"monitor\", \"manage\" ],\n  \"index\" : [\n    {\n      \"names\": [ \"suppliers\", \"products\" ],\n      \"privileges\": [ \"read\" ]\n    },\n    {\n      \"names\": [ \"inventory\" ],\n      \"privileges\" : [ \"read\", \"write\" ]\n    }\n  ],\n  \"application\": [\n    {\n      \"application\": \"inventory_manager\",\n      \"privileges\" : [ \"read\", \"data:write/inventory\" ],\n      \"resources\" : [ \"product/1852563\" ]\n    }\n  ]\n}"
      required: true
    security.put_privileges:
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/security.put_privileges.Actions'
          examples:
            SecurityPutPrivilegesRequestExample1:
              summary: Add a privilege
              description: 'Run `PUT /_security/privilege` to add a single application privilege. The wildcard (`*`) means that this privilege grants access to all actions that start with `data:read/`. Elasticsearch does not assign any meaning to these actions. However, if the request includes an application privilege such as `data:read/users` or `data:read/settings`, the has privileges API respects the use of a wildcard and returns `true`.

                '
              value: "{\n  \"myapp\": {\n    \"read\": {\n      \"actions\": [ \n        \"data:read/*\" , \n        \"action:login\" ],\n        \"metadata\": { \n          \"description\": \"Read access to myapp\"\n        }\n      }\n    }\n}"
            SecurityPutPrivilegesRequestExample2:
              summary: Add multiple privileges
              description: 'Run `PUT /_security/privilege` to add multiple application privileges.

                '
              value: "{\n  \"app01\": {\n    \"read\": {\n      \"actions\": [ \"action:login\", \"data:read/*\" ]\n    },\n    \"write\": {\n      \"actions\": [ \"action:login\", \"data:write/*\" ]\n    }\n  },\n  \"app02\": {\n    \"all\": {\n      \"actions\": [ \"*\" ]\n    }\n  }\n}"
      required: true
  securitySchemes:
    apiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
      description: "Elasticsearch APIs support key-based authentication.\nYou must create an API key and use the encoded value in the request header.\nFor example:\n\n\n```\ncurl -X GET \"${ES_URL}/_cat/indices?v=true\" \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n```\n\nTo get API keys, use the `/_security/api_key` APIs.\n"
    basicAuth:
      scheme: basic
      type: http
    bearerAuth:
      scheme: bearer
      type: http
      description: 'Elasticsearch APIs support the use of bearer tokens in the `Authorization` HTTP header to authenticate with the API.

        For examples, refer to [Token-based authentication services](https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/token-based-authentication-services)

        '
