    put:
      tags:
      - Security
      summary: Create user-managed service accounts
      description: 'Create a service account in a namespace of your own, or replace one that already exists.

        A replacement is not a partial update: every write applies the defaults, so an account that was disabled and is then written again without `enabled` comes back enabled.


        Creating an account whose name still has leftover service tokens is rejected.

        Delete those tokens first.


        NOTE: The `elastic` namespace is reserved for the built-in service accounts that ship with Elasticsearch.

        The `manage_service_account` privilege does not authorize this API.


        ## Required authorization


        * Cluster privileges: `manage_security`'
      externalDocs:
        description: More about service accounts
        url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/service-accounts
      operationId: security-put-user-managed-service-account
      parameters:
      - in: path
        name: namespace
        description: 'The namespace, which is a top-level grouping of service accounts.

          It must start with a letter or digit and can contain only letters, digits, hyphens, and underscores, up to a maximum of 128 characters.

          It cannot be `elastic`, which is reserved for built-in service accounts.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Namespace'
        style: simple
      - in: path
        name: service
        description: 'The service name.

          It must start with a letter or digit and can contain only letters, digits, hyphens, and underscores, up to a maximum of 128 characters.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Service'
        style: simple
      - in: query
        name: refresh
        description: If `wait_for` (the default) then wait for a refresh to make this operation visible to search, if `true` then refresh the affected shards to make this operation visible to search, if `false` then do nothing with refreshes.
        deprecated: false
        schema:
          default: wait_for
          allOf:
          - $ref: '#/components/schemas/_types.Refresh'
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  description: 'The names of the roles to grant to the service account, up to a maximum of 1000.

                    The roles are resolved when the account authenticates, so they do not have to exist yet.'
                  type: array
                  items:
                    type: string
                enabled:
                  description: 'Whether the account can authenticate.

                    Tokens can still be created for a disabled account; they just cannot be used until the account is enabled.'
                  default: true
                  type: boolean
                description:
                  description: 'A free-text description of the account, as sent on the last PUT of the account.

                    It has no meaning to Elasticsearch. Absent when the account has no description.'
                  type: string
              required:
              - roles
            examples:
              PutUserManagedServiceAccountRequestExample1:
                summary: Create a user-managed service account
                description: 'Run `PUT /_security/service/my-namespace/my-service` to create a service account that is granted the `my_role` role and can authenticate.

                  '
                value: "{\n  \"roles\": [\n    \"my_role\"\n  ],\n  \"enabled\": true\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    description: 'A successful call returns a JSON structure that shows whether the service account has been created or updated.

                      When an existing service account is replaced, `created` is set to `false`.'
                    type: boolean
                required:
                - created
              examples:
                PutUserManagedServiceAccountResponseExample1:
                  description: 'A successful response from `PUT /_security/service/my-namespace/my-service`.

                    '
                  value: "{\n  \"created\": true\n}"
