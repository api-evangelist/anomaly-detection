  /_security/saml/prepare:
    post:
      tags:
      - Security
      summary: Prepare SAML authentication
      description: 'Create a SAML authentication request (``) as a URL string based on the configuration of the respective SAML realm in Elasticsearch.


        NOTE: This API is intended for use by custom web applications other than Kibana.

        If you are using Kibana, refer to the documentation for configuring SAML single-sign-on on the Elastic Stack.


        This API returns a URL pointing to the SAML Identity Provider.

        You can use the URL to redirect the browser of the user in order to continue the authentication process.

        The URL includes a single parameter named `SAMLRequest`, which contains a SAML Authentication request that is deflated and Base64 encoded.

        If the configuration dictates that SAML authentication requests should be signed, the URL has two extra parameters named `SigAlg` and `Signature`.

        These parameters contain the algorithm used for the signature and the signature value itself.

        It also returns a random string that uniquely identifies this SAML Authentication request.

        The caller of this API needs to store this identifier as it needs to be used in a following step of the authentication process.'
      externalDocs:
        description: More about SAML authentication
        url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/saml
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-saml-prepare-authentication.html
      operationId: security-saml-prepare-authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acs:
                  description: 'The Assertion Consumer Service URL that matches the one of the SAML realms in Elasticsearch.

                    The realm is used to generate the authentication request. You must specify either this parameter or the `realm` parameter.'
                  type: string
                realm:
                  description: 'The name of the SAML realm in Elasticsearch for which the configuration is used to generate the authentication request.

                    You must specify either this parameter or the `acs` parameter.'
                  type: string
                relay_state:
                  description: 'A string that will be included in the redirect URL that this API returns as the `RelayState` query parameter.

                    If the Authentication Request is signed, this value is used as part of the signature computation.'
                  type: string
            examples:
              SamlPrepareAuthenticationRequestExample1:
                summary: Prepare with a realm
                description: 'Run `POST /_security/saml/prepare` to generate a SAML authentication request for the SAML realm named `saml1`.

                  '
                value: "{\n  \"realm\" : \"saml1\"\n}"
              SamlPrepareAuthenticationRequestExample2:
                summary: Prepare with an ACS
                description: 'Run `POST /_security/saml/prepare` to generate a SAML authentication request for the SAML realm with an Assertion Consuming Service (ACS) URL.

                  '
                value: "{\n  \"acs\" : \"https://kibana.org/api/security/saml/callback\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: A unique identifier for the SAML Request to be stored by the caller of the API.
                    allOf:
                    - $ref: '#/components/schemas/_types.Id'
                  realm:
                    description: The name of the Elasticsearch realm that was used to construct the authentication request.
                    type: string
                  redirect:
                    description: The URL to redirect the user to.
                    type: string
                required:
                - id
                - realm
                - redirect
              examples:
                SAmlPrepareAuthenticationResponseExample1:
                  description: A successful response from `POST /_security/saml/prepare`.
                  value: "{\n  \"redirect\": \"https://my-idp.org/login?SAMLRequest=fVJdc6IwFP0rmbwDgUKLGbFDtc462%2B06FX3Yl50rBJsKCZsbrPbXL6J22hdfk%2FNx7zl3eL%2BvK7ITBqVWCfVdRolQuS6k2iR0mU2dmN6Phgh1FTQ8be2rehH%2FWoGWdESF%2FPST0NYorgElcgW1QG5zvkh%2FPfHAZbwx2upcV5SkiMLYzmqsFba1MAthdjIXy5enhL5a23DPOyo6W7kGBa7cwhZ2gO7G8OiW%2BR400kORt0bag7fzezAlk24eqcD2OxxlsNN5O3MdsW9c6CZnbq7rntF4d3s0D7BaHTZhIWN52P%2BcjiuGRbDU6cdj%2BEjJbJLQv4N4ADdhxBiEZbQuWclY4Q8iABbCXczCdSiKMAC%2FgyO2YqbQgrIJDZg%2FcFjsMD%2Fzb3gUcBa5sR%2F9oWR%2BzuJBqlPG14Jbn0DIf2TZ3Jn%2FXmSUrC5ddQB6bob37uZrJdeF4dIDHV3iuhb70Ptq83kOz53ubDLXlcwPJK0q%2FT42AqxIaAkVCkqm2tRgr49yfJGFU%2FZQ3hy3QyuUpd7obPv97kb%2FAQ%3D%3D\"}\",\n  \"realm\": \"saml1\",\n  \"id\": \"_989a34500a4f5bf0f00d195aa04a7804b4ed42a1\"\n}"
      x-state: Generally available; Added in 7.5.0
