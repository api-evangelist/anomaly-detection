  /_security/oauth2/token:
    post:
      tags:
      - Security
      summary: Get a token
      description: 'Create a bearer token for access without requiring basic authentication.

        The tokens are created by the Elasticsearch Token Service, which is automatically enabled when you configure TLS on the HTTP interface.

        Alternatively, you can explicitly enable the `xpack.security.authc.token.enabled` setting.

        When you are running in production mode, a bootstrap check prevents you from enabling the token service unless you also enable TLS on the HTTP interface.


        The get token API takes the same parameters as a typical OAuth 2.0 token API except for the use of a JSON request body.


        A successful get token API call returns a JSON structure that contains the access token, the amount of time (seconds) that the token expires in, the type, and the scope if available.


        The tokens returned by the get token API have a finite period of time for which they are valid and after that time period, they can no longer be used.

        That time period is defined by the `xpack.security.authc.token.timeout` setting.

        If you want to invalidate a token immediately, you can do so by using the invalidate token API.


        ## Required authorization


        * Cluster privileges: `manage_token`'
      externalDocs:
        description: More about setting up https
        url: https://www.elastic.co/docs/deploy-manage/security/set-up-basic-security-plus-https#encrypt-http-communication
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-get-token.html
      operationId: security-get-token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  description: "The type of grant.\nSupported grant types are: `password`, `_kerberos`, `client_credentials`, `refresh_token`, and `_user_managed_service_account`.\n\nSupported values include:\n  - `password`: This grant type implements the Resource Owner Password Credentials Grant of OAuth2.\nIn this grant, a trusted client exchanges the end user's credentials for an access token and (possibly) a refresh token.\nThe request needs to be made by an authenticated user but happens on behalf of another authenticated user (the one whose credentials are passed as request parameters).\nThis grant type is not suitable or designed for the self-service user creation of tokens.\n  - `client_credentials`: This grant type implements the Client Credentials Grant of OAuth2.\nIt is geared for machine to machine communication and is not suitable or designed for the self-service user creation of tokens.\nIt generates only access tokens that cannot be refreshed.\nThe premise is that the entity that uses `client_credentials` has constant access to a set of (client, not end-user) credentials and can authenticate itself at will.\n  - `_kerberos`: This grant type is supported internally and implements SPNEGO based Kerberos support.\nThe `_kerberos` grant type may change from version to version.\n  - `refresh_token`: This grant type implements the Refresh Token Grant of OAuth2.\nIn this grant a user exchanges a previously issued refresh token for a new access token and a new refresh token.\n  - `_user_managed_service_account`: This grant type is supported internally and exchanges a user-managed service account token for an access token that represents that service account.\nThe request must be made by an authenticated caller with the `manage_token` cluster privilege, on behalf of the service account whose token is passed in the `service_account_token` parameter.\nThe service account token is authenticated on every exchange, so a disabled account or an invalidated token is rejected.\nTokens that belong to built-in (`elastic/*`) service accounts are rejected.\nIt generates only access tokens that cannot be refreshed.\nThe `_user_managed_service_account` grant type may change from version to version.\n\n"
                  allOf:
                  - $ref: '#/components/schemas/security.get_token.AccessTokenGrantType'
                scope:
                  description: 'The scope of the token.

                    Currently tokens are only issued for a scope of FULL regardless of the value sent with the request.'
                  type: string
                password:
                  description: 'The user''s password.

                    If you specify the `password` grant type, this parameter is required.

                    This parameter is not valid with any other supported grant type.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Password'
                kerberos_ticket:
                  description: 'The base64 encoded kerberos ticket.

                    If you specify the `_kerberos` grant type, this parameter is required.

                    This parameter is not valid with any other supported grant type.'
                  type: string
                refresh_token:
                  description: 'The string that was returned when you created the token, which enables you to extend its life.

                    If you specify the `refresh_token` grant type, this parameter is required.

                    This parameter is not valid with any other supported grant type.'
                  type: string
                service_account_token:
                  description: 'The service account token of a user-managed service account, as returned by the create service account token API.

                    If you specify the `_user_managed_service_account` grant type, this parameter is required.

                    This parameter is not valid with any other supported grant type.'
                  x-state: Generally available; Added in 9.6.0
                  type: string
                username:
                  description: 'The username that identifies the user.

                    If you specify the `password` grant type, this parameter is required.

                    This parameter is not valid with any other supported grant type.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Username'
            examples:
              GetUserAccessTokenRequestExample1:
                summary: A client_credentials grant type example
                description: 'Run `POST /_security/oauth2/token` to obtain a token using the `client_credentials` grant type, which simply creates a token as the authenticated user.

                  '
                value: "{\n  \"grant_type\" : \"client_credentials\"\n}"
              GetUserAccessTokenRequestExample2:
                summary: A password grant type example
                description: 'Run `POST /_security/oauth2/token` to obtain a token for the `test_admin` user using the password grant type. This request needs to be made by an authenticated user with sufficient privileges that may or may not be the same as the one whose username is passed in the `username` parameter.

                  '
                value: "{\n  \"grant_type\" : \"password\",\n  \"username\" : \"test_admin\",\n  \"password\" : \"x-pack-test-password\"\n}"
              GetUserAccessTokenRequestExample3:
                summary: A _user_managed_service_account grant type example
                description: 'Run `POST /_security/oauth2/token` to exchange a user-managed service account token for an access token that represents the `apps/oauth2_worker` service account. This request needs to be made by an authenticated user with the `manage_token` cluster privilege; the service account itself does not need, and should not hold, that privilege.

                  '
                value: "{\n  \"grant_type\" : \"_user_managed_service_account\",\n  \"service_account_token\" : \"AAEAAWFwcHMvb2F1dGgyX3dvcmtlci9leGNoYW5nZS10b2tlbjpyNVdhVjNiYUxTX2lPRXhRb0VOSDdR\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: number
                  scope:
                    type: string
                  type:
                    type: string
                  refresh_token:
                    type: string
                  kerberos_authentication_response_token:
                    type: string
                  authentication:
                    allOf:
                    - $ref: '#/components/schemas/security.get_token.AuthenticatedUser'
                required:
                - access_token
                - expires_in
                - type
                - authentication
              examples:
                GetUserAccessTokenResponseExample1:
                  summary: A client_credentials grant type example
                  description: A successful response from `POST /_security/oauth2/token`.
