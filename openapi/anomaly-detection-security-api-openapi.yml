  /_ssl/certificates:
    get:
      tags:
      - Security
      summary: Get SSL certificates
      description: 'Get information about the X.509 certificates that are used to encrypt communications in the cluster.

        The API returns a list that includes certificates from all TLS contexts including:


        - Settings for transport and HTTP interfaces

        - TLS settings that are used within authentication realms

        - TLS settings for remote monitoring exporters


        The list includes certificates that are used for configuring trust, such as those configured in the `xpack.security.transport.ssl.truststore` and `xpack.security.transport.ssl.certificate_authorities` settings.

        It also includes certificates that are used for configuring server identity, such as `xpack.security.http.ssl.keystore` and `xpack.security.http.ssl.certificate settings`.


        The list does not include certificates that are sourced from the default SSL context of the Java Runtime Environment (JRE), even if those certificates are in use within Elasticsearch.


        NOTE: When a PKCS#11 token is configured as the truststore of the JRE, the API returns all the certificates that are included in the PKCS#11 token irrespective of whether these are used in the Elasticsearch TLS configuration.


        If Elasticsearch is configured to use a keystore or truststore, the API output includes all certificates in that store, even though some of the certificates might not be in active use within the cluster.


        ## Required authorization


        * Cluster privileges: `monitor`'
      externalDocs:
        description: About setting up transport tls
        url: https://www.elastic.co/docs/deploy-manage/security/set-up-basic-security#encrypt-internode-communication
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-ssl.html
      operationId: ssl-certificates
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ssl.certificates.CertificateInformation'
              examples:
                GetCertificatesResponseExample1:
                  description: 'A successful response from `GET /_ssl/certificates`, which provides information about the certificates on a single node of Elasticsearch.

                    '
                  value: "[\n  {\n    \"path\": \"certs/elastic-certificates.p12\",\n    \"format\": \"PKCS12\",\n    \"alias\": \"instance\",\n    \"subject_dn\": \"CN=Elastic Certificate Tool Autogenerated CA\",\n    \"serial_number\": \"a20f0ee901e8f69dc633ff633e5cd5437cdb4137\",\n    \"has_private_key\": false,\n    \"expiry\": \"2021-01-15T20:42:49.000Z\"\n  },\n  {\n    \"path\": \"certs/elastic-certificates.p12\",\n    \"format\": \"PKCS12\",\n    \"alias\": \"ca\",\n    \"subject_dn\": \"CN=Elastic Certificate Tool Autogenerated CA\",\n    \"serial_number\": \"a20f0ee901e8f69dc633ff633e5cd5437cdb4137\",\n    \"has_private_key\": false,\n    \"expiry\": \"2021-01-15T20:42:49.000Z\"\n  },\n  {\n    \"path\": \"certs/elastic-certificates.p12\",\n    \"format\": \"PKCS12\",\n    \"alias\": \"instance\",\n    \"subject_dn\": \"CN=instance\",\n    \"serial_number\": \"fc1905e1494dc5230218d079c47a617088f84ce0\",\n    \"has_private_key\": true,\n    \"expiry\": \"2021-01-15T20:44:32.000Z\"\n  }\n]"
      x-state: Generally available; Added in 6.2.0
      x-codeSamples:
      - lang: Console
        source: 'GET /_ssl/certificates

          '
      - lang: Python
        source: resp = client.ssl.certificates()
      - lang: JavaScript
        source: const response = await client.ssl.certificates();
      - lang: Ruby
        source: response = client.ssl.certificates
      - lang: PHP
        source: $resp = $client->ssl()->certificates();
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_ssl/certificates"'
      - lang: Java
        source: 'client.ssl().certificates();

          '
      x-metaTags:
