              description: 'A successful response from `POST /_security/profile/u_P_0BMHgaOK3p7k-PFWUCbw9dQ-UFjt01oWJ_Dp2PmPc_0/_data`, which indicates that the request is acknowledged.

                '
              value: "{\n  \"acknowledged\": true\n}"
    security.get_user-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/security._types.User'
          examples:
            SecurityGetUserResponseExample1:
              description: 'A successful response from `GET /_security/user/jacknich?with_profile_uid=true`. It includes the user `profile_uid` as part of the response.

                '
              value: "{\n  \"jacknich\": {\n    \"username\": \"jacknich\",\n    \"roles\": [\n      \"admin\", \"other_role1\"\n    ],\n    \"full_name\": \"Jack Nicholson\",\n    \"email\": \"jacknich@example.com\",\n    \"metadata\": { \"intelligence\" : 7 },\n    \"enabled\": true,\n    \"profile_uid\": \"u_79HkWkwmnBH5gqFKwoxggWPjEBOur1zLPXQPEl1VBW0_0\"\n  }\n}"
    security.query_role-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                description: The total number of roles found.
                type: number
              count:
                description: The number of roles returned in the response.
                type: number
              roles:
                description: 'A list of roles that match the query.

                  The returned role format is an extension of the role definition format.

                  It adds the `transient_metadata.enabled` and the `_sort` fields.

                  `transient_metadata.enabled` is set to `false` in case the role is automatically disabled, for example when the role grants privileges that are not allowed by the installed license.

                  `_sort` is present when the search query sorts on some field.

                  It contains the array of values that have been used for sorting.'
                type: array
                items:
                  $ref: '#/components/schemas/security.query_role.QueryRole'
            required:
            - total
            - count
            - roles
          examples:
            QueryRolesResponseExample1:
              summary: Query roles by name
              description: 'A successful response from `POST /_security/_query/role`. It returns a JSON structure that contains the information retrieved for one or more roles.

                '
              value: "{\n    \"total\": 2,\n    \"count\": 2,\n    \"roles\": [ \n        {\n          \"name\" : \"my_admin_role\",\n          \"cluster\" : [\n            \"all\"\n          ],\n          \"indices\" : [\n            {\n              \"names\" : [\n                \"index1\",\n                \"index2\"\n              ],\n              \"privileges\" : [\n                \"all\"\n              ],\n              \"field_security\" : {\n                \"grant\" : [\n                  \"title\",\n                  \"body\"\n                ]\n              },\n              \"allow_restricted_indices\" : false\n            }\n          ],\n          \"applications\" : [ ],\n          \"run_as\" : [\n            \"other_user\"\n          ],\n          \"metadata\" : {\n            \"version\" : 1\n          },\n          \"transient_metadata\" : {\n            \"enabled\" : true\n          },\n          \"description\" : \"Grants full access to all management features within the cluster.\",\n          \"_sort\" : [\n            \"my_admin_role\"\n          ]\n        },\n        {\n          \"name\" : \"my_user_role\",\n          \"cluster\" : [ ],\n          \"indices\" : [\n            {\n              \"names\" : [\n                \"index1\",\n                \"index2\"\n              ],\n              \"privileges\" : [\n                \"all\"\n              ],\n              \"field_security\" : {\n                \"grant\" : [\n                  \"title\",\n                  \"body\"\n                ]\n              },\n              \"allow_restricted_indices\" : false\n            }\n          ],\n          \"applications\" : [ ],\n          \"run_as\" : [ ],\n          \"metadata\" : {\n            \"version\" : 1\n          },\n          \"transient_metadata\" : {\n            \"enabled\" : true\n          },\n          \"description\" : \"Grants user access to some indicies.\",\n          \"_sort\" : [\n            \"my_user_role\"\n          ]\n        }\n    ]\n}"
            QueryRolesResponseExample2:
              summary: Query roles by description
              description: 'A successful response from `POST /_security/_query/role`.

                '
              value: "{\n    \"total\": 2,\n    \"count\": 1,\n    \"roles\": [\n        {\n          \"name\" : \"my_user_role\",\n          \"cluster\" : [ ],\n          \"indices\" : [\n            {\n              \"names\" : [\n                \"index1\",\n                \"index2\"\n              ],\n              \"privileges\" : [\n                \"all\"\n              ],\n              \"field_security\" : {\n                \"grant\" : [\n                  \"title\",\n                  \"body\"\n                ]\n              },\n              \"allow_restricted_indices\" : false\n            }\n          ],\n          \"applications\" : [ ],\n          \"run_as\" : [ ],\n          \"metadata\" : {\n            \"version\" : 1\n          },\n          \"transient_metadata\" : {\n            \"enabled\" : true\n          },\n          \"description\" : \"Grants user access to some indicies.\"\n        }\n    ]\n}"
    security.put_user-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              created:
                description: 'A successful call returns a JSON structure that shows whether the user has been created or updated.

                  When an existing user is updated, `created` is set to `false`.'
                type: boolean
            required:
            - created
          examples:
            SecurityPutUserResponseExample1:
              description: 'A successful response from `POST /_security/user/jacknich`. When an existing user is updated, `created` is set to `false`.

                '
              value: "{\n  \"created\": true \n}"
    security.get_privileges-200:
