    delete:
      tags:
      - Security
      summary: Delete user-managed service accounts
      description: 'Delete a service account from a namespace of your own.


        Deleting an account that still has service tokens is rejected unless `force` is `true`.

        A forced delete leaves the tokens behind: they cannot authenticate while no account of that name exists, and recreating the account is rejected until they are deleted.


        NOTE: The `elastic` namespace is reserved for the built-in service accounts that ship with Elasticsearch.

        A name that no user-managed service account could have is rejected rather than reported as not found.

        The `manage_service_account` privilege does not authorize this API.


        ## Required authorization


        * Cluster privileges: `manage_security`'
      externalDocs:
        description: More about service accounts
        url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/service-accounts
      operationId: security-delete-user-managed-service-account
      parameters:
      - in: path
        name: namespace
        description: 'The namespace, which is a top-level grouping of service accounts.

          It must start with a letter or digit and can contain only letters, digits, hyphens, and underscores, up to a maximum of 128 characters.

          It cannot be `elastic`, which is reserved for built-in service accounts.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Namespace'
        style: simple
      - in: path
        name: service
        description: 'The service name.

          It must start with a letter or digit and can contain only letters, digits, hyphens, and underscores, up to a maximum of 128 characters.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Service'
        style: simple
      - in: query
        name: refresh
        description: If `wait_for` (the default) then wait for a refresh to make this operation visible to search, if `true` then refresh the affected shards to make this operation visible to search, if `false` then do nothing with refreshes.
        deprecated: false
        schema:
          default: wait_for
          allOf:
          - $ref: '#/components/schemas/_types.Refresh'
        style: form
      - in: query
        name: force
        description: 'If `false` (the default), deleting a service account that still has service tokens is rejected.

          If `true`, the account is deleted and its tokens are left in place.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    description: 'If the service account is successfully deleted, the request returns `{"found": true}`.

                      Otherwise, the response will have status code 404 and `found` is set to `false`.'
                    type: boolean
                required:
                - found
              examples:
                DeleteUserManagedServiceAccountResponseExample1:
                  description: 'A successful response from `DELETE /_security/service/my-namespace/my-service`.

                    '
                  value: "{\n  \"found\": true\n}"
      x-state: Generally available; Added in 9.6.0
      x-codeSamples:
      - lang: Console
        source: 'DELETE /_security/service/my-namespace/my-service

          '
      - lang: Python
        source: "resp = client.security.delete_user_managed_service_account(\n    namespace=\"my-namespace\",\n    service=\"my-service\",\n)"
      - lang: JavaScript
        source: "const response = await client.security.deleteUserManagedServiceAccount({\n  namespace: \"my-namespace\",\n  service: \"my-service\",\n});"
      - lang: Ruby
        source: "response = client.security.delete_user_managed_service_account(\n  namespace: \"my-namespace\",\n  service: \"my-service\"\n)"
