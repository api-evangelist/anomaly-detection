      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/security.get_service_accounts.ServiceAccountInfo'
          examples:
            GetServiceAccountsResponseExample1:
              summary: A built-in service account
              description: 'A successful response from `GET /_security/service/elastic/fleet-server`. The response contains information about the `elastic/fleet-server` service account.

                '
              value: "{\n  \"elastic/fleet-server\": {\n    \"type\": \"built_in\",\n    \"role_descriptor\": {\n      \"cluster\": [\n        \"monitor\",\n        \"manage_own_api_key\",\n        \"read_fleet_secrets\"\n      ],\n      \"indices\": [\n        {\n          \"names\": [\n            \"logs-*\",\n            \"metrics-*\",\n            \"traces-*\",\n            \".logs-endpoint.diagnostic.collection-*\",\n            \".logs-endpoint.action.responses-*\",\n            \".logs-endpoint.heartbeat-*\"\n          ],\n          \"privileges\": [\n            \"write\",\n            \"create_index\",\n            \"auto_configure\"\n          ],\n          \"allow_restricted_indices\": false\n        },\n        {\n          \"names\": [\n            \"profiling-*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\"\n          ],\n          \"allow_restricted_indices\": false\n        },\n        {\n          \"names\": [\n            \"traces-apm.sampled-*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"monitor\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": false\n        },\n        {\n          \"names\": [\n            \".fleet-secrets*\"\n          ],\n          \"privileges\": [\n            \"read\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \".fleet-actions*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"monitor\",\n            \"create_index\",\n            \"auto_configure\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \".fleet-agents*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"monitor\",\n            \"create_index\",\n            \"auto_configure\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \".fleet-artifacts*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"monitor\",\n            \"create_index\",\n            \"auto_configure\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \".fleet-enrollment-api-keys*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"monitor\",\n            \"create_index\",\n            \"auto_configure\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \".fleet-policies*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"monitor\",\n            \"create_index\",\n            \"auto_configure\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \".fleet-policies-leader*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"monitor\",\n            \"create_index\",\n            \"auto_configure\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \".fleet-servers*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"monitor\",\n            \"create_index\",\n            \"auto_configure\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \".fleet-fileds*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"monitor\",\n            \"create_index\",\n            \"auto_configure\",\n            \"maintenance\"\n          ],\n          \"allow_restricted_indices\": true\n        },\n        {\n          \"names\": [\n            \"synthetics-*\"\n          ],\n          \"privileges\": [\n            \"read\",\n            \"write\",\n            \"create_index\",\n            \"auto_configure\"\n          ],\n          \"allow_restricted_indices\": false\n        }\n      ],\n      \"applications\": [\n        {\n          \"application\": \"kibana-*\",\n          \"privileges\": [\n            \"reserved_fleet-setup\"\n          ],\n          \"resources\": [\n            \"*\"\n          ]\n        }\n      ],\n      \"run_as\": [],\n      \"metadata\": {},\n      \"transient_metadata\": {\n        \"enabled\": true\n      }\n    }\n  }\n}"
            GetServiceAccountsResponseExample2:
              summary: User-managed service accounts in a namespace
              description: 'A successful response from `GET /_security/service/my-namespace?type=user_managed`. The response contains the user-managed service accounts in the `my-namespace` namespace.

                '
              value: "{\n  \"my-namespace/my-service\": {\n    \"type\": \"user_managed\",\n    \"roles\": [\n      \"my_role\"\n    ],\n    \"enabled\": true\n  }\n}"
