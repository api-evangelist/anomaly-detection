  /_security/saml/logout:
    post:
      tags:
      - Security
      summary: Logout of SAML
      description: 'Submits a request to invalidate an access token and refresh token.


        NOTE: This API is intended for use by custom web applications other than Kibana.

        If you are using Kibana, refer to the documentation for configuring SAML single-sign-on on the Elastic Stack.


        This API invalidates the tokens that were generated for a user by the SAML authenticate API.

        If the SAML realm in Elasticsearch is configured accordingly and the SAML IdP supports this, the Elasticsearch response contains a URL to redirect the user to the IdP that contains a SAML logout request (starting an SP-initiated SAML Single Logout).'
      externalDocs:
        description: More about SAML authentication
        url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/saml
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-saml-logout.html
      operationId: security-saml-logout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  description: 'The access token that was returned as a response to calling the SAML authenticate API.

                    Alternatively, the most recent token that was received after refreshing the original one by using a `refresh_token`.'
                  type: string
                refresh_token:
                  description: 'The refresh token that was returned as a response to calling the SAML authenticate API.

                    Alternatively, the most recent refresh token that was received after refreshing the original access token.'
                  type: string
              required:
              - token
            examples:
              SamlLogoutRequestExample1:
                description: 'Run `POST /_security/saml/logout` to invalidate the pair of tokens that were generated by calling the SAML authenticate API with a successful SAML response.

                  '
                value: "{\n  \"token\" : \"46ToAxZVaXVVZTVKOVF5YU04ZFJVUDVSZlV3\",\n  \"refresh_token\" : \"mJdXLtmvTUSpoLwMvdBt_w\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect:
                    description: 'A URL that contains a SAML logout request as a parameter.

                      You can use this URL to be redirected back to the SAML IdP and to initiate Single Logout.'
                    type: string
                required:
                - redirect
              examples:
                SamlLogoutResponseExample1:
                  description: A successful response from `POST /_security/saml/logout`.
                  value: "{\n  \"redirect\" : \"https://my-idp.org/logout/SAMLRequest=....\"\n}"
      x-state: Generally available; Added in 7.5.0
      x-codeSamples:
      - lang: Console
        source: "POST /_security/saml/logout\n{\n  \"token\" : \"46ToAxZVaXVVZTVKOVF5YU04ZFJVUDVSZlV3\",\n  \"refresh_token\" : \"mJdXLtmvTUSpoLwMvdBt_w\"\n}"
      - lang: Python
        source: "resp = client.security.saml_logout(\n    token=\"46ToAxZVaXVVZTVKOVF5YU04ZFJVUDVSZlV3\",\n    refresh_token=\"mJdXLtmvTUSpoLwMvdBt_w\",\n)"
      - lang: JavaScript
        source: "const response = await client.security.samlLogout({\n  token: \"46ToAxZVaXVVZTVKOVF5YU04ZFJVUDVSZlV3\",\n  refresh_token: \"mJdXLtmvTUSpoLwMvdBt_w\",\n});"
