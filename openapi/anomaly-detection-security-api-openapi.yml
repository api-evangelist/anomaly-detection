                - $ref: '#/components/schemas/security.has_privileges_user_profile.HasPrivilegesUserProfileErrors'
            required:
            - has_privilege_uids
          examples:
            HasPrivilegesUserProfileResponseExample1:
              description: 'A response from `POST /_security/profile/_has_privileges` that indicates only one of the three users has all the privileges and one of them is not found.

                '
              value: "{\n  \"has_privilege_uids\": [\"u_rzRnxDgEHIH0GOUoFkZr5Y27YUwSk19Joiq=g4OCxxB_1\"],\n  \"errors\": {\n    \"count\": 1,\n    \"details\": {\n      \"u_does-not-exist_0\": {\n        \"type\": \"resource_not_found_exception\",\n        \"reason\": \"profile document not found\"\n      }\n    }\n  }\n}"
    security.has_privileges-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              application:
                allOf:
                - $ref: '#/components/schemas/security.has_privileges.ApplicationsPrivileges'
              cluster:
                type: object
                additionalProperties:
                  type: boolean
              has_all_requested:
                type: boolean
              index:
