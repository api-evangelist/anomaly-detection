  /_security/oidc/prepare:
    post:
      tags:
      - Security
      summary: Prepare OpenID connect authentication
      description: 'Create an oAuth 2.0 authentication request as a URL string based on the configuration of the OpenID Connect authentication realm in Elasticsearch.


        The response of this API is a URL pointing to the Authorization Endpoint of the configured OpenID Connect Provider, which can be used to redirect the browser of the user in order to continue the authentication process.


        Elasticsearch exposes all the necessary OpenID Connect related functionality with the OpenID Connect APIs.

        These APIs are used internally by Kibana in order to provide OpenID Connect based authentication, but can also be used by other, custom web applications or other clients.'
      operationId: security-oidc-prepare-authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                iss:
                  description: 'In the case of a third party initiated single sign on, this is the issuer identifier for the OP that the RP is to send the authentication request to.

                    It cannot be specified when *realm* is specified.

                    One of *realm* or *iss* is required.'
                  type: string
                login_hint:
                  description: 'In the case of a third party initiated single sign on, it is a string value that is included in the authentication request as the *login_hint* parameter.

                    This parameter is not valid when *realm* is specified.'
                  type: string
                nonce:
                  description: 'The value used to associate a client session with an ID token and to mitigate replay attacks.

                    If the caller of the API does not provide a value, Elasticsearch will generate one with sufficient entropy and return it in the response.'
                  type: string
                realm:
                  description: 'The name of the OpenID Connect realm in Elasticsearch the configuration of which should be used in order to generate the authentication request.

                    It cannot be specified when *iss* is specified.

                    One of *realm* or *iss* is required.'
                  type: string
                state:
                  description: 'The value used to maintain state between the authentication request and the response, typically used as a Cross-Site Request Forgery mitigation.

                    If the caller of the API does not provide a value, Elasticsearch will generate one with sufficient entropy and return it in the response.'
                  type: string
            examples:
              OidcPrepareAuthenticationRequestExample1:
                summary: Prepare with realm
                description: 'Run `POST /_security/oidc/prepare` to generate an authentication request for the OpenID Connect Realm `oidc1`.

                  '
                value: "{\n  \"realm\" : \"oidc1\"\n}"
              OidcPrepareAuthenticationRequestExample2:
                summary: Prepare with realm, state, and nonce
                description: 'Run `POST /_security/oidc/prepare` to generate an authentication request for the OpenID Connect Realm `oidc1`, where the values for the `state` and the `nonce` have been generated by the client.

                  '
                value: "{\n  \"realm\" : \"oidc1\",\n  \"state\" : \"lGYK0EcSLjqH6pkT5EVZjC6eIW5YCGgywj2sxROO\",\n  \"nonce\" : \"zOBXLJGUooRrbLbQk5YCcyC8AXw3iloynvluYhZ5\"\n}"
              OidcPrepareAuthenticationRequestExample3:
                summary: Prepare by realm
                description: 'Run `POST /_security/oidc/prepare` to generate an authentication request for a third party initiated single sign on. Specify the issuer that should be used for matching the appropriate OpenID Connect Authentication realm.

                  '
                value: "{\n  \"iss\" : \"http://127.0.0.1:8080\",\n  \"login_hint\": \"this_is_an_opaque_string\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce:
                    type: string
                  realm:
                    type: string
                  redirect:
                    description: A URI that points to the authorization endpoint of the OpenID Connect Provider with all the parameters of the authentication request as HTTP GET parameters.
                    type: string
                  state:
                    type: string
                required:
                - nonce
                - realm
                - redirect
                - state
              examples:
                OidcPrepareAuthenticationResponseExample1:
                  description: 'A successful response from `POST /_security/oidc/prepare`. It contains the URI pointing to the Authorization Endpoint of the OpenID Connect Provider with all the parameters of the Authentication Request as HTTP GET parameters.

                    '
                  value: "{\n  \"redirect\" : \"http://127.0.0.1:8080/c2id-login?scope=openid&response_type=id_token&redirect_uri=https%3A%2F%2Fmy.fantastic.rp%2Fcb&state=4dbrihtIAt3wBTwo6DxK-vdk-sSyDBV8Yf0AjdkdT5I&nonce=WaBPH0KqPVdG5HHdSxPRjfoZbXMCicm5v1OiAj0DUFM&client_id=elasticsearch-rp\",\n  \"state\" : \"4dbrihtIAt3wBTwo6DxK-vdk-sSyDBV8Yf0AjdkdT5I\",\n  \"nonce\" : \"WaBPH0KqPVdG5HHdSxPRjfoZbXMCicm5v1OiAj0DUFM\",\n  \"realm\" : \"oidc1\"\n}"
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: "POST /_security/oidc/prepare\n{\n  \"realm\" : \"oidc1\"\n}"
      - lang: Python
        source: "resp = client.security.oidc_prepare_authentication(\n    realm=\"oidc1\",\n)"
      - lang: JavaScript
        source: "const response = await client.security.oidcPrepareAuthentication({\n  realm: \"oidc1\",\n});"
      - lang: Ruby
        source: "response = client.security.oidc_prepare_authentication(\n  body: {\n    \"realm\": \"oidc1\"\n  }\n)"
      - lang: PHP
        source: "$resp = $client->security()->oidcPrepareAuthentication([\n    \"body\" => [\n        \"realm\" => \"oidc1\",\n    ],\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"realm":"oidc1"}'' "$ELASTICSEARCH_URL/_security/oidc/prepare"'
      - lang: C#
        source: "var response = await client.Security\n    .OidcPrepareAuthenticationAsync(d1 => d1\n        .Realm(\"oidc1\")\n    );"
      - lang: Java
        source: "client.security().oidcPrepareAuthentication(o -> o\n    .realm(\"oidc1\")\n);\n"
