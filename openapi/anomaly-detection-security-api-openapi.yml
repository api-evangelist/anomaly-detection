  /_security/cross_cluster/api_key/{id}:
    put:
      tags:
      - Security
      summary: Update a cross-cluster API key
      description: 'Update the attributes of an existing cross-cluster API key, which is used for API key based remote cluster access.


        To use this API, you must have at least the `manage_security` cluster privilege.

        Users can only update API keys that they created.

        To update another user''s API key, use the `run_as` feature to submit a request on behalf of another user.


        IMPORTANT: It''s not possible to use an API key as the authentication credential for this API.

        To update an API key, the owner user''s credentials are required.


        It''s not possible to update expired API keys, or API keys that have been invalidated by the invalidate API key API.


        This API supports updates to an API key''s access scope, metadata, and expiration.

        The owner user''s information, such as the `username` and `realm`, is also updated automatically on every call.


        NOTE: This API cannot update REST API keys, which should be updated by either the update API key or bulk update API keys API.


        To learn more about how to use this API, refer to the Update cross cluter API key API examples page.


        ## Required authorization


        * Cluster privileges: `manage_security`'
      externalDocs:
        description: About adding remote clusters
        url: https://www.elastic.co/docs/deploy-manage/remote-clusters/remote-clusters-api-key
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-update-cross-cluster-api-key.html
      operationId: security-update-cross-cluster-api-key
      parameters:
      - in: path
        name: id
        description: The ID of the cross-cluster API key to update.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Id'
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                access:
                  description: 'The access to be granted to this API key.

                    The access is composed of permissions for cross cluster search and cross cluster replication.

                    At least one of them must be specified.

                    When specified, the new access assignment fully replaces the previously assigned access.'
                  allOf:
                  - $ref: '#/components/schemas/security._types.Access'
                expiration:
                  description: 'The expiration time for the API key.

                    By default, API keys never expire. This property can be omitted to leave the value unchanged.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                metadata:
                  description: 'Arbitrary metadata that you want to associate with the API key.

                    It supports nested data structure.

                    Within the metadata object, keys beginning with `_` are reserved for system usage.

                    When specified, this information fully replaces metadata previously associated with the API key.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Metadata'
                certificate_identity:
                  description: 'The certificate identity to associate with this API key.

                    This field is used to restrict the API key to connections authenticated by a specific TLS certificate.

                    The value should match the certificate''s distinguished name (DN) pattern.

                    When specified, this fully replaces any previously assigned certificate identity.

                    To clear an existing certificate identity, explicitly set this field to `null`.

                    When omitted, the existing certificate identity remains unchanged.'
                  type: string
              required:
              - access
            examples:
              UpdateCrossClusterApiKeyRequestExample1:
                description: 'Run `PUT /_security/cross_cluster/api_key/VuaCfGcBCdbkQm-e5aOx` to update a cross-cluster API key, assigning it new access scope and metadata.

                  '
                value: "{\n  \"access\": {\n    \"replication\": [\n      {\n        \"names\": [\"archive\"]\n      }\n    ]\n  },\n  \"metadata\": {\n    \"application\": \"replication\"\n  }\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    description: 'If `true`, the API key was updated.

                      If `false`, the API key didn’t change because no change was detected.'
                    type: boolean
                required:
                - updated
              examples:
                UpdateCrossClusterApiKeyResponseExample1:
                  description: 'A successful response from `PUT /_security/cross_cluster/api_key/VuaCfGcBCdbkQm-e5aOx` that indicates that the API key was updated.

                    '
                  value: "{\n  \"updated\": true\n}"
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: "PUT /_security/cross_cluster/api_key/VuaCfGcBCdbkQm-e5aOx\n{\n  \"access\": {\n    \"replication\": [\n      {\n        \"names\": [\"archive\"]\n      }\n    ]\n  },\n  \"metadata\": {\n    \"application\": \"replication\"\n  }\n}"
      - lang: Python
        source: "resp = client.security.update_cross_cluster_api_key(\n    id=\"VuaCfGcBCdbkQm-e5aOx\",\n    access={\n        \"replication\": [\n            {\n                \"names\": [\n                    \"archive\"\n                ]\n            }\n        ]\n    },\n    metadata={\n        \"application\": \"replication\"\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.security.updateCrossClusterApiKey({\n  id: \"VuaCfGcBCdbkQm-e5aOx\",\n  access: {\n    replication: [\n      {\n        names: [\"archive\"],\n      },\n    ],\n  },\n  metadata: {\n    application: \"replication\",\n  },\n});"
      - lang: Ruby
        source: "response = client.security.update_cross_cluster_api_key(\n  id: \"VuaCfGcBCdbkQm-e5aOx\",\n  body: {\n    \"access\": {\n      \"replication\": [\n        {\n          \"names\": [\n            \"archive\"\n          ]\n        }\n      ]\n    },\n    \"metadata\": {\n      \"application\": \"replication\"\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->security()->updateCrossClusterApiKey([\n    \"id\" => \"VuaCfGcBCdbkQm-e5aOx\",\n    \"body\" => [\n        \"access\" => [\n            \"replication\" => array(\n                [\n                    \"names\" => array(\n                        \"archive\",\n                    ),\n                ],\n            ),\n        ],\n        \"metadata\" => [\n            \"application\" => \"replication\",\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"access":{"replication":[{"names":["archive"]}]},"metadata":{"application":"replication"}}'' "$ELASTICSEARCH_URL/_security/cross_cluster/api_key/VuaCfGcBCdbkQm-e5aOx"'
      - lang: C#
        source: "var response = await client.Security\n    .UpdateCrossClusterApiKeyAsync(id: \"VuaCfGcBCdbkQm-e5aOx\", d1 => d1\n        .Access(d2 => d2\n            .Replication(d3 => d3\n                .Names([\"archive\"])\n            )\n        )\n        .Metadata(new Dictionary<string, object>()\n        {\n            { \"application\", \"replication\" }\n        })\n    );"
      - lang: Java
        source: "client.security().updateCrossClusterApiKey(u -> u\n    .access(a -> a\n        .replication(r -> r\n            .names(\"archive\")\n        )\n    )\n    .id(\"VuaCfGcBCdbkQm-e5aOx\")\n    .metadata(\"application\", JsonData.fromJson(\"\\\"replication\\\"\"))\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_security/profile/{uid}/_data:
    post:
      tags:
      - Security
      summary: Update user profile data
      description: '**All methods and paths for this operation:**


        PUT

        /_security/profile/{uid}/_data


        POST

        /_security/profile/{uid}/_data


        Update specific data for the user profile that is associated with a unique ID.


        NOTE: The user profile feature is designed only for use by Kibana and Elastic''s Observability, Enterprise Search, and Elastic Security solutions.

        Individual users and external applications should not call this API directly.

        Elastic reserves the right to change or remove this feature in future releases without prior notice.


        To use this API, you must have one of the following privileges:


        * The `manage_user_profile` cluster privilege.

        * The `update_profile_data` global privilege for the namespaces that are referenced in the request.


        This API updates the `labels` and `data` fields of an existing user profile document with JSON objects.

        New keys and their values are added to the profile document and conflicting keys are replaced by data that''s included in the request.


        For both labels and data, content is namespaced by the top-level fields.

        The `update_profile_data` global privilege grants privileges for updating only the allowed namespaces.


        ## Required authorization


        * Cluster privileges: `manage_user_profile`'
      operationId: security-update-user-profile-data
      parameters:
      - $ref: '#/components/parameters/security.update_user_profile_data-uid'
      - $ref: '#/components/parameters/security.update_user_profile_data-if_seq_no'
      - $ref: '#/components/parameters/security.update_user_profile_data-if_primary_term'
      - $ref: '#/components/parameters/security.update_user_profile_data-refresh'
      requestBody:
        $ref: '#/components/requestBodies/security.update_user_profile_data'
      responses:
        '200':
          $ref: '#/components/responses/security.update_user_profile_data-200'
      x-state: Generally available; Added in 8.2.0
      x-codeSamples:
      - lang: Console
        source: "POST /_security/profile/u_P_0BMHgaOK3p7k-PFWUCbw9dQ-UFjt01oWJ_Dp2PmPc_0/_data\n{\n  \"labels\": {\n    \"direction\": \"east\"\n  },\n  \"data\": {\n    \"app1\": {\n      \"theme\": \"default\"\n    }\n  }\n}"
      - lang: Python
        source: "resp = client.security.update_user_profile_data(\n    uid=\"u_P_0BMHgaOK3p7k-PFWUCbw9dQ-UFjt01oWJ_Dp2PmPc_0\",\n    labels={\n        \"direction\": \"east\"\n    },\n    data={\n        \"app1\": {\n            \"theme\": \"default\"\n        }\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.security.updateUserProfileData({\n  uid: \"u_P_0BMHgaOK3p7k-PFWUCbw9dQ-UFjt01oWJ_Dp2PmPc_0\",\n  labels: {\n    direction: \"east\",\n  },\n  data: {\n    app1: {\n      theme: \"default\",\n    },\n  },\n});"
