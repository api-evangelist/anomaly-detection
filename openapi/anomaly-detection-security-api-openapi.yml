  /_security/cross_cluster/api_key:
    post:
      tags:
      - Security
      summary: Create a cross-cluster API key
      description: 'Create an API key of the `cross_cluster` type for the API key based remote cluster access.

        A `cross_cluster` API key cannot be used to authenticate through the REST interface.


        IMPORTANT: To authenticate this request you must use a credential that is not an API key. Even if you use an API key that has the required privilege, the API returns an error.


        Cross-cluster API keys are created by the Elasticsearch API key service, which is automatically enabled.


        NOTE: Unlike REST API keys, a cross-cluster API key does not capture permissions of the authenticated user. The API key’s effective permission is exactly as specified with the `access` property.


        A successful request returns a JSON structure that contains the API key, its unique ID, and its name. If applicable, it also returns expiration information for the API key in milliseconds.


        By default, API keys never expire. You can specify expiration information when you create the API keys.


        Cross-cluster API keys can only be updated with the update cross-cluster API key API.

        Attempting to update them with the update REST API key API or the bulk update REST API keys API will result in an error.


        ## Required authorization


        * Cluster privileges: `manage_security`'
      externalDocs:
        description: About adding remote clusters
        url: https://www.elastic.co/docs/deploy-manage/remote-clusters/remote-clusters-api-key
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-create-cross-cluster-api-key.html
      operationId: security-create-cross-cluster-api-key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                access:
                  description: 'The access to be granted to this API key.

                    The access is composed of permissions for cross-cluster search and cross-cluster replication.

                    At least one of them must be specified.


                    NOTE: No explicit privileges should be specified for either search or replication access.

                    The creation process automatically converts the access specification to a role descriptor which has relevant privileges assigned accordingly.'
                  allOf:
                  - $ref: '#/components/schemas/security._types.Access'
                expiration:
                  description: 'Expiration time for the API key.

                    By default, API keys never expire.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Duration'
                metadata:
                  description: 'Arbitrary metadata that you want to associate with the API key.

                    It supports nested data structure.

                    Within the metadata object, keys beginning with `_` are reserved for system usage.'
                  allOf:
                  - $ref: '#/components/schemas/_types.Metadata'
                name:
                  description: Specifies the name for this API key.
                  allOf:
                  - $ref: '#/components/schemas/_types.Name'
                certificate_identity:
                  description: 'The certificate identity to associate with this API key.

                    This field is used to restrict the API key to connections authenticated by a specific TLS certificate.

                    The value should match the certificate''s distinguished name (DN) pattern.'
                  type: string
              required:
              - access
              - name
            examples:
              CreateCrossClusterApiKeyRequestExample1:
                description: 'Run `POST /_security/cross_cluster/api_key` to create a cross-cluster API key.

                  '
                value: "{\n  \"name\": \"my-cross-cluster-api-key\",\n  \"expiration\": \"1d\",   \n  \"access\": {\n    \"search\": [  \n      {\n        \"names\": [\"logs*\"]\n      }\n    ],\n    \"replication\": [  \n      {\n        \"names\": [\"archive*\"]\n      }\n    ]\n  },\n  \"metadata\": {\n    \"description\": \"phase one\",\n    \"environment\": {\n      \"level\": 1,\n      \"trusted\": true,\n      \"tags\": [\"dev\", \"staging\"]\n    }\n  }\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    description: Generated API key.
                    type: string
                  expiration:
                    description: Expiration in milliseconds for the API key.
                    allOf:
                    - $ref: '#/components/schemas/_types.DurationValueUnitMillis'
                  id:
                    description: Unique ID for this API key.
                    allOf:
                    - $ref: '#/components/schemas/_types.Id'
                  name:
                    description: Specifies the name for this API key.
                    allOf:
                    - $ref: '#/components/schemas/_types.Name'
                  encoded:
                    description: 'API key credentials which is the base64-encoding of

                      the UTF-8 representation of `id` and `api_key` joined

                      by a colon (`:`).'
                    type: string
                required:
                - api_key
                - id
                - name
                - encoded
              examples:
                CreateCrossClusterApiKeyResponseExample1:
                  description: 'A successful response from `POST /_security/service/elastic/fleet-server/credential/token`.

                    '
                  value: "{\n  \"created\": true,\n  \"token\": {\n    \"name\": \"Jk5J1HgBuyBK5TpDrdo4\",\n    \"value\": \"AAEAAWVsYXN0aWM...vZmxlZXQtc2VydmVyL3Rva2VuMTo3TFdaSDZ\"\n  }\n}"
      x-state: Generally available
      x-codeSamples:
      - lang: Console
        source: "POST /_security/cross_cluster/api_key\n{\n  \"name\": \"my-cross-cluster-api-key\",\n  \"expiration\": \"1d\",   \n  \"access\": {\n    \"search\": [  \n      {\n        \"names\": [\"logs*\"]\n      }\n    ],\n    \"replication\": [  \n      {\n        \"names\": [\"archive*\"]\n      }\n    ]\n  },\n  \"metadata\": {\n    \"description\": \"phase one\",\n    \"environment\": {\n      \"level\": 1,\n      \"trusted\": true,\n      \"tags\": [\"dev\", \"staging\"]\n    }\n  }\n}"
      - lang: Python
        source: "resp = client.security.create_cross_cluster_api_key(\n    name=\"my-cross-cluster-api-key\",\n    expiration=\"1d\",\n    access={\n        \"search\": [\n            {\n                \"names\": [\n                    \"logs*\"\n                ]\n            }\n        ],\n        \"replication\": [\n            {\n                \"names\": [\n                    \"archive*\"\n                ]\n            }\n        ]\n    },\n    metadata={\n        \"description\": \"phase one\",\n        \"environment\": {\n            \"level\": 1,\n            \"trusted\": True,\n            \"tags\": [\n                \"dev\",\n                \"staging\"\n            ]\n        }\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.security.createCrossClusterApiKey({\n  name: \"my-cross-cluster-api-key\",\n  expiration: \"1d\",\n  access: {\n    search: [\n      {\n        names: [\"logs*\"],\n      },\n    ],\n    replication: [\n      {\n        names: [\"archive*\"],\n      },\n    ],\n  },\n  metadata: {\n    description: \"phase one\",\n    environment: {\n      level: 1,\n      trusted: true,\n      tags: [\"dev\", \"staging\"],\n    },\n  },\n});"
      - lang: Ruby
        source: "response = client.security.create_cross_cluster_api_key(\n  body: {\n    \"name\": \"my-cross-cluster-api-key\",\n    \"expiration\": \"1d\",\n    \"access\": {\n      \"search\": [\n        {\n          \"names\": [\n            \"logs*\"\n          ]\n        }\n      ],\n      \"replication\": [\n        {\n          \"names\": [\n            \"archive*\"\n          ]\n        }\n      ]\n    },\n    \"metadata\": {\n      \"description\": \"phase one\",\n      \"environment\": {\n        \"level\": 1,\n        \"trusted\": true,\n        \"tags\": [\n          \"dev\",\n          \"staging\"\n        ]\n      }\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->security()->createCrossClusterApiKey([\n    \"body\" => [\n        \"name\" => \"my-cross-cluster-api-key\",\n        \"expiration\" => \"1d\",\n        \"access\" => [\n            \"search\" => array(\n                [\n                    \"names\" => array(\n                        \"logs*\",\n                    ),\n                ],\n            ),\n            \"replication\" => array(\n                [\n                    \"names\" => array(\n                        \"archive*\",\n                    ),\n                ],\n            ),\n        ],\n        \"metadata\" => [\n            \"description\" => \"phase one\",\n            \"environment\" => [\n                \"level\" => 1,\n                \"trusted\" => true,\n                \"tags\" => array(\n                    \"dev\",\n                    \"staging\",\n                ),\n            ],\n        ],\n    ],\n]);"
