      - lang: PHP
        source: "$resp = $client->security()->putRoleMapping([\n    \"name\" => \"mapping1\",\n    \"body\" => [\n        \"roles\" => array(\n            \"user\",\n        ),\n        \"enabled\" => true,\n        \"rules\" => [\n            \"field\" => [\n                \"username\" => \"*\",\n            ],\n        ],\n        \"metadata\" => [\n            \"version\" => 1,\n        ],\n    ],\n]);"
