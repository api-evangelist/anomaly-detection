      - lang: PHP
        source: "$resp = $client->security()->updateUserProfileData([\n    \"uid\" => \"u_P_0BMHgaOK3p7k-PFWUCbw9dQ-UFjt01oWJ_Dp2PmPc_0\",\n    \"body\" => [\n        \"labels\" => [\n            \"direction\" => \"east\",\n        ],\n        \"data\" => [\n            \"app1\" => [\n                \"theme\" => \"default\",\n            ],\n        ],\n    ],\n]);"
      - lang: curl
