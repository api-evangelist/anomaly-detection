  /_security/oidc/authenticate:
    post:
      tags:
      - Security
      summary: Authenticate OpenID Connect
      description: 'Exchange an OpenID Connect authentication response message for an Elasticsearch internal access token and refresh token that can be subsequently used for authentication.


        Elasticsearch exposes all the necessary OpenID Connect related functionality with the OpenID Connect APIs.

        These APIs are used internally by Kibana in order to provide OpenID Connect based authentication, but can also be used by other, custom web applications or other clients.'
      operationId: security-oidc-authenticate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  description: 'Associate a client session with an ID token and mitigate replay attacks.

                    This value needs to be the same as the one that was provided to the `/_security/oidc/prepare` API or the one that was generated by Elasticsearch and included in the response to that call.'
                  type: string
                realm:
                  description: 'The name of the OpenID Connect realm.

                    This property is useful in cases where multiple realms are defined.'
                  type: string
                redirect_uri:
                  description: 'The URL to which the OpenID Connect Provider redirected the User Agent in response to an authentication request after a successful authentication.

                    This URL must be provided as-is (URL encoded), taken from the body of the response or as the value of a location header in the response from the OpenID Connect Provider.'
                  type: string
                state:
                  description: 'Maintain state between the authentication request and the response.

                    This value needs to be the same as the one that was provided to the `/_security/oidc/prepare` API or the one that was generated by Elasticsearch and included in the response to that call.'
                  type: string
              required:
              - nonce
              - redirect_uri
              - state
            examples:
              OidcAuthenticateRequestExample1:
                description: 'Run `POST /_security/oidc/authenticate` to exchange the response that was returned from the OpenID Connect Provider after a successful authentication for an Elasticsearch access token and refresh token. This example is from an authentication that uses the authorization code grant flow.

                  '
                value: "{\n  \"redirect_uri\" : \"https://oidc-kibana.elastic.co:5603/api/security/oidc/callback?code=jtI3Ntt8v3_XvcLzCFGq&state=4dbrihtIAt3wBTwo6DxK-vdk-sSyDBV8Yf0AjdkdT5I\",\n  \"state\" : \"4dbrihtIAt3wBTwo6DxK-vdk-sSyDBV8Yf0AjdkdT5I\",\n  \"nonce\" : \"WaBPH0KqPVdG5HHdSxPRjfoZbXMCicm5v1OiAj0DUFM\",\n  \"realm\" : \"oidc1\"\n}"
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    description: The Elasticsearch access token.
                    type: string
                  expires_in:
                    description: The duration (in seconds) of the tokens.
                    type: number
                  refresh_token:
                    description: The Elasticsearch refresh token.
                    type: string
                  type:
                    description: The type of token.
                    type: string
                required:
                - access_token
                - expires_in
                - refresh_token
                - type
              examples:
