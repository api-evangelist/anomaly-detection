  /_security/delegate_pki:
    post:
      tags:
      - Security
      summary: Delegate PKI authentication
      description: 'This API implements the exchange of an X509Certificate chain for an Elasticsearch access token.

        The certificate chain is validated, according to RFC 5280, by sequentially considering the trust configuration of every installed PKI realm that has `delegation.enabled` set to `true`.

        A successfully trusted client certificate is also subject to the validation of the subject distinguished name according to thw `username_pattern` of the respective realm.


        This API is called by smart and trusted proxies, such as Kibana, which terminate the user''s TLS session but still want to authenticate the user by using a PKI realm—-​as if the user connected directly to Elasticsearch.


        IMPORTANT: The association between the subject public key in the target certificate and the corresponding private key is not validated.

        This is part of the TLS authentication process and it is delegated to the proxy that calls this API.

        The proxy is trusted to have performed the TLS authentication and this API translates that authentication into an Elasticsearch access token.


        ## Required authorization


        * Cluster privileges: `all`'
      externalDocs:
        description: Learn more about pki
        url: https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/pki
        x-previousVersionUrl: https://www.elastic.co/guide/en/elasticsearch/reference/8.19/security-api-delegate-pki-authentication.html
      operationId: security-delegate-pki
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                x509_certificate_chain:
                  description: 'The X509Certificate chain, which is represented as an ordered string array.

                    Each string in the array is a base64-encoded (Section 4 of RFC4648 - not base64url-encoded) of the certificate''s DER encoding.


                    The first element is the target certificate that contains the subject distinguished name that is requesting access.

                    This may be followed by additional certificates; each subsequent certificate is used to certify the previous one.'
                  type: array
                  items:
                    type: string
              required:
              - x509_certificate_chain
            examples:
              SecurityDelegatePkiRequestExample1:
                description: Delegate a one element certificate chain.
                value: '{

                  "x509_certificate_chain": [""]

                  }'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    description: An access token associated with the subject distinguished name of the client's certificate.
                    type: string
                  expires_in:
                    description: The amount of time (in seconds) before the token expires.
                    type: number
                  type:
                    description: The type of token.
                    type: string
                  authentication:
                    allOf:
                    - $ref: '#/components/schemas/security.delegate_pki.Authentication'
                required:
                - access_token
                - expires_in
                - type
              examples:
                SecurityDelegatePkiResponseExample1:
                  description: A successful response from delegating a one element certificate chain.
                  value: "{\n  \"access_token\": \"dGhpcyBpcyBub3QgYSByZWFsIHRva2VuIGJ1dCBpdCBpcyBvbmx5IHRlc3QgZGF0YS4gZG8gbm90IHRyeSB0byByZWFkIHRva2VuIQ==\",\n  \"type\": \"Bearer\",\n  \"expires_in\": 1200,\n  \"authentication\": {\n    \"username\": \"Elasticsearch Test Client\",\n    \"roles\": [],\n    \"full_name\": null,\n    \"email\": null,\n    \"metadata\": {\n      \"pki_dn\": \"O=org, OU=Elasticsearch, CN=Elasticsearch Test Client\",\n      \"pki_delegated_by_user\": \"test_admin\",\n      \"pki_delegated_by_realm\": \"file\"\n    },\n    \"enabled\": true,\n    \"authentication_realm\": {\n      \"name\": \"pki1\",\n      \"type\": \"pki\"\n    },\n    \"lookup_realm\": {\n      \"name\": \"pki1\",\n      \"type\": \"pki\"\n    },\n    \"authentication_type\": \"realm\"\n  }\n}"
      x-state: Generally available; Added in 7.4.0
      x-codeSamples:
      - lang: Console
        source: 'POST /_security/delegate_pki

          {

          "x509_certificate_chain": [""]

          }'
      - lang: Python
        source: "resp = client.security.delegate_pki(\n    x509_certificate_chain=[\n        \"\"\n    ],\n)"
      - lang: JavaScript
        source: "const response = await client.security.delegatePki({\n  x509_certificate_chain: [\n    \"\",\n  ],\n});"
      - lang: Ruby
        source: "response = client.security.delegate_pki(\n  body: {\n    \"x509_certificate_chain\": [\n      \"\"\n    ]\n  }\n)"
      - lang: PHP
        source: "$requestFactory = Psr17FactoryDiscovery::findRequestFactory();\n$streamFactory = Psr17FactoryDiscovery::findStreamFactory();\n$request = $requestFactory->createRequest(\n    \"POST\",\n    \"/_security/delegate_pki\",\n);\n$request = $request->withHeader(\"Content-Type\", \"application/json\");\n$request = $request->withBody($streamFactory->createStream(\n    json_encode([\n        \"x509_certificate_chain\" => array(\n            \"\",\n        ),\n    ]),\n));\n$resp = $client->sendRequest($request);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"x509_certificate_chain":[""]}'' "$ELASTICSEARCH_URL/_security/delegate_pki"'
      - lang: C#
        source: "var response = await client.Security\n    .DelegatePkiAsync(d1 => d1\n        .X509CertificateChain(\"\")\n    );"
      - lang: Java
        source: "client.security().delegatePki(d -> d\n    .x509CertificateChain(\"\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
