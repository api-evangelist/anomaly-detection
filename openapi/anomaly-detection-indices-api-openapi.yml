          geohash:
            allOf:
            - $ref: '#/components/schemas/_types.GeoHash'
          geohex:
            allOf:
            - $ref: '#/components/schemas/_types.GeoHexCell'
        minProperties: 1
        maxProperties: 1
    _types.TopLeftBottomRightGeoBounds:
      type: object
      properties:
        top_left:
