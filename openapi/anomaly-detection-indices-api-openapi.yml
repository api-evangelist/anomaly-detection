  /_resolve/cluster/{name}:
    get:
      tags:
      - Indices
      summary: Resolve the cluster
      description: '**All methods and paths for this operation:**


        GET

        /_resolve/cluster


        GET

        /_resolve/cluster/{name}


        Resolve the specified index expressions to return information about each cluster, including the local "querying" cluster, if included. If no index expression is provided, the API will return information about all the remote clusters that are configured on the querying cluster. This endpoint is useful before doing a cross-cluster search in order to determine which remote clusters should be included in a search. You use the same index expression with this endpoint as you would for cross-cluster search. Index and cluster exclusions are also supported with this endpoint. For each cluster in the index expression, information is returned about:


        * Whether the querying ("local") cluster is currently connected to each remote cluster specified in the index expression. Note that this endpoint actively attempts to contact the remote clusters, unlike the `remote/info` endpoint. * Whether each remote cluster is configured with `skip_unavailable` as `true` or `false`. * Whether there are any indices, aliases, or data streams on that cluster that match the index expression. * Whether the search is likely to have errors returned when you do the cross-cluster search (including any authorization errors if you do not have permission to query the index). * Cluster version information, including the Elasticsearch server version. For example, `GET /_resolve/cluster/my-index-*,cluster*:my-index-*` returns information about the local cluster and all remotely configured clusters that start with the alias `cluster*`. Each cluster returns information about whether it has any indices, aliases or data streams that match `my-index-*`. ## Note on backwards compatibility

        The ability to query without an index expression was added in version 8.18, so when

        querying remote clusters older than that, the local cluster will send the index

        expression `dummy*` to those remote clusters. Thus, if an errors occur, you may see a reference

        to that index expression even though you didn''t request it. If it causes a problem, you can

        instead include an index expression like `*:*` to bypass the issue. ## Advantages of using this endpoint before a cross-cluster search


        You may want to exclude a cluster or index from a search when:


        * A remote cluster is not currently connected and is configured with `skip_unavailable=false`. Running a cross-cluster search under those conditions will cause the entire search to fail. * A cluster has no matching indices, aliases or data streams for the index expression (or your user does not have permissions to search them). For example, suppose your index expression is `logs*,remote1:logs*` and the remote1 cluster has no indices, aliases or data streams that match `logs*`. In that case, that cluster will return no results from that cluster if you include it in a cross-cluster search. * The index expression (combined with any query parameters you specify) will likely cause an exception to be thrown when you do the search. In these cases, the "error" field in the `_resolve/cluster` response will be present. (This is also where security/permission errors will be shown.)

        * A remote cluster is an older version that does not support the feature you want to use in your search. ## Test availability of remote clusters


        The `remote/info` endpoint is commonly used to test whether the "local" cluster (the cluster being queried) is connected to its remote clusters, but it does not necessarily reflect whether the remote cluster is available or not. The remote cluster may be available, while the local cluster is not currently connected to it. You can use the `_resolve/cluster` API to attempt to reconnect to remote clusters. For example with `GET _resolve/cluster` or `GET _resolve/cluster/*:*`. The `connected` field in the response will indicate whether it was successful.'
      operationId: indices-resolve-cluster
      parameters:
      - $ref: '#/components/parameters/indices.resolve_cluster-name'
      - $ref: '#/components/parameters/indices.resolve_cluster-allow_no_indices'
      - $ref: '#/components/parameters/indices.resolve_cluster-expand_wildcards'
      - $ref: '#/components/parameters/indices.resolve_cluster-ignore_throttled'
      - $ref: '#/components/parameters/indices.resolve_cluster-ignore_unavailable'
      - $ref: '#/components/parameters/indices.resolve_cluster-timeout'
      responses:
        '200':
          $ref: '#/components/responses/indices.resolve_cluster-200'
      x-state: Generally available; Added in 8.13.0
      x-codeSamples:
      - lang: Console
        source: 'GET /_resolve/cluster/not-present,clust*:my-index*,oldcluster:*?ignore_unavailable=false&timeout=5s

          '
      - lang: Python
        source: "resp = client.indices.resolve_cluster(\n    name=\"not-present,clust*:my-index*,oldcluster:*\",\n    ignore_unavailable=False,\n    timeout=\"5s\",\n)"
      - lang: JavaScript
        source: "const response = await client.indices.resolveCluster({\n  name: \"not-present,clust*:my-index*,oldcluster:*\",\n  ignore_unavailable: \"false\",\n  timeout: \"5s\",\n});"
      - lang: Ruby
        source: "response = client.indices.resolve_cluster(\n  name: \"not-present,clust*:my-index*,oldcluster:*\",\n  ignore_unavailable: \"false\",\n  timeout: \"5s\"\n)"
      - lang: PHP
        source: "$resp = $client->indices()->resolveCluster([\n    \"name\" => \"not-present,clust*:my-index*,oldcluster:*\",\n    \"ignore_unavailable\" => \"false\",\n    \"timeout\" => \"5s\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_resolve/cluster/not-present,clust*:my-index*,oldcluster:*?ignore_unavailable=false&timeout=5s"'
      - lang: C#
        source: "var response = await client.Indices\n    .ResolveClusterAsync(d1 => d1\n        .Name(new[] { \"not-present\", \"clust*:my-index*\", \"oldcluster:*\" })\n        .IgnoreUnavailable(false)\n        .Timeout(\"5s\")\n    );"
      - lang: Java
        source: "client.indices().resolveCluster(r -> r\n    .ignoreUnavailable(false)\n    .name(List.of(\"not-present\",\"clust*:my-index*\",\"oldcluster:*\"))\n    .timeout(t -> t\n        .time(\"5s\")\n    )\n);\n"
