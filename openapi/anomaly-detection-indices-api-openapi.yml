      - lang: PHP
        source: "$resp = $client->indices()->create([\n    \"index\" => \"my-index-000001\",\n    \"body\" => [\n        \"settings\" => [\n            \"number_of_shards\" => 3,\n            \"number_of_replicas\" => 2,\n        ],\n    ],\n]);"
