            - float
          null_value:
            type: number
        required:
        - type
    _types.query_dsl.QueryBase:
      type: object
      properties:
        boost:
          description: 'Floating point number used to decrease or increase the relevance scores of the query.

            Boost values are relative to the default value of 1.0.

            A boost value between 0 and 1.0 decreases the relevance score.

            A value greater than 1.0 increases the relevance score.'
          default: 1
          type: number
        _name:
          type: string
      x-model: true
    _global.search._types.HighlighterFragmenter:
      type: string
      enum:
      - simple
      - span
    _types.mapping.GeoShapeProperty:
      description: 'The `geo_shape` data type facilitates the indexing of and searching with arbitrary geo shapes such as rectangles

        and polygons.'
      allOf:
      - $ref: '#/components/schemas/_types.mapping.DocValuesPropertyBase'
      - type: object
        properties:
          coerce:
            type: boolean
          ignore_malformed:
            type: boolean
          ignore_z_value:
            type: boolean
          index:
            type: boolean
          orientation:
            allOf:
            - $ref: '#/components/schemas/_types.mapping.GeoOrientation'
          strategy:
            allOf:
            - $ref: '#/components/schemas/_types.mapping.GeoStrategy'
          type:
            type: string
            enum:
            - geo_shape
        required:
        - type
    _types.aggregations.DerivativeAggregation:
      allOf:
      - $ref: '#/components/schemas/_types.aggregations.PipelineAggregationBase'
      - type: object
    _types.query_dsl.KqlQuery:
      description: 'Returns documents matching a provided Kibana Query Language (KQL) expression.

        The expression is parsed and rewritten into standard Query DSL.'
      allOf:
      - $ref: '#/components/schemas/_types.query_dsl.QueryBase'
      - type: object
        properties:
          case_insensitive:
            description: If `true`, performs case-insensitive matching for field names and keyword or text terms.
            default: false
            type: boolean
          default_field:
            description: 'Default field, or field pattern with wildcards, to target when a bare term does not specify a field.

              Defaults to the `index.query.default_field` index setting, which has a default value of `*`.'
            allOf:
            - $ref: '#/components/schemas/_types.Field'
          query:
            description: The KQL expression to parse.
            type: string
          time_zone:
            description: Coordinated Universal Time (UTC) offset or IANA time zone used to interpret date literals in the expression.
            allOf:
            - $ref: '#/components/schemas/_types.TimeZone'
        required:
        - query
    _types.mapping.ObjectProperty:
      allOf:
      - $ref: '#/components/schemas/_types.mapping.CorePropertyBase'
      - type: object
        properties:
          enabled:
            type: boolean
          subobjects:
            allOf:
            - $ref: '#/components/schemas/_types.mapping.Subobjects'
          type:
            type: string
            enum:
            - object
