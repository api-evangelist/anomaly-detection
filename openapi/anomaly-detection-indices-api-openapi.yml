        sort:
          description: 'How the inner hits should be sorted per `inner_hits`.

            By default, inner hits are sorted by score.'
          allOf:
          - $ref: '#/components/schemas/_types.Sort'
        _source:
          allOf:
          - $ref: '#/components/schemas/_global.search._types.SourceConfig'
        stored_fields:
          allOf:
          - $ref: '#/components/schemas/_types.Fields'
        track_scores:
          default: false
          type: boolean
        version:
          type: boolean
