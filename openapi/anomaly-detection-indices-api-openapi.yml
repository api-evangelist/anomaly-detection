  requestBodies:
    indices.rollover:
      content:
        application/json:
          schema:
            type: object
            properties:
              aliases:
                description: 'Aliases for the target index.

                  Data streams do not support this parameter.'
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/indices._types.Alias'
              conditions:
                description: 'Conditions for the rollover.

                  If specified, Elasticsearch only performs the rollover if the current index satisfies these conditions.

                  If this parameter is not specified, Elasticsearch performs the rollover unconditionally.

                  If conditions are specified, at least one of them must be a `max_*` condition.

                  The index will rollover if any `max_*` condition is satisfied and all `min_*` conditions are satisfied.'
                allOf:
                - $ref: '#/components/schemas/indices.rollover.RolloverConditions'
              mappings:
                description: 'Mapping for fields in the index.

                  If specified, this mapping can include field names, field data types, and mapping paramaters.'
                allOf:
                - $ref: '#/components/schemas/_types.mapping.TypeMapping'
              settings:
                description: 'Configuration options for the index.

                  Data streams do not support this parameter.'
                type: object
                additionalProperties:
                  type: object
          examples:
            indicesRolloverRequestExample1:
              summary: Stack request
              description: Create a new index for a data stream
              value: "{\n  \"conditions\": {\n    \"max_age\": \"7d\",\n    \"max_docs\": 1000,\n    \"max_primary_shard_size\": \"50gb\",\n    \"max_primary_shard_docs\": \"2000\"\n  }\n}"
    indices.put_mapping:
      content:
        application/json:
          schema:
            type: object
            properties:
              date_detection:
                description: Controls whether dynamic date detection is enabled.
                type: boolean
              dynamic:
                description: Controls whether new fields are added dynamically.
                allOf:
                - $ref: '#/components/schemas/_types.mapping.DynamicMapping'
              dynamic_date_formats:
                description: 'If date detection is enabled then new string fields are checked

                  against ''dynamic_date_formats'' and if the value matches then

                  a new date field is added instead of string.'
                type: array
                items:
                  type: string
              dynamic_templates:
                description: Specify dynamic templates for the mapping.
                type: array
                items:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/_types.mapping.DynamicTemplate'
                  minProperties: 1
                  maxProperties: 1
              _field_names:
                description: Control whether field names are enabled for the index.
                allOf:
                - $ref: '#/components/schemas/_types.mapping.FieldNamesField'
              _meta:
                description: 'A mapping type can have custom meta data associated with it. These are

                  not used at all by Elasticsearch, but can be used to store

                  application-specific metadata.'
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
              numeric_detection:
                description: Automatically map strings into numeric data types for all fields.
                default: false
                type: boolean
              properties:
                description: 'Mapping for a field. For new fields, this mapping can include:


                  - Field name

                  - Field data type

                  - Mapping parameters'
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/_types.mapping.Property'
              _routing:
                description: Enable making a routing value required on indexed documents.
                allOf:
                - $ref: '#/components/schemas/_types.mapping.RoutingField'
              _source:
                description: Control whether the _source field is enabled on the index.
                allOf:
                - $ref: '#/components/schemas/_types.mapping.SourceField'
              runtime:
                description: Mapping of runtime fields for the index.
                allOf:
                - $ref: '#/components/schemas/_types.mapping.RuntimeFields'
          examples:
            indicesPutMappingRequestExample1:
              summary: Update multiple targets
              description: 'The update mapping API can be applied to multiple data streams or indices with a single request. For example, run `PUT /my-index-000001,my-index-000002/_mapping` to update mappings for the `my-index-000001` and `my-index-000002` indices at the same time.

                '
              value: "{\n  \"properties\": {\n    \"user\": {\n      \"properties\": {\n        \"name\": {\n          \"type\": \"keyword\"\n        }\n      }\n    }\n  }\n}"
      required: true
    indices.split:
      content:
        application/json:
          schema:
            type: object
            properties:
              aliases:
                description: Aliases for the resulting index.
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/indices._types.Alias'
              settings:
                description: Configuration options for the target index.
                type: object
                additionalProperties:
                  type: object
          examples:
            indicesSplitRequestExample1:
              description: Split an existing index into a new index with more primary shards.
              value: "{\n  \"settings\": {\n    \"index.number_of_shards\": 2\n  }\n}"
      required: true
    indices.put_settings:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/indices._types.IndexSettings'
          examples:
            IndicesPutSettingsRequestExample1:
              summary: Change a dynamic index setting
              value: "{\n  \"index\" : {\n    \"number_of_replicas\" : 2\n  }\n}"
            indicesPutSettingsRequestExample2:
              summary: Reset an index setting
              description: To revert a setting to the default value, use `null`.
              value: "{\n  \"index\" : {\n    \"refresh_interval\" : null\n  }\n}"
            indicesPutSettingsRequestExample3:
              summary: Update index analysis
              description: To add an analyzer, you must close the index (`POST /my-index-000001/_close`), define the analyzer, then reopen the index (`POST /my-index-000001/_open`).
              value: "{\n  \"analysis\": {\n    \"analyzer\": {\n      \"content\": {\n        \"type\": \"custom\",\n        \"tokenizer\": \"whitespace\"\n      }\n    }\n  }\n}"
      required: true
    cluster.put_component_template:
      content:
        application/json:
          schema:
            type: object
            properties:
              template:
                description: The template to be applied which includes mappings, settings, or aliases configuration.
                allOf:
                - $ref: '#/components/schemas/indices.put_index_template.IndexTemplateMapping'
              version:
                description: 'Version number used to manage component templates externally.

                  This number isn''t automatically generated or incremented by Elasticsearch.

                  To unset a version, replace the template without specifying a version.'
                allOf:
                - $ref: '#/components/schemas/_types.VersionNumber'
              _meta:
                description: 'Optional user metadata about the component template.

                  It may have any contents. This map is not automatically generated by Elasticsearch.

                  This information is stored in the cluster state, so keeping it short is preferable.

                  To unset `_meta`, replace the template without specifying this information.'
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
              deprecated:
                description: 'Marks this index template as deprecated. When creating or updating a non-deprecated index template

                  that uses deprecated components, Elasticsearch will emit a deprecation warning.'
                type: boolean
            required:
            - template
          examples:
            ClusterPutComponentTemplateRequestExample1:
              summary: Create a template
              value: "{\n  \"template\": {\n    \"settings\": {\n      \"number_of_shards\": 1\n    },\n    \"mappings\": {\n      \"_source\": {\n        \"enabled\": false\n      },\n      \"properties\": {\n        \"host_name\": {\n          \"type\": \"keyword\"\n        },\n        \"created_at\": {\n          \"type\": \"date\",\n          \"format\": \"EEE MMM dd HH:mm:ss Z yyyy\"\n        }\n      }\n    }\n  }\n}"
            ClusterPutComponentTemplateRequestExample2:
              summary: Create a template with aliases
              description: 'You can include index aliases in a component template. During index creation, the `{index}` placeholder in the alias name will be replaced with the actual index name that the template gets applied to.

                '
              value: "{\n  \"template\": {\n    \"settings\": {\n      \"number_of_shards\": 1\n    },\n    \"aliases\": {\n      \"alias1\": {},\n      \"alias2\": {\n        \"filter\": {\n          \"term\": {\n            \"user.id\": \"kimchy\"\n          }\n        },\n        \"routing\": \"shard-1\"\n      },\n      \"{index}-alias\": {}\n    }\n  }\n}"
      required: true
    indices.shrink:
      content:
        application/json:
          schema:
            type: object
            properties:
              aliases:
                description: 'The key is the alias name.

                  Index alias names support date math.'
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/indices._types.Alias'
              settings:
                description: Configuration options for the target index.
                type: object
                additionalProperties:
                  type: object
          examples:
            indicesShrinkRequestExample1:
              summary: Shrink an existing index into a new index with fewer primary shards.
              value: "{\n  \"settings\": {\n    \"index.routing.allocation.require._name\": null,\n    \"index.blocks.write\": null\n  }\n}"
      required: true
    indices.clone:
      content:
        application/json:
          schema:
            type: object
            properties:
              aliases:
                description: Aliases for the resulting index.
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/indices._types.Alias'
              settings:
                description: Configuration options for the target index.
                type: object
                additionalProperties:
                  type: object
          examples:
            indicesCloneRequestExample1:
              summary: Clone an existing index.
              description: 'Clone `my_source_index` into a new index called `my_target_index` with `POST /my_source_index/_clone/my_target_index`. The API accepts `settings` and `aliases` parameters for the target index.

                '
              value: "{\n  \"settings\": {\n    \"index.refresh_interval\": \"2s\"\n  },\n  \"aliases\": {\n    \"my_search_indices\": {}\n  }\n}"
    indices.validate_query:
      content:
        application/json:
          schema:
            type: object
            properties:
              query:
                description: Query in the Lucene query string syntax.
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
    indices.resolve_index:
      content:
        application/json:
          schema:
            type: object
    indices.put_index_template:
      content:
        application/json:
          schema:
            type: object
            properties:
              index_patterns:
                description: Array of wildcard (`*`) expressions used to match the names of data streams and indices during creation.
                allOf:
                - $ref: '#/components/schemas/_types.Indices'
              composed_of:
                description: 'An ordered list of component template names.

                  Component templates are merged in the order specified, meaning that the last component template specified has the highest precedence.'
                type: array
                items:
                  $ref: '#/components/schemas/_types.Name'
              template:
                description: 'Template to be applied.

                  It may optionally include an `aliases`, `mappings`, or `settings` configuration.'
                allOf:
                - $ref: '#/components/schemas/indices.put_index_template.IndexTemplateMapping'
              data_stream:
                description: 'If this object is included, the template is used to create data streams and their backing indices.

                  Supports an empty object.

                  Data streams require a matching index template with a `data_stream` object.'
                allOf:
                - $ref: '#/components/schemas/indices._types.DataStreamVisibility'
              priority:
                description: 'Priority to determine index template precedence when a new data stream or index is created.

                  The index template with the highest priority is chosen.

                  If no priority is specified the template is treated as though it is of priority 0 (lowest priority).

                  This number is not automatically generated by Elasticsearch.'
                type: number
              version:
                description: 'Version number used to manage index templates externally.

                  This number is not automatically generated by Elasticsearch.

                  External systems can use these version numbers to simplify template management.

                  To unset a version, replace the template without specifying one.'
                allOf:
                - $ref: '#/components/schemas/_types.VersionNumber'
              _meta:
                description: 'Optional user metadata about the index template.

                  It may have any contents.

                  It is not automatically generated or used by Elasticsearch.

                  This user-defined object is stored in the cluster state, so keeping it short is preferable

                  To unset the metadata, replace the template without specifying it.'
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
              allow_auto_create:
                description: 'This setting overrides the value of the `action.auto_create_index` cluster setting.

                  If set to `true` in a template, then indices can be automatically created using that template even if auto-creation of indices is disabled via `actions.auto_create_index`.

                  If set to `false`, then indices or data streams matching the template must always be explicitly created, and may never be automatically created.'
                type: boolean
              ignore_missing_component_templates:
                description: 'The configuration option ignore_missing_component_templates can be used when an index template

                  references a component template that might not exist'
                type: array
                items:
                  type: string
              deprecated:
                description: 'Marks this index template as deprecated. When creating or updating a non-deprecated index template

                  that uses deprecated components, Elasticsearch will emit a deprecation warning.'
                type: boolean
          examples:
            IndicesPutIndexTemplateRequestExample1:
              summary: Create a template
              value: "{\n  \"index_patterns\" : [\"template*\"],\n  \"priority\" : 1,\n  \"template\": {\n    \"settings\" : {\n      \"number_of_shards\" : 2\n    }\n  }\n}"
            IndicesPutIndexTemplateRequestExample2:
              summary: Create a template with aliases
              description: 'You can include index aliases in an index template.

                During index creation, the `{index}` placeholder in the alias name will be replaced with the actual index name that the template gets applied to.

                '
              value: "{\n  \"index_patterns\": [\n    \"template*\"\n  ],\n  \"template\": {\n    \"settings\": {\n      \"number_of_shards\": 1\n    },\n    \"aliases\": {\n      \"alias1\": {},\n      \"alias2\": {\n        \"filter\": {\n          \"term\": {\n            \"user.id\": \"kimchy\"\n          }\n        },\n        \"routing\": \"shard-1\"\n      },\n      \"{index}-alias\": {}\n    }\n  }\n}"
      required: true
    indices.put_template:
      content:
        application/json:
          schema:
            type: object
            properties:
              aliases:
                description: Aliases for the index.
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/indices._types.Alias'
              index_patterns:
                description: 'Array of wildcard expressions used to match the names

                  of indices during creation.'
                oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              mappings:
                description: Mapping for fields in the index.
                allOf:
                - $ref: '#/components/schemas/_types.mapping.TypeMapping'
              order:
                description: 'Order in which Elasticsearch applies this template if index

                  matches multiple templates.


                  Templates with lower ''order'' values are merged first. Templates with higher

                  ''order'' values are merged later, overriding templates with lower values.'
                type: number
              settings:
                description: Configuration options for the index.
                allOf:
                - $ref: '#/components/schemas/indices._types.IndexSettings'
              version:
                description: 'Version number used to manage index templates externally. This number

                  is not automatically generated by Elasticsearch.

                  To unset a version, replace the template without specifying one.'
                allOf:
                - $ref: '#/components/schemas/_types.VersionNumber'
          examples:
            indicesPutTemplateRequestExample1:
              summary: Create an index template
              value: "{\n  \"index_patterns\": [\n    \"te*\",\n    \"bar*\"\n  ],\n  \"settings\": {\n    \"number_of_shards\": 1\n  },\n  \"mappings\": {\n    \"_source\": {\n      \"enabled\": false\n    },\n    \"properties\": {\n      \"host_name\": {\n        \"type\": \"keyword\"\n      },\n      \"created_at\": {\n        \"type\": \"date\",\n        \"format\": \"EEE MMM dd HH:mm:ss Z yyyy\"\n      }\n    }\n  }\n}"
            indicesPutTemplateRequestExample2:
              summary: Create an index template with aliases
              description: 'You can include index aliases in an index template. During index creation, the `{index}` placeholder in the alias name will be replaced with the actual index name that the template gets applied to.

                '
              value: "{\n  \"index_patterns\": [\n    \"te*\"\n  ],\n  \"settings\": {\n    \"number_of_shards\": 1\n  },\n  \"aliases\": {\n    \"alias1\": {},\n    \"alias2\": {\n      \"filter\": {\n        \"term\": {\n          \"user.id\": \"kimchy\"\n        }\n      },\n      \"routing\": \"shard-1\"\n    },\n    \"{index}-alias\": {}\n  }\n}"
      required: true
    indices.simulate_template:
      content:
        application/json:
          schema:
            type: object
            properties:
              allow_auto_create:
                description: 'This setting overrides the value of the `action.auto_create_index` cluster setting.

                  If set to `true` in a template, then indices can be automatically created using that template even if auto-creation of indices is disabled via `actions.auto_create_index`.

                  If set to `false`, then indices or data streams matching the template must always be explicitly created, and may never be automatically created.'
                type: boolean
              index_patterns:
                description: Array of wildcard (`*`) expressions used to match the names of data streams and indices during creation.
                allOf:
                - $ref: '#/components/schemas/_types.Indices'
              composed_of:
                description: 'An ordered list of component template names.

                  Component templates are merged in the order specified, meaning that the last component template specified has the highest precedence.'
                type: array
                items:
                  $ref: '#/components/schemas/_types.Name'
              template:
                description: 'Template to be applied.

                  It may optionally include an `aliases`, `mappings`, or `settings` configuration.'
                allOf:
                - $ref: '#/components/schemas/indices.put_index_template.IndexTemplateMapping'
              data_stream:
                description: 'If this object is included, the template is used to create data streams and their backing indices.

                  Supports an empty object.

                  Data streams require a matching index template with a `data_stream` object.'
                allOf:
                - $ref: '#/components/schemas/indices._types.DataStreamVisibility'
              priority:
                description: 'Priority to determine index template precedence when a new data stream or index is created.

                  The index template with the highest priority is chosen.

                  If no priority is specified the template is treated as though it is of priority 0 (lowest priority).

                  This number is not automatically generated by Elasticsearch.'
                type: number
              version:
                description: 'Version number used to manage index templates externally.

                  This number is not automatically generated by Elasticsearch.'
                allOf:
                - $ref: '#/components/schemas/_types.VersionNumber'
              _meta:
                description: 'Optional user metadata about the index template.

                  May have any contents.

                  This map is not automatically generated by Elasticsearch.'
                allOf:
                - $ref: '#/components/schemas/_types.Metadata'
              ignore_missing_component_templates:
                description: 'The configuration option ignore_missing_component_templates can be used when an index template

                  references a component template that might not exist'
                type: array
                items:
                  type: string
              deprecated:
                description: 'Marks this index template as deprecated. When creating or updating a non-deprecated index template

                  that uses deprecated components, Elasticsearch will emit a deprecation warning.'
                type: boolean
          examples:
            indicesSimulateTemplateRequestExample1:
              description: 'To see what settings will be applied by a template before you add it to the cluster, you can pass a template configuration in the request body. The specified template is used for the simulation if it has a higher priority than existing templates.

                '
              value: "{\n  \"index_patterns\": [\"my-index-*\"],\n  \"composed_of\": [\"ct2\"],\n  \"priority\": 10,\n  \"template\": {\n    \"settings\": {\n      \"index.number_of_replicas\": 1\n    }\n  }\n}"
    indices.analyze:
      content:
        application/json:
          schema:
            type: object
            properties:
              analyzer:
                description: 'The name of the analyzer that should be applied to the provided `text`.

                  This could be a built-in analyzer, or an analyzer that’s been configured in the index.'
                type: string
              attributes:
                description: Array of token attributes used to filter the output of the `explain` parameter.
                type: array
                items:
                  type: string
              char_filter:
                description: Array of character filters used to preprocess characters before the tokenizer.
                type: array
                items:
                  $ref: '#/components/schemas/_types.analysis.CharFilter'
              explain:
                description: If `true`, the response includes token attributes and additional details.
                default: false
                type: boolean
              field:
                description: 'Field used to derive the analyzer.

                  To use this parameter, you must specify an index.

                  If specified, the `analyzer` parameter overrides this value.'
                allOf:
                - $ref: '#/components/schemas/_types.Field'
              filter:
                description: Array of token filters used to apply after the tokenizer.
                type: array
                items:
                  $ref: '#/components/schemas/_types.analysis.TokenFilter'
              normalizer:
                description: Normalizer to use to convert text into a single token.
                type: string
              text:
                description: 'Text to analyze.

                  If an array of strings is provided, it is analyzed as a multi-value field.'
                allOf:
                - $ref: '#/components/schemas/indices.analyze.TextToAnalyze'
              tokenizer:
                description: Tokenizer to use to convert text into tokens.
                allOf:
                - $ref: '#/components/schemas/_types.analysis.Tokenizer'
          examples:
            indicesAnalyzeRequestExample1:
              summary: No index specified
              description: You can apply any of the built-in analyzers to the text string without specifying an index.
              value: "{\n  \"analyzer\": \"standard\",\n  \"text\": \"this is a test\"\n}"
            indicesAnalyzeRequestExample2:
              summary: An array of text strings
              description: If the text parameter is provided as array of strings, it is analyzed as a multi-value field.
              value: "{\n  \"analyzer\": \"standard\",\n  \"text\": [\n    \"this is a test\",\n    \"the second text\"\n  ]\n}"
            indicesAnalyzeRequestExample3:
              summary: Custom analyzer example 1
              description: You can test a custom transient analyzer built from tokenizers, token filters, and char filters. Token filters use the filter parameter.
              value: "{\n  \"tokenizer\": \"keyword\",\n  \"filter\": [\n    \"lowercase\"\n  ],\n  \"char_filter\": [\n    \"html_strip\"\n  ],\n  \"text\": \"this is a <b>test</b>\"\n}"
            indicesAnalyzeRequestExample4:
              summary: Custom analyzer example 2
              description: Custom tokenizers, token filters, and character filters can be specified in the request body.
              value: "{\n  \"tokenizer\": \"whitespace\",\n  \"filter\": [\n    \"lowercase\",\n    {\n      \"type\": \"stop\",\n      \"stopwords\": [\n        \"a\",\n        \"is\",\n        \"this\"\n      ]\n    }\n  ],\n  \"text\": \"this is a test\"\n}"
            indicesAnalyzeRequestExample5:
              summary: Derive analyzer from field mapping
              description: Run `GET /analyze_sample/_analyze` to run an analysis on the text using the default index analyzer associated with the `analyze_sample` index. Alternatively, the analyzer can be derived based on a field mapping.
              value: "{\n  \"field\": \"obj1.field1\",\n  \"text\": \"this is a test\"\n}"
            indicesAnalyzeRequestExample6:
              summary: Normalizer
              description: Run `GET /analyze_sample/_analyze` and supply a normalizer for a keyword field if there is a normalizer associated with the specified index.
              value: "{\n  \"normalizer\": \"my_normalizer\",\n  \"text\": \"BaR\"\n}"
            indicesAnalyzeRequestExample7:
              summary: Explain analysis
              description: 'If you want to get more advanced details, set `explain` to `true`. It will output all token attributes for each token. You can filter token attributes you want to output by setting the `attributes` option. NOTE: The format of the additional detail information is labelled as experimental in Lucene and it may change in the future.

                '
              value: "{\n  \"tokenizer\": \"standard\",\n  \"filter\": [\n    \"snowball\"\n  ],\n  \"text\": \"detailed output\",\n  \"explain\": true,\n  \"attributes\": [\n    \"keyword\"\n  ]\n}"
      required: true
    indices.put_alias:
      content:
        application/json:
          schema:
            type: object
            properties:
              filter:
                description: Query used to limit documents the alias can access.
                allOf:
                - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
              index_routing:
                description: 'Value used to route indexing operations to a specific shard.

                  If specified, this overwrites the `routing` value for indexing operations.

                  Data stream aliases don’t support this parameter.'
                type: string
              is_write_index:
                description: 'If `true`, sets the write index or data stream for the alias.

                  If an alias points to multiple indices or data streams and `is_write_index` isn’t set, the alias rejects write requests.

                  If an index alias points to one index and `is_write_index` isn’t set, the index automatically acts as the write index.

                  Data stream aliases don’t automatically set a write data stream, even if the alias points to one data stream.'
                type: boolean
              routing:
                description: 'Value used to route indexing and search operations to a specific shard.

                  Data stream aliases don’t support this parameter.'
                type: string
              search_routing:
                description: 'Value used to route search operations to a specific shard.

                  If specified, this overwrites the `routing` value for search operations.

                  Data stream aliases don’t support this parameter.'
                type: string
          examples:
            indicesPutAliasRequestExample1:
              summary: Filter an alias
              description: The filter option uses Query DSL to limit the documents an alias can access.
              value: "{\n  \"filter\": {\n    \"bool\": {\n      \"filter\": [\n        {\n          \"range\": {\n            \"@timestamp\": {\n              \"gte\": \"now-1d/d\",\n              \"lt\": \"now/d\"\n            }\n          }\n        },\n        {\n          \"term\": {\n            \"user.id\": \"kimchy\"\n          }\n        }\n      ]\n    }\n  }\n}"
            indicesPutAliasRequestExample2:
              summary: Write index
              description: You can use is_write_index to specify a write index or data stream for an alias. Elasticsearch routes any write requests for the alias to this index or data stream.
              value: "{\n  \"is_write_index\": true\n}"
            indicesPutAliasRequestExample3:
              summary: Routing
              description: Use the routing option to route requests for an alias to a specific shard.
              value: "{\n  \"routing\": \"1\"\n}"
  securitySchemes:
    apiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
      description: "Elasticsearch APIs support key-based authentication.\nYou must create an API key and use the encoded value in the request header.\nFor example:\n\n\n```\ncurl -X GET \"${ES_URL}/_cat/indices?v=true\" \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n```\n\nTo get API keys, use the `/_security/api_key` APIs.\n"
    basicAuth:
      scheme: basic
      type: http
    bearerAuth:
      scheme: bearer
      type: http
      description: 'Elasticsearch APIs support the use of bearer tokens in the `Authorization` HTTP header to authenticate with the API.

        For examples, refer to [Token-based authentication services](https://www.elastic.co/docs/deploy-manage/users-roles/cluster-or-deployment-auth/token-based-authentication-services)

        '
