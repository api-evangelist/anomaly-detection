    indices.recovery-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/indices.recovery.RecoveryStatus'
          examples:
            indicesRecoveryResponseExample1:
              summary: Get segment information
              description: 'A successful response from `GET /_recovery?human`, which gets information about ongoing and completed shard recoveries for all data streams and indices in a cluster. This example includes information about a single index recovering a single shard. The source of the recovery is a snapshot repository and the target of the recovery is the `my_es_node` node. The response also includes the number and percentage of files and bytes recovered.

                '
              value: "{\n  \"index1\" : {\n    \"shards\" : [ {\n      \"id\" : 0,\n      \"type\" : \"SNAPSHOT\",\n      \"stage\" : \"INDEX\",\n      \"primary\" : true,\n      \"start_time\" : \"2014-02-24T12:15:59.716\",\n      \"start_time_in_millis\": 1393244159716,\n      \"stop_time\" : \"0s\",\n      \"stop_time_in_millis\" : 0,\n      \"total_time\" : \"2.9m\",\n      \"total_time_in_millis\" : 175576,\n      \"source\" : {\n        \"repository\" : \"my_repository\",\n        \"snapshot\" : \"my_snapshot\",\n        \"index\" : \"index1\",\n        \"version\" : \"{version}\",\n        \"restoreUUID\": \"PDh1ZAOaRbiGIVtCvZOMww\"\n      },\n      \"target\" : {\n        \"id\" : \"ryqJ5lO5S4-lSFbGntkEkg\",\n        \"host\" : \"my.fqdn\",\n        \"transport_address\" : \"my.fqdn\",\n        \"ip\" : \"10.0.1.7\",\n        \"name\" : \"my_es_node\"\n      },\n      \"index\" : {\n        \"size\" : {\n          \"total\" : \"75.4mb\",\n          \"total_in_bytes\" : 79063092,\n          \"reused\" : \"0b\",\n          \"reused_in_bytes\" : 0,\n          \"recovered\" : \"65.7mb\",\n          \"recovered_in_bytes\" : 68891939,\n          \"recovered_from_snapshot\" : \"0b\",\n          \"recovered_from_snapshot_in_bytes\" : 0,\n          \"percent\" : \"87.1%\"\n        },\n        \"files\" : {\n          \"total\" : 73,\n          \"reused\" : 0,\n          \"recovered\" : 69,\n          \"percent\" : \"94.5%\"\n        },\n        \"total_time\" : \"0s\",\n        \"total_time_in_millis\" : 0,\n        \"source_throttle_time\" : \"0s\",\n        \"source_throttle_time_in_millis\" : 0,\n        \"target_throttle_time\" : \"0s\",\n        \"target_throttle_time_in_millis\" : 0\n      },\n      \"translog\" : {\n        \"recovered\" : 0,\n        \"total\" : 0,\n        \"percent\" : \"100.0%\",\n        \"total_on_start\" : 0,\n        \"total_time\" : \"0s\",\n        \"total_time_in_millis\" : 0\n      },\n      \"verify_index\" : {\n        \"check_index_time\" : \"0s\",\n        \"check_index_time_in_millis\" : 0,\n        \"total_time\" : \"0s\",\n        \"total_time_in_millis\" : 0\n      }\n    } ]\n  }\n}"
            indicesRecoveryResponseExample2:
              summary: Get detailed recovery information
              description: 'A successful response from `GET _recovery?human&detailed=true`. The response includes a listing of any physical files recovered and their sizes. The response also includes timings in milliseconds of the various stages of recovery: index retrieval, translog replay, and index start time. This response indicates the recovery is done.

                '
              value: "{\n  \"index1\" : {\n    \"shards\" : [ {\n      \"id\" : 0,\n      \"type\" : \"EXISTING_STORE\",\n      \"stage\" : \"DONE\",\n      \"primary\" : true,\n      \"start_time\" : \"2014-02-24T12:38:06.349\",\n      \"start_time_in_millis\" : \"1393245486349\",\n      \"stop_time\" : \"2014-02-24T12:38:08.464\",\n      \"stop_time_in_millis\" : \"1393245488464\",\n      \"total_time\" : \"2.1s\",\n      \"total_time_in_millis\" : 2115,\n      \"source\" : {\n        \"id\" : \"RGMdRc-yQWWKIBM4DGvwqQ\",\n        \"host\" : \"my.fqdn\",\n        \"transport_address\" : \"my.fqdn\",\n        \"ip\" : \"10.0.1.7\",\n        \"name\" : \"my_es_node\"\n      },\n      \"target\" : {\n        \"id\" : \"RGMdRc-yQWWKIBM4DGvwqQ\",\n        \"host\" : \"my.fqdn\",\n        \"transport_address\" : \"my.fqdn\",\n        \"ip\" : \"10.0.1.7\",\n        \"name\" : \"my_es_node\"\n      },\n      \"index\" : {\n        \"size\" : {\n          \"total\" : \"24.7mb\",\n          \"total_in_bytes\" : 26001617,\n          \"reused\" : \"24.7mb\",\n          \"reused_in_bytes\" : 26001617,\n          \"recovered\" : \"0b\",\n          \"recovered_in_bytes\" : 0,\n          \"recovered_from_snapshot\" : \"0b\",\n          \"recovered_from_snapshot_in_bytes\" : 0,\n          \"percent\" : \"100.0%\"\n        },\n        \"files\" : {\n          \"total\" : 26,\n          \"reused\" : 26,\n          \"recovered\" : 0,\n          \"percent\" : \"100.0%\",\n          \"details\" : [ {\n            \"name\" : \"segments.gen\",\n            \"length\" : 20,\n            \"recovered\" : 20\n          }, {\n            \"name\" : \"_0.cfs\",\n            \"length\" : 135306,\n            \"recovered\" : 135306,\n            \"recovered_from_snapshot\": 0\n          }, {\n            \"name\" : \"segments_2\",\n            \"length\" : 251,\n            \"recovered\" : 251,\n            \"recovered_from_snapshot\": 0\n          }\n          ]\n        },\n        \"total_time\" : \"2ms\",\n        \"total_time_in_millis\" : 2,\n        \"source_throttle_time\" : \"0s\",\n        \"source_throttle_time_in_millis\" : 0,\n        \"target_throttle_time\" : \"0s\",\n        \"target_throttle_time_in_millis\" : 0\n      },\n      \"translog\" : {\n        \"recovered\" : 71,\n        \"total\" : 0,\n        \"percent\" : \"100.0%\",\n        \"total_on_start\" : 0,\n        \"total_time\" : \"2.0s\",\n        \"total_time_in_millis\" : 2025\n      },\n      \"verify_index\" : {\n        \"check_index_time\" : 0,\n        \"check_index_time_in_millis\" : 0,\n        \"total_time\" : \"88ms\",\n        \"total_time_in_millis\" : 88\n      }\n    } ]\n  }\n}"
    indices.resolve_index-200:
