              value: "{\n  \"index_templates\" : [\n    {\n      \"name\" : \"my-index-template\",\n      \"index_template\" : {\n        \"index_patterns\" : [ \"logs-*\" ],\n        \"template\" : {\n          \"settings\" : {\n            \"index\" : {\n              \"number_of_shards\" : \"1\",\n              \"number_of_replicas\" : \"1\"\n            }\n          },\n          \"mappings\" : {\n            \"properties\" : {\n              \"@timestamp\" : {\n                \"type\" : \"date\"\n              },\n              \"message\" : {\n                \"type\" : \"text\"\n              }\n            }\n          }\n        },\n        \"composed_of\" : [ \"my-component-template\" ],\n        \"priority\" : 200,\n        \"version\" : 1,\n        \"_meta\" : {\n          \"description\" : \"my custom index template\"\n        },\n        \"created_date\" : \"2024-01-01T12:00:00.000Z\",\n        \"created_date_millis\" : 1704110400000,\n        \"modified_date\" : \"2025-01-01T12:00:00.000Z\",\n        \"modified_date_millis\" : 1735732800000\n      }\n    }\n  ]\n}"
    indices.resolve_cluster-200:
      description: ''
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/indices.resolve_cluster.ResolveClusterInfo'
          examples:
            ResolveClusterResponseExample1:
              summary: Resolve with wildcards
              description: 'A successful response from `GET /_resolve/cluster/my-index*,clust*:my-index*`. Each cluster has its own response section. The cluster you sent the request to is labelled as "(local)".

                '
              value: "{\n  \"(local)\": {\n    \"connected\": true,\n    \"skip_unavailable\": false,\n    \"matching_indices\": true,\n    \"version\": {\n      \"number\": \"8.13.0\",\n      \"build_flavor\": \"default\",\n      \"minimum_wire_compatibility_version\": \"7.17.0\",\n      \"minimum_index_compatibility_version\": \"7.0.0\"\n    }\n  },\n  \"cluster_one\": {\n    \"connected\": true,\n    \"skip_unavailable\": true,\n    \"matching_indices\": true,\n    \"version\": {\n      \"number\": \"8.13.0\",\n      \"build_flavor\": \"default\",\n      \"minimum_wire_compatibility_version\": \"7.17.0\",\n      \"minimum_index_compatibility_version\": \"7.0.0\"\n    }\n  },\n  \"cluster_two\": {\n    \"connected\": true,\n    \"skip_unavailable\": false,\n    \"matching_indices\": true,\n    \"version\": {\n      \"number\": \"8.13.0\",\n      \"build_flavor\": \"default\",\n      \"minimum_wire_compatibility_version\": \"7.17.0\",\n      \"minimum_index_compatibility_version\": \"7.0.0\"\n    }\n  }\n}"
            ResolveClusterResponseExample2:
              summary: Identify search problems
              description: 'A successful response from `GET /_resolve/cluster/not-present,clust*:my-index*,oldcluster:*?ignore_unavailable=false&timeout=5s`. This type of request can be used to identify potential problems with your cross-cluster search. Note also that a `timeout` of 5 seconds is sent, which sets the maximum time the query will wait for remote clusters to respond. The local cluster has no index called `not_present`. Searching with `ignore_unavailable=false` would return a "no such index" error. The `cluster_one` remote cluster has no indices that match the pattern `my-index*`. There may be no indices that match the pattern or the index could be closed. The `cluster_two` remote cluster is not connected (the attempt to connect failed). Since this cluster is marked as `skip_unavailable=false`, you should probably exclude this cluster from the search by adding `-cluster_two:*` to the search index expression. For `cluster_three`, the error message indicates that this remote cluster did not respond within the 5-second timeout window specified, so it is also marked as not connected. The `oldcluster` remote cluster shows that it has matching indices, but no version information is included. This indicates that the cluster version predates the introduction of the `_resolve/cluster` API, so you may want to exclude it from your cross-cluster search.

                '
              value: "{\n  \"(local)\": {\n    \"connected\": true,\n    \"skip_unavailable\": false,\n    \"error\": \"no such index [not_present]\"\n  },\n  \"cluster_one\": {\n    \"connected\": true,\n    \"skip_unavailable\": true,\n    \"matching_indices\": false,\n    \"version\": {\n      \"number\": \"8.13.0\",\n      \"build_flavor\": \"default\",\n      \"minimum_wire_compatibility_version\": \"7.17.0\",\n      \"minimum_index_compatibility_version\": \"7.0.0\"\n    }\n  },\n  \"cluster_two\": {\n    \"connected\": false,\n    \"skip_unavailable\": false\n  },\n  \"cluster_three\": {\n    \"connected\": false,\n    \"skip_unavailable\": false,\n    \"error\": \"Request timed out before receiving a response from the remote cluster\"\n  },\n  \"oldcluster\": {\n    \"connected\": true,\n    \"skip_unavailable\": false,\n    \"matching_indices\": true\n  }\n}"
