  /{alias}/_rollover/{new_index}:
    post:
      tags:
      - Indices
      summary: Roll over to a new index
      description: '**All methods and paths for this operation:**


        POST

        /{alias}/_rollover


        POST

        /{alias}/_rollover/{new_index}


        TIP: We recommend using the index lifecycle rollover action to automate rollovers. However, Serverless does not support Index Lifecycle Management (ILM), so don''t use this approach in the Serverless context.


        The rollover API creates a new index for a data stream or index alias.

        The API behavior depends on the rollover target.


        **Roll over a data stream**


        If you roll over a data stream, the API creates a new write index for the stream.

        The stream''s previous write index becomes a regular backing index.

        A rollover also increments the data stream''s generation.


        **Roll over an index alias with a write index**


        TIP: Prior to Elasticsearch 7.9, you''d typically use an index alias with a write index to manage time series data.

        Data streams replace this functionality, require less maintenance, and automatically integrate with data tiers.


        If an index alias points to multiple indices, one of the indices must be a write index.

        The rollover API creates a new write index for the alias with `is_write_index` set to `true`.

        The API also `sets is_write_index` to `false` for the previous write index.


        **Roll over an index alias with one index**


        If you roll over an index alias that points to only one index, the API creates a new index for the alias and removes the original index from the alias.


        NOTE: A rollover creates a new index and is subject to the `wait_for_active_shards` setting.


        **Increment index names for an alias**


        When you roll over an index alias, you can specify a name for the new index.

        If you don''t specify a name and the current index ends with `-` and a number, such as `my-index-000001` or `my-index-3`, the new index name increments that number.

        For example, if you roll over an alias with a current index of `my-index-000001`, the rollover creates a new index named `my-index-000002`.

        This number is always six characters and zero-padded, regardless of the previous index''s name.


        If you use an index alias for time series data, you can use date math in the index name to track the rollover date.

        For example, you can create an alias that points to an index named ``.

        If you create the index on May 6, 2099, the index''s name is `my-index-2099.05.06-000001`.

        If you roll over the alias on May 7, 2099, the new index''s name is `my-index-2099.05.07-000002`.


        ## Required authorization


        * Index privileges: `manage`'
      operationId: indices-rollover
      parameters:
      - $ref: '#/components/parameters/indices.rollover-alias'
      - $ref: '#/components/parameters/indices.rollover-new_index'
      - $ref: '#/components/parameters/indices.rollover-dry_run'
      - $ref: '#/components/parameters/indices.rollover-master_timeout'
      - $ref: '#/components/parameters/indices.rollover-timeout'
      - $ref: '#/components/parameters/indices.rollover-wait_for_active_shards'
      - $ref: '#/components/parameters/indices.rollover-lazy'
      requestBody:
        $ref: '#/components/requestBodies/indices.rollover'
      responses:
        '200':
          $ref: '#/components/responses/indices.rollover-200'
      x-state: Generally available; Added in 5.0.0
      x-codeSamples:
      - lang: Console
        source: "POST my-data-stream/_rollover\n{\n  \"conditions\": {\n    \"max_age\": \"7d\",\n    \"max_docs\": 1000,\n    \"max_primary_shard_size\": \"50gb\",\n    \"max_primary_shard_docs\": \"2000\"\n  }\n}"
      - lang: Python
        source: "resp = client.indices.rollover(\n    alias=\"my-data-stream\",\n    conditions={\n        \"max_age\": \"7d\",\n        \"max_docs\": 1000,\n        \"max_primary_shard_size\": \"50gb\",\n        \"max_primary_shard_docs\": \"2000\"\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.indices.rollover({\n  alias: \"my-data-stream\",\n  conditions: {\n    max_age: \"7d\",\n    max_docs: 1000,\n    max_primary_shard_size: \"50gb\",\n    max_primary_shard_docs: \"2000\",\n  },\n});"
      - lang: Ruby
        source: "response = client.indices.rollover(\n  alias: \"my-data-stream\",\n  body: {\n    \"conditions\": {\n      \"max_age\": \"7d\",\n      \"max_docs\": 1000,\n      \"max_primary_shard_size\": \"50gb\",\n      \"max_primary_shard_docs\": \"2000\"\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->indices()->rollover([\n    \"alias\" => \"my-data-stream\",\n    \"body\" => [\n        \"conditions\" => [\n            \"max_age\" => \"7d\",\n            \"max_docs\" => 1000,\n            \"max_primary_shard_size\" => \"50gb\",\n            \"max_primary_shard_docs\" => \"2000\",\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"conditions":{"max_age":"7d","max_docs":1000,"max_primary_shard_size":"50gb","max_primary_shard_docs":"2000"}}'' "$ELASTICSEARCH_URL/my-data-stream/_rollover"'
      - lang: C#
        source: "var response = await client.Indices\n    .RolloverAsync(new RolloverRequest()\n    {\n        Alias = \"my-data-stream\",\n        Conditions = new()\n        {\n            MaxAge = \"7d\",\n            MaxDocs = 1000L,\n            MaxPrimaryShardDocs = 2000L,\n            MaxPrimaryShardSize = new ByteSize(\"50gb\")\n        }\n    });"
      - lang: Java
        source: "client.indices().rollover(r -> r\n    .alias(\"my-data-stream\")\n    .conditions(c -> c\n        .maxAge(m -> m\n            .time(\"7d\")\n        )\n        .maxDocs(1000L)\n        .maxPrimaryShardSize(\"50gb\")\n        .maxPrimaryShardDocs(2000L)\n    )\n);\n"
