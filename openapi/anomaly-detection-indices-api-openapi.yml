    indices.recovery.ShardRecovery:
      type: object
      properties:
        id:
          type: number
        index:
          allOf:
          - $ref: '#/components/schemas/indices.recovery.RecoveryIndexStatus'
        primary:
          type: boolean
        source:
          allOf:
          - $ref: '#/components/schemas/indices.recovery.RecoveryOrigin'
        stage:
          description: "The recovery stage.\n\nSupported values include:\n  - `CREATED`: The shard's recovery state has been created, but the recovery has not started yet (it may be queued behind other ongoing recoveries).\n  - `INIT`: Recovery has started and is initializing.\n  - `INDEX`: Reading index metadata and copying bytes from source to destination.\n  - `VERIFY_INDEX`: Verifying the integrity of the index.\n  - `TRANSLOG`: Replaying the transaction log.\n  - `FINALIZE`: Cleanup.\n  - `DONE`: Complete.\n\n"
          allOf:
          - $ref: '#/components/schemas/indices.recovery.RecoveryStage'
        local_retries:
          description: The number of times this recovery has failed in a way which is retried locally (i.e. on the data node).
          x-state: Generally available; Added in 9.6.0
          type: number
        priority:
          description: "The recovery priority.\n\nSupported values include:\n  - `UNASSIGNED_NEW_PRIMARY`: A primary shard which is unassigned because it is newly created.\n  - `UNASSIGNED_UNEXPECTED`: A shard which is unassigned because of an unexpected condition, i.e. some kind of failure.\n  - `UNASSIGNED_EXPECTED`: A shard which is unassigned for an expected condition, i.e. because of a user operation such as opening or restoring an index, but which is not an UNASSIGNED_NEW_PRIMARY.\n  - `RELOCATION_CAN_REMAIN_NO`: A shard which is assigned, and is being relocated because it cannot remain on its current node according to the allocation deciders.\n  - `RELOCATION_CAN_REMAIN_NOT_PREFERRED`: A shard which is assigned, and is being relocated because it is not preferred for it to remain on its current node according to the allocation deciders.\n  - `RELOCATE_REBALANCING`: A shard which is assigned, and is being relocated for rebalancing.\n  - `UNKNOWN`: Placeholder value for unknown priorities.\n\n"
          x-state: Generally available; Added in 9.6.0
          allOf:
          - $ref: '#/components/schemas/indices.recovery.RecoveryPriority'
        gate:
          description: 'The name of the recovery gate that blocked recovery on the target node.


            Only present for queued recoveries in the `CREATED` stage that are blocked by a recovery gate.'
          x-state: Generally available; Added in 9.6.0
          type: string
        blocked_for_millis:
          description: 'The elapsed time in milliseconds recovery is blocked for.


            Only present with `gate`.'
          x-state: Generally available; Added in 9.6.0
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitMillis'
        start:
          allOf:
          - $ref: '#/components/schemas/indices.recovery.RecoveryStartStatus'
        start_time:
          description: 'The time the recovery started.

            For recoveries in the `CREATED` stage (not yet started), this value is the Unix epoch (1970-01-01T00:00:00.000Z).'
          allOf:
          - $ref: '#/components/schemas/_types.DateTime'
        start_time_in_millis:
          description: 'The time the recovery started, in milliseconds since the Unix epoch.

            For recoveries in the `CREATED` stage (not yet started), this value is 0.'
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        stop_time:
          description: The time the recovery completed. Only present for completed recoveries (`DONE` stage).
          allOf:
          - $ref: '#/components/schemas/_types.DateTime'
        stop_time_in_millis:
          description: 'The time the recovery completed, in milliseconds since the Unix epoch.

            Only present for completed recoveries (`DONE` stage).'
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        target:
          allOf:
          - $ref: '#/components/schemas/indices.recovery.RecoveryOrigin'
        total_time:
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        total_time_in_millis:
          description: 'The total elapsed recovery time in milliseconds.

            For recoveries in the `CREATED` stage (not yet started), this value is 0.'
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitMillis'
        translog:
          allOf:
          - $ref: '#/components/schemas/indices.recovery.TranslogStatus'
        type:
          description: "The recovery source type.\n\nSupported values include:\n  - `EMPTY_STORE`: An empty store. Indicates a new primary shard or the forced allocation of an empty primary shard using the cluster reroute API.\n  - `EXISTING_STORE`: The store of an existing primary shard. Indicates recovery is related to node startup or the allocation of an existing primary shard.\n  - `LOCAL_SHARDS`: Shards of another index on the same node. Indicates recovery is related to a clone, shrink, or split operation.\n  - `PEER`: A primary shard on another node. Indicates recovery is related to shard replication.\n  - `SNAPSHOT`: A snapshot. Indicates recovery is related to a snapshot restore operation.\n\n"
          allOf:
          - $ref: '#/components/schemas/indices.recovery.RecoveryType'
        verify_index:
          allOf:
          - $ref: '#/components/schemas/indices.recovery.VerifyIndex'
      required:
      - id
      - index
      - primary
      - source
      - stage
      - start_time_in_millis
      - target
      - total_time_in_millis
      - translog
