      - lang: Python
        source: "resp = client.indices.split(\n    index=\"my-index-000001\",\n    target=\"split-my-index-000001\",\n    settings={\n        \"index.number_of_shards\": 2\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.indices.split({\n  index: \"my-index-000001\",\n  target: \"split-my-index-000001\",\n  settings: {\n    \"index.number_of_shards\": 2,\n  },\n});"
      - lang: Ruby
        source: "response = client.indices.split(\n  index: \"my-index-000001\",\n  target: \"split-my-index-000001\",\n  body: {\n    \"settings\": {\n      \"index.number_of_shards\": 2\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->indices()->split([\n    \"index\" => \"my-index-000001\",\n    \"target\" => \"split-my-index-000001\",\n    \"body\" => [\n        \"settings\" => [\n            \"index.number_of_shards\" => 2,\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"settings":{"index.number_of_shards":2}}'' "$ELASTICSEARCH_URL/my-index-000001/_split/split-my-index-000001"'
      - lang: C#
        source: "var response = await client.Indices\n    .SplitAsync(index: \"my-index-000001\", target: \"split-my-index-000001\", d1 => d1\n        .Settings(new Dictionary<string, object>()\n        {\n            { \"index.number_of_shards\", 2 }\n        })\n    );"
      - lang: Java
