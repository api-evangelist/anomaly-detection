      description: 'A setting that does two separate checks on the index expression.

        If `false`, the request returns an error (1) if any wildcard expression

        (including `_all` and `*`) resolves to zero matching indices or (2) if the

        complete set of resolved indices, aliases or data streams is empty after all

        expressions are evaluated. If `true`, index expressions that resolve to no

        indices are allowed and the request returns an empty result.'
      deprecated: false
      schema:
        default: true
        type: boolean
      style: form
    indices.stats-groups:
      in: query
      name: groups
      description: Comma-separated list of search groups to include in the search statistics.
      deprecated: false
      schema:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      style: form
    indices.stats-index:
      in: path
      name: index
      description: A comma-separated list of index names; use `_all` or empty string to perform the operation on all indices
      required: true
      deprecated: false
      schema:
        $ref: '#/components/schemas/_types.Indices'
      style: simple
    cluster.get_component_template-flat_settings:
      in: query
      name: flat_settings
      description: If `true`, returns settings in flat format.
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    indices.forcemerge-only_expunge_deletes:
      in: query
      name: only_expunge_deletes
      description: Specify whether the operation should only expunge deleted documents
      deprecated: false
      schema:
        default: false
        type: boolean
      style: form
    indices.delete_alias-master_timeout:
      in: query
      name: master_timeout
      description: 'Period to wait for a connection to the master node.

        If no response is received before the timeout expires, the request fails and returns an error.'
      deprecated: false
      schema:
        default: 30s
        allOf:
        - $ref: '#/components/schemas/_types.Duration'
      style: form
    indices.resolve_index-mode:
      in: query
      name: mode
      description: 'Filter indices by index mode - standard, lookup, time_series, etc. Comma-separated list of IndexMode. Empty means no filter.


        Supported values include: `standard`, `time_series`, `logsdb`, `lookup`


        '
      deprecated: false
      schema:
        oneOf:
        - $ref: '#/components/schemas/indices._types.IndexMode'
        - type: array
          items:
            $ref: '#/components/schemas/indices._types.IndexMode'
      x-state: Generally available; Added in 9.2.0
