paths:
  /_component_template/{name}:
    get:
      tags:
      - Indices
      summary: Get component templates
      description: '**All methods and paths for this operation:**


        GET

        /_component_template


        GET

        /_component_template/{name}


        Get information about component templates.


        ## Required authorization


        * Cluster privileges: `manage_index_templates`'
      operationId: cluster-get-component-template
      parameters:
      - $ref: '#/components/parameters/cluster.get_component_template-name'
      - $ref: '#/components/parameters/cluster.get_component_template-flat_settings'
      - $ref: '#/components/parameters/cluster.get_component_template-settings_filter'
      - $ref: '#/components/parameters/cluster.get_component_template-include_defaults'
      - $ref: '#/components/parameters/cluster.get_component_template-local'
      - $ref: '#/components/parameters/cluster.get_component_template-master_timeout'
      responses:
        '200':
          $ref: '#/components/responses/cluster.get_component_template-200'
      x-state: Generally available; Added in 7.8.0
      x-codeSamples:
      - lang: Console
        source: 'GET /_component_template/template_1

          '
      - lang: Python
        source: "resp = client.cluster.get_component_template(\n    name=\"template_1\",\n)"
      - lang: JavaScript
        source: "const response = await client.cluster.getComponentTemplate({\n  name: \"template_1\",\n});"
      - lang: Ruby
        source: "response = client.cluster.get_component_template(\n  name: \"template_1\"\n)"
      - lang: PHP
        source: "$resp = $client->cluster()->getComponentTemplate([\n    \"name\" => \"template_1\",\n]);"
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_component_template/template_1"'
      - lang: C#
        source: "var response = await client.Cluster\n    .GetComponentTemplateAsync(d1 => d1\n        .Name(\"template_1\")\n    );"
      - lang: Java
        source: "client.cluster().getComponentTemplate(g -> g\n    .name(\"template_1\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    post:
      tags:
      - Indices
      summary: Create or update a component template
      description: '**All methods and paths for this operation:**


        PUT

        /_component_template/{name}


        POST

        /_component_template/{name}


        Component templates are building blocks for constructing index templates that specify index mappings, settings, and aliases.


        An index template can be composed of multiple component templates.

        To use a component template, specify it in an index template’s `composed_of` list.

        Component templates are only applied to new data streams and indices as part of a matching index template.


        Settings and mappings specified directly in the index template or the create index request override any settings or mappings specified in a component template.


        Component templates are only used during index creation.

        For data streams, this includes data stream creation and the creation of a stream’s backing indices.

        Changes to component templates do not affect existing indices, including a stream’s backing indices.


        You can use C-style `/* *\/` block comments in component templates.

        You can include comments anywhere in the request body except before the opening curly bracket.


        **Applying component templates**


        You cannot directly apply a component template to a data stream or index.

        To be applied, a component template must be included in an index template''s `composed_of` list.


        ## Required authorization


        * Cluster privileges: `manage_index_templates`'
      operationId: cluster-put-component-template
      parameters:
      - $ref: '#/components/parameters/cluster.put_component_template-name'
      - $ref: '#/components/parameters/cluster.put_component_template-create'
      - $ref: '#/components/parameters/cluster.put_component_template-cause'
      - $ref: '#/components/parameters/cluster.put_component_template-master_timeout'
      requestBody:
        $ref: '#/components/requestBodies/cluster.put_component_template'
      responses:
        '200':
          $ref: '#/components/responses/cluster.put_component_template-200'
      x-state: Generally available; Added in 7.8.0
      x-codeSamples:
      - lang: Console
        source: "PUT _component_template/template_1\n{\n  \"template\": {\n    \"settings\": {\n      \"number_of_shards\": 1\n    },\n    \"mappings\": {\n      \"_source\": {\n        \"enabled\": false\n      },\n      \"properties\": {\n        \"host_name\": {\n          \"type\": \"keyword\"\n        },\n        \"created_at\": {\n          \"type\": \"date\",\n          \"format\": \"EEE MMM dd HH:mm:ss Z yyyy\"\n        }\n      }\n    }\n  }\n}"
      - lang: Python
        source: "resp = client.cluster.put_component_template(\n    name=\"template_1\",\n    template={\n        \"settings\": {\n            \"number_of_shards\": 1\n        },\n        \"mappings\": {\n            \"_source\": {\n                \"enabled\": False\n            },\n            \"properties\": {\n                \"host_name\": {\n                    \"type\": \"keyword\"\n                },\n                \"created_at\": {\n                    \"type\": \"date\",\n                    \"format\": \"EEE MMM dd HH:mm:ss Z yyyy\"\n                }\n            }\n        }\n    },\n)"
      - lang: JavaScript
        source: "const response = await client.cluster.putComponentTemplate({\n  name: \"template_1\",\n  template: {\n    settings: {\n      number_of_shards: 1,\n    },\n    mappings: {\n      _source: {\n        enabled: false,\n      },\n      properties: {\n        host_name: {\n          type: \"keyword\",\n        },\n        created_at: {\n          type: \"date\",\n          format: \"EEE MMM dd HH:mm:ss Z yyyy\",\n        },\n      },\n    },\n  },\n});"
      - lang: Ruby
        source: "response = client.cluster.put_component_template(\n  name: \"template_1\",\n  body: {\n    \"template\": {\n      \"settings\": {\n        \"number_of_shards\": 1\n      },\n      \"mappings\": {\n        \"_source\": {\n          \"enabled\": false\n        },\n        \"properties\": {\n          \"host_name\": {\n            \"type\": \"keyword\"\n          },\n          \"created_at\": {\n            \"type\": \"date\",\n            \"format\": \"EEE MMM dd HH:mm:ss Z yyyy\"\n          }\n        }\n      }\n    }\n  }\n)"
      - lang: PHP
        source: "$resp = $client->cluster()->putComponentTemplate([\n    \"name\" => \"template_1\",\n    \"body\" => [\n        \"template\" => [\n            \"settings\" => [\n                \"number_of_shards\" => 1,\n            ],\n            \"mappings\" => [\n                \"_source\" => [\n                    \"enabled\" => false,\n                ],\n                \"properties\" => [\n                    \"host_name\" => [\n                        \"type\" => \"keyword\",\n                    ],\n                    \"created_at\" => [\n                        \"type\" => \"date\",\n                        \"format\" => \"EEE MMM dd HH:mm:ss Z yyyy\",\n                    ],\n                ],\n            ],\n        ],\n    ],\n]);"
      - lang: curl
        source: 'curl -X PUT -H "Authorization: ApiKey $ELASTIC_API_KEY" -H "Content-Type: application/json" -d ''{"template":{"settings":{"number_of_shards":1},"mappings":{"_source":{"enabled":false},"properties":{"host_name":{"type":"keyword"},"created_at":{"type":"date","format":"EEE MMM dd HH:mm:ss Z yyyy"}}}}}'' "$ELASTICSEARCH_URL/_component_template/template_1"'
      - lang: C#
        source: "var response = await client.Cluster\n    .PutComponentTemplateAsync(name: \"template_1\", d1 => d1\n        .Template(d2 => d2\n            .Mappings(d3 => d3\n                .Properties(d4 => d4\n                    .Keyword(x => x.HostName)\n                    .Date(x => x.CreatedAt, d5 => d5\n                        .Format(\"EEE MMM dd HH:mm:ss Z yyyy\")\n                    )\n                )\n                .Source(d4 => d4\n                    .Enabled(false)\n                )\n            )\n            .Settings(d3 => d3\n                .NumberOfShards(1)\n            )\n        )\n    );"
      - lang: Java
        source: "client.cluster().putComponentTemplate(p -> p\n    .name(\"template_1\")\n    .template(t -> t\n        .mappings(m -> m\n            .properties(Map.of(\"created_at\", Property.of(pr -> pr\n                    .date(d -> d\n                        .format(\"EEE MMM dd HH:mm:ss Z yyyy\")\n                    )\n                ),\"host_name\", Property.of(pro -> pro\n                    .keyword(k -> k)\n                )))\n            .source(s -> s\n                .enabled(false)\n            )\n        )\n        .settings(s -> s\n            .otherSettings(Map.of())\n            .numberOfShards(\"1\")\n        )\n    )\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    delete:
      tags:
      - Indices
      summary: Delete component templates
      description: 'Component templates are building blocks for constructing index templates that specify index mappings, settings, and aliases.


        ## Required authorization


        * Cluster privileges: `manage_index_templates`'
      operationId: cluster-delete-component-template
      parameters:
      - in: path
        name: name
        description: Comma-separated list or wildcard expression of component template names used to limit the request.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Names'
        style: simple
      - in: query
        name: master_timeout
        description: 'Period to wait for a connection to the master node.

          If no response is received before the timeout expires, the request fails and returns an error.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: 'Period to wait for a response.

          If no response is received before the timeout expires, the request fails and returns an error.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 7.8.0
      x-codeSamples:
      - lang: Console
        source: 'DELETE _component_template/template_1

          '
      - lang: Python
        source: "resp = client.cluster.delete_component_template(\n    name=\"template_1\",\n)"
      - lang: JavaScript
        source: "const response = await client.cluster.deleteComponentTemplate({\n  name: \"template_1\",\n});"
      - lang: Ruby
        source: "response = client.cluster.delete_component_template(\n  name: \"template_1\"\n)"
      - lang: PHP
        source: "$resp = $client->cluster()->deleteComponentTemplate([\n    \"name\" => \"template_1\",\n]);"
      - lang: curl
        source: 'curl -X DELETE -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_component_template/template_1"'
      - lang: C#
        source: 'var response = await client.Cluster.DeleteComponentTemplateAsync(name: new[] { "template_1" });'
      - lang: Java
        source: "client.cluster().deleteComponentTemplate(d -> d\n    .name(\"template_1\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    head:
      tags:
      - Indices
      summary: Check component templates
      description: Returns information about whether a particular component template exists.
      operationId: cluster-exists-component-template
      parameters:
      - in: path
        name: name
        description: 'Comma-separated list of component template names used to limit the request.

          Wildcard (*) expressions are supported.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Names'
        style: simple
      - in: query
        name: master_timeout
        description: 'Period to wait for a connection to the master node. If no response is

          received before the timeout expires, the request fails and returns an

          error.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: local
        description: 'If true, the request retrieves information from the local node only.

          Defaults to false, which means information is retrieved from the master node.'
        deprecated: true
        schema:
          default: false
          type: boolean
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json: {}
      x-state: Generally available; Added in 7.8.0
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_dangling/{index_uuid}:
    post:
      tags:
      - Indices
      summary: Import a dangling index
      description: 'If Elasticsearch encounters index data that is absent from the current cluster state, those indices are considered to be dangling.

        For example, this can happen if you delete more than `cluster.indices.tombstones.size` indices while an Elasticsearch node is offline.


        ## Required authorization


        * Cluster privileges: `manage`'
      operationId: dangling-indices-import-dangling-index
      parameters:
      - in: path
        name: index_uuid
        description: The UUID of the index to import. Use the get dangling indices API to locate the UUID.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Uuid'
        style: simple
      - in: query
        name: accept_data_loss
        description: 'This parameter must be set to true to import a dangling index.

          Because Elasticsearch cannot know where the dangling index data came from or determine which shard copies are fresh and which are stale, it cannot guarantee that the imported data represents the latest state of the index when it was last in the cluster.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: The period to wait for a connection to the master node.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: The period to wait for a response.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
              examples:
                ImportDanglingIndexResponseExample1:
                  description: 'A successful response from `POST /_dangling/zmM4e0JtBkeUjiHD-MihPQ?accept_data_loss=true`.

                    '
                  value: "{\n  \"acknowledged\": true\n}"
      x-state: Generally available; Added in 7.9.0
      x-codeSamples:
      - lang: Console
        source: 'POST /_dangling/zmM4e0JtBkeUjiHD-MihPQ?accept_data_loss=true

          '
      - lang: Python
        source: "resp = client.dangling_indices.import_dangling_index(\n    index_uuid=\"zmM4e0JtBkeUjiHD-MihPQ\",\n    accept_data_loss=True,\n)"
      - lang: JavaScript
        source: "const response = await client.danglingIndices.importDanglingIndex({\n  index_uuid: \"zmM4e0JtBkeUjiHD-MihPQ\",\n  accept_data_loss: \"true\",\n});"
      - lang: Ruby
        source: "response = client.dangling_indices.import_dangling_index(\n  index_uuid: \"zmM4e0JtBkeUjiHD-MihPQ\",\n  accept_data_loss: \"true\"\n)"
      - lang: PHP
        source: "$resp = $client->danglingIndices()->importDanglingIndex([\n    \"index_uuid\" => \"zmM4e0JtBkeUjiHD-MihPQ\",\n    \"accept_data_loss\" => \"true\",\n]);"
      - lang: curl
        source: 'curl -X POST -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_dangling/zmM4e0JtBkeUjiHD-MihPQ?accept_data_loss=true"'
      - lang: Java
        source: "client.danglingIndices().importDanglingIndex(i -> i\n    .acceptDataLoss(true)\n    .indexUuid(\"zmM4e0JtBkeUjiHD-MihPQ\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
    delete:
      tags:
      - Indices
      summary: Delete a dangling index
      description: 'If Elasticsearch encounters index data that is absent from the current cluster state, those indices are considered to be dangling.

        For example, this can happen if you delete more than `cluster.indices.tombstones.size` indices while an Elasticsearch node is offline.


        ## Required authorization


        * Cluster privileges: `manage`'
      operationId: dangling-indices-delete-dangling-index
      parameters:
      - in: path
        name: index_uuid
        description: The UUID of the index to delete. Use the get dangling indices API to find the UUID.
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Uuid'
        style: simple
      - in: query
        name: accept_data_loss
        description: This parameter must be set to true to acknowledge that it will no longer be possible to recove data from the dangling index.
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: The period to wait for a connection to the master node.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: The period to wait for a response.
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_types.AcknowledgedResponseBase'
      x-state: Generally available; Added in 7.9.0
      x-codeSamples:
      - lang: Console
        source: 'DELETE /_dangling/<index-uuid>?accept_data_loss=true

          '
      - lang: Python
        source: "resp = client.dangling_indices.delete_dangling_index(\n    index_uuid=\"<index-uuid>\",\n    accept_data_loss=True,\n)"
      - lang: JavaScript
        source: "const response = await client.danglingIndices.deleteDanglingIndex({\n  index_uuid: \"<index-uuid>\",\n  accept_data_loss: \"true\",\n});"
      - lang: Ruby
        source: "response = client.dangling_indices.delete_dangling_index(\n  index_uuid: \"<index-uuid>\",\n  accept_data_loss: \"true\"\n)"
      - lang: PHP
        source: "$resp = $client->danglingIndices()->deleteDanglingIndex([\n    \"index_uuid\" => \"<index-uuid>\",\n    \"accept_data_loss\" => \"true\",\n]);"
      - lang: curl
        source: 'curl -X DELETE -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_dangling/<index-uuid>?accept_data_loss=true"'
      - lang: Java
        source: "client.danglingIndices().deleteDanglingIndex(d -> d\n    .acceptDataLoss(true)\n    .indexUuid(\"<index-uuid>\")\n);\n"
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /_dangling:
    get:
      tags:
      - Indices
      summary: Get the dangling indices
      description: 'If Elasticsearch encounters index data that is absent from the current cluster state, those indices are considered to be dangling.

        For example, this can happen if you delete more than `cluster.indices.tombstones.size` indices while an Elasticsearch node is offline.


        Use this API to list dangling indices, which you can then import or delete.


        ## Required authorization


        * Cluster privileges: `manage`'
      operationId: dangling-indices-list-dangling-indices
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  dangling_indices:
                    type: array
                    items:
                      $ref: '#/components/schemas/dangling_indices.list_dangling_indices.DanglingIndex'
                required:
                - dangling_indices
              examples:
                ListDanglingIndicesResponseExample1:
                  value: "{\n  \"dangling_indices\": [\n   {\n    \"index_name\": \"my-index-000001\",\n    \"index_uuid\": \"zmM4e0JtBkeUjiHD-MihPQ\",\n    \"creation_date_millis\": 1589414451372,\n    \"node_ids\": [\n      \"pL47UN3dAb2d5RCWP6lQ3e\"\n    ]\n   }\n  ]\n}"
      x-state: Generally available; Added in 7.9.0
      x-codeSamples:
      - lang: Console
        source: 'GET /_dangling

          '
      - lang: Python
        source: resp = client.dangling_indices.list_dangling_indices()
      - lang: JavaScript
        source: const response = await client.danglingIndices.listDanglingIndices();
      - lang: Ruby
        source: response = client.dangling_indices.list_dangling_indices
      - lang: PHP
        source: $resp = $client->danglingIndices()->listDanglingIndices();
      - lang: curl
        source: 'curl -X GET -H "Authorization: ApiKey $ELASTIC_API_KEY" "$ELASTICSEARCH_URL/_dangling"'
      - lang: C#
        source: var response = await client.DanglingIndices.ListDanglingIndicesAsync();
      - lang: Java
        source: 'client.danglingIndices().listDanglingIndices();

          '
      x-metaTags:
      - content: Elasticsearch
        name: product_name
  /{index}/_block/{block}:
    put:
      tags:
      - Indices
      summary: Add an index block
      description: 'Add an index block to an index.

        Index blocks limit the operations allowed on an index by blocking specific operation types.'
      operationId: indices-add-block
      parameters:
      - in: path
        name: index
        description: 'A comma-separated list or wildcard expression of index names used to limit the request.

          By default, you must explicitly name the indices you are adding blocks to.

          To allow the adding of blocks to indices with `_all`, `*`, or other wildcard expressions, change the `action.destructive_requires_name` setting to `false`.

          You can update this setting in the `elasticsearch.yml` file or by using the cluster update settings API.'
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/_types.Indices'
        style: simple
      - in: path
        name: block
        description: "The block type to add to the index.\n\nSupported values include:\n  - `metadata`: Disable metadata changes, such as closing the index.\n  - `read`: Disable read operations.\n  - `read_only`: Disable write operations and metadata changes.\n  - `write`: Disable write operations. However, metadata changes are still allowed.\n\n"
        required: true
        deprecated: false
        schema:
          $ref: '#/components/schemas/indices._types.IndicesBlockOptions'
        style: simple
      - in: query
        name: allow_no_indices
        description: 'A setting that does two separate checks on the index expression.

          If `false`, the request returns an error (1) if any wildcard expression

          (including `_all` and `*`) resolves to zero matching indices or (2) if the

          complete set of resolved indices, aliases or data streams is empty after all

          expressions are evaluated. If `true`, index expressions that resolve to no

          indices are allowed and the request returns an empty result.'
        deprecated: false
        schema:
          default: true
          type: boolean
        style: form
      - in: query
        name: expand_wildcards
        description: "The type of index that wildcard patterns can match.\nIf the request can target data streams, this argument determines whether wildcard expressions match hidden data streams.\nIt supports comma-separated values, such as `open,hidden`.\n\nSupported values include:\n  - `all`: Match any data stream or index, including hidden ones.\n  - `open`: Match open, non-hidden indices. Also matches any non-hidden data stream.\n  - `closed`: Match closed, non-hidden indices. Also matches any non-hidden data stream. Data streams cannot be closed.\n  - `hidden`: Match hidden data streams and hidden indices. Must be combined with `open`, `closed`, or `both`.\n  - `none`: Wildcard expressions are not accepted.\n\n"
        deprecated: false
        schema:
          default: open
          allOf:
          - $ref: '#/components/schemas/_types.ExpandWildcards'
        style: form
      - in: query
        name: ignore_unavailable
        description: 'If `false`, the request returns an error if it targets a concrete (non-wildcarded)

          index, alias, or data stream that is missing, closed, or otherwise unavailable.

          If `true`, unavailable concrete targets are silently ignored.'
        deprecated: false
        schema:
          default: false
          type: boolean
        style: form
      - in: query
        name: master_timeout
        description: 'The period to wait for the master node.

          If the master node is not available before the timeout expires, the request fails and returns an error.

          It can also be set to `-1` to indicate that the request should never timeout.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      - in: query
        name: timeout
        description: 'The period to wait for a response from all relevant nodes in the cluster after updating the cluster metadata.

          If no response is received before the timeout expires, the cluster metadata update still applies but the response will indicate that it was not completely acknowledged.

          It can also be set to `-1` to indicate that the request should never timeout.'
        deprecated: false
        schema:
          default: 30s
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        style: form
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
