            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                  shards_acknowledged:
                    type: boolean
                required:
                - acknowledged
                - shards_acknowledged
              examples:
                indicesOpenResponseExample1:
                  description: A successful response for opening an index.
