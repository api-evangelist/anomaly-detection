    ml.explain_data_frame_analytics:
      content:
        application/json:
          schema:
            type: object
            properties:
              source:
                description: 'The configuration of how to source the analysis data. It requires an

                  index. Optionally, query and _source may be specified.'
                allOf:
                - $ref: '#/components/schemas/ml._types.DataframeAnalyticsSource'
