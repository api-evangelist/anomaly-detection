      - lang: C#
        source: "var response = await client.MachineLearning\n    .UpdateDataFrameAnalyticsAsync(id: \"loganalytics\", d1 => d1\n        .ModelMemoryLimit(\"200mb\")\n    );"
      - lang: Java
        source: "client.ml().updateDataFrameAnalytics(u -> u\n    .id(\"loganalytics\")\n    .modelMemoryLimit(\"200mb\")\n);\n"
