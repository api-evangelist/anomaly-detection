- name: AWS Lookout for Metrics
  description: >-
    Amazon Lookout for Metrics is a fully managed ML service that automatically detects anomalies in business
    and operational data. It connects to data sources including Amazon S3, Amazon Redshift, Amazon CloudWatch,
    and SaaS applications, learns each metric's normal behavior, and sends alerts when anomalies are detected.
    Provides root cause analysis grouping related anomalies for faster diagnosis.
