- name: Azure AI Anomaly Detector
  description: >-
    Azure AI Anomaly Detector is a managed REST API service that enables monitoring and detection of anomalies
    in time series data without requiring machine learning expertise. Supports univariate batch and streaming
    detection, multivariate detection using Graph Attention Networks for up to 300 correlated signals,
    and change-point detection. The service is being retired on 1 October 2026 in favor of Microsoft Fabric
    real-time intelligence.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
