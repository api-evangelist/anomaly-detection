- name: Datadog Anomaly Monitor API
  description: >-
    Datadog's Monitors API supports anomaly detection monitors that identify unusual metric behavior using
    historical pattern analysis including trends, day-of-week, and time-of-day seasonality. Offers three
    detection algorithms — Basic, Agile (SARIMA), and Robust (seasonal-trend decomposition) — configurable
    via REST API. Available across regional endpoints for US, EU, AP1, AP2, GOV, US3, and US5 deployments.
